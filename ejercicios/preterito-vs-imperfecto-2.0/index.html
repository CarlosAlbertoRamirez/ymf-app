<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretérito vs Imperfecto | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --pret:#f472b6;--pret2:#ff91cd;--pret3:rgba(244,114,182,.12);--pretbd:rgba(244,114,182,.3);
  --imp:#60a5fa;--imp2:#93c5fd;--imp3:rgba(96,165,250,.12);--impbd:rgba(96,165,250,.3);
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 15% 8%,rgba(244,114,182,.12),transparent 35%),radial-gradient(ellipse at 85% 10%,rgba(96,165,250,.1),transparent 35%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--pret),#fff 45%,var(--imp));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:4px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:7px 10px;font-weight:800;font-family:var(--font);font-size:.72rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.1rem;line-height:1}
.etab-label{font-size:.58rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:90px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;transition:width .35s;background:linear-gradient(90deg,var(--pret),var(--imp))}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-pret{background:linear-gradient(135deg,var(--pret),#e11d80);color:white}
.btn-imp{background:linear-gradient(135deg,var(--imp),#2563eb);color:white}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ── TENSE PILLS ── */
.pill-p{background:var(--pret3);border:1px solid var(--pretbd);color:var(--pret2);border-radius:999px;padding:2px 10px;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;display:inline-block}
.pill-i{background:var(--imp3);border:1px solid var(--impbd);color:var(--imp2);border-radius:999px;padding:2px 10px;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;display:inline-block}
.pret-txt{color:var(--pret2);font-weight:800}
.imp-txt{color:var(--imp2);font-weight:800}

/* ── EXPLANATION CARDS (EX 0) ── */
.exp-section{margin-bottom:20px}
.exp-section-title{font-family:var(--display);font-size:1rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.concept-card{border-radius:16px;padding:18px;border:2px solid}
.concept-title{font-family:var(--display);font-size:1.1rem;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.concept-def{font-size:.88rem;line-height:1.7;color:var(--muted);margin-bottom:10px}
.concept-def strong{color:var(--text)}
.signal-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.signal-tag{border-radius:7px;padding:4px 9px;font-size:.74rem;font-weight:700;font-family:var(--display)}
.story-demo{background:rgba(0,0,0,.25);border-radius:14px;padding:18px;line-height:2.1;font-size:.95rem;margin-bottom:14px}
.story-p{background:var(--pret3);border:1px solid var(--pretbd);border-radius:6px;padding:1px 7px;color:var(--pret2);font-weight:800}
.story-i{background:var(--imp3);border:1px solid var(--impbd);border-radius:6px;padding:1px 7px;color:var(--imp2);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.analogy-box{background:rgba(255,255,255,.04);border-radius:14px;padding:16px 18px;border-left:4px solid var(--warn)}
.analogy-title{font-size:.8rem;font-weight:800;color:var(--warn);margin-bottom:8px;text-transform:uppercase;letter-spacing:.07em}

/* ── CONJUGATION CARDS (EX 1) ── */
.conj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.conj-card{border-radius:16px;overflow:hidden;border:2px solid}
.conj-verb{padding:14px 18px;font-family:var(--display);font-size:1.2rem;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.conj-type{font-size:.7rem;font-weight:700;opacity:.7}
.conj-table{width:100%;border-collapse:collapse;font-size:.85rem}
.conj-table td{padding:7px 18px;border-bottom:1px solid rgba(255,255,255,.05);line-height:1.4}
.conj-table tr:last-child td{border-bottom:none}
.conj-table .sub{color:var(--muted2);font-size:.8rem;width:90px}
.conj-table .form{font-family:var(--display);font-weight:800;font-size:.95rem}
.conj-note{padding:10px 18px;font-size:.77rem;color:var(--muted2);line-height:1.5;background:rgba(0,0,0,.2)}
.irreg-badge{font-size:.62rem;font-weight:900;border-radius:5px;padding:2px 6px;background:rgba(245,158,11,.18);color:var(--warn);margin-left:6px}

/* ── MC ── */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.7;flex:1}
.mc-blank{display:inline-block;min-width:90px;border-bottom:2.5px solid rgba(37,217,255,.4);text-align:center;font-weight:800;color:var(--cyan);padding:0 4px}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px}
.mc-opt{border:0;border-radius:10px;padding:7px 14px;font-weight:800;font-family:var(--display);font-size:.9rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-opt.pret-opt:hover:not([disabled]){border-color:var(--pretbd);background:var(--pret3)}
.mc-opt.imp-opt:hover:not([disabled]){border-color:var(--impbd);background:var(--imp3)}
.mc-expl{display:none;font-size:.79rem;color:var(--muted);line-height:1.6;margin-top:7px;padding:7px 12px 7px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}

/* ── STORY FILL-IN (EX 3) ── */
.story-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:18px;padding:22px 24px;margin-bottom:16px}
.story-title{font-family:var(--display);font-size:1.05rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.story-text{font-size:.97rem;line-height:2.4;color:var(--text)}
.story-blank{display:inline-block;min-width:110px;border-bottom:2.5px solid rgba(37,217,255,.4);text-align:center;cursor:pointer;transition:.13s;padding:0 4px;font-weight:700}
.story-blank:hover:not(.done){border-color:var(--cyan);background:rgba(37,217,255,.07);border-radius:5px 5px 0 0}
.story-blank.done-p{border-color:var(--pret2);color:var(--pret2);font-weight:900;font-family:var(--display);border-bottom:2.5px solid}
.story-blank.done-i{border-color:var(--imp2);color:var(--imp2);font-weight:900;font-family:var(--display);border-bottom:2.5px solid}
.story-blank.wrong{border-color:var(--bad);color:var(--bad);font-weight:900;font-family:var(--display)}
.blank-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.blank-modal-box{background:linear-gradient(160deg,#100028,#1e0045);border:1.5px solid rgba(37,217,255,.25);border-radius:20px;padding:24px 28px;width:min(480px,92%);box-shadow:var(--shadow)}
.blank-modal-sent{font-size:1rem;line-height:1.7;margin-bottom:16px;color:var(--muted);font-style:italic}
.blank-modal-sent strong{color:var(--text);font-style:normal}
.blank-modal-opts{display:flex;flex-direction:column;gap:8px}
.blank-modal-opt{border:0;border-radius:11px;padding:11px 18px;font-weight:800;font-family:var(--display);font-size:.92rem;cursor:pointer;transition:.14s;text-align:left}
.blank-modal-close{font-size:.78rem;color:var(--muted2);cursor:pointer;text-align:center;margin-top:14px;padding:6px;border-radius:8px;transition:.13s}
.blank-modal-close:hover{background:rgba(255,255,255,.07)}

/* ── SORT (EX 5) ── */
.sort-pile{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;min-height:52px;margin-bottom:12px}
.sort-bucket{border-radius:14px;padding:12px;min-height:70px;display:flex;flex-direction:column;gap:6px;transition:.2s}
.sort-bucket.drag-over{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.bucket-title{font-family:var(--display);font-size:.78rem;font-weight:900;text-align:center;margin-bottom:3px}
.sort-chip{border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:grab;user-select:none;transition:.15s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12)}
.sort-chip:hover{transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sort-chip.ghost{opacity:.35}
.sort-chip.c-ok{cursor:default}
.sort-chip.c-err{font-size:.78rem}

/* ── SPEED ── */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;text-align:center;width:100%;max-width:540px}
.sp-tense{font-size:.72rem;font-weight:900;border-radius:999px;padding:4px 12px;display:inline-block;margin-bottom:8px}
.sp-q{font-size:1rem;line-height:1.7;margin-bottom:4px}
.sp-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:540px}
.sp-inp{flex:1;max-width:260px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--display);font-size:1rem;font-weight:800;color:var(--text);outline:none;transition:.15s}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:540px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:540px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;transition:width 1s linear;background:linear-gradient(90deg,var(--pret),var(--imp))}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* ── REFERENCE ── */
.ref-section{margin-bottom:18px}
.ref-h3{font-family:var(--display);font-size:.92rem;font-weight:800;padding:6px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.ref-table{width:100%;border-collapse:collapse;font-size:.83rem}
.ref-table th{padding:6px 12px;font-size:.6rem;font-weight:800;text-transform:uppercase;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.ref-table td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.6;vertical-align:top}
.ref-table tr:last-child td{border-bottom:none}
.ref-tip{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:10px 14px;font-size:.83rem;color:#bbf7d0;line-height:1.6;margin-bottom:10px}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.concept-grid{grid-template-columns:1fr}.conj-grid{grid-template-columns:1fr}.panel{padding:14px 12px}}

/* ── AUDIO ── */
.btn-audio{background:rgba(37,217,255,.12);border:1.5px solid rgba(37,217,255,.28);color:var(--cyan);border-radius:8px;padding:4px 10px;font-size:.74rem;font-weight:800;cursor:pointer;transition:.13s;font-family:var(--font);display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:6px}
.btn-audio:hover{background:rgba(37,217,255,.22);border-color:var(--cyan)}
.btn-audio.playing{background:rgba(37,217,255,.25);animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
/* ── TRANSFORM EX ── */
.tr-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;margin-bottom:12px}
.tr-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.tr-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.tr-source{font-size:.98rem;font-weight:700;line-height:1.7;margin-bottom:4px}
.tr-ctx{font-size:.76rem;color:var(--muted2);font-style:italic;margin-bottom:10px}
.tr-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.tr-chip{border:0;border-radius:9px;padding:8px 15px;font-weight:700;font-family:var(--display);font-size:.9rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);color:var(--text)}
.tr-chip:hover:not([disabled]){transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.tr-chip.t-ok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.tr-chip.t-err{border-color:var(--bad);background:rgba(239,68,68,.15);color:#fca5a5}
.tr-chip[disabled]{cursor:default;transform:none;opacity:.5}
.tr-exp{display:none;font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:8px}
.tr-exp.show{display:block}

/* YMF brand v2 */
.logo-box,.hero .logo,.logoBox{padding:0!important;overflow:hidden!important;background:#0c0030!important;border:2px solid rgba(37,217,255,.28)!important;box-shadow:0 0 18px rgba(255,43,191,.18)!important}

<script>
function normS(s){return(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function seededShuffle(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Smart audio — picks best es-MX voice */
let _voice=null;
function initVoice(){if(!window.speechSynthesis)return;const pick=()=>{const vs=window.speechSynthesis.getVoices();if(!vs.length)return;const p=[v=>v.name==='Paulina',v=>v.name.includes('Paulina'),v=>v.lang==='es-MX'&&v.localService,v=>v.lang==='es-MX',v=>v.name.includes('Google')&&v.lang.startsWith('es'),v=>v.lang.startsWith('es')&&v.localService,v=>v.lang.startsWith('es')];for(const t of p){const f=vs.find(t);if(f){_voice=f;break;}}};pick();if(!_voice&&window.speechSynthesis.onvoiceschanged!==undefined)window.speechSynthesis.onvoiceschanged=pick;setTimeout(pick,800);}
initVoice();
function speak(text,btn){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.btn-audio').forEach(b=>{b.classList.remove('playing');b.textContent='🔊';});
  const u=new SpeechSynthesisUtterance(text);
  if(_voice)u.voice=_voice;
  u.lang=_voice?_voice.lang:'es-MX';u.rate=0.82;u.pitch=1.0;
  if(btn){btn.classList.add('playing');btn.textContent='🔊▶';}
  u.onend=()=>{if(btn){btn.classList.remove('playing');btn.textContent='🔊';}};
  u.onerror=()=>{if(btn){btn.classList.remove('playing');btn.textContent='🔊';}};
  window.speechSynthesis.speak(u);
}

function goEx(idx){

}

function renderExpl(){
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📚 Pretérito vs Imperfecto — la clave está en la historia</div>
  <div class="ex-instr">Forget grammar rules for a moment. Think of telling a story: you need a <em>canvas</em> (background) and <em>events</em> that happen on it. That's exactly what these two tenses do.</div>

  <div class="exp-section">
    <div class="analogy-box" style="margin-bottom:20px">
      <div class="analogy-title">🎬 The movie analogy</div>
      <div style="font-size:.88rem;line-height:1.75;color:var(--muted)">
        Imagine a movie scene. The <span class="imp-txt">imperfecto</span> sets the scene — the weather, what people looked like, what was normally happening. The <span class="pret-txt">pretérito</span> is the action — what happened, what changed, what moved the story forward.<br><br>
        <strong style="color:var(--text)">Llovía</strong> <span class="pill-i">IMP</span> y las calles <strong style="color:var(--text)">estaban</strong> <span class="pill-i">IMP</span> vacías cuando de repente <strong style="color:var(--text)">apareció</strong> <span class="pill-p">PRET</span> un hombre con un abrigo rojo.
        <br><span style="font-size:.8rem;color:var(--muted2);font-style:italic">It was raining and the streets were empty when suddenly a man in a red coat appeared.</span>
      </div>
    </div>

    <div class="concept-grid">
      <div class="concept-card" style="background:var(--pret3);border-color:var(--pretbd)">
        <div class="concept-title"><span class="pill-p">PRETÉRITO</span></div>
        <div class="concept-def">
          <strong>Completed actions</strong> — things that happened at a specific moment and are done.<br><br>
          📸 Think of it as a <strong>photograph</strong>: a single frozen moment.<br><br>
          • <em>Llegué</em> a las 8. (I arrived at 8.)<br>
          • <em>Comió</em> y se fue. (She ate and left.)<br>
          • <em>Vivieron</em> en Oaxaca tres años. (They lived in Oaxaca for 3 years — and then they stopped.)
        </div>
        <div><div style="font-size:.72rem;font-weight:900;color:var(--pret2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Signal words</div>
        <div class="signal-grid">
          ${['ayer','el lunes','de repente','entonces','luego','al final','en ese momento','una vez','el año pasado','de niño (una vez)','finalmente','en cuanto'].map(w=>`<span class="signal-tag" style="background:rgba(244,114,182,.15);color:var(--pret2);border:1px solid var(--pretbd)">${w}</span>`).join('')}
        </div></div>
      </div>
      <div class="concept-card" style="background:var(--imp3);border-color:var(--impbd)">
        <div class="concept-title"><span class="pill-i">IMPERFECTO</span></div>
        <div class="concept-def">
          <strong>Ongoing background</strong> — states, descriptions, habits, or actions that were in progress.<br><br>
          🖼️ Think of it as a <strong>painting</strong>: atmosphere, mood, what things looked like.<br><br>
          • <em>Llovía</em> mucho. (It was raining a lot.)<br>
          • <em>Tenía</em> 10 años. (I was 10 years old.)<br>
          • <em>Íbamos</em> al mercado todos los domingos. (We used to go to the market every Sunday.)
        </div>
        <div><div style="font-size:.72rem;font-weight:900;color:var(--imp2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Signal words</div>
        <div class="signal-grid">
          ${['siempre','todos los días','de niño/a','antes','normalmente','mientras','generalmente','cada semana','era','tenía','había','en aquella época','con frecuencia'].map(w=>`<span class="signal-tag" style="background:rgba(96,165,250,.15);color:var(--imp2);border:1px solid var(--impbd)">${w}</span>`).join('')}
        </div></div>
      </div>
    </div>
  </div>

  <div class="exp-section">
    <div class="exp-section-title">📖 A story in action — both tenses together</div>
    <div style="font-size:.78rem;color:var(--muted2);margin-bottom:10px">The pink words moved the story forward. The blue words painted the background.</div>
    <div class="story-demo">
      <span class="story-i">Era</span> una mañana tranquila. <span class="story-i">Hacía</span> frío y <span class="story-i">había</span> muy poca gente en la calle. Yo <span class="story-i">caminaba</span> hacia el café cuando de repente <span class="story-p">vi</span> a mi ex. <span class="story-p">Me detuve</span> en seco. Ella también <span class="story-p">se detuvo</span>. <span class="story-i">Llevaba</span> un sombrero verde que yo <span class="story-i">nunca había visto</span>. <span class="story-p">Sonrió</span>, <span class="story-p">dijo</span> "hola" y <span class="story-p">siguió</span> caminando.
    </div>
    <button class="btn-audio" style="margin-bottom:10px" onclick="speak('Era una mañana tranquila. Hacía frío y había muy poca gente en la calle. Yo caminaba hacia el café cuando de repente vi a mi ex. Me detuve en seco. Ella también se detuvo. Llevaba un sombrero verde que yo nunca había visto. Sonrió, dijo hola y siguió caminando.',this)">🔊 Listen to the whole story</button>

      <div class="legend-item"><span class="story-p" style="border-radius:5px;padding:2px 8px">pretérito</span> = action happened, story moves forward</div>
      <div class="legend-item"><span class="story-i" style="border-radius:5px;padding:2px 8px">imperfecto</span> = setting, state, description</div>
    </div>

  <div class="exp-section">
    <div class="exp-section-title">⚠️ The 4 trickiest cases</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px">
      <div style="background:rgba(255,255,255,.04);border-radius:12px;padding:14px">
        <div style="font-weight:800;margin-bottom:6px;font-size:.88rem">1. Duration: how long vs started-and-stopped</div>
        <div style="font-size:.82rem;color:var(--muted);line-height:1.65">
          <span class="imp-txt">Vivía</span> en México. (I lived there — ongoing, no end mentioned)<br>
          <span class="pret-txt">Viví</span> en México dos años. (I lived there for 2 years — done, finished)
        </div>
      </div>
      <div style="background:rgba(255,255,255,.04);border-radius:12px;padding:14px">
        <div style="font-weight:800;margin-bottom:6px;font-size:.88rem">2. Interruption: two tenses together</div>

function renderConj(){
  const pretCards=CONJ_VERBS.filter(v=>v.tense==='pret');
  const impCards=CONJ_VERBS.filter(v=>v.tense==='imp');
  function makeCard(v){
    const rows=v.forms.map(([sub,form])=>`<tr><td class="conj-table-sub" style="color:var(--muted2);padding:7px 18px;font-size:.8rem;width:100px">${sub}</td><td style="font-family:var(--display);font-weight:800;font-size:.95rem;padding:7px 18px">${form}</td></tr>`).join('');
    const col=v.tense==='pret'?'var(--pret2)':'var(--imp2)';
    const bg=v.tense==='pret'?'var(--pret3)':'var(--imp3)';
    const bd=v.tense==='pret'?'var(--pretbd)':'var(--impbd)';
    return `<div class="conj-card" style="background:${bg};border-color:${bd}">
      <div class="conj-verb" style="background:rgba(0,0,0,.2);color:${col}">
        <span>${v.verb}${v.irreg?'<span class="irreg-badge">irregular</span>':''}</span>
        <span class="conj-type">${v.type}</span>
      </div>
      <table class="conj-table"><tbody>${rows}</tbody></table>
      <div class="conj-note">${v.note}</div>
    </div>`;
  }
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📋 Conjugaciones — Pretérito & Imperfecto</div>
  <div class="ex-instr">Good news: the <em>imperfecto only has 3 irregular verbs</em> (ser, ir, ver). The pretérito has more but they follow predictable stem patterns.</div>

  <div style="margin-bottom:18px">
    <div class="ref-h3" style="color:var(--pret2);background:var(--pret3)">📸 PRETÉRITO (${pretCards.length} verbs)</div>
    <div class="conj-grid">${pretCards.map(makeCard).join('')}</div>
  </div>
  <div>
    <div class="ref-h3" style="color:var(--imp2);background:var(--imp3)">🖼️ IMPERFECTO (${impCards.length} verbs)</div>
    <div class="conj-grid">${impCards.map(makeCard).join('')}</div>
  </div>
  <div class="ref-tip" style="margin-top:14px">💡 <strong>Imperfecto shortcut:</strong> Only 3 irregular verbs ever! ser→era, ir→iba, ver→veía. Everything else follows the -aba / -ía pattern. Learn those 3 and you're done.</div>
  </div>`;
}

  if(mcChecked)return;

  document.getElementById('mc_chk').disabled=true;renderMC();
}

let storyState={};

function renderStory(){
  storyState={};
  STORIES.forEach((_,i)=>{storyState[i]={answers:{},done:false};});
  renderStoryBody();
}

function renderStoryBody(){
  const cards=STORIES.map((st,si)=>{
    const state=storyState[si];
    const wordsArr=st.text.split(/(\[\d+\])/);
    const textHTML=wordsArr.map(part=>{
      const m=part.match(/\[(\d+)\]/);
      if(!m)return part;
      const bi=parseInt(m[1]);
      const blank=st.blanks[bi];
      const ans=state.answers[bi];
      let cls='story-blank';let txt='___';
      if(ans!==undefined){
        const isOk=normS(ans)===normS(blank.form);
        cls='story-blank '+(isOk?'done-'+(blank.tense==='pret'?'p':'i'):'wrong');
        txt=ans;
      }
      if(state.done&&ans===undefined){cls='story-blank done-'+(blank.tense==='pret'?'p':'i');txt=blank.form;}
      const onclick=state.done?'':`onclick="openBlankModal(${si},${bi})"`;
      return `<span class="${cls}" ${onclick} title="${blank.hint}">${txt}</span>`;
    }).join('');
    const filled=Object.keys(state.answers).length;
    const total=st.blanks.length;
    const ok=state.done?st.blanks.filter((_,bi)=>normS(state.answers[bi])===normS(st.blanks[bi].form)).length:0;
    return `<div class="story-card">
      <div class="story-title">${st.title}</div>
      <div style="font-size:.77rem;color:var(--muted2);font-style:italic;margin-bottom:12px">${st.en}</div>
      <div class="story-text" id="stxt${si}">${textHTML}</div>
      ${state.done?`<div style="margin-top:12px;font-size:.82rem;color:var(--muted2)">
        <span class="pill-p">Pink = pretérito</span> &nbsp; <span class="pill-i">Blue = imperfecto</span> &nbsp;
        Score: <strong style="color:${ok===total?'var(--good)':'var(--warn)'}">${ok}/${total}</strong>
      </div>`:''}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-cyan" style="padding:7px 14px;font-size:.8rem" onclick="checkStory(${si})" ${filled===total&&!state.done?'':'disabled'} id="stchk${si}">Check ✓</button>
        <button class="btn btn-ghost" style="padding:7px 14px;font-size:.8rem" onclick="revealStory(${si})">Show answers</button>
        <button class="btn btn-ghost" style="padding:7px 14px;font-size:.8rem" onclick="resetStory(${si})">↺ Reset</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📖 Completa la historia — 5 relatos</div>
  <div class="ex-instr">Click a blank to choose the form. No labels — decide from context. <span class="pill-p">Pink</span> = pretérito, <span class="pill-i">blue</span> = imperfecto after checking.</div>
  <div class="legend" style="margin-bottom:14px">
    <span style="font-size:.8rem;color:var(--muted2)">Hover any blank to see the verb + hint. The 4 options will always be: correct form / wrong tense / wrong person / present tense.</span>
  </div>
  ${cards}
  </div>`;
}

function openBlankModal(si,bi){
  const st=STORIES[si];const blank=st.blanks[bi];
  const state=storyState[si];if(state.done)return;
  // Fixed distractors: correct + wrong tense of same verb + wrong person + present
  const opts=seededShuffle([
    {form:blank.form, correct:true},
    {form:blank.pretAlt, correct:false},
    {form:blank.impAlt, correct:false},
    {form:blank.pres, correct:false},
  ].filter((o,i,arr)=>arr.findIndex(x=>normS(x.form)===normS(o.form))===i), si*7+bi*3);

  const contextText=st.text.replace(/\[(\d+)\]/g,(m,n)=>{
    const n2=parseInt(n);
    if(n2===bi)return `<strong style="color:var(--cyan)">___</strong>`;
    const a=state.answers[n2];
    return a||st.blanks[n2].form;
  });

  document.body.insertAdjacentHTML('beforeend',`<div class="blank-modal" id="bm${si}_${bi}" onclick="if(event.target===this)closeModal('bm${si}_${bi}')">
    <div class="blank-modal-box">
      <div class="blank-modal-sent">${contextText}</div>
      <div style="font-size:.74rem;font-weight:800;color:var(--muted2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Verb: ${blank.verb} — ${blank.hint}</div>
      <div class="blank-modal-opts">
        ${opts.map(o=>`<button class="blank-modal-opt" style="background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:var(--text)" onclick="selectBlank(${si},${bi},'${o.form.replace(/'/g,"\\'")}','bm${si}_${bi}')">${o.form}</button>`).join('')}
      </div>
      <div class="blank-modal-close" onclick="closeModal('bm${si}_${bi}')">✕ Cancel</div>
    </div>
  </div>`);
}
function closeModal(id){const el=document.getElementById(id);if(el)el.remove();}
function selectBlank(si,bi,form,mid){storyState[si].answers[bi]=form;closeModal(mid);renderStoryBody();}
function checkStory(si){storyState[si].done=true;renderStoryBody();}

let trAns={};

function renderTransform(){
  trAns={};
  const tot=TRANSFORM.length;
  const html=TRANSFORM.map((item,i)=>{
    const opts=seededShuffle([item.correct,...item.wrong],i*11+3);
    const chips=opts.map((o,oi)=>`<button class="tr-chip" id="tc${i}_${oi}" onclick="answerTransform(${i},'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('');
    return `<div class="tr-card" id="trc${i}">
      <div class="tr-source"><span class="pill-i">Original:</span> <em style="color:var(--muted)">${item.orig}</em></div>
      <div class="tr-ctx">💬 <strong>New context:</strong> ${item.ctx}</div>
      <div class="tr-chips">${chips}</div>
      <div class="tr-exp" id="te${i}"></div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">🔀 Transforma la oración</div>
  <div class="ex-instr">You're given a sentence and a <strong>new context</strong>. Choose the version that fits the new context. This isn't just about changing forms — the <em>meaning changes too</em>.</div>
  <div class="score-bar"><div class="sc"><span class="l">Total</span><span class="v">${tot}</span></div><div class="sc"><span class="l">OK</span><span class="v g" id="tr_ok">0</span></div><div class="sc"><span class="l">Miss</span><span class="v b" id="tr_err">0</span></div><div class="prog-w"><div class="prog-l">Answered: <span id="tr_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="tr_pg" style="width:0%"></div></div></div></div>
  ${html}
  <div class="fb" id="tr_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="trAns={};renderTransform()">↺ Reset</button></div></div>`;
}

function answerTransform(qi,chosen){
  if(trAns[qi]!==undefined)return;
  const item=TRANSFORM[qi];
  const isOk=chosen===item.correct;
  trAns[qi]=isOk;
  const card=document.getElementById('trc'+qi);if(card)card.classList.add(isOk?'ok':'err');
  // Disable all chips, highlight correct
  document.querySelectorAll(`[id^="tc${qi}_"]`).forEach(b=>{
    b.disabled=true;
    if(b.textContent===item.correct)b.classList.add('t-ok');
    else if(b.textContent===chosen&&!isOk)b.classList.add('t-err');
  });
  const e=document.getElementById('te'+qi);
  if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ ':'✗ ')+item.exp;}
  const done=Object.keys(trAns).length;
  const ok=Object.values(trAns).filter(v=>v).length;
  document.getElementById('tr_ok').textContent=ok;
  document.getElementById('tr_err').textContent=done-ok;
  document.getElementById('tr_pct').textContent=Math.round(done/TRANSFORM.length*100)+'%';
  document.getElementById('tr_pg').style.width=Math.round(done/TRANSFORM.length*100)+'%';
  if(done===TRANSFORM.length){
    const pct=Math.round(ok/done*100);
    const fb=document.getElementById('tr_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'🏆':'📖'} <strong>${ok}/${done}.</strong> ${pct>=80?'Excellent! You understand meaning, not just form.':'Pay attention to how the meaning shifts between tenses.'}`;
  }
}

let whyState={};

function renderWhy(){
  whyState={};WHY.forEach((_,i)=>{whyState[i]={done:false,ok:false};});
  const html=WHY.map((item,i)=>{
    const highlighted=item.s.replace(/\[([^\]]+)\]/,`<strong style="color:var(--warn)">$1</strong>`);
    const tenseBtns=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn btn-pret" id="wb_p${i}" style="padding:7px 14px;font-size:.8rem" onclick="selectWhy(${i},'pret')">📸 Pretérito</button>
      <button class="btn btn-imp" id="wb_i${i}" style="padding:7px 14px;font-size:.8rem" onclick="selectWhy(${i},'imp')">🖼️ Imperfecto</button>
      <button class="btn btn-ghost" id="wb_b${i}" style="padding:7px 14px;font-size:.8rem;border-color:rgba(255,200,0,.3);color:#fde68a" onclick="selectWhy(${i},'both')">🔀 Ambos</button>

function selectWhy(idx,tense){
  const item=WHY[idx];
  const isOk=tense===item.tense;
  const btns=['pret','imp','both'].forEach(t=>{
    const b=document.getElementById(`wb_${t[0]}${idx}`);
    if(b){b.disabled=true;if(t===item.tense)b.style.opacity='1';else b.style.opacity='.3';}
  });
  const wr=document.getElementById('wr'+idx);
  if(!isOk){
    // Wrong tense — show explanation immediately
    whyState[idx]={done:true,ok:false};
    const e=document.getElementById('we'+idx);
    if(e){e.classList.add('show');e.innerHTML=`✗ This is <strong>${item.tense==='both'?'both tenses':item.tense==='pret'?'pretérito':'imperfecto'}</strong>. ${item.why}`;}
    updateWhyScore();
  } else {
    // Correct tense — show the "why" step
    if(wr)wr.style.display='block';
  }
}

function answerWhy(idx,ri,isCorrectStr){
  const isOk=isCorrectStr==='true';
  whyState[idx]={done:true,ok:isOk};
  document.querySelectorAll(`[id^="wrb${idx}_"]`).forEach(b=>{
    b.disabled=true;
    const isThis=parseInt(b.id.split('_')[1])===ri;
    if(isThis)b.classList.add(isOk?'mc-ok':'mc-err');
  });
  // Find and highlight correct
  const item=WHY[idx];
  const allOpts=seededShuffle([item.why,...item.reasons.filter(r=>normS(r)!==normS(item.why))],idx*13);
  allOpts.forEach((r,x)=>{if(normS(r)===normS(item.why)){const b=document.getElementById(`wrb${idx}_${x}`);if(b)b.classList.add('mc-show');}});
  const e=document.getElementById('we'+idx);
  if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ Exactly right! ':'✗ ')+item.why;}
  updateWhyScore();
}

function updateWhyScore(){
  const done=Object.values(whyState).filter(s=>s.done).length;
  const ok=Object.values(whyState).filter(s=>s.ok).length;
  document.getElementById('w_ok').textContent=ok;
  document.getElementById('w_err').textContent=done-ok;
  document.getElementById('w_pct').textContent=Math.round(done/WHY.length*100)+'%';
  document.getElementById('w_pg').style.width=Math.round(done/WHY.length*100)+'%';
  if(done===WHY.length){
    const pct=Math.round(ok/WHY.length*100);
    const fb=document.getElementById('w_fb');
    fb.className='fb show '+(pct>=75?'ok':'partial');
    fb.innerHTML=`${pct>=75?'🏆':'📖'} <strong>${ok}/${WHY.length}.</strong> ${pct>=75?'Excellent! You understand not just HOW but WHY.':'Focus on the explanations — understanding the reason helps more than memorizing.'}`;
  }
}

/* ══════════════════════════════════
   EX 6 — DRAG & SORT (classify signal words)
   2 buckets: pretérito signals / imperfecto signals
   + 1 "neutral" bucket (can work with either)
══════════════════════════════════ */
const SORT_BUCKETS=[
  {id:'pret',label:'Pretérito 📸',sub:'signals a completed, specific event',col:'var(--pret2)',bg:'rgba(244,114,182,.07)',bd:'var(--pretbd)'},
  {id:'imp', label:'Imperfecto 🖼️',sub:'signals habit, background, or state',col:'var(--imp2)', bg:'rgba(96,165,250,.07)', bd:'var(--impbd)'},
];
const SORT_CARDS=[
  {id:'c1', t:'ayer',          b:'pret', x:'"Ayer" = yesterday = specific completed day → pretérito.'},
  {id:'c2', t:'de repente',    b:'pret', x:'"De repente" = suddenly = signals an instantaneous event → pretérito.'},
  {id:'c3', t:'entonces',      b:'pret', x:'"Entonces" = then (moving the story forward) → pretérito action.'},
  {id:'c4', t:'al final',      b:'pret', x:'"Al final" = in the end = conclusion of a sequence → pretérito.'},
  {id:'c5', t:'el lunes',      b:'pret', x:'"El lunes" = specific day = completed event → pretérito.'},
  {id:'c6', t:'una vez',       b:'pret', x:'"Una vez" = once (a single occasion) → pretérito.'},
  {id:'c7', t:'en ese momento',b:'pret', x:'"En ese momento" = at that moment = instantaneous event → pretérito.'},
  {id:'c8', t:'finalmente',    b:'pret', x:'"Finalmente" = finally = completion of something → pretérito.'},
  {id:'c9', t:'siempre',       b:'imp',  x:'"Siempre" = always = habitual/recurring pattern → imperfecto.'},
  {id:'c10',t:'todos los días',b:'imp',  x:'"Todos los días" = every day = habitual routine → imperfecto.'},
  {id:'c11',t:'de niño/a',     b:'imp',  x:'"De niño/a" = as a child = ongoing period → imperfecto.'},
  {id:'c12',t:'antes',         b:'imp',  x:'"Antes" = before/in the past (no specific time) = habitual or ongoing → imperfecto.'},
  {id:'c13',t:'mientras',      b:'imp',  x:'"Mientras" = while = two things happening simultaneously → typically imperfecto for the background action.'},
  {id:'c14',t:'generalmente',  b:'imp',  x:'"Generalmente" = generally = habitual pattern → imperfecto.'},
  {id:'c15',t:'en aquella época',b:'imp',x:'"En aquella época" = in those times = describing an era → imperfecto.'},
  {id:'c16',t:'normalmente',   b:'imp',  x:'"Normalmente" = normally = habitual → imperfecto.'},
  {id:'c17',t:'cada semana',   b:'imp',  x:'"Cada semana" = every week = recurring habit → imperfecto.'},
  {id:'c18',t:'cuando era niño',b:'imp', x:'"Cuando era niño" = when I was a child = background period → imperfecto.'},
  {id:'c19',t:'el año pasado', b:'pret', x:'"El año pasado" = last year = specific completed period → pretérito.'},
  {id:'c20',t:'en 2010',       b:'pret', x:'A specific year = completed, bounded time → pretérito.'},
];

function renderSort(){
  sortPlaced={};sortChecked=false;tapSel=null;
  const shuffled=[...SORT_CARDS].sort(()=>Math.random()-.5);
  const pile=shuffled.map(c=>`<div class="sort-chip" id="sc_${c.id}" draggable="true"
    ondragstart="dragItem='${c.id}';setTimeout(()=>{const e=document.getElementById('sc_${c.id}');if(e)e.classList.add('ghost');},0)"
    ondragend="const e=document.getElementById('sc_${c.id}');if(e)e.classList.remove('ghost');dragItem=null"
    onclick="tapCard('${c.id}')">${c.t}</div>`).join('');
  const bucks=SORT_BUCKETS.map(b=>`<div class="sort-bucket" id="bk_${b.id}"
    style="background:${b.bg};border:2px dashed ${b.bd};flex:1;min-width:220px"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="dropCard(event,'${b.id}')"
    onclick="tapBucket('${b.id}')">
    <div class="bucket-title" style="color:${b.col}">${b.label}</div>
    <div style="font-size:.65rem;color:var(--muted2);text-align:center;margin-bottom:4px">${b.sub}</div>
  </div>`).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel"><div class="ex-title">📊 Clasifica las señales</div>
  <div class="ex-instr">Sort each signal word or phrase into the tense it typically signals. Learning these triggers will help you choose the right tense automatically!</div>
  <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">Signal words (${SORT_CARDS.length})</div>
  <div class="sort-pile" id="sPile">${pile}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">${bucks}</div>
  <div class="fb" id="srtFb"></div>
  <div class="actions"><button class="btn btn-cyan" id="srtChk" onclick="checkSort()" disabled>Check</button><button class="btn btn-ghost" onclick="renderSort()">↺ Reset</button></div></div>`;
}
function tapCard(id){
  if(sortPlaced[id])return;const c=document.getElementById('sc_'+id);if(!c)return;
  if(tapSel===id){c.style.boxShadow='';tapSel=null;return;}
  if(tapSel){const p=document.getElementById('sc_'+tapSel);if(p)p.style.boxShadow='';}
  tapSel=id;c.style.boxShadow='0 0 0 3px var(--cyan)';
}
function tapBucket(bId){if(!tapSel)return;placeCard(tapSel,bId);tapSel=null;}
function dropCard(e,bId){e.preventDefault();document.getElementById('bk_'+bId).classList.remove('drag-over');if(!dragItem||sortPlaced[dragItem])return;placeCard(dragItem,bId);}
function placeCard(id,bId){
  sortPlaced[id]=bId;const card=document.getElementById('sc_'+id);const bk=document.getElementById('bk_'+bId);
  if(!card||!bk)return;card.style.boxShadow='';card.classList.remove('ghost');card.draggable=false;
  const b=SORT_BUCKETS.find(x=>x.id===bId);if(b)card.style.borderColor=b.col;
  card.onclick=()=>{if(sortChecked)return;delete sortPlaced[id];const c=document.getElementById('sc_'+id);const pile=document.getElementById('sPile');if(!c||!pile)return;c.style.borderColor='';c.style.boxShadow='';c.draggable=true;c.onclick=()=>tapCard(id);pile.appendChild(c);const btn=document.getElementById('srtChk');if(btn)btn.disabled=true;};
  bk.appendChild(card);
  if(Object.keys(sortPlaced).length===SORT_CARDS.length){const btn=document.getElementById('srtChk');if(btn)btn.disabled=false;}
}
function checkSort(){
  sortChecked=true;let ok=0;
  SORT_CARDS.forEach(item=>{const c=document.getElementById('sc_'+item.id);if(!c)return;
    const isOk=sortPlaced[item.id]===item.b;if(isOk)ok++;
    const b=SORT_BUCKETS.find(x=>x.id===item.b);
    c.className='sort-chip '+(isOk?'c-ok':'c-err');c.draggable=false;c.onclick=null;
    if(isOk&&b)c.style.borderColor=b.col;
    if(!isOk){const rb=SORT_BUCKETS.find(x=>x.id===item.b);c.innerHTML=`${item.t}<span style="font-size:.7rem;display:block;margin-top:2px">→ ${rb?rb.label:item.b}</span>`;}
    c.title=item.x;
  });
  const pct=Math.round(ok/SORT_CARDS.length*100);
  const fb=document.getElementById('srtFb');fb.className='fb show '+(pct>=80?'ok':'partial');
  fb.innerHTML=`<strong>${ok}/${SORT_CARDS.length} (${pct}%).</strong> Hover/tap red items to see the correct category and why.`;
  document.getElementById('srtChk').disabled=true;
}

/* ══════════════════════════════════
   EX 7 — SPEED ROUND (30)
   Prompt → type conjugated form
   Mix of pret + imp, all persons
══════════════════════════════════ */
const SPEED=[
  {q:'hablar — yo — pretérito',hint:'hablé',a:'hable',also:['hablé']},
  {q:'hablar — yo — imperfecto',hint:'hablaba',a:'hablaba',also:[]},
  {q:'comer — tú — pretérito',hint:'comiste',a:'comiste',also:[]},
  {q:'comer — ella — imperfecto',hint:'comía',a:'comia',also:['comía']},
  {q:'vivir — nosotros — pretérito',hint:'vivimos',a:'vivimos',also:[]},
  {q:'vivir — ellos — imperfecto',hint:'vivían',a:'vivian',also:['vivían']},
  {q:'ser — yo — pretérito',hint:'fui',a:'fui',also:[]},
  {q:'ser — tú — imperfecto',hint:'eras',a:'eras',also:[]},
  {q:'ir — ella — pretérito',hint:'fue',a:'fue',also:[]},
  {q:'ir — nosotros — imperfecto',hint:'íbamos',a:'ibamos',also:['íbamos']},
  {q:'tener — yo — pretérito',hint:'tuve',a:'tuve',also:[]},
  {q:'tener — yo — imperfecto',hint:'tenía',a:'tenia',also:['tenía']},
  {q:'hacer — él — pretérito',hint:'hizo',a:'hizo',also:[]},
  {q:'hacer — yo — pretérito',hint:'hice',a:'hice',also:[]},
  {q:'estar — yo — pretérito',hint:'estuve',a:'estuve',also:[]},
  {q:'estar — ellas — imperfecto',hint:'estaban',a:'estaban',also:[]},
  {q:'poder — yo — pretérito',hint:'pude',a:'pude',also:[]},
  {q:'poder — tú — imperfecto',hint:'podías',a:'podias',also:['podías']},
  {q:'decir — yo — pretérito',hint:'dije',a:'dije',also:[]},
  {q:'decir — ellos — pretérito',hint:'dijeron',a:'dijeron',also:[]},
  {q:'venir — yo — pretérito',hint:'vine',a:'vine',also:[]},
  {q:'ver — ella — imperfecto',hint:'veía',a:'veia',also:['veía']},
  {q:'saber — yo — pretérito (I found out)',hint:'supe',a:'supe',also:[]},
  {q:'querer — yo — imperfecto (I wanted)',hint:'quería',a:'queria',also:['quería']},
  {q:'hablar — usted — pretérito',hint:'habló',a:'hablo',also:['habló']},
  {q:'llegar — nosotros — pretérito',hint:'llegamos',a:'llegamos',also:[]},
  {q:'ver — yo — pretérito',hint:'vi',a:'vi',also:[]},
  {q:'conocer — yo — pretérito (I met)',hint:'conocí',a:'conoci',also:['conocí']},

];

function renderSpeed(){
  if(spTimer){clearInterval(spTimer);spTimer=null;}
  spIdx=0;spOk=0;spErr=0;spStreak=0;spAnswered=false;
  const arr=[...SPEED];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  window.__sp=arr;
  document.getElementById('exContainer').innerHTML=`<div class="panel"><div class="ex-title">⚡ Speed round — Conjugaciones</div>
  <div class="ex-instr">Type the correct conjugated form. Accents are optional — the answer is accepted without them.</div>
  <div class="sp-wrap" id="spWrap"><div class="sp-start"><div style="font-size:2.8rem">⚡</div><h2>Conjugar en contexto</h2><p style="color:var(--muted);max-width:420px">30 conjugations — pretérito and imperfecto, regular and irregular.</p><button class="btn btn-cyan" onclick="startSpeed()">¡Empezamos!</button></div></div></div>`;
}
function startSpeed(){spIdx=0;spOk=0;spErr=0;spStreak=0;nextQ();}
function nextQ(){
  const arr=window.__sp;
  if(spIdx>=arr.length){endSpeed();return;}
  spAnswered=false;const item=arr[spIdx];spTimeLeft=12;
  const isPret=item.hint===normS(item.hint)?true:item.q.includes('pretérito');
  const tenseTag=item.q.includes('pretérito')?`<span class="sp-tense" style="background:var(--pret3);color:var(--pret2);border:1px solid var(--pretbd)">📸 Pretérito</span>`:`<span class="sp-tense" style="background:var(--imp3);color:var(--imp2);border:1px solid var(--impbd)">🖼️ Imperfecto</span>`;
  document.getElementById('spWrap').innerHTML=`
    <div class="sp-stats"><div class="spst"><div class="sl">Q</div><div class="sv w">${spIdx+1}/${arr.length}</div></div><div class="spst"><div class="sl">OK</div><div class="sv g">${spOk}</div></div><div class="spst"><div class="sl">Miss</div><div class="sv b">${spErr}</div></div></div>
    <div class="streak${spStreak>=3?' on':''}" id="stk">🔥 x${spStreak}</div>
    <div class="sp-card">${tenseTag}<div class="sp-q">${item.q}</div><div class="sp-hint">💡 ${item.hint}</div></div>
    <div class="tmr-row"><div class="tmr-trk"><div class="tmr-fil" id="tF" style="width:100%;transition:width 1s linear"></div></div><div class="tmr-n" id="tN">12</div></div>
    <div class="sp-row"><input id="sInp" class="sp-inp" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="conjugate…" onkeydown="if(event.key==='Enter')submitQ()"><button class="btn btn-cyan" onclick="submitQ()" style="flex-shrink:0">→</button></div>
    <div class="sp-fb" id="sFb" style="opacity:0"></div>`;
  setTimeout(()=>{const i=document.getElementById('sInp');if(i)i.focus();},50);
  if(spTimer)clearInterval(spTimer);
  spTimer=setInterval(()=>{
    spTimeLeft--;const f=document.getElementById('tF'),n=document.getElementById('tN');
    if(f)f.style.width=Math.max(0,(spTimeLeft/12)*100)+'%';
    if(n){n.textContent=spTimeLeft;n.style.color=spTimeLeft<=3?'var(--bad)':spTimeLeft<=5?'var(--warn)':'var(--muted2)';}
    if(spTimeLeft<=0){clearInterval(spTimer);spTimer=null;if(!spAnswered)submitQ();}
  },1000);
}
function submitQ(){
  const arr=window.__sp;
  const inp=document.getElementById('sInp');if(!inp||spAnswered)return;
  spAnswered=true;if(spTimer){clearInterval(spTimer);spTimer=null;}inp.disabled=true;
  const item=arr[spIdx];const nt=normS(inp.value);const na=normS(item.a);
  const isOk=nt===na||item.also.map(normS).includes(nt);
  if(isOk){spOk++;spStreak++;}else{spErr++;spStreak=0;}
  const fb=document.getElementById('sFb');
  if(fb){fb.style.opacity='1';
    if(!inp.value.trim()){fb.className='sp-fb err';fb.innerHTML=`⏱ → <strong>${item.hint}</strong>`;}
    else if(isOk){fb.className='sp-fb ok';fb.innerHTML=`✓ Correct!${spStreak>=3?' 🔥 x'+spStreak:''}`;}
    else{fb.className='sp-fb err';fb.innerHTML=`✗ <strong>${inp.value}</strong> → <strong>${item.hint}</strong>`;}}
  if(spStreak>=3){const cf=document.getElementById('cf');cf.textContent='🔥 x'+spStreak;cf.classList.remove('pop');void cf.offsetWidth;cf.classList.add('pop');}
  spIdx++;setTimeout(nextQ,isOk?700:1500);
}
function endSpeed(){
  const pct=Math.round(spOk/SPEED.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  document.getElementById('spWrap').innerHTML=`<div class="sp-start"><div style="font-size:3rem">${emo}</div><h2>${spOk}/${SPEED.length}</h2><p style="color:var(--muted)">${pct>=90?'¡Excelente! Perfect conjugations!':pct>=70?'¡Muy bien! Almost there.':pct>=50?'Good start. Review irregulars.':'Review the conjugation cards first.'}</p><button class="btn btn-cyan" onclick="startSpeed()">↺ Try again</button></div>`;
}
