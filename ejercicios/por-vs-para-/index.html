<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Por vs. Para | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --por:#f472b6;--por2:#ff91cd;
  --para:#25d9ff;--para2:#7ee8ff;
  --font:'DM Sans',system-ui,sans-serif;
  --display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 10% 10%,rgba(255,43,191,.13),transparent 28%),radial-gradient(ellipse at 90% 15%,rgba(37,217,255,.09),transparent 28%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(980px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}

.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);box-shadow:0 0 18px rgba(255,43,191,.22);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta);text-shadow:1px 1px 0 var(--cyan)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.5rem,2.8vw,2.5rem);font-weight:900;line-height:.95;background:linear-gradient(90deg,var(--por) 0%,#fff 40%,var(--para) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.86rem;line-height:1.5;margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.pill-por{background:rgba(244,114,182,.15);border:1px solid rgba(244,114,182,.35);border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:800;color:var(--por2)}
.pill-para{background:rgba(37,217,255,.12);border:1px solid rgba(37,217,255,.3);border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:800;color:var(--para2)}

.ex-tabs{display:flex;gap:6px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:8px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:9px 12px;font-weight:800;font-family:var(--font);font-size:.78rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translateY(-1px)}
.etab-icon{font-size:1.2rem;line-height:1}
.etab-label{font-size:.65rem;text-align:center;line-height:1.2;opacity:.9}

.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:24px 28px;box-shadow:var(--shadow)}
.ex-header{margin-bottom:16px}
.ex-title{font-family:var(--display);font-size:1.2rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.86rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}

.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:100px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--por),var(--para));transition:width .35s}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.btn-dark{background:#0b0220;color:var(--muted);border:1px solid rgba(255,255,255,.08)}

.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;font-weight:500;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ── MC ── */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:15px 17px;transition:border-color .15s}
.mc-card:hover{border-color:rgba(37,217,255,.15)}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.mc-num{font-size:.62rem;font-weight:900;color:var(--muted2);background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.65;color:var(--text);flex:1}
.mc-blank{display:inline-block;min-width:52px;border-bottom:2.5px solid rgba(37,217,255,.4);padding:0 4px;text-align:center;font-weight:800;color:var(--cyan)}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px;margin-bottom:3px}
.mc-opt{border:0;border-radius:10px;padding:9px 28px;font-weight:900;font-family:var(--display);font-size:1.05rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt.por-opt:hover:not(:disabled){border-color:var(--por);background:rgba(244,114,182,.12);color:var(--por2);transform:translateY(-1px)}
.mc-opt.para-opt:hover:not(:disabled){border-color:var(--para);background:rgba(37,217,255,.1);color:var(--para2);transform:translateY(-1px)}
.mc-opt:disabled{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:8px 12px 8px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}
.mc-use{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.mc-use.por{color:var(--por2)}.mc-use.para{color:var(--para2)}

/* ── CONTRAST ── */
.contrast-grid{display:flex;flex-direction:column;gap:16px}
.contrast-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:16px 18px}
.contrast-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cp-card{border-radius:12px;padding:13px 15px}
.cp-card.por-card{background:rgba(244,114,182,.07);border:1.5px solid rgba(244,114,182,.22)}
.cp-card.para-card{background:rgba(37,217,255,.06);border:1.5px solid rgba(37,217,255,.2)}
.cp-label{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.por-lbl{color:var(--por2)}.para-lbl{color:var(--para2)}
.cp-sent{font-size:.97rem;color:var(--text);line-height:1.5;margin-bottom:3px;font-weight:600}
.cp-en{font-size:.76rem;color:var(--muted2);font-style:italic;margin-bottom:5px}
.cp-mean{font-size:.78rem;font-weight:700}
.por-mean{color:var(--por2)}.para-mean{color:var(--para2)}
.contrast-q{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px}
.cq-text{font-size:.93rem;margin-bottom:8px;line-height:1.5}
.cq-opts{display:flex;gap:7px;flex-wrap:wrap}
.cq-opt{border:0;border-radius:8px;padding:7px 16px;font-weight:800;font-family:var(--font);font-size:.85rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.cq-opt:hover:not(:disabled){background:rgba(255,255,255,.12)}
.cq-opt:disabled{cursor:default}
.cq-opt.ok{background:rgba(34,197,94,.16);border-color:var(--good);color:#86efac}
.cq-opt.bad{background:rgba(239,68,68,.12);border-color:var(--bad);color:#fca5a5}

/* ── ERROR HUNT ── */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.revealed{border-color:rgba(255,255,255,.1)}
.eh-item.correct-sentence{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.wrong-sentence{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}
.eh-sent{font-size:.97rem;line-height:1.6}
.wrong-word{color:var(--bad);text-decoration:underline wavy var(--bad);font-weight:700}
.eh-correction{font-size:.82rem;font-weight:700;color:var(--good);margin-left:5px}
.eh-judge-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-judge-btn{border:0;border-radius:9px;padding:7px 15px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-correct-btn:hover:not(:disabled){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-error-btn:hover:not(:disabled){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-judge-btn:disabled{cursor:default;opacity:.5}
.judge-chosen-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.judge-chosen-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* ── SORT ── */
.sort-pile{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;min-height:52px;margin-bottom:12px}
.sort-buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sort-bucket{border-radius:14px;padding:13px;min-height:160px;display:flex;flex-direction:column;gap:7px;transition:background .2s}
.sort-bucket.drag-over{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.bucket-title{font-family:var(--display);font-size:.95rem;font-weight:900;text-align:center}
.bucket-sub{font-size:.63rem;color:var(--muted2);text-align:center;margin-bottom:4px;line-height:1.45}
.sort-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:grab;user-select:none;transition:.15s;line-height:1.4}
.sort-card:hover{transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sort-card:active{cursor:grabbing}
.sort-card.drag-ghost{opacity:.35}
.sort-card.card-correct{background:rgba(34,197,94,.14);border-color:var(--good);color:#86efac;cursor:default}
.sort-card.card-wrong{background:rgba(239,68,68,.1);border-color:var(--bad);color:#fca5a5;font-size:.78rem}

/* ── SPEED ── */
.speed-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.speed-stats{display:flex;gap:9px}
.spstat{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spstat .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2)}
.spstat .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spstat .sv.g{color:var(--good)}.spstat .sv.b{color:var(--bad)}.spstat .sv.w{color:var(--warn)}
.speed-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:22px 20px;text-align:center;width:100%;max-width:500px}
.speed-sent{font-size:1.08rem;line-height:1.7;color:var(--text);margin-bottom:4px}
.speed-sent em{font-style:normal;font-weight:900;color:var(--warn);background:rgba(245,158,11,.12);border-radius:5px;padding:0 5px}
.speed-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.speed-btns{display:flex;gap:14px;justify-content:center}
.speed-btn{border:0;border-radius:14px;padding:13px 32px;font-weight:900;font-family:var(--display);font-size:1.15rem;cursor:pointer;transition:.15s;box-shadow:0 4px 0 rgba(0,0,0,.25);min-width:130px}
.speed-btn.por-btn{background:linear-gradient(135deg,var(--por),var(--por2));color:#07111f}
.speed-btn.para-btn{background:linear-gradient(135deg,var(--para),var(--para2));color:#07111f}
.speed-btn:hover{transform:translateY(-3px)}
.speed-btn:active{transform:translateY(0);box-shadow:none}
.speed-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.speed-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:500px}
.speed-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.speed-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.timer-row{display:flex;align-items:center;gap:9px;width:100%;max-width:500px}
.timer-track{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.timer-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--por),var(--para));transition:width 1s linear}
.timer-num{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:18px;text-align:right}
.streak-badge{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak-badge.show{display:inline-flex;align-items:center;gap:4px}
.speed-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.speed-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.speed-start p{color:var(--muted);font-size:.87rem;max-width:380px;line-height:1.6}
.combo-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999;text-shadow:0 0 20px rgba(245,158,11,.5)}
.combo-flash.anim{animation:cf .7s ease forwards}
@keyframes cf{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* ── REFERENCE ── */
.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.ref-col{border-radius:14px;padding:16px}
.ref-col.por-col{background:rgba(244,114,182,.06);border:1.5px solid rgba(244,114,182,.2)}
.ref-col.para-col{background:rgba(37,217,255,.05);border:1.5px solid rgba(37,217,255,.18)}
.ref-col-title{font-family:var(--display);font-size:1.1rem;font-weight:900;margin-bottom:12px}
.ref-row{padding:7px 0;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:8px;align-items:flex-start}
.ref-key{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;min-width:92px;flex-shrink:0;margin-top:2px}
.ref-val{font-size:.83rem;color:var(--muted);line-height:1.5}
.ref-val em{font-style:normal;color:var(--text)}
.note-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:15px 17px;margin-bottom:14px}
.note-box h3{font-family:var(--display);font-size:.95rem;font-weight:800;margin-bottom:10px;color:var(--warn)}
.note-row{display:flex;gap:8px;margin-bottom:7px;font-size:.84rem;line-height:1.55}
.note-row:last-child{margin-bottom:0}
.idiom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.idiom-card{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 13px;border:1px solid rgba(255,255,255,.07)}
.idiom-word{font-family:var(--display);font-size:.88rem;font-weight:800;margin-bottom:3px}
.idiom-en{font-size:.78rem;color:var(--muted2)}

.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.panel{padding:16px 13px}.contrast-pair,.sort-buckets,.ref-grid{grid-template-columns:1fr}.mc-sent{font-size:.93rem}.speed-btns{gap:10px}.speed-btn{min-width:110px;padding:12px 20px}}

/* YMF brand v2 */
.logo-box,.hero .logo,.logoBox{padding:0!important;overflow:hidden!important;background:#0c0030!important;border:2px solid rgba(37,217,255,.28)!important;box-shadow:0 0 18px rgba(255,43,191,.18)!important}
img.ymf-logo{width:72px!important;height:72px!important;max-width:72px!important;object-fit:cover!important;border-radius:18px!important;padding:0!important;display:block}
.logo-box>img.ymf-logo,.hero .logo>img.ymf-logo,.logoBox>img.ymf-logo{width:100%!important;height:100%!important;max-width:none!important;border-radius:inherit!important}
.logo-box .logoText,.logoBox .logoText{display:none!important}
.hero-text h1,.hero h1,.app>header h1,header .brand~h1{background:linear-gradient(90deg,#ff4fd8,#ffffff 48%,#25d9ff)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;font-family:'Syne','DM Sans',system-ui,sans-serif!important}

      <h1>Por vs. Para</h1>
      <p>Six exercises to master the most confusing preposition pair in Spanish. Both translate as "for" in English — but they mean very different things.</p>
      <div class="badges">
        <span class="badge">A2–B1</span>
        <span class="badge" style="border-color:rgba(244,114,182,.35);color:var(--por2)">POR — causa · medio · duración</span>
        <span class="badge" style="border-color:rgba(37,217,255,.35);color:var(--para2)">PARA — propósito · destino · plazo</span>
        <span class="badge">By Carlos &amp; Denisse</span>

<script>
/* ═══════════════════════════════════════════════════════
   EX 1 — MULTIPLE CHOICE
   20 sentences. opts always [por, para] + 2 distractors.
   ans: 0=por, 1=para
   use: the grammar rule being tested
═══════════════════════════════════════════════════════ */
const MC = [
  { sent:'El regalo es ___ ti.',
    en:'The gift is for you.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Destinatario → <strong>para</strong>. El regalo va dirigido A ti.' },
  { sent:'Lo compré ___ 50 dólares.',
    en:'I bought it for 50 dollars.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Intercambio/precio → <strong>por</strong>. Diste dinero a cambio de algo.' },
  { sent:'Viajaré ___ Europa en el verano.',
    en:'I will travel through Europe in the summer.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Movimiento a través de un lugar → <strong>por</strong>. No es el destino final; es el recorrido.' },
  { sent:'Ella estudia ___ ser doctora.',
    en:'She studies in order to be a doctor.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Propósito/objetivo → <strong>para</strong>. La meta de sus estudios es llegar a ser doctora.' },
  { sent:'El paquete fue enviado ___ avión.',
    en:'The package was sent by plane.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Medio o método → <strong>por</strong>. El avión es el medio de transporte/envío.' },
  { sent:'Esas flores son ___ la ceremonia.',
    en:'Those flowers are for the ceremony.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Uso destinado / receptor → <strong>para</strong>. Las flores tienen un destino: la ceremonia.' },
  { sent:'Gracias ___ ayudarme.',
    en:'Thanks for helping me.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Gratitud por una causa o acción → <strong>por</strong>. "Gracias para" no existe. Siempre "gracias por".' },
  { sent:'Estuve esperando ___ dos horas.',
    en:'I was waiting for two hours.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Duración → <strong>por</strong>. Indica cuánto tiempo duró la acción.' },
  { sent:'Ella trabaja ___ ganar más experiencia.',
    en:'She works in order to gain more experience.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Propósito → <strong>para</strong>. El objetivo de trabajar es ganar experiencia.' },
  { sent:'___ la mañana, siempre tomo café.',
    en:'In the morning, I always drink coffee.',
    opts:['Por','Para'], ans:0, use:'por',
    exp:'Tiempo aproximado del día → <strong>por</strong>. "Por la mañana/tarde/noche" indica franja horaria.' },
  { sent:'Ellos luchan ___ sus derechos.',
    en:'They fight for their rights.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Causa o motivo → <strong>por</strong>. Luchan motivados por sus derechos.' },
  { sent:'Necesito terminar el informe ___ mañana.',
    en:'I need to finish the report by tomorrow.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Plazo / fecha límite → <strong>para</strong>. Indica cuándo debe estar listo.' },
  { sent:'El cuadro fue pintado ___ Picasso.',
    en:'The painting was painted by Picasso.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Agente de la voz pasiva → <strong>por</strong>. Introduce quién realizó la acción.' },
  { sent:'Voy al gimnasio ___ ponerme en forma.',
    en:'I go to the gym in order to get in shape.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Propósito → <strong>para</strong>. El objetivo de ir al gimnasio es ponerse en forma.' },
  { sent:'Voy al gimnasio dos veces ___ semana.',
    en:'I go to the gym twice per week.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Frecuencia → <strong>por</strong>. "Por semana/mes/año" indica con qué frecuencia.' },
  { sent:'___ ser tan joven, habla muy bien.',
    en:'For being so young, he speaks very well.',
    opts:['Por','Para'], ans:1, use:'para',
    exp:'Comparación o contraste → <strong>para</strong>. Expresa algo sorprendente dadas las circunstancias.' },
  { sent:'Estoy aquí ___ ti — cuéntame qué pasó.',
    en:'I\'m here for you — tell me what happened.',
    opts:['por','para'], ans:1, use:'para',
    exp:'<strong>Para ti</strong> = estoy aquí para apoyarte (propósito). <strong>Por ti</strong> significaría "vine a causa de ti".' },
  { sent:'Hablé con ella ___ teléfono.',
    en:'I spoke with her by phone.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Medio de comunicación → <strong>por</strong>. "Por teléfono / por correo / por WhatsApp".' },
  { sent:'___ mí, esta película es aburrida.',
    en:'For me, this movie is boring.',
    opts:['Por','Para'], ans:1, use:'para',
    exp:'Opinión personal → <strong>para</strong>. "Para mí/ti/él/ella" expresa punto de vista.' },
  { sent:'Lo hizo ___ su familia, no ___ dinero.',
    en:'He did it for his family, not for money.',
    opts:['por / por','para / para'], ans:0, use:'por',
    exp:'Ambos son <strong>por</strong>: causa/motivo. Hizo algo motivado por su familia y (no) por dinero.' },
  { sent:'Voy a la tienda ___ pan.',
    en:'I\'m going to the store to get bread.',
    opts:['por','para'], ans:0, use:'por',
    exp:'<strong>Por</strong> en este contexto = "a buscar / a recoger". "Voy por pan" = voy a buscarlo. Es una expresión idiomática con por.' },
  { sent:'Este libro es ___ aprender a cocinar.',
    en:'This book is for learning how to cook.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Uso destinado → <strong>para</strong>. El libro tiene un propósito específico: aprender a cocinar.' },
  { sent:'La clase se canceló ___ la lluvia.',
    en:'The class was canceled because of the rain.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Causa o razón → <strong>por</strong>. La lluvia es el motivo de la cancelación.' },
  { sent:'Te llamo ___ teléfono más tarde.',
    en:'I\'ll call you by phone later.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Medio de comunicación → <strong>por</strong>. "Por teléfono / por WhatsApp / por correo".' },
  { sent:'Compré estas flores ___ ti.',
    en:'I bought these flowers for you.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Destinatario → <strong>para</strong>. Las flores van dirigidas a ti.' },
  { sent:'Estaré en Madrid ___ tres días.',
    en:'I\'ll be in Madrid for three days.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Duración → <strong>por</strong>. Indica cuánto tiempo permaneces en un lugar.' },
  { sent:'Ella aprendió español ___ trabajar en México.',
    en:'She learned Spanish in order to work in Mexico.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Propósito/objetivo → <strong>para</strong>. La meta de aprender español es trabajar en México.' },
  { sent:'El trabajo fue hecho ___ mí.',
    en:'The work was done by me.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Agente de la voz pasiva → <strong>por</strong>. "Por mí" indica quién realizó la acción.' },
  { sent:'Necesito algo ___ abrir esta botella.',
    en:'I need something to open this bottle.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Uso destinado → <strong>para</strong>. El objeto tiene una función específica.' },
  { sent:'Nos casamos ___ amor, no ___ dinero.',
    en:'We got married for love, not for money.',
    opts:['por / por','para / para'], ans:0, use:'por',
    exp:'Causa/motivo en ambos casos → <strong>por</strong>. El amor y el dinero son las razones.' },
  { sent:'El vuelo sale ___ Cancún a las ocho.',
    en:'The flight leaves for Cancún at eight.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Destino → <strong>para</strong>. Cancún es el punto de llegada del vuelo.' },
  { sent:'Yo hago ejercicio ___ una hora cada día.',
    en:'I exercise for one hour every day.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Duración → <strong>por</strong>. Indica cuánto tiempo dura la actividad.' },
  { sent:'___ ella, la mejor ciudad del mundo es Oaxaca.',
    en:'For her, the best city in the world is Oaxaca.',
    opts:['Por','Para'], ans:1, use:'para',
    exp:'Opinión o punto de vista → <strong>para</strong>. "Para ella / para mí / para él" expresa perspectiva personal.' },
  { sent:'Viajamos ___ avión hasta París.',
    en:'We traveled by plane to Paris.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Medio de transporte → <strong>por</strong>. "Por avión / por tren / por barco".' },
  { sent:'La tarea es ___ el miércoles.',
    en:'The homework is due Wednesday.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Fecha límite/plazo → <strong>para</strong>. Indica cuándo debe estar lista la tarea.' },
  { sent:'Estudio ___ interés en la cultura.',
    en:'I study because of my interest in the culture.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Causa/motivo existente → <strong>por</strong>. El interés ya existe y es la razón del estudio.' },
  { sent:'¿Tienes un bolígrafo ___ firmar?',
    en:'Do you have a pen to sign with?',
    opts:['por','para'], ans:1, use:'para',
    exp:'Uso destinado → <strong>para</strong>. El bolígrafo tiene una función específica en este momento.' },
  { sent:'Camino ___ el centro todos los días.',
    en:'I walk through downtown every day.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Movimiento a través de un lugar → <strong>por</strong>. No es el destino; es la ruta.' },
  { sent:'Este medicamento es ___ el dolor de cabeza.',
    en:'This medicine is for headaches.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Uso destinado → <strong>para</strong>. El medicamento tiene un propósito específico.' },
  { sent:'Te doy mi coche ___ el tuyo por una semana.',
    en:'I\'ll give you my car for yours for a week.',
    opts:['por','para'], ans:0, use:'por',
    exp:'Intercambio/trueque → <strong>por</strong>. Das algo a cambio de otra cosa.' },
  { sent:'Salgo ___ la oficina en diez minutos.',
    en:'I\'m leaving for the office in ten minutes.',
    opts:['por','para'], ans:1, use:'para',
    exp:'Destino → <strong>para</strong>. La oficina es adonde me dirijo.' },
  { sent:'Lo cancelaron ___ falta de participantes.',

function renderMC(){
  const answered=Object.keys(mc_answers).length;
  const pct=Math.round(answered/MC.length*100);
  const qHTML=MC.map((item,i)=>{
    const optHTML=item.opts.map((o,oi)=>{
      let cls='mc-opt '+(o.startsWith('por')||o==='por'||o==='Por'?'por-opt':'para-opt');
      if(mc_checked){
        if(oi===item.ans) cls+=' mc-show';
        else if(mc_answers[i]===oi&&oi!==item.ans) cls+=' mc-err';
      } else if(mc_answers[i]===oi) cls+=oi===item.ans?' mc-ok':' mc-err';
      return `<button class="${cls}" id="mco_${i}_${oi}" onclick="answerMC(${i},${oi})" ${mc_checked?'disabled':''}>${o}</button>`;
    }).join('');
    const ruleColor=item.use==='por'?'var(--por2)':'var(--para2)';
    const explShow=mc_checked||(mc_answers[i]!==undefined);
    return `<div class="mc-card">
      <div class="mc-top"><span class="mc-num" style="color:${ruleColor}">${i+1}</span><span class="mc-sent">${item.sent.replace('___','<span class="mc-blank">___</span>').replace(/___/g,'<span class="mc-blank">___</span>')}</span></div>
      <div class="mc-en">${item.en}</div>
      <div class="mc-opts">${optHTML}</div>
      <div class="mc-expl ${explShow?'show':''}" id="mcexp_${i}"><span class="mc-use ${item.use}">Regla: ${item.use.toUpperCase()}</span> ${item.exp}</div>
    </div>`;
  }).join('');

  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-header">
    <div class="ex-title">📝 Multiple choice</div>
    <div class="ex-instr">Choose <span class="pill-por">por</span> or <span class="pill-para">para</span> for each sentence. The number color is a subtle hint: 🩷 por · 🔵 para — but try to figure it out from context first.</div>
  </div>
  <div class="score-bar">
    <div class="sc"><span class="l">Total</span><span class="v">${MC.length}</span></div>
    <div class="sc"><span class="l">Correctas</span><span class="v g" id="mc_ok">—</span></div>
    <div class="sc"><span class="l">Errores</span><span class="v b" id="mc_err">—</span></div>
    <div class="prog-w"><div class="prog-l">Respondidas: <span id="mc_pct">${pct}%</span></div><div class="prog-t"><div class="prog-f" id="mc_prog" style="width:${pct}%"></div></div></div>
  </div>
  <div class="mc-list">${qHTML}</div>
  <div class="fb" id="mc_fb"></div>
  <div class="actions">
    <button class="btn btn-cyan" id="mc_check" onclick="checkMC()" ${mc_checked?'disabled':''}>Revisar todo</button>
    <button class="btn btn-ghost" onclick="mc_answers={};mc_checked=false;renderMC()">↺ Reiniciar</button>
  </div></div>`;
}

function answerMC(qi,oi){
  if(mc_checked) return;
  if(mc_answers[qi]!==undefined){
    const prev=document.getElementById(`mco_${qi}_${mc_answers[qi]}`);
    if(prev){prev.classList.remove('mc-ok','mc-err');}
  }
  mc_answers[qi]=oi;
  const isOk=oi===MC[qi].ans;
  const btn=document.getElementById(`mco_${qi}_${oi}`);
  if(btn) btn.classList.add(isOk?'mc-ok':'mc-err');
  const exp=document.getElementById(`mcexp_${qi}`);
  if(exp) exp.classList.add('show');
  const pct=Math.round(Object.keys(mc_answers).length/MC.length*100);
  const el=document.getElementById('mc_pct'); if(el)el.textContent=pct+'%';
  const pg=document.getElementById('mc_prog'); if(pg)pg.style.width=pct+'%';
}

function checkMC(){
  mc_checked=true;
  let ok=0;
  MC.forEach((item,i)=>{ if(mc_answers[i]===item.ans) ok++; });
  const pct=Math.round(ok/MC.length*100);
  document.getElementById('mc_ok').textContent=ok;
  document.getElementById('mc_err').textContent=MC.length-ok;
  document.getElementById('mc_prog').style.width='100%';
  document.getElementById('mc_pct').textContent='100%';
  const fb=document.getElementById('mc_fb');
  if(pct===100){fb.className='fb show ok';fb.innerHTML='🏆 <strong>¡Perfecto! 20/20.</strong> Dominas por vs para.';}
  else if(pct>=75){fb.className='fb show ok';fb.innerHTML=`👍 <strong>${ok}/20.</strong> Muy bien. Lee las explicaciones de los errores.`;}
  else if(pct>=50){fb.className='fb show partial';fb.innerHTML=`📖 <strong>${ok}/20.</strong> Recuerda: POR = causa/duración/medio. PARA = propósito/destino/plazo.`;}
  else{fb.className='fb show err';fb.innerHTML=`💪 <strong>${ok}/20.</strong> Revisa la tabla de referencia y vuelve a intentarlo.`;}
  document.getElementById('mc_check').disabled=true;
  renderMC();
}

          <div class="cp-sent">${item.por.sent}</div>

          <div class="cp-mean por-mean">→ ${item.por.mean}</div>
        </div>
        <div class="cp-card para-card">
          <div class="cp-label para-lbl">🔵 PARA</div>
          <div class="cp-sent">${item.para.sent}</div>
          <div class="cp-en">${item.para.en}</div>
          <div class="cp-mean para-mean">→ ${item.para.mean}</div>
        </div>
      </div>
      <div class="contrast-q">
        <div class="cq-text">❓ ${item.q}</div>
        <div class="cq-opts">${item.opts.map((o,oi)=>`<button class="cq-opt" id="cqo_${idx}_${oi}" onclick="answerContrast(${idx},${oi})">${o}</button>`).join('')}</div>
        <div class="fb" id="cqfb_${idx}"></div>
      </div>
    </div>`;
  });
  html+=`</div></div>`;
  document.getElementById('exContainer').innerHTML=html;
}

function answerContrast(idx,chosen){
  if(contrast_answered[idx]!==undefined) return;
  contrast_answered[idx]=chosen;
  const item=CONTRAST[idx];
  const isOk=chosen===item.ans;
  [0,1].forEach(oi=>{
    const btn=document.getElementById(`cqo_${idx}_${oi}`);
    if(!btn)return;
    btn.disabled=true;
    if(oi===chosen&&isOk) btn.classList.add('ok');
    else if(oi===chosen&&!isOk) btn.classList.add('bad');
    else if(oi===item.ans) btn.classList.add('ok');
  });
  const fb=document.getElementById(`cqfb_${idx}`);
  fb.className='fb show '+(isOk?'ok':'err');
  fb.innerHTML=isOk?`✓ <strong>¡Correcto!</strong> ${item.exp}`:`✗ ${item.exp}`;
}

/* ═══════════════════════════════════════════════════════
   EX 3 — ERROR HUNT (student judges)
═══════════════════════════════════════════════════════ */
function renderErrorHunt(){
  eh_answered={};
  let html=`<div class="panel">
  <div class="ex-header">
    <div class="ex-title">🔍 Error hunter</div>
    <div class="ex-instr">Read each sentence. Is <span class="pill-por">por</span> or <span class="pill-para">para</span> used <em>correctly</em>? Decide before seeing the explanation.</div>
  </div>
  <div class="score-bar">
    <div class="sc"><span class="l">Total</span><span class="v">${ERRORS.length}</span></div>
    <div class="sc"><span class="l">Aciertos</span><span class="v g" id="eh_ok">0</span></div>
    <div class="sc"><span class="l">Errores</span><span class="v b" id="eh_err">0</span></div>
    <div class="prog-w"><div class="prog-l">Progreso: <span id="eh_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="eh_prog" style="width:0%"></div></div></div>
  </div>
  <div class="eh-list">`;

  ERRORS.forEach(([sent,,,exp],idx)=>{
    html+=`<div class="eh-item" id="ehi_${idx}">
      <div class="eh-num">${idx+1}</div>
      <div class="eh-body">
        <div class="eh-sent" id="ehsent_${idx}">${sent}</div>
        <div class="eh-judge-row">
          <button class="eh-judge-btn eh-correct-btn" onclick="judgeEh(${idx},false)">✅ Correcto</button>
          <button class="eh-judge-btn eh-error-btn"   onclick="judgeEh(${idx},true)">❌ Tiene error</button>
        </div>
        <div class="eh-exp" id="ehexp_${idx}">${exp}</div>
      </div>
    </div>`;
  });

  html+=`</div>
  <div class="fb" id="eh_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="eh_answered={};renderErrorHunt()">↺ Reiniciar</button></div>
  </div>`;
  document.getElementById('exContainer').innerHTML=html;
}

function judgeEh(idx,studentSaysError){
  if(eh_answered[idx]!==undefined) return;
  const [sent,hasErr,correction,exp]=ERRORS[idx];
  const correct=studentSaysError===hasErr;
  eh_answered[idx]=correct;

  const item=document.getElementById('ehi_'+idx);
  item.classList.add('revealed',correct?'correct-sentence':'wrong-sentence');
  item.querySelectorAll('.eh-judge-btn').forEach(b=>b.disabled=true);
  const chosenBtn=item.querySelector(studentSaysError?'.eh-error-btn':'.eh-correct-btn');
  if(chosenBtn) chosenBtn.classList.add(correct?'judge-chosen-ok':'judge-chosen-err');

  if(hasErr&&correction){
    const sentEl=document.getElementById('ehsent_'+idx);
    let h=sent;
    ['por','para'].forEach(p=>{
      if(correction!==p){
        const re=new RegExp(`\\b${p}\\b`,'gi');
        h=h.replace(re,`<span class="wrong-word">${p}</span>`);
      }
    });
    sentEl.innerHTML=h+` <span class="eh-correction">→ <strong>${correction}</strong></span>`;
  }
  document.getElementById('ehexp_'+idx).classList.add('show');

  const totalAnswered=Object.keys(eh_answered).length;
  const totalOk=Object.values(eh_answered).filter(v=>v).length;
  document.getElementById('eh_ok').textContent=totalOk;
  document.getElementById('eh_err').textContent=totalAnswered-totalOk;
  document.getElementById('eh_pct').textContent=Math.round(totalAnswered/ERRORS.length*100)+'%';
  document.getElementById('eh_prog').style.width=Math.round(totalAnswered/ERRORS.length*100)+'%';

  if(totalAnswered===ERRORS.length){
    const pct=Math.round(totalOk/ERRORS.length*100);
    const fb=document.getElementById('eh_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'🏆':'📖'} <strong>${totalOk}/${ERRORS.length}.</strong> ${pct>=80?'¡Excelente! Identificaste todos los errores.':'Repasa las reglas marcadas en rojo.'}`;
  }
}

/* ═══════════════════════════════════════════════════════
   EX 4 — SORT
═══════════════════════════════════════════════════════ */
function renderSort(){
  sortPlaced={}; sortChecked=false; tapSelected=null;
  const shuffled=[...SORT_ITEMS].sort(()=>Math.random()-.5);
  const pile=shuffled.map(item=>`<div class="sort-card" id="sc_${item.id}" draggable="true"
    ondragstart="dragStart(event,'${item.id}')" ondragend="dragEnd(event)"
    onclick="tapCard('${item.id}')">${item.text}</div>`).join('');
  const buckHTML=SORT_BUCKETS_DATA.map(b=>`<div class="sort-bucket" id="bucket-${b.id}"
    style="background:${b.bg};border:2px dashed ${b.bdr};min-height:90px"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="dropInto(event,'${b.id}')" onclick="bucketTap('${b.id}')">
    <div class="bucket-title" style="color:${b.col};font-size:.78rem">${b.icon} ${b.label}</div>
    <div class="bucket-sub">${b.sub}</div>
  </div>`).join('');

  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-header">
    <div class="ex-title">🗂️ Drag & sort</div>
    <div class="ex-instr">Drag each sentence to the correct <em>use case</em> — not just POR or PARA, but <em>why</em>. Is it a cause? A destination? A deadline? The grammar rule matters. On mobile, tap a card then tap the bucket.</div>
  </div>
  <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);margin-bottom:8px">Sentences — drag or tap → tap bucket</div>
  <div class="sort-pile" id="sortPile">${pile}</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;margin-bottom:12px">${buckHTML}</div>
  <div class="fb" id="sort_fb"></div>
  <div class="actions">
    <button class="btn btn-cyan" id="sort_check" onclick="checkSort()" disabled>Revisar</button>
    <button class="btn btn-ghost" onclick="renderSort()">↺ Reiniciar</button>
  </div></div>`;
}

function dragStart(e,id){dragItem=id;setTimeout(()=>{const c=document.getElementById('sc_'+id);if(c)c.classList.add('drag-ghost');},0);}
function dragEnd(e){if(dragItem){const c=document.getElementById('sc_'+dragItem);if(c)c.classList.remove('drag-ghost');}dragItem=null;}
function dropInto(e,bucket){
  e.preventDefault();
  const id=e.dataTransfer?e.dataTransfer.getData('text'):dragItem;
  document.getElementById('bucket-'+bucket).classList.remove('drag-over');
  if(!id||sortPlaced[id])return;
  placeCard(id,bucket);
}
function tapCard(id){
  if(sortPlaced[id])return;
  const card=document.getElementById('sc_'+id);
  if(!card)return;
  if(tapSelected===id){card.style.boxShadow='';tapSelected=null;return;}
  if(tapSelected){const p=document.getElementById('sc_'+tapSelected);if(p)p.style.boxShadow='';}
  tapSelected=id; card.style.boxShadow='0 0 0 3px var(--cyan)';
}
function bucketTap(bucket){if(!tapSelected)return;placeCard(tapSelected,bucket);tapSelected=null;}
function placeCard(id,bucket){
  sortPlaced[id]=bucket;
  const card=document.getElementById('sc_'+id);
  const bEl=document.getElementById('bucket-'+bucket);
  if(!card||!bEl)return;
  card.style.boxShadow='';card.classList.remove('drag-ghost');card.draggable=false;
  card.style.borderColor=bucket==='por'?'var(--por2)':'var(--para2)';
  card.onclick=()=>returnCard(id);
  bEl.appendChild(card);
  if(Object.keys(sortPlaced).length===SORT_ITEMS.length){
    const btn=document.getElementById('sort_check');if(btn)btn.disabled=false;
  }
}
function returnCard(id){
  if(sortChecked)return;
  delete sortPlaced[id];
  const card=document.getElementById('sc_'+id);
  const pile=document.getElementById('sortPile');
  if(!card||!pile)return;
  card.style.borderColor='';card.style.boxShadow='';card.draggable=true;
  card.onclick=()=>tapCard(id);
  card.ondragstart=(e)=>dragStart(e,id);
  pile.appendChild(card);
  const btn=document.getElementById('sort_check');if(btn)btn.disabled=true;
}
function checkSort(){
  sortChecked=true;
  let ok=0;
  SORT_ITEMS.forEach(item=>{
    const card=document.getElementById('sc_'+item.id);
    if(!card)return;
    const isOk=sortPlaced[item.id]===item.correct;
    if(isOk)ok++;
    card.className='sort-card '+(isOk?'card-correct':'card-wrong');
    card.draggable=false;card.onclick=null;
    if(!isOk){
      const correctBucket=SORT_BUCKETS_DATA.find(b=>b.id===item.correct);
      card.innerHTML=`${item.text} <span style="font-size:.7rem;display:block;margin-top:3px;opacity:.9">→ ${correctBucket?correctBucket.icon+' '+correctBucket.label:item.correct}</span>`;
    }
    card.title=item.exp;
  });
  const pct=Math.round(ok/SORT_ITEMS.length*100);
  const fb=document.getElementById('sort_fb');
  fb.className='fb show '+(pct>=80?'ok':pct>=55?'partial':'err');
  fb.innerHTML=`<strong>${ok}/${SORT_ITEMS.length} (${pct}%).</strong> Las tarjetas rojas muestran el cubo correcto. Pasa el cursor para ver la explicación.`;
  document.getElementById('sort_check').disabled=true;
}

/* ═══════════════════════════════════════════════════════
   EX 5 — SPEED ROUND (POR / PARA buttons, 5 sec)
═══════════════════════════════════════════════════════ */
function renderSpeed(){
  if(speedTimer){clearInterval(speedTimer);speedTimer=null;}
  speedIdx=0;speedOk=0;speedErr=0;speedStreak=0;speedAnswered=false;
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-header">
    <div class="ex-title">⚡ Speed round</div>
    <div class="ex-instr"><span class="pill-por">POR</span> or <span class="pill-para">PARA</span>? You have <em>5 seconds</em>. Trust your instinct — the hint is there if you need it. Build a streak!</div>
  </div>
  <div class="speed-wrap" id="speedWrap">
    <div class="speed-start">
      <div style="font-size:2.8rem">⚡</div>
      <h2>¿Por o Para?</h2>
      <p>Read the sentence and tap the correct preposition before time runs out. Streaks of 3+ earn a combo!</p>
      <button class="btn btn-cyan" onclick="startSpeed()">¡Empezar!</button>
    </div>
  </div></div>`;
}

function startSpeed(){speedIdx=0;speedOk=0;speedErr=0;speedStreak=0;nextSpeedQ();}

function nextSpeedQ(){
  if(speedIdx>=SPEED.length){endSpeed();return;}
  speedAnswered=false;
  const item=SPEED[speedIdx];
  speedTimeLeft=5;
  document.getElementById('speedWrap').innerHTML=`
    <div class="speed-stats">
      <div class="spstat"><div class="sl">Pregunta</div><div class="sv w">${speedIdx+1}/${SPEED.length}</div></div>
      <div class="spstat"><div class="sl">Correctas</div><div class="sv g">${speedOk}</div></div>
      <div class="spstat"><div class="sl">Errores</div><div class="sv b">${speedErr}</div></div>
    </div>
    <div class="streak-badge ${speedStreak>=3?'show':''}" id="streakB">🔥 Racha: ${speedStreak}</div>
    <div class="speed-card">
      <div class="speed-sent">${item.q.replace('___','<em>___</em>')}</div>
      <div class="speed-hint">💡 ${item.hint}</div>
    </div>
    <div class="timer-row">
      <div class="timer-track"><div class="timer-fill" id="tFill" style="width:100%;transition:width 1s linear"></div></div>
      <div class="timer-num" id="tNum">5</div>
    </div>
    <div class="speed-btns">
      <button class="speed-btn por-btn" id="sbPor" onclick="answerSpeed('por')">POR</button>
      <button class="speed-btn para-btn" id="sbPara" onclick="answerSpeed('para')">PARA</button>
    </div>
    <div class="speed-fb" id="sFb" style="opacity:0"></div>`;

  if(speedTimer)clearInterval(speedTimer);
  speedTimer=setInterval(()=>{
    speedTimeLeft--;
    const f=document.getElementById('tFill');
    const n=document.getElementById('tNum');
    if(f)f.style.width=Math.max(0,(speedTimeLeft/5)*100)+'%';
    if(n){n.textContent=speedTimeLeft;n.style.color=speedTimeLeft<=1?'var(--bad)':speedTimeLeft<=3?'var(--warn)':'var(--muted2)';}
    if(speedTimeLeft<=0){clearInterval(speedTimer);speedTimer=null;if(!speedAnswered)answerSpeed(null);}
  },1000);
}

function answerSpeed(chosen){
  if(speedAnswered)return;
  speedAnswered=true;
  if(speedTimer){clearInterval(speedTimer);speedTimer=null;}
  const item=SPEED[speedIdx];
  const isOk=chosen===item.ans;
  if(isOk){speedOk++;speedStreak++;}else{speedErr++;speedStreak=0;}
  ['sbPor','sbPara'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true;});
  const fb=document.getElementById('sFb');
  if(fb){
    fb.style.opacity='1';
    if(!chosen){fb.className='speed-fb err';fb.innerHTML=`⏱ Time! → <strong>${item.ans.toUpperCase()}</strong>`;}
    else if(isOk){fb.className='speed-fb ok';fb.innerHTML=`✓ <strong>¡Correcto!</strong>${speedStreak>=3?' 🔥 x'+speedStreak:''}`;}
    else{fb.className='speed-fb err';fb.innerHTML=`✗ Era <strong>${item.ans.toUpperCase()}</strong> (${item.hint})`;}
  }
  if(speedStreak>=3){
    const cf=document.getElementById('comboFlash');
    cf.textContent='🔥 x'+speedStreak;
    cf.classList.remove('anim');void cf.offsetWidth;cf.classList.add('anim');
  }
  speedIdx++;
  setTimeout(nextSpeedQ,isOk?700:1300);
}

function endSpeed(){
  const pct=Math.round(speedOk/SPEED.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  document.getElementById('speedWrap').innerHTML=`<div class="speed-start">
    <div style="font-size:3rem">${emo}</div>
    <h2>${speedOk}/${SPEED.length} correctas</h2>
    <p style="color:var(--muted)">${pct>=90?'¡Perfecto! Por y para no te confunden.':pct>=70?'¡Muy bien! Repasa los casos que fallaste.':pct>=50?'Buen intento. Fíjate en la pista de cada pregunta.':'Revisa la tabla de referencia e inténtalo de nuevo.'}</p>
    <button class="btn btn-cyan" onclick="startSpeed()">↺ Intentar de nuevo</button>
  </div>`;
}
