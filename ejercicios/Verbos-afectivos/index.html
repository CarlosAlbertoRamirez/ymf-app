<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbos Afectivos | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --g1:#f472b6;--g2:#ff91cd;--v1:#25d9ff;--v2:#7ee8ff;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 12% 8%,rgba(255,43,191,.15),transparent 30%),radial-gradient(ellipse at 88% 12%,rgba(37,217,255,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);box-shadow:0 0 18px rgba(255,43,191,.22);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta);text-shadow:1px 1px 0 var(--cyan)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--g1),#fff 40%,var(--v1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:5px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:8px 11px;font-weight:800;font-family:var(--font);font-size:.76rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translateY(-1px)}
.etab-icon{font-size:1.15rem;line-height:1}
.etab-label{font-size:.62rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:100px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--v1));transition:width .35s}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ── VERB CARDS (EX 0) ── */
.verb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.verb-card{border-radius:18px;overflow:hidden;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer;transition:transform .15s,box-shadow .15s}
.verb-card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,.5)}
.verb-card-top{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.verb-emoji{font-size:2rem;line-height:1;flex-shrink:0;width:44px;text-align:center}
.verb-info{flex:1}
.verb-name{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--text)}
.verb-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-top:2px}
.verb-intensity{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:2px 9px;margin-top:4px;display:inline-block}
.verb-struct{background:rgba(0,0,0,.3);padding:10px 18px;font-size:.83rem;color:var(--muted);border-top:1px solid rgba(255,255,255,.06);font-family:monospace;line-height:1.7}
.verb-struct .hl{color:var(--cyan);font-weight:700;font-family:var(--font)}
.verb-struct .hl2{color:var(--g2);font-weight:700;font-family:var(--font)}
.verb-examples{padding:12px 18px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.02);border-top:1px solid rgba(255,255,255,.05)}
.verb-ex{font-size:.85rem;line-height:1.5}
.verb-ex .es{font-weight:600;color:var(--text)}
.verb-ex .en{font-size:.75rem;color:var(--muted2);font-style:italic;display:block}

/* conjugation table inside card */
.conj-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px}
.conj-table th{padding:4px 8px;font-size:.58rem;font-weight:800;text-transform:uppercase;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.conj-table td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.4}
.conj-table tr:last-child td{border-bottom:none}
.conj-io{font-weight:700;color:var(--cyan)}
.conj-verb{font-weight:700;color:var(--g2)}
.conj-sub{color:var(--muted)}

/* ── PICTURE CARDS (EX 1) ── */
.pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.pic-card{border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:transform .15s,box-shadow .15s}
.pic-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.pic-card.ok{border-color:var(--good);box-shadow:0 0 0 2px rgba(34,197,94,.3)}
.pic-card.err{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
.pic-q{padding:12px 14px 8px;font-size:.97rem;font-weight:700;text-align:center;line-height:1.45;background:rgba(0,0,0,.25)}
.pic-blank{display:inline-block;min-width:72px;border-bottom:3px solid var(--cyan);color:var(--cyan);font-weight:900;padding:0 4px;text-align:center}
.pic-img{background:linear-gradient(160deg,#f0f4ff,#dde8ff);display:flex;align-items:center;justify-content:center;padding:14px;min-height:220px}
.pic-img img{width:100%;height:190px;display:block;border-radius:14px;object-fit:cover;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.pic-img svg{max-width:185px;max-height:135px;display:block}
.pic-btns{display:grid;grid-template-columns:1fr 1fr}
.pic-btn{border:0;padding:11px 8px 11px 24px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.12s;color:white;text-align:left;position:relative;line-height:1.3}
.pic-btn:hover:not([disabled]){filter:brightness(1.15)}
.pic-btn[disabled]{cursor:default}
.pic-btn::before{content:attr(data-l);position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.68rem;opacity:.65;font-weight:900}
.pic-btn.c1{background:#e11d9a}.pic-btn.c2{background:#0891b2}
.pic-btn.c3{background:#d97706}.pic-btn.c4{background:#7c3aed}
.pic-btn.revealed{box-shadow:inset 0 0 0 3px white}
.pic-btn.revealed::after{content:"✓";position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.pic-btn.dim{opacity:.3}
.pic-exp{font-size:.76rem;padding:8px 12px;background:rgba(0,0,0,.35);color:var(--muted);line-height:1.5;text-align:center;display:none}
.pic-exp.show{display:block}

/* ── MC (EX 2) ── */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.65;flex:1}
.mc-blank{display:inline-block;min-width:80px;border-bottom:2.5px solid rgba(37,217,255,.4);padding:0 4px;text-align:center;font-weight:800;color:var(--cyan)}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px}
.mc-opt{border:0;border-radius:10px;padding:7px 14px;font-weight:700;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px);background:rgba(37,217,255,.09);border-color:rgba(37,217,255,.35)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.79rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:7px 12px 7px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}

/* ── ERROR HUNT (EX 3) ── */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.eh-ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.eh-bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}
.eh-sent{font-size:.97rem;line-height:1.6}
.eh-fix{font-size:.82rem;font-weight:700;color:var(--good);margin-left:6px}
.eh-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-btn{border:0;border-radius:9px;padding:7px 15px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-yes:hover:not([disabled]){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-no:hover:not([disabled]){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-btn[disabled]{cursor:default;opacity:.5}
.cho-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.cho-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* ── SPEED (EX 4) ── */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;text-align:center;width:100%;max-width:520px}
.sp-q{font-size:1.05rem;line-height:1.7;margin-bottom:4px}
.sp-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.sp-inp{flex:1;max-width:280px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--font);font-size:1rem;font-weight:700;color:var(--text);outline:none;transition:.15s}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-inp::placeholder{color:var(--muted2);font-weight:400}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:520px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:520px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--v1));transition:width 1s linear}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.sp-start p{color:var(--muted);font-size:.87rem;max-width:420px;line-height:1.6}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* ── REFERENCE (EX 5) ── */
.ref-table{width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px}
.ref-table th{padding:7px 12px;font-size:.62rem;font-weight:800;text-transform:uppercase;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.ref-table td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5;vertical-align:top}
.ref-table tr:last-child td{border-bottom:none}
.ref-table tr:hover td{background:rgba(255,255,255,.02)}
.td-es{font-weight:700}.td-en{color:var(--muted2);font-style:italic;font-size:.79rem}.td-ex{color:var(--muted);font-size:.78rem;font-style:italic}
.ref-h3{font-family:var(--display);font-size:.95rem;font-weight:800;margin-bottom:10px;padding:6px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.ref-alert{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:12px 16px;font-size:.84rem;color:#fecaca;line-height:1.6;margin-bottom:12px}
.ref-tip{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:12px 16px;font-size:.84rem;color:#bbf7d0;line-height:1.6;margin-bottom:12px}
.struct-box{background:rgba(255,255,255,.04);border:1px solid rgba(37,217,255,.15);border-radius:12px;padding:14px 18px;margin-bottom:10px;font-size:.9rem;line-height:2}
.s-io{color:var(--g2);font-weight:800}.s-verb{color:var(--cyan);font-weight:800}.s-sub{color:var(--muted)}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.panel{padding:14px 12px}.verb-grid{grid-template-columns:1fr}.pic-grid{grid-template-columns:1fr}}

/* YMF brand v2 */
.logo-box,.hero .logo,.logoBox{padding:0!important;overflow:hidden!important;background:#0c0030!important;border:2px solid rgba(37,217,255,.28)!important;box-shadow:0 0 18px rgba(255,43,191,.18)!important}
img.ymf-logo{width:72px!important;height:72px!important;max-width:72px!important;object-fit:cover!important;border-radius:18px!important;padding:0!important;display:block}
.logo-box>img.ymf-logo,.hero .logo>img.ymf-logo,.logoBox>img.ymf-logo{width:100%!important;height:100%!important;max-width:none!important;border-radius:inherit!important}
.logo-box .logoText,.logoBox .logoText{display:none!important}
.hero-text h1,.hero h1,.app>header h1,header .brand~h1{background:linear-gradient(90deg,#ff4fd8,#ffffff 48%,#25d9ff)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;font-family:'Syne','DM Sans',system-ui,sans-serif!important}
.app>header:not(.hero){background:radial-gradient(circle at top right,rgba(37,217,255,.16),transparent 38%),linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e)!important;border-bottom:1px solid rgba(37,217,255,.13)}

const VERBS = [
  {
    emoji:'😍', name:'gustar', en:'to like / to please',
    intensity:'neutral', intColor:'rgba(37,217,255,.2)', intTxt:'#7ee8ff',
    meaning:'Subject pleases the indirect object. The subject is what is liked.',
    conj:[['me','gusta','gustan'],['te','gusta','gustan'],['le','gusta','gustan'],['nos','gusta','gustan'],['les','gusta','gustan']],
    examples:[
      {es:'Me gusta el café.',en:'I like coffee. (lit. Coffee pleases me.)'},
      {es:'Te gustan los tacos, ¿verdad?',en:'You like tacos, right?'},
      {es:'A Carlos le gusta cocinar.',en:'Carlos likes to cook.'},
      {es:'No me gustan las arañas.',en:'I don\'t like spiders.'},
    ],
    tip:'Singular subject → gusta. Plural subject → gustan. Verb infinitivo → gusta (always singular).'
  },
  {
    emoji:'🤩', name:'encantar', en:'to love / to be delighted by',
    intensity:'strong positive', intColor:'rgba(244,114,182,.2)', intTxt:'#ff91cd',
    meaning:'Stronger than gustar. "I love it" — the subject enchants you.',
    conj:[['me','encanta','encantan'],['te','encanta','encantan'],['le','encanta','encantan'],['nos','encanta','encantan'],['les','encanta','encantan']],
    examples:[
      {es:'Me encanta la música mexicana.',en:'I love Mexican music.'},
      {es:'A ella le encantan los perros.',en:'She loves dogs.'},
      {es:'Nos encanta viajar juntos.',en:'We love traveling together.'},
      {es:'¿Te encanta el chocolate?',en:'Do you love chocolate?'},
    ],
    tip:'Same structure as gustar. Much stronger in emotion — closer to "I\'m in love with" than just "I like".'
  },
  {
    emoji:'😤', name:'molestar', en:'to bother / to annoy',
    intensity:'negative', intColor:'rgba(239,68,68,.2)', intTxt:'#fca5a5',
    meaning:'The subject bothers or irritates the indirect object.',
    conj:[['me','molesta','molestan'],['te','molesta','molestan'],['le','molesta','molestan'],['nos','molesta','molestan'],['les','molesta','molestan']],
    examples:[
      {es:'Me molesta el ruido.',en:'Noise bothers me.'},
      {es:'Le molestan las mentiras.',en:'Lies bother him/her.'},
      {es:'¿Te molesta si abro la ventana?',en:'Does it bother you if I open the window?'},
      {es:'Nos molesta llegar tarde.',en:'Being late bothers us.'},
    ],
    tip:'Very useful in daily conversation. Can also be used as a polite request: "¿Te molesta si...?"'
  },
  {
    emoji:'😴', name:'aburrir', en:'to bore / to find boring',
    intensity:'negative', intColor:'rgba(239,68,68,.2)', intTxt:'#fca5a5',
    meaning:'The subject bores the indirect object.',
    conj:[['me','aburre','aburren'],['te','aburre','aburren'],['le','aburre','aburren'],['nos','aburre','aburren'],['les','aburre','aburren']],
    examples:[
      {es:'Me aburre la política.',en:'Politics bores me.'},
      {es:'A los niños les aburren los museos.',en:'Children find museums boring.'},
      {es:'No me aburre para nada.',en:'It doesn\'t bore me at all.'},
      {es:'¿Te aburre esta clase?',en:'Does this class bore you?'},
    ],
    tip:'Careful: "Estoy aburrido/a" = I AM bored (adjective). "Me aburre" = it bores me (verb).'
  },
  {
    emoji:'🤔', name:'interesar', en:'to interest / to find interesting',
    intensity:'neutral', intColor:'rgba(37,217,255,.2)', intTxt:'#7ee8ff',
    meaning:'The subject interests or appeals to the indirect object.',
    conj:[['me','interesa','interesan'],['te','interesa','interesan'],['le','interesa','interesan'],['nos','interesa','interesan'],['les','interesa','interesan']],
    examples:[
      {es:'Me interesa la historia.',en:'History interests me.'},
      {es:'Le interesan los idiomas.',en:'Languages interest him/her.'},
      {es:'No nos interesa ese plan.',en:'That plan doesn\'t interest us.'},
      {es:'¿Te interesa aprender chino?',en:'Are you interested in learning Chinese?'},
    ],
    tip:'Common in formal contexts too. "Me interesa" is softer than "me encanta".'
  },
  {
    emoji:'🤢', name:'disgustar', en:'to dislike / to displease',
    intensity:'negative', intColor:'rgba(239,68,68,.2)', intTxt:'#fca5a5',
    meaning:'The subject displeases or is disliked by the indirect object. Stronger than "no me gusta".',
    conj:[['me','disgusta','disgustan'],['te','disgusta','disgustan'],['le','disgusta','disgustan'],['nos','disgusta','disgustan'],['les','disgusta','disgustan']],
    examples:[
      {es:'Me disgusta la violencia.',en:'Violence disgusts/displeases me.'},
      {es:'Le disgustan las personas hipócritas.',en:'He/she dislikes hypocritical people.'},
      {es:'Nos disgusta el desorden.',en:'Disorder displeases us.'},
    ],
    tip:'Stronger than "no me gusta". Can also mean to upset someone: "Lo que dijiste me disgustó."'
  },
  {
    emoji:'😢', name:'doler', en:'to hurt / to be in pain',
    intensity:'physical/emotional', intColor:'rgba(245,158,11,.2)', intTxt:'#fcd34d',
    meaning:'The subject causes pain to the indirect object. Used for physical AND emotional pain.',
    conj:[['me','duele','duelen'],['te','duele','duelen'],['le','duele','duelen'],['nos','duele','duelen'],['les','duele','duelen']],
    examples:[
      {es:'Me duele la cabeza.',en:'My head hurts. (lit. The head hurts me.)'},
      {es:'Le duelen las rodillas.',en:'His/her knees hurt.'},
      {es:'Me duele que no me llames.',en:'It hurts me that you don\'t call me.'},
      {es:'¿Te duele mucho?',en:'Does it hurt a lot?'},
    ],
    tip:'Body part is the SUBJECT — it\'s singular or plural depending on the body part, not the person!'
  },
  {
    emoji:'😟', name:'preocupar', en:'to worry / to concern',
    intensity:'negative', intColor:'rgba(239,68,68,.2)', intTxt:'#fca5a5',
    meaning:'The subject worries or concerns the indirect object.',
    conj:[['me','preocupa','preocupan'],['te','preocupa','preocupan'],['le','preocupa','preocupan'],['nos','preocupa','preocupan'],['les','preocupa','preocupan']],
    examples:[
      {es:'Me preocupa tu salud.',en:'Your health worries me.'},
      {es:'Le preocupan las noticias.',en:'The news worries him/her.'},
      {es:'No nos preocupa el precio.',en:'The price doesn\'t worry us.'},
      {es:'¿Te preocupa el examen?',en:'Are you worried about the exam?'},
    ],
    tip:'Also: "estoy preocupado/a" = I am worried (current state). "Me preocupa" = something worries me (ongoing).'
  },
  {
    emoji:'😡', name:'fastidiar', en:'to annoy / to be fed up with',
    intensity:'strong negative', intColor:'rgba(239,68,68,.25)', intTxt:'#fca5a5',
    meaning:'Stronger than molestar. Expresses strong irritation or annoyance.',
    conj:[['me','fastidia','fastidian'],['te','fastidia','fastidian'],['le','fastidia','fastidian'],['nos','fastidia','fastidian'],['les','fastidia','fastidian']],
    examples:[
      {es:'Me fastidia esperar.',en:'Waiting really annoys me.'},
      {es:'Le fastidian las excusas.',en:'Excuses really bother him/her.'},
      {es:'Nos fastidia que lleguen tarde.',en:'It annoys us that they arrive late.'},
    ],
    tip:'More intense than molestar. Very common in Spain and Mexico for strong annoyance.'
  },
  {
    emoji:'😍', name:'fascinar', en:'to fascinate / to be fascinated by',
    intensity:'strong positive', intColor:'rgba(244,114,182,.2)', intTxt:'#ff91cd',
    meaning:'The subject fascinates the indirect object. Similar strength to encantar.',
    conj:[['me','fascina','fascinan'],['te','fascina','fascinan'],['le','fascina','fascinan'],['nos','fascina','fascinan'],['les','fascina','fascinan']],
    examples:[
      {es:'Me fascina la cultura mexicana.',en:'Mexican culture fascinates me.'},
      {es:'Le fascinan las películas de terror.',en:'Horror movies fascinate him/her.'},
      {es:'Nos fascina viajar.',en:'Traveling fascinates us.'},
    ],
    tip:'Similar to encantar but with more sense of awe. Often used for things that amaze or captivate.'
  },
  {
    emoji:'😰', name:'dar miedo', en:'to be scared of / to frighten',
    intensity:'negative', intColor:'rgba(239,68,68,.2)', intTxt:'#fca5a5',
    meaning:'The subject frightens or scares the indirect object.',
    conj:[['me','da miedo','dan miedo'],['te','da miedo','dan miedo'],['le','da miedo','dan miedo'],['nos','da miedo','dan miedo'],['les','da miedo','dan miedo']],
    examples:[
      {es:'Me da miedo la oscuridad.',en:'Darkness scares me.'},
      {es:'Le dan miedo las arañas.',en:'Spiders scare him/her.'},
      {es:'Nos da miedo volar.',en:'Flying scares us.'},
      {es:'¿Te da miedo el dentista?',en:'Are you scared of the dentist?'},
    ],
    tip:'"Dar miedo" is a verb phrase. "Miedo" doesn\'t change — only "da/dan" changes based on the subject.'
  },
  {
    emoji:'🤮', name:'caer mal / bien', en:'to dislike / like (a person)',
    intensity:'social', intColor:'rgba(167,139,250,.2)', intTxt:'#c4b5fd',
    meaning:'Used specifically for how you feel about PEOPLE. "Me cae bien" = I like them. "Me cae mal" = I don\'t like them.',
    conj:[['me','cae bien/mal','caen bien/mal'],['te','cae bien/mal','caen bien/mal'],['le','cae bien/mal','caen bien/mal'],['nos','cae bien/mal','caen bien/mal'],['les','cae bien/mal','caen bien/mal']],
    examples:[
      {es:'Me cae muy bien tu amigo.',en:'I really like your friend (as a person).'},
      {es:'Le cae mal ese profesor.',en:'He/she doesn\'t like that teacher (as a person).'},
      {es:'¿Te cae bien la nueva jefa?',en:'Do you like the new boss?'},

function renderVerbCards(){
  const cards = VERBS.map((v,i)=>{
    const conjRows = v.conj.map(([io,sg,pl])=>`<tr><td class="conj-io">${io}</td><td class="conj-verb">${sg}</td><td class="conj-sub" style="color:var(--muted2);font-size:.72rem">/ ${pl}</td></tr>`).join('');
    const exRows = v.examples.slice(0,3).map(ex=>`<div class="verb-ex"><span class="es">${ex.es}</span><span class="en">${ex.en}</span></div>`).join('');
    return `<div class="verb-card" style="border-color:${v.intColor}">
      <div class="verb-card-top">
        <div class="verb-emoji">${v.emoji}</div>
        <div class="verb-info">
          <div class="verb-name">${v.name}</div>
          <div class="verb-en">${v.en}</div>
          <span class="verb-intensity" style="background:${v.intColor};color:${v.intTxt}">${v.intensity}</span>
        </div>
      </div>
      <div class="verb-struct">
        <span class="hl2">IO</span> + <span class="hl">${v.name==='dar miedo'?'da/dan miedo':v.name==='caer mal / bien'?'cae/caen bien/mal':v.name.slice(0,3)+'a / '+v.name.slice(0,3)+'an'}</span> + sujeto
        <table class="conj-table" style="margin-top:6px">
          <tr><th>IO</th><th>singular</th><th>plural</th></tr>
          ${conjRows}
        </table>
      </div>
      <div class="verb-examples">
        ${exRows}
        <div style="font-size:.72rem;color:var(--muted2);padding-top:4px;border-top:1px solid rgba(255,255,255,.06);margin-top:4px">&#128161; ${v.tip}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">&#128218; Verb cards — 13 verbos afectivos</div>
  <div class="ex-instr">These verbs work <em>backwards</em> — the thing you feel IS the subject, and YOU are the indirect object (IO). <em>IO + verb + subject</em>. Conjugate based on what is liked/hated/hurting, not the person.</div>
  <div class="verb-grid">${cards}</div></div>`;
}

function renderPicCards(){
  const ok=Object.values(picAnswers).filter(v=>v).length;
  const ans=Object.keys(picAnswers).length;
  const total=PIC_ITEMS.length;
  const pct=Math.round(ans/total*100);
  const cards=PIC_ITEMS.map((item,idx)=>{
    const done=picAnswers[idx]!==undefined;
    const isOk=picAnswers[idx]===true;
    const q=item.q.replace('___','<span class="pic-blank">___</span>');
    const btns=item.opts.map((o,oi)=>{
      let cls=`pic-btn ${item.colors[oi]}`;
      if(done){cls+=oi===item.ans?' revealed':' dim';}
      return `<button class="${cls}" data-l="${['A','B','C','D'][oi]}" onclick="answerPic(${idx},${oi})" ${done?'disabled':''}>${o}</button>`;
    }).join('');
    return `<div class="pic-card${done?(isOk?' ok':' err'):''}" id="pc${idx}">
      <div class="pic-q"><span style="font-size:.72rem;color:var(--muted2)">${item.clue}</span><br>${q}</div>
      <div class="pic-img"><img src="${item.img}" alt="Picture card illustration"></div>
      <div class="pic-btns">${btns}</div>
      <div class="pic-exp${done?' show':''}">${done?(isOk?'&#10003; ':'&#10007; ')+item.exp:''}</div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">&#128444;&#65039; Picture cards <span style="font-size:.7rem;color:var(--cyan)">V3 FIX · imágenes integradas</span></div>
  <div class="ex-instr">Look at the scene and the clue. Choose the correct form — pay attention to <em>singular vs plural subject</em> and <em>which verb fits best</em>.</div>
  <div class="score-bar">
    <div class="sc"><span class="l">Cards</span><span class="v">${total}</span></div>
    <div class="sc"><span class="l">OK</span><span class="v g" id="pOk">${ok}</span></div>
    <div class="sc"><span class="l">Miss</span><span class="v b" id="pErr">${ans-ok}</span></div>
    <div class="prog-w"><div class="prog-l">Answered: ${pct}%</div><div class="prog-t"><div class="prog-f" id="pPg" style="width:${pct}%"></div></div></div>
  </div>
  <div class="pic-grid">${cards}</div>
  <div class="actions"><button class="btn btn-ghost" onclick="picAnswers={};renderPicCards()">&#8635; Reset</button></div></div>`;
}
function answerPic(idx,oi){
  if(picAnswers[idx]!==undefined)return;
  const item=PIC_ITEMS[idx];
  const isOk=oi===item.ans;
  picAnswers[idx]=isOk;
  const card=document.getElementById('pc'+idx);
  if(card){
    card.classList.add(isOk?'ok':'err');
    card.querySelectorAll('.pic-btn').forEach((b,bi)=>{
      b.disabled=true;
      b.classList.remove('revealed','dim');
      b.classList.add(bi===item.ans?'revealed':'dim');
    });
    const exp=card.querySelector('.pic-exp');
    if(exp){exp.classList.add('show');exp.innerHTML=(isOk?'&#10003; ':'&#10007; ')+item.exp;}
  }
  const ok=Object.values(picAnswers).filter(v=>v).length;
  const ans=Object.keys(picAnswers).length;
  const pct=Math.round(ans/PIC_ITEMS.length*100);
  const el=document.getElementById('pOk');if(el)el.textContent=ok;
  const el2=document.getElementById('pErr');if(el2)el2.textContent=ans-ok;
  const pg=document.getElementById('pPg');if(pg)pg.style.width=pct+'%';
}

function renderMC(){
  const pct=Math.round(Object.keys(mcAnswers).length/MC.length*100);

function answerMC(qi,oi){
  if(mcChecked)return;
  if(mcAnswers[qi]!==undefined){const p=document.getElementById(`mco${qi}_${mcAnswers[qi]}`);if(p)p.classList.remove('mc-ok','mc-err');}
  mcAnswers[qi]=oi;
  const b=document.getElementById(`mco${qi}_${oi}`);if(b)b.classList.add(oi===MC[qi].a?'mc-ok':'mc-err');
  const e=document.getElementById('mce'+qi);if(e)e.classList.add('show');
  const pct=Math.round(Object.keys(mcAnswers).length/MC.length*100);
  const el=document.getElementById('mc_p');if(el)el.textContent=pct+'%';
  const pg=document.getElementById('mc_pg');if(pg)pg.style.width=pct+'%';
}
function checkMC(){
  mcChecked=true;let ok=0;MC.forEach((item,i)=>{if(mcAnswers[i]===item.a)ok++;});
  const pct=Math.round(ok/MC.length*100);
  document.getElementById('mc_ok').textContent=ok;
  document.getElementById('mc_err').textContent=MC.length-ok;
  document.getElementById('mc_pg').style.width='100%';
  document.getElementById('mc_p').textContent='100%';
  const fb=document.getElementById('mc_fb');
  fb.className='fb show '+(pct>=90?'ok':pct>=70?'ok':'partial');
  fb.innerHTML=`${pct>=90?'&#127942;':'&#128218;'} <strong>${ok}/${MC.length}.</strong> ${pct>=90?'Excellent!':pct>=70?'Good job!':'Review the verb cards.'}`;
  document.getElementById('mc_chk').disabled=true;renderMC();
}

  ['A Carlos le gustan el fútbol.',true,'le gusta el fútbol','ERROR — "fútbol" is singular → <strong>le gusta</strong>. Even with "A Carlos", the verb follows the subject.'],
  ['Me cae bien tu amigo.',false,null,'CORRECT ✓ — "caer bien" for people. "amigo" singular → "cae bien". ✓'],
  ['Te interesa los idiomas extranjeros.',true,'Te interesan los idiomas','ERROR — "idiomas" is plural → <strong>te interesan</strong>.'],

  ['Le aburro las clases de historia.',true,'Le aburren las clases','ERROR — Two errors: verb should be <strong>aburren</strong> (plural "clases"), and IO should be "le", not "aburro" (yo form).'],
  ['Me gustan mucho cocinar.',true,'Me gusta mucho cocinar','ERROR — Infinitive is always singular → <strong>me gusta</strong>. Never "me gustan" with an infinitive.'],
  ['Nos preocupa las noticias del país.',true,'Nos preocupan las noticias','ERROR — "noticias" is plural → <strong>nos preocupan</strong>.'],
  ['A mí me cae bien esa actriz.',false,null,'CORRECT ✓ — "A mí me" for emphasis + "caer bien" for a person. "actriz" singular → "cae bien". ✓'],

function renderErrorHunt(){
  ehAnswered={};
  let html=`<div class="panel"><div class="ex-title">&#128269; Error hunter</div>
  <div class="ex-instr">Each sentence is <em>independent</em>. Is the verb form correct? Watch out for <em>singular vs. plural</em> subjects and the <em>right IO pronoun</em>.</div>
  <div class="score-bar"><div class="sc"><span class="l">Total</span><span class="v">${ERRORS.length}</span></div><div class="sc"><span class="l">OK</span><span class="v g" id="eh_ok">0</span></div><div class="sc"><span class="l">Miss</span><span class="v b" id="eh_err">0</span></div><div class="prog-w"><div class="prog-l">Progress: <span id="eh_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="eh_pg" style="width:0%"></div></div></div></div>
  <div class="eh-list">`;
  ERRORS.forEach(([s,hasErr,,exp],i)=>{
    html+=`<div class="eh-item" id="ehi${i}"><div class="eh-n">${i+1}</div>
    <div class="eh-body"><div class="eh-sent" id="ehs${i}">${s}</div>
    <div class="eh-btns"><button class="eh-btn eh-yes" onclick="judgeEh(${i},false)">&#9989; Correct</button><button class="eh-btn eh-no" onclick="judgeEh(${i},true)">&#10060; Has an error</button></div>
    <div class="eh-exp" id="ehe${i}">${exp}</div></div></div>`;
  });
  html+=`</div><div class="fb" id="eh_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="ehAnswered={};renderErrorHunt()">&#8635; Reset</button></div></div>`;
  document.getElementById('exContainer').innerHTML=html;
}
function judgeEh(idx,saysErr){
  if(ehAnswered[idx]!==undefined)return;
  const [s,hasErr,fix,exp]=ERRORS[idx];
  const correct=saysErr===hasErr;
  ehAnswered[idx]=correct;
  const item=document.getElementById('ehi'+idx);
  item.classList.add('revealed',correct?'eh-ok':'eh-bad');
  item.querySelectorAll('.eh-btn').forEach(b=>b.disabled=true);
  const chosen=item.querySelector(saysErr?'.eh-no':'.eh-yes');
  if(chosen)chosen.classList.add(correct?'cho-ok':'cho-err');
  if(hasErr&&fix){const se=document.getElementById('ehs'+idx);se.innerHTML=s+` <span class="eh-fix">&#8594; <strong>${fix}</strong></span>`;}
  document.getElementById('ehe'+idx).classList.add('show');
  const total=Object.keys(ehAnswered).length;
  const ok=Object.values(ehAnswered).filter(v=>v).length;
  document.getElementById('eh_ok').textContent=ok;
  document.getElementById('eh_err').textContent=total-ok;
  document.getElementById('eh_pct').textContent=Math.round(total/ERRORS.length*100)+'%';
  document.getElementById('eh_pg').style.width=Math.round(total/ERRORS.length*100)+'%';
  if(total===ERRORS.length){
    const pct=Math.round(ok/ERRORS.length*100);
    const fb=document.getElementById('eh_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'&#127942;':'&#128218;'} <strong>${ok}/${ERRORS.length}.</strong> ${pct>=80?'Excellent!':'Review the corrections above.'}`;
  }
}

    spTimeLeft--;
    const f=document.getElementById('tF'),n=document.getElementById('tN');
    if(f)f.style.width=Math.max(0,(spTimeLeft/10)*100)+'%';
    if(n){n.textContent=spTimeLeft;n.style.color=spTimeLeft<=2?'var(--bad)':spTimeLeft<=5?'var(--warn)':'var(--muted2)';}
    if(spTimeLeft<=0){clearInterval(spTimer);spTimer=null;if(!spAnswered)submitQ();}
  },1000);
}
function submitQ(){
  const inp=document.getElementById('sInp');if(!inp||spAnswered)return;
  spAnswered=true;if(spTimer){clearInterval(spTimer);spTimer=null;}inp.disabled=true;
  const item=SPEED[spIdx];const nt=normS(inp.value);const na=normS(item.a);
  const isOk=nt===na||item.also.map(normS).includes(nt)||nt.length>2&&na.includes(nt);
  if(isOk){spOk++;spStreak++;}else{spErr++;spStreak=0;}
  const fb=document.getElementById('sFb');
  if(fb){fb.style.opacity='1';
    if(!inp.value.trim()){fb.className='sp-fb err';fb.innerHTML=`&#9201; Time's up! &#8594; <strong>${item.hint}</strong>`;}
    else if(isOk){fb.className='sp-fb ok';fb.innerHTML=`&#10003; <strong>Correct!</strong>${spStreak>=3?' &#128293; x'+spStreak:''}`;}
    else{fb.className='sp-fb err';fb.innerHTML=`&#10007; <strong>${inp.value}</strong> &#8594; <strong>${item.hint}</strong>`;}}
  if(spStreak>=3){const cf=document.getElementById('cf');cf.textContent='&#128293; x'+spStreak;cf.classList.remove('pop');void cf.offsetWidth;cf.classList.add('pop');}
  spIdx++;setTimeout(nextQ,isOk?700:1400);
}
function endSpeed(){
  const pct=Math.round(spOk/SPEED.length*100);
  const emo=pct>=90?'&#127942;':pct>=70?'&#127881;':pct>=50?'&#128170;':'&#128218;';
  document.getElementById('spWrap').innerHTML=`<div class="sp-start"><div style="font-size:3rem">${emo}</div><h2>${spOk}/${SPEED.length}</h2><p style="color:var(--muted)">${pct>=90?'Excellent!':pct>=70?'Great job!':pct>=50?'Keep going!':'Check the verb cards.'}</p><button class="btn btn-cyan" onclick="startSpeed()">&#8635; Try again</button></div>`;
}
