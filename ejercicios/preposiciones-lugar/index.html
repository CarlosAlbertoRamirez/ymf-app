<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preposiciones de Lugar | Scene Quiz en Español</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;--bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--prep:#f472b6;--prep2:#ff91cd;--voc:#25d9ff;--voc2:#7ee8ff;--font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;--shadow:0 20px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 10% 10%,rgba(255,43,191,.13),transparent 28%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow)}
.hero-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--prep),#fff 40%,var(--voc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:5px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:8px 11px;font-weight:800;font-family:var(--font);font-size:.76rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.15rem;line-height:1}
.etab-label{font-size:.62rem;text-align:center;line-height:1.2}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:100px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--prep),var(--voc));transition:width .35s}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;font-weight:500;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* === PICTURE CARDS === */
.pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pic-card{border-radius:22px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));transition:transform .15s,box-shadow .15s;border-color:rgba(255,255,255,.12)}
.pic-card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(0,0,0,.42)}
.pic-card.ok{border-color:var(--good);box-shadow:0 0 0 2px rgba(34,197,94,.3)}
.pic-card.err{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
.pic-q{padding:13px 15px 9px;font-size:1rem;font-weight:800;text-align:center;line-height:1.45;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(10,6,36,.22))}
.pic-blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--cyan);color:var(--cyan);font-weight:900;padding:0 4px;text-align:center}
.pic-multi{display:inline-block;background:rgba(245,158,11,.25);color:#fcd34d;border-radius:999px;padding:1px 8px;font-size:.62rem;font-weight:800;margin-left:5px;vertical-align:middle}
.pic-img{position:relative;background:linear-gradient(180deg,#edf7ff 0%,#dbeaff 58%,#eaf5ff 58%,#dff3dc 100%);display:flex;align-items:center;justify-content:center;padding:18px;min-height:180px;overflow:hidden}
.pic-img svg,.pic-img img{max-width:205px;max-height:150px;display:block;position:relative;z-index:1;filter:drop-shadow(0 10px 16px rgba(28,18,76,.18)) saturate(1.06)}
.pic-img img{border-radius:12px;object-fit:cover;width:205px;height:150px}
.pic-img::before{content:"";position:absolute;inset:10px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.45)}
.cartoon-svg *{stroke:rgba(39,25,76,.25);stroke-width:1.8;paint-order:stroke fill;stroke-linejoin:round;stroke-linecap:round}
.cartoon-svg text{stroke:none}
.pic-btns{display:grid;grid-template-columns:1fr 1fr}
.pic-btn{border:0;padding:11px 8px 11px 24px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.12s;color:white;text-align:left;position:relative;line-height:1.3}
.pic-btn:hover:not([disabled]){filter:brightness(1.15)}
.pic-btn[disabled]{cursor:default}
.pic-btn::before{content:attr(data-l);position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.68rem;opacity:.65;font-weight:900}
.pic-btn.c1{background:#c0392b}.pic-btn.c2{background:#2980b9}
.pic-btn.c3{background:#d35400}.pic-btn.c4{background:#27ae60}
.pic-btn.revealed{box-shadow:inset 0 0 0 3px white}
.pic-btn.revealed::after{content:"✓";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.9rem}
.pic-btn.dim{opacity:.3}
.pic-exp{font-size:.77rem;padding:10px 12px;background:rgba(0,0,0,.28);color:var(--muted);line-height:1.55;text-align:center;display:none}
.pic-exp.show{display:block}

/* === SCENE === */
.scene-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-svg-box{width:100%;max-width:700px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.scene-svg-box svg{display:block;width:100%}
.scene-badge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(37,217,255,.08);border:1px solid rgba(37,217,255,.2);border-radius:12px;padding:9px 16px;font-size:.95rem;font-weight:700;width:100%;max-width:700px;line-height:1.5;text-align:center}
.multi-badge{background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#fcd34d;border-radius:999px;padding:2px 10px;font-size:.68rem;font-weight:800}
.scene-opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:700px}
.s-opt{border:0;border-radius:10px;padding:9px 18px;font-weight:800;font-family:var(--display);font-size:.93rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.13);color:var(--text)}
.s-opt:hover:not([disabled]){background:rgba(37,217,255,.12);border-color:var(--cyan);transform:translateY(-1px)}
.s-opt[disabled]{cursor:default;transform:none}
.s-opt.s-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important}
.s-opt.s-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important}
.scene-exp{font-size:.83rem;color:var(--muted);text-align:center;max-width:560px;line-height:1.6;padding:8px 14px;background:rgba(255,255,255,.04);border-radius:10px;display:none}
.scene-exp.show{display:block}
.sc-row{display:flex;align-items:center;gap:12px;width:100%;max-width:700px}
.sc-cnt{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.sc-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.sc-fil{height:100%;background:linear-gradient(90deg,var(--prep),var(--voc));border-radius:999px;transition:width .4s}

/* === MC === */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.65;flex:1}
.mc-blank{display:inline-block;min-width:80px;border-bottom:2.5px solid rgba(37,217,255,.4);padding:0 4px;text-align:center;font-weight:800;color:var(--cyan)}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px}
.mc-opt{border:0;border-radius:10px;padding:7px 14px;font-weight:700;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px);background:rgba(37,217,255,.09);border-color:rgba(37,217,255,.35)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.79rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:7px 12px 7px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}

/* === ERROR HUNT === */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.eh-ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.eh-bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}
.eh-sent{font-size:.97rem;line-height:1.6}
.eh-fix{font-size:.82rem;font-weight:700;color:var(--good);margin-left:6px}
.eh-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-btn{border:0;border-radius:9px;padding:7px 15px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-yes:hover:not([disabled]){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-no:hover:not([disabled]){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-btn[disabled]{cursor:default;opacity:.5}
.cho-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.cho-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* === STORY BUILDER === */
.mission-list{display:flex;flex-direction:column;gap:14px}
.mission-card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.025));border:1.5px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;transition:.18s}
.mission-card.m-ok{border-color:rgba(34,197,94,.42);box-shadow:0 0 0 2px rgba(34,197,94,.12)}
.mission-card.m-err{border-color:rgba(239,68,68,.42);box-shadow:0 0 0 2px rgba(239,68,68,.1)}
.mission-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mission-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(37,217,255,.1);border:1px solid rgba(37,217,255,.25);font-size:.75rem;font-weight:900;color:var(--cyan);flex-shrink:0}
.mission-body{flex:1}
.mission-title{font-weight:900;font-family:var(--display);font-size:.95rem;margin-bottom:4px;color:#fff}
.mission-clue{font-size:.8rem;color:var(--muted);line-height:1.55}
.mission-clue strong{color:#dff8ff}
.mission-target{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);font-size:.88rem;line-height:1.55}
.mission-build{min-height:48px;padding:9px;border-radius:13px;border:1.5px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mission-empty{color:var(--muted2);font-size:.8rem;font-style:italic}
.mission-piece{border-radius:999px;padding:7px 11px;background:rgba(255,43,191,.12);border:1px solid rgba(255,43,191,.25);color:#ffd8f4;font-size:.82rem;font-weight:800}
.mission-bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.mission-chip{border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.065);color:var(--text);border-radius:999px;padding:8px 12px;font-size:.82rem;font-weight:800;cursor:pointer;transition:.14s}
.mission-chip:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(37,217,255,.45);background:rgba(37,217,255,.1)}
.mission-chip:disabled{opacity:.32;cursor:default}
.mission-chip.used{opacity:.32}
.mission-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mission-small{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:6px 11px;font-size:.75rem;font-weight:800;cursor:pointer}
.mission-exp{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.045);color:var(--muted);font-size:.82rem;line-height:1.55}
.mission-exp.show{display:block}
.mission-model{color:#bbf7d0;font-weight:900}
.eh-group{margin-top:12px;border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:12px;background:rgba(255,255,255,.025)}
.eh-group h4{font-family:var(--display);font-size:.9rem;color:#ffd8f4;margin-bottom:10px}
.eh-ctx{display:inline-block;margin-bottom:6px;padding:4px 9px;border-radius:999px;background:rgba(37,217,255,.08);border:1px solid rgba(37,217,255,.18);font-size:.68rem;font-weight:800;color:#d2f6ff}
.eh-tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.25);font-size:.62rem;font-weight:800;color:#fcd34d}
/* === SORT === */
.sort-pile{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;min-height:52px;margin-bottom:12px}
.sort-bucket{border-radius:14px;padding:12px;min-height:80px;display:flex;flex-direction:column;gap:6px;transition:.2s}
.sort-bucket.drag-over{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.bucket-title{font-family:var(--display);font-size:.78rem;font-weight:900;text-align:center}
.bucket-sub{font-size:.62rem;color:var(--muted2);text-align:center;line-height:1.35}
.sort-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:grab;user-select:none;transition:.15s;line-height:1.4}
.sort-card:hover{transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sort-card.ghost{opacity:.35}
.sort-card.c-ok{background:rgba(34,197,94,.14);border-color:var(--good);color:#86efac;cursor:default}
.sort-card.c-err{background:rgba(239,68,68,.1);border-color:var(--bad);color:#fca5a5;font-size:.78rem}

/* === SPEED === */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;text-align:center;width:100%;max-width:520px}
.sp-q{font-size:1.05rem;line-height:1.7;margin-bottom:4px}
.sp-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.sp-inp{flex:1;max-width:260px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--font);font-size:1rem;font-weight:700;color:var(--text);outline:none;transition:.15s}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-inp::placeholder{color:var(--muted2);font-weight:400}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:520px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:520px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--prep),var(--voc));transition:width 1s linear}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.sp-start p{color:var(--muted);font-size:.87rem;max-width:400px;line-height:1.6}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* === REFERENCE === */
.ref-section{margin-bottom:18px}
.ref-section h3{font-family:var(--display);font-size:.95rem;font-weight:800;margin-bottom:10px;padding:5px 12px;border-radius:8px;display:inline-block}
.ref-table{width:100%;border-collapse:collapse;font-size:.83rem}
.ref-table th{padding:7px 12px;font-size:.62rem;font-weight:800;text-transform:uppercase;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.ref-table td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5;vertical-align:top}
.ref-table tr:last-child td{border-bottom:none}
.ref-table tr:hover td{background:rgba(255,255,255,.02)}
.td-es{font-weight:700}.td-en{color:var(--muted2);font-style:italic;font-size:.79rem}.td-ex{color:var(--muted);font-size:.78rem;font-style:italic}
.ref-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.ref-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px}
.ref-block h4{font-family:var(--display);font-size:.85rem;font-weight:800;margin-bottom:8px}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.panel{padding:14px 12px}.ref-cols{grid-template-columns:1fr}.pic-grid{grid-template-columns:1fr}}
</style>

function renderPicCards(){
  const ok=Object.values(picAnswers).filter(v=>v).length;
  const ans=Object.keys(picAnswers).length;
  const total=PIC_ITEMS.length;
  const pct=Math.round(ans/total*100);
  const cards=PIC_ITEMS.map((item,idx)=>{
    const done=picAnswers[idx]!==undefined;
    const isOk=picAnswers[idx]===true;
    const cardCls=done?(isOk?"ok":"err"):"";
    const qHTML=item.q.replace("___","<span class=\"pic-blank\">___</span>");
    const btns=item.opts.map((o,oi)=>{
      let cls=`pic-btn ${item.colors[oi]}`;
      if(done){
        const valid=item.valid.some(v=>normS(o).includes(normS(v))||normS(v).includes(normS(o)));
        cls+=valid?" revealed":" dim";
      }
      return `<button class="${cls}" data-l="${item.letters[oi]}" onclick="answerPic(${idx},${oi})" ${done?"disabled":""}>${o}</button>`;
    }).join("");
    return `<div class="pic-card ${cardCls}" id="pc${idx}">
      <div class="pic-q">${qHTML}${item.multi?'<span class="pic-multi">2+ OK</span>':''}</div>
      <div class="pic-img">${item.svg}</div>
      <div class="pic-btns">${btns}</div>
      <div class="pic-exp${done?" show":""}">${done?(isOk?"✓ ":"✗ ")+item.exp:""}</div>
    </div>`;
  }).join("");
  document.getElementById("exContainer").innerHTML=`<div class="panel">
  <div class="ex-title">🖼️ Picture cards</div>
  <div class="ex-instr">Look at the prettier <em>cartoon-style illustration</em> and choose the correct preposition or locución. This set now includes <strong>20 picture cards</strong>. <em>Cards marked "2+ OK"</em> accept multiple natural answers — any valid option counts!</div>
  <div class="score-bar">
    <div class="sc"><span class="l">Total</span><span class="v">${total}</span></div>
    <div class="sc"><span class="l">Correct</span><span class="v g" id="pOk">${ok}</span></div>
    <div class="sc"><span class="l">Wrong</span><span class="v b" id="pErr">${ans-ok}</span></div>
    <div class="prog-w"><div class="prog-l">Answered: ${pct}%</div><div class="prog-t"><div class="prog-f" id="pProg" style="width:${pct}%"></div></div></div>
  </div>
  <div class="pic-grid">${cards}</div>
  <div class="actions"><button class="btn btn-ghost" onclick="picAnswers={};renderPicCards()">↺ Reset</button></div></div>`;
}
function answerPic(idx,oi){
  if(picAnswers[idx]!==undefined)return;
  const item=PIC_ITEMS[idx];
  const chosen=item.opts[oi];
  const isOk=item.valid.some(v=>normS(chosen).includes(normS(v))||normS(v).includes(normS(chosen)));
  picAnswers[idx]=isOk;
  const card=document.getElementById("pc"+idx);
  if(card){
    card.classList.add(isOk?"ok":"err");
    card.querySelectorAll(".pic-btn").forEach((b,bi)=>{
      b.disabled=true;
      const o=item.opts[bi];
      const valid=item.valid.some(v=>normS(o).includes(normS(v))||normS(v).includes(normS(o)));
      b.classList.remove("revealed","dim");
      b.classList.add(valid?"revealed":"dim");
    });
    const exp=card.querySelector(".pic-exp");
    if(exp){exp.classList.add("show");exp.innerHTML=(isOk?"✓ ":"✗ ")+item.exp;}
  }
  const ok=Object.values(picAnswers).filter(v=>v).length;
  const ans=Object.keys(picAnswers).length;
  const el=document.getElementById("pOk");if(el)el.textContent=ok;
  const el2=document.getElementById("pErr");if(el2)el2.textContent=ans-ok;
  const pg=document.getElementById("pProg");if(pg)pg.style.width=Math.round(ans/PIC_ITEMS.length*100)+"%";
}

function buildSceneSVG(lbl){
  const h=BOUNDS[lbl];if(!h)return SCENE_SVG;
  const p=10;
  const ring=`<rect x="${h.x-p}" y="${h.y-p}" width="${h.w+p*2}" height="${h.h+p*2}" rx="12" fill="rgba(37,217,255,.1)" stroke="#25d9ff" stroke-width="3" stroke-dasharray="10,5"><animate attributeName="stroke-dashoffset" values="0;30" dur="1.2s" repeatCount="indefinite"/></rect>`;
  return SCENE_SVG.replace('</svg>',ring+'</svg>');
}

function renderScene(){sceneIdx=0;sceneAnswered=false;sceneAnswers={};renderSceneCard();}
function renderSceneCard(){
  if(sceneIdx>=SCENE_Q.length){endScene();return;}
  const item=SCENE_Q[sceneIdx];
  const pct=Math.round(sceneIdx/SCENE_Q.length*100);
  const ok=Object.values(sceneAnswers).filter(v=>v).length;
  const multi=item.valid.length>1;
  const opts=item.opts.map((o,oi)=>`<button class="s-opt" id="so${oi}" onclick="answerScene(${oi})">${o}</button>`).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">🗺️ Scene quiz</div>
  <div class="ex-instr">Find the <em>glowing label</em> on the map, then choose the correct preposition. Some questions have <em>2 valid answers</em> — both are highlighted green!</div>
  <div class="scene-wrap">
    <div class="sc-row">
      <span class="sc-cnt">${sceneIdx+1} / ${SCENE_Q.length}</span>
      <div class="sc-trk"><div class="sc-fil" style="width:${pct}%"></div></div>
      <span class="sc-cnt" style="color:var(--good)">✓ ${ok}</span>
    </div>
    <div class="scene-svg-box">${buildSceneSVG(item.l)}</div>
    <p style="font-size:.75rem;color:var(--muted2);font-style:italic">👆 Label <strong style="color:var(--cyan)">${item.l}</strong> is glowing</p>
    <div class="scene-badge">${item.q}${multi?'<span class="multi-badge">2 answers OK</span>':''}</div>
    <div class="scene-opts" id="scOpts">${opts}</div>
    <div class="scene-exp" id="scExp"></div>
    <div class="actions" style="justify-content:center" id="scAct"></div>
  </div></div>`;
}
function answerScene(oi){
  if(sceneAnswered)return;
  sceneAnswered=true;
  const item=SCENE_Q[sceneIdx];
  const isOk=item.valid.includes(item.opts[oi]);
  sceneAnswers[sceneIdx]=isOk;
  item.opts.forEach((_,i)=>{
    const b=document.getElementById('so'+i);if(!b)return;
    b.disabled=true;
    if(item.valid.includes(item.opts[i]))b.classList.add('s-ok');
    else if(i===oi&&!isOk)b.classList.add('s-err');
  });
  const exp=document.getElementById('scExp');
  if(exp){exp.classList.add('show');exp.innerHTML=(isOk?'<span style="color:var(--good)">✓ Correct!</span> ':'<span style="color:var(--bad)">✗ </span>')+item.exp;}
  const act=document.getElementById('scAct');
  if(act)act.innerHTML=`<button class="btn btn-cyan" onclick="nextScene()">${sceneIdx<SCENE_Q.length-1?'Next →':'Results 🏆'}</button>`;
}
function nextScene(){sceneIdx++;sceneAnswered=false;renderSceneCard();}
function endScene(){
  const ok=Object.values(sceneAnswers).filter(v=>v).length;
  const pct=Math.round(ok/SCENE_Q.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':'💪';
  document.getElementById('exContainer').innerHTML=`<div class="panel"><div class="scene-wrap" style="gap:18px;padding:20px 0">
    <div style="font-size:3.5rem">${emo}</div>
    <div style="font-family:var(--display);font-size:1.6rem;font-weight:900">${ok} / ${SCENE_Q.length}</div>
    <div style="width:100%;max-width:400px;background:rgba(255,255,255,.05);border-radius:12px;overflow:hidden"><div style="height:10px;background:linear-gradient(90deg,var(--prep),var(--voc));width:${pct}%"></div></div>
    <p style="color:var(--muted);text-align:center;max-width:360px">${pct>=90?'Excellent!':pct>=70?'Great job!':'Check the Reference card.'}</p>
    <button class="btn btn-cyan" onclick="renderScene()">↺ Try again</button>
  </div></div>`;
}

function answerMC(qi,oi){

function missionText(i){return (missionBuilds[i]||[]).map(idx=>MISSIONS[i].bank[idx]).join(' ');}
function missionOk(i){
  const built=normS(missionText(i).replace(/[.]/g,''));
  const model=normS(MISSIONS[i].ans.join(' '));
  const alt=(MISSIONS[i].alt||[]).map(x=>normS(x));
  return built===model || alt.includes(built);
}
function renderMission(){
  const answered=Object.keys(missionBuilds).filter(k=>(missionBuilds[k]||[]).length>0).length;
  const ok=missionChecked?MISSIONS.reduce((a,_,i)=>a+(missionOk(i)?1:0),0):0;
  const pct=Math.round(answered/MISSIONS.length*100);
  const cards=MISSIONS.map((m,i)=>{
    const built=missionBuilds[i]||[];
    const used=new Set(built);
    const checked=missionChecked;
    const good=checked&&missionOk(i);
    const bad=checked&&!missionOk(i);
    const pieces=built.length?built.map(idx=>`<span class="mission-piece">${m.bank[idx]}</span>`).join(''):`<span class="mission-empty">Click the Spanish words below to order the translation…</span>`;
    const chips=m.bank.map((w,wi)=>`<button class="mission-chip ${used.has(wi)?'used':''}" onclick="addMissionChip(${i},${wi})" ${checked||used.has(wi)?'disabled':''}>${w}</button>`).join('');
    const model=m.ans.join(' ');
    const alt=(m.alt&&m.alt.length)?`<br>Also accepted: <strong>${m.alt.join('</strong> / <strong>')}</strong>`:'';
    return `<div class="mission-card ${good?'m-ok':bad?'m-err':''}">
      <div class="mission-top"><div class="mission-num">${i+1}</div>
      <div class="mission-body">
        <div class="mission-title">${m.title}</div>
        <div class="mission-clue">Translate this sentence into Spanish and put the words in order:</div>
        <div class="mission-target"><strong>${m.prompt}</strong></div>
        <div class="mission-build">${pieces}</div>
        <div class="mission-bank">${chips}</div>
        <div class="mission-actions">
          <button class="mission-small" onclick="undoMission(${i})" ${checked?'disabled':''}>↶ Undo</button>
          <button class="mission-small" onclick="clearMission(${i})" ${checked?'disabled':''}>Clear</button>
        </div>
        <div class="mission-exp ${checked?'show':''}">${good?'✅ Correct!':'💡 Model answer:'} <span class="mission-model">${model}.</span>${alt}</div>
      </div></div>
    </div>`;
  }).join('');
  document.getElementById("exContainer").innerHTML=`<div class="panel">
    <div class="ex-title">🧩 Translate & Order</div>
    <div class="ex-instr">Read the English sentence, then click the Spanish word chips in the correct order to build the translation. This practices <em>translation + sentence order + prepositions of place</em>.</div>
    <div class="score-bar">
      <div class="sc"><span class="l">Total</span><span class="v">${MISSIONS.length}</span></div>
      <div class="sc"><span class="l">Built</span><span class="v">${answered}</span></div>
      <div class="sc"><span class="l">Correct</span><span class="v g">${missionChecked?ok:'—'}</span></div>
      <div class="prog-w"><div class="prog-l">Progress: <span>${pct}%</span></div><div class="prog-t"><div class="prog-f" style="width:${pct}%"></div></div></div>
    </div>
    <div class="mission-list">${cards}</div>
    <div class="fb" id="mission_fb"></div>
    <div class="actions">
      <button class="btn btn-cyan" onclick="checkMission()" ${missionChecked?'disabled':''}>Check all</button>
      <button class="btn btn-ghost" onclick="missionBuilds={};missionChecked=false;renderMission()">↺ Reset</button>
    </div>
  </div>`;
}
function addMissionChip(i,wi){if(missionChecked)return;if(!missionBuilds[i])missionBuilds[i]=[];if(!missionBuilds[i].includes(wi))missionBuilds[i].push(wi);renderMission();}
function undoMission(i){if(missionChecked)return;if(missionBuilds[i])missionBuilds[i].pop();renderMission();}
function clearMission(i){if(missionChecked)return;missionBuilds[i]=[];renderMission();}
function checkMission(){
  missionChecked=true;renderMission();

  const pct=Math.round(ok/MISSIONS.length*100);

    fb.className='fb show '+(pct>=80?'ok':pct>=50?'partial':'err');
    fb.innerHTML=`${pct>=80?'🏆':'🧩'} <strong>${ok}/${MISSIONS.length}.</strong> ${pct>=80?'Great job translating and ordering full Spanish sentences!':pct>=50?'Good work — review the model answers.':'Try again using the model answers as examples.'}`;

}

function renderSort(){

  const shuffled=[...CARDS].sort(()=>Math.random()-.5);
  const pile=shuffled.map(c=>`<div class="sort-card" id="sc_${c.id}" draggable="true" ondragstart="ds(event,'${c.id}')" ondragend="de(event)" onclick="tapCard('${c.id}')">${c.t}</div>`).join('');
  const bucks=BUCKETS.map(b=>`<div class="sort-bucket" id="bk_${b.id}" style="background:${b.bg};border:2px dashed ${b.bd}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event,'${b.id}')" onclick="tapBucket('${b.id}')"><div class="bucket-title" style="color:${b.col}">${b.icon} ${b.label}</div><div class="bucket-sub">${b.sub}</div></div>`).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel"><div class="ex-title">🗂️ Drag &amp; sort</div><div class="ex-instr">Drag each card into the correct category. On mobile: tap a card, then tap a bucket.</div>

function ds(e,id){dragItem=id;setTimeout(()=>{const c=document.getElementById('sc_'+id);if(c)c.classList.add('ghost');},0);}
function de(){if(dragItem){const c=document.getElementById('sc_'+dragItem);if(c)c.classList.remove('ghost');}dragItem=null;}
function drop(e,bId){e.preventDefault();const id=e.dataTransfer?e.dataTransfer.getData('text'):dragItem;document.getElementById('bk_'+bId).classList.remove('drag-over');if(!id||sortPlaced[id])return;placeCard(id,bId);}
function tapCard(id){if(sortPlaced[id])return;const c=document.getElementById('sc_'+id);if(!c)return;if(tapSel===id){c.style.boxShadow='';tapSel=null;return;}if(tapSel){const p=document.getElementById('sc_'+tapSel);if(p)p.style.boxShadow='';}tapSel=id;c.style.boxShadow='0 0 0 3px var(--cyan)';}
function tapBucket(bId){if(!tapSel)return;placeCard(tapSel,bId);tapSel=null;}
function placeCard(id,bId){
  sortPlaced[id]=bId;const card=document.getElementById('sc_'+id);const bk=document.getElementById('bk_'+bId);
  if(!card||!bk)return;card.style.boxShadow='';card.classList.remove('ghost');card.draggable=false;
  const b=BUCKETS.find(x=>x.id===bId);if(b)card.style.borderColor=b.col;
  card.onclick=()=>returnCard(id);bk.appendChild(card);
  if(Object.keys(sortPlaced).length===CARDS.length){const btn=document.getElementById('srtChk');if(btn)btn.disabled=false;}
}
function returnCard(id){if(sortChecked)return;delete sortPlaced[id];const c=document.getElementById('sc_'+id);const pile=document.getElementById('sPile');if(!c||!pile)return;c.style.borderColor='';c.style.boxShadow='';c.draggable=true;c.onclick=()=>tapCard(id);pile.appendChild(c);const btn=document.getElementById('srtChk');if(btn)btn.disabled=true;}
function checkSort(){
  sortChecked=true;let ok=0;
  CARDS.forEach(item=>{const c=document.getElementById('sc_'+item.id);if(!c)return;const isOk=sortPlaced[item.id]===item.b;if(isOk)ok++;c.className='sort-card '+(isOk?'c-ok':'c-err');c.draggable=false;c.onclick=null;if(!isOk){const b=BUCKETS.find(x=>x.id===item.b);c.innerHTML=`${item.t}<span style="font-size:.7rem;display:block;margin-top:2px">→ ${b?b.icon+' '+b.label:item.b}</span>`;}c.title=item.x;});
  const pct=Math.round(ok/CARDS.length*100);
  const fb=document.getElementById('srtFb');fb.className='fb show '+(pct>=80?'ok':'partial');
  fb.innerHTML=`<strong>${ok}/${CARDS.length} (${pct}%).</strong> Red cards show the correct bucket.`;
  document.getElementById('srtChk').disabled=true;
}

function renderSpeed(){
  if(spTimer){clearInterval(spTimer);spTimer=null;}
  spIdx=0;spOk=0;spErr=0;spStreak=0;spAnswered=false;
  for(let i=SPEED.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[SPEED[i],SPEED[j]]=[SPEED[j],SPEED[i]];}
  document.getElementById('exContainer').innerHTML=`<div class="panel"><div class="ex-title">⚡ Speed round</div><div class="ex-instr">Type the Spanish word or phrase. 10 seconds per question. Press Enter to confirm.</div>
  <div class="sp-wrap" id="spWrap"><div class="sp-start"><div style="font-size:2.8rem">⚡</div><h2>Type in Spanish</h2><p>Prepositions, locuciones, and street vocabulary. 30 items!</p><button class="btn btn-cyan" onclick="startSpeed()">Let\'s go!</button></div></div></div>`;
}
function startSpeed(){spIdx=0;spOk=0;spErr=0;spStreak=0;nextQ();}
function nextQ(){
  if(spIdx>=SPEED.length){endSpeed();return;}
  spAnswered=false;const item=SPEED[spIdx];spTimeLeft=10;
  document.getElementById('spWrap').innerHTML=`
    <div class="sp-stats"><div class="spst"><div class="sl">Q</div><div class="sv w">${spIdx+1}/${SPEED.length}</div></div><div class="spst"><div class="sl">OK</div><div class="sv g">${spOk}</div></div><div class="spst"><div class="sl">Miss</div><div class="sv b">${spErr}</div></div></div>
    <div class="streak${spStreak>=3?' on':''}" id="stk">🔥 x${spStreak}</div>
    <div class="sp-card"><div class="sp-q">${item.q}</div><div class="sp-hint">💡 ${item.hint}</div></div>
    <div class="tmr-row"><div class="tmr-trk"><div class="tmr-fil" id="tF" style="width:100%;transition:width 1s linear"></div></div><div class="tmr-n" id="tN">10</div></div>
    <div class="sp-row"><input id="sInp" class="sp-inp" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type in Spanish…" onkeydown="if(event.key==='Enter')submitQ()"><button class="btn btn-cyan" onclick="submitQ()" style="flex-shrink:0">→</button></div>
    <div class="sp-fb" id="sFb" style="opacity:0"></div>`;
  setTimeout(()=>{const i=document.getElementById('sInp');if(i)i.focus();},50);
  if(spTimer)clearInterval(spTimer);
  spTimer=setInterval(()=>{
    spTimeLeft--;
    const f=document.getElementById('tF'),n=document.getElementById('tN');
    if(f)f.style.width=Math.max(0,(spTimeLeft/10)*100)+'%';
    if(n){n.textContent=spTimeLeft;n.style.color=spTimeLeft<=2?'var(--bad)':spTimeLeft<=5?'var(--warn)':'var(--muted2)';}
    if(spTimeLeft<=0){clearInterval(spTimer);spTimer=null;if(!spAnswered)submitQ();}
  },1000);
}
function submitQ(){
  const inp=document.getElementById('sInp');if(!inp||spAnswered)return;
  spAnswered=true;if(spTimer){clearInterval(spTimer);spTimer=null;}inp.disabled=true;
  const item=SPEED[spIdx];const nt=normS(inp.value);const na=normS(item.a);
  const isOk=nt===na||item.also.map(normS).includes(nt);
  if(isOk){spOk++;spStreak++;}else{spErr++;spStreak=0;}
  const fb=document.getElementById('sFb');
  if(fb){fb.style.opacity='1';
    if(!inp.value.trim()){fb.className='sp-fb err';fb.innerHTML=`⏱ Time's up! → <strong>${item.a}</strong>`;}
    else if(isOk){fb.className='sp-fb ok';fb.innerHTML=`✓ <strong>Correct!</strong>${spStreak>=3?' 🔥 x'+spStreak:''}`;}
    else{fb.className='sp-fb err';fb.innerHTML=`✗ <strong>${inp.value}</strong> → <strong>${item.a}</strong>`;}}
  if(spStreak>=3){const cf=document.getElementById('cf');cf.textContent='🔥 x'+spStreak;cf.classList.remove('pop');void cf.offsetWidth;cf.classList.add('pop');}
  spIdx++;setTimeout(nextQ,isOk?700:1400);
}
function endSpeed(){
  const pct=Math.round(spOk/SPEED.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  document.getElementById('spWrap').innerHTML=`<div class="sp-start"><div style="font-size:3rem">${emo}</div><h2>${spOk}/${SPEED.length}</h2><p style="color:var(--muted)">${pct>=90?'Excellent!':pct>=70?'Great job!':pct>=50?'Keep going!':'Check the reference card.'}</p><button class="btn btn-cyan" onclick="startSpeed()">↺ Try again</button></div>`;
}
