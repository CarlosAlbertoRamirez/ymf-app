<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjetivos | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --ap:#f472b6;--ap2:#ff91cd;
  --per:#25d9ff;--per2:#7ee8ff;
  --font:'DM Sans',system-ui,sans-serif;
  --display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 10% 10%,rgba(255,43,191,.13),transparent 28%),radial-gradient(ellipse at 90% 15%,rgba(37,217,255,.09),transparent 28%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(980px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);box-shadow:0 0 18px rgba(255,43,191,.22);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta);text-shadow:1px 1px 0 var(--cyan)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.4rem,2.6vw,2.4rem);font-weight:900;line-height:.95;background:linear-gradient(90deg,var(--ap) 0%,#fff 40%,var(--per) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.86rem;line-height:1.5;margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:6px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:8px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:9px 12px;font-weight:800;font-family:var(--font);font-size:.78rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translateY(-1px)}
.etab-icon{font-size:1.2rem;line-height:1}
.etab-label{font-size:.65rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:24px 28px;box-shadow:var(--shadow)}
.ex-header{margin-bottom:16px}
.ex-title{font-family:var(--display);font-size:1.2rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.86rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:100px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ap),var(--per));transition:width .35s}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.btn-magenta{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;font-weight:500;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ══ FLASHCARDS ══ */
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.flash-progress-row{display:flex;align-items:center;gap:12px;width:100%;max-width:520px}
.flash-counter{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.flash-track{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.flash-fill{height:100%;background:linear-gradient(90deg,var(--ap),var(--per));border-radius:999px;transition:width .4s}
.flash-card-wrap{width:100%;max-width:520px;height:200px;perspective:1000px;cursor:pointer}
.flash-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.flash-card.flipped{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px}
.flash-front{background:linear-gradient(135deg,rgba(244,114,182,.15),rgba(167,139,250,.1));border:2px solid rgba(244,114,182,.3)}
.flash-back{background:linear-gradient(135deg,rgba(37,217,255,.12),rgba(34,197,94,.08));border:2px solid rgba(37,217,255,.3);transform:rotateY(180deg)}
.flash-emoji{font-size:2.6rem;line-height:1}
.flash-word{font-family:var(--display);font-size:1.8rem;font-weight:900;text-align:center}
.flash-sub{font-size:.82rem;color:var(--muted2);text-align:center}
.flash-hint{font-size:.72rem;color:var(--muted2);font-style:italic;margin-top:4px}
.flash-cat{font-size:.65rem;font-weight:800;border-radius:999px;padding:2px 9px}
.flash-btns{display:flex;gap:10px;justify-content:center;width:100%;max-width:520px}
.flash-nav{border:0;border-radius:10px;padding:9px 20px;font-weight:800;font-family:var(--font);font-size:.85rem;cursor:pointer;transition:.15s;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--text)}
.flash-nav:hover{background:rgba(255,255,255,.14)}
.flash-mode-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.flash-mode-btn{border:0;border-radius:999px;padding:5px 14px;font-weight:700;font-family:var(--font);font-size:.75rem;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted2);transition:.14s}
.flash-mode-btn.active{background:rgba(37,217,255,.14);color:var(--cyan);border-color:rgba(37,217,255,.3)}
.flash-filter-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;width:100%;max-width:520px}
.flash-filter{border:0;border-radius:999px;padding:5px 13px;font-weight:700;font-family:var(--font);font-size:.73rem;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted2);transition:.14s}
.flash-filter.on{background:rgba(37,217,255,.14);color:var(--cyan);border-color:rgba(37,217,255,.3)}
.flash-filter.on-ap{background:rgba(244,114,182,.14);color:var(--ap2);border-color:rgba(244,114,182,.3)}

/* ══ MC ══ */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:15px 17px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.65;flex:1}
.mc-blank{display:inline-block;min-width:80px;border-bottom:2.5px solid rgba(37,217,255,.4);padding:0 4px;text-align:center;font-weight:800;color:var(--cyan)}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px;margin-bottom:3px}
.mc-opt{border:0;border-radius:10px;padding:8px 16px;font-weight:700;font-family:var(--font);font-size:.92rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not(:disabled){transform:translateY(-1px);background:rgba(37,217,255,.09);border-color:rgba(37,217,255,.35)}
.mc-opt:disabled{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:8px 12px 8px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}

/* ══ ERROR HUNT ══ */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.correct-sentence{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.wrong-sentence{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}.eh-sent{font-size:.97rem;line-height:1.6}
.wrong-word{color:var(--bad);text-decoration:underline wavy var(--bad);font-weight:700}
.eh-correction{font-size:.82rem;font-weight:700;color:var(--good);margin-left:5px}
.eh-judge-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-judge-btn{border:0;border-radius:9px;padding:7px 15px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-correct-btn:hover:not(:disabled){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-error-btn:hover:not(:disabled){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-judge-btn:disabled{cursor:default;opacity:.5}
.judge-chosen-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.judge-chosen-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* ══ SORT ══ */
.sort-pile{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;min-height:52px;margin-bottom:12px}
.sort-bucket{border-radius:14px;padding:13px;min-height:90px;display:flex;flex-direction:column;gap:7px;transition:background .2s}
.sort-bucket.drag-over{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.bucket-title{font-family:var(--display);font-size:.8rem;font-weight:900;text-align:center}
.bucket-sub{font-size:.62rem;color:var(--muted2);text-align:center;line-height:1.35}
.sort-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:700;cursor:grab;user-select:none;transition:.15s;line-height:1.4;display:flex;align-items:center;gap:6px}
.sort-card:hover{transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sort-card:active{cursor:grabbing}
.sort-card.drag-ghost{opacity:.35}
.sort-card.card-correct{background:rgba(34,197,94,.14);border-color:var(--good);color:#86efac;cursor:default}
.sort-card.card-wrong{background:rgba(239,68,68,.1);border-color:var(--bad);color:#fca5a5;font-size:.78rem}

/* ══ SPEED ══ */
.speed-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.speed-stats{display:flex;gap:9px}
.spstat{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spstat .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2)}
.spstat .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spstat .sv.g{color:var(--good)}.spstat .sv.b{color:var(--bad)}.spstat .sv.w{color:var(--warn)}
.speed-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:22px 20px;text-align:center;width:100%;max-width:520px}
.speed-emoji{font-size:3.5rem;line-height:1;margin-bottom:8px}
.speed-clue{font-size:1.05rem;line-height:1.6;margin-bottom:4px}
.speed-clue em{font-style:normal;font-weight:900;color:var(--warn);background:rgba(245,158,11,.12);border-radius:5px;padding:0 5px}
.speed-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.speed-input-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.speed-inp{flex:1;max-width:240px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--font);font-size:1rem;font-weight:700;color:var(--text);outline:none;transition:.15s}
.speed-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.speed-inp::placeholder{color:var(--muted2);font-weight:400}
.speed-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:520px}
.speed-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.speed-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.timer-row{display:flex;align-items:center;gap:9px;width:100%;max-width:520px}
.timer-track{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.timer-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ap),var(--per));transition:width 1s linear}
.timer-num{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.streak-badge{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak-badge.show{display:inline-flex;align-items:center;gap:4px}
.speed-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.speed-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.speed-start p{color:var(--muted);font-size:.87rem;max-width:400px;line-height:1.6}
.combo-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.combo-flash.anim{animation:cf .7s ease forwards}
@keyframes cf{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}


/* ══ PHOTO EXERCISE ══ */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.photo-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;transition:border-color .15s}
.photo-card:hover{border-color:rgba(37,217,255,.3)}
.photo-img-wrap{position:relative;width:100%;height:260px;overflow:hidden;background:linear-gradient(160deg,#f0f4ff,#e8edf8);display:flex;align-items:center;justify-content:center}
.photo-img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:opacity .3s}
.photo-img.loaded{opacity:1}.photo-img.loading{opacity:0}
.photo-svg-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.photo-body{padding:14px 16px}
.photo-q{font-size:.95rem;line-height:1.55;color:var(--text);margin-bottom:10px}
.photo-q strong{color:var(--cyan)}
.photo-opts{display:flex;flex-wrap:wrap;gap:7px}
.p-opt{border:0;border-radius:9px;padding:7px 16px;font-weight:800;font-family:var(--display);font-size:.92rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.p-opt:hover:not(:disabled){transform:translateY(-1px);background:rgba(37,217,255,.09);border-color:rgba(37,217,255,.35)}
.p-opt:disabled{cursor:default;transform:none}
.p-opt.p-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.p-opt.p-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.p-opt.p-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.p-expl{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding:7px 10px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.5}
.p-expl.show{display:block}
.photo-num{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:white;font-size:.65rem;font-weight:900;border-radius:6px;padding:3px 8px;backdrop-filter:blur(4px)}

/* ══ REFERENCE ══ */
.ref-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ref-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px}
.ref-block h3{font-family:var(--display);font-size:.95rem;font-weight:800;margin-bottom:10px}
.ref-table{width:100%;border-collapse:collapse;font-size:.83rem}
.ref-table th{padding:7px 10px;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.ref-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5}
.ref-table tr:last-child td{border-bottom:none}

.pic-opt:disabled{cursor:default;transform:none}

.pic-opt.p0{background:#e53935}
.pic-opt.p1{background:#1e88e5}
.pic-opt.p2{background:#fb8c00}
.pic-opt.p3{background:#43a047}
.pic-opt .opt-shape.s0{background:#e53935;border-color:white}
.pic-opt .opt-shape.s1{background:#1e88e5;border-color:white}
.pic-opt .opt-shape.s2{background:#fb8c00;border-color:white}
.pic-opt .opt-shape.s3{background:#43a047;border-color:white}
.pic-opt-ok{box-shadow:0 0 0 4px var(--good) !important;filter:brightness(1.15)}
.pic-opt-err{opacity:.45}
.pic-opt-reveal{box-shadow:0 0 0 4px var(--good) !important}
.pic-check-icon{margin-left:auto;font-size:1.2rem}

.pic-fb.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#fca5a5}

function seededShuffle(arr,seed){
  const a=[...arr];let s=seed;
  for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ══ MC ══ */
function renderMC(){
  const pct=Math.round(Object.keys(mc_answers).length/MC.length*100);
  const qHTML=MC.map((item,i)=>{
    const order=MC_ORDER[i];
    const optHTML=order.map(origIdx=>{
      const o=item.opts[origIdx];
      let cls='mc-opt';
      if(mc_checked){
        if(origIdx===item.ans)cls+=' mc-show';
        else if(mc_answers[i]===origIdx&&origIdx!==item.ans)cls+=' mc-err';
      } else if(mc_answers[i]===origIdx)cls+=origIdx===item.ans?' mc-ok':' mc-err';
      return `<button class="${cls}" id="mco_${i}_${origIdx}" onclick="answerMC(${i},${origIdx})" ${mc_checked?'disabled':''}>${o}</button>`;
    }).join('');
    const explShow=mc_checked||(mc_answers[i]!==undefined);
    return `<div class="mc-card">
      <div class="mc-top"><span class="mc-num">${i+1}</span><span class="mc-sent">${item.sent.replace('___','<span class="mc-blank">___</span>')}</span></div>
      <div class="mc-en">${item.en}</div>
      <div class="mc-opts">${optHTML}</div>
      <div class="mc-expl ${explShow?'show':''}" id="mcexp_${i}">${item.exp}</div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-header"><div class="ex-title">📝 Multiple choice</div>
  <div class="ex-instr">Choose the correct adjective. Pay attention to <em>gender agreement</em> — adjectives must match the noun. 50 sentences total.</div></div>
  <div class="score-bar">
    <div class="sc"><span class="l">Total</span><span class="v">${MC.length}</span></div>
    <div class="sc"><span class="l">Correct</span><span class="v g" id="mc_ok">—</span></div>
    <div class="sc"><span class="l">Wrong</span><span class="v b" id="mc_err">—</span></div>
    <div class="prog-w"><div class="prog-l">Answered: <span id="mc_pct">${pct}%</span></div><div class="prog-t"><div class="prog-f" id="mc_prog" style="width:${pct}%"></div></div></div>
  </div>
  <div class="mc-list">${qHTML}</div>
  <div class="fb" id="mc_fb"></div>
  <div class="actions">
    <button class="btn btn-cyan" id="mc_check" onclick="checkMC()" ${mc_checked?'disabled':''}>Check all</button>
    <button class="btn btn-ghost" onclick="mc_answers={};mc_checked=false;renderMC()">↺ Reset</button>
  </div></div>`;
}

function answerMC(qi,origIdx){
  if(mc_checked)return;
  if(mc_answers[qi]!==undefined){const p=document.getElementById(`mco_${qi}_${mc_answers[qi]}`);if(p)p.classList.remove('mc-ok','mc-err');}
  mc_answers[qi]=origIdx;
  const isOk=origIdx===MC[qi].ans;
  const btn=document.getElementById(`mco_${qi}_${origIdx}`);if(btn)btn.classList.add(isOk?'mc-ok':'mc-err');
  const exp=document.getElementById(`mcexp_${qi}`);if(exp)exp.classList.add('show');
  const pct=Math.round(Object.keys(mc_answers).length/MC.length*100);
  const el=document.getElementById('mc_pct');if(el)el.textContent=pct+'%';
  const pg=document.getElementById('mc_prog');if(pg)pg.style.width=pct+'%';
}
function checkMC(){
  mc_checked=true;
  let ok=0;
  MC.forEach((item,i)=>{if(mc_answers[i]===item.ans)ok++;});
  const pct=Math.round(ok/MC.length*100);

  // Re-render first so the correct/wrong options and explanations appear,
  // then restore the score and feedback in the new DOM.
  renderMC();

  document.getElementById('mc_ok').textContent=ok;
  document.getElementById('mc_err').textContent=MC.length-ok;
  document.getElementById('mc_prog').style.width='100%';
  document.getElementById('mc_pct').textContent='100%';

  const fb=document.getElementById('mc_fb');
  if(pct===100){fb.className='fb show ok';fb.innerHTML='🏆 <strong>Perfect! 50/50.</strong>';}
  else if(pct>=75){fb.className='fb show ok';fb.innerHTML=`👍 <strong>${ok}/50.</strong> Great job!`;}
  else if(pct>=50){fb.className='fb show partial';fb.innerHTML=`📖 <strong>${ok}/50.</strong> Remember: adjectives must agree with the noun in gender and number.`;}
  else{fb.className='fb show err';fb.innerHTML=`💪 <strong>${ok}/50.</strong> Review the flashcards and try again.`;}
}

  eh_answered={};
  let html=`<div class="panel"><div class="ex-header"><div class="ex-title">🔍 Error hunter</div>
  <div class="ex-instr">Does the adjective agree correctly with the noun? Decide before seeing the explanation.</div></div>
  <div class="score-bar">
    <div class="sc"><span class="l">Total</span><span class="v">${ERRORS.length}</span></div>
    <div class="sc"><span class="l">Correct</span><span class="v g" id="eh_ok">0</span></div>
    <div class="sc"><span class="l">Wrong</span><span class="v b" id="eh_err">0</span></div>
    <div class="prog-w"><div class="prog-l">Progress: <span id="eh_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="eh_prog" style="width:0%"></div></div></div>
  </div><div class="eh-list">`;
  ERRORS.forEach(([sent,,,exp],idx)=>{
    html+=`<div class="eh-item" id="ehi_${idx}"><div class="eh-num">${idx+1}</div>
      <div class="eh-body">
        <div class="eh-sent" id="ehsent_${idx}">${sent}</div>
        <div class="eh-judge-row">
          <button class="eh-judge-btn eh-correct-btn" onclick="judgeEh(${idx},false)">✅ Correct</button>
          <button class="eh-judge-btn eh-error-btn" onclick="judgeEh(${idx},true)">❌ Has an error</button>
        </div>
        <div class="eh-exp" id="ehexp_${idx}">${exp}</div>
      </div></div>`;
  });
  html+=`</div><div class="fb" id="eh_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="eh_answered={};renderErrorHunt()">↺ Reset</button></div></div>`;
  document.getElementById('exContainer').innerHTML=html;
}
function judgeEh(idx,studentSaysError){
  if(eh_answered[idx]!==undefined)return;
  const [sent,hasErr,correction,exp]=ERRORS[idx];
  const correct=studentSaysError===hasErr;
  eh_answered[idx]=correct;
  const item=document.getElementById('ehi_'+idx);
  item.classList.add('revealed',correct?'correct-sentence':'wrong-sentence');
  item.querySelectorAll('.eh-judge-btn').forEach(b=>b.disabled=true);
  const chosen=item.querySelector(studentSaysError?'.eh-error-btn':'.eh-correct-btn');
  if(chosen)chosen.classList.add(correct?'judge-chosen-ok':'judge-chosen-err');
  if(hasErr&&correction){
    const sentEl=document.getElementById('ehsent_'+idx);
    const allAdj=ADJ.flatMap(a=>[a.masc,a.fem,a.masc+'s',a.fem+'s']).filter((v,i,a)=>a.indexOf(v)===i);
    let h=sent;
    allAdj.filter(a=>a!==correction).forEach(a=>{
      h=h.replace(new RegExp(`\\b${a}\\b`,'g'),`<span class="wrong-word">${a}</span>`);
    });
    sentEl.innerHTML=h+` <span class="eh-correction">→ <strong>${correction}</strong></span>`;
  }
  document.getElementById('ehexp_'+idx).classList.add('show');
  const total=Object.keys(eh_answered).length;
  const totalOk=Object.values(eh_answered).filter(v=>v).length;
  document.getElementById('eh_ok').textContent=totalOk;
  document.getElementById('eh_err').textContent=total-totalOk;
  document.getElementById('eh_pct').textContent=Math.round(total/ERRORS.length*100)+'%';
  document.getElementById('eh_prog').style.width=Math.round(total/ERRORS.length*100)+'%';
  if(total===ERRORS.length){
    const pct=Math.round(totalOk/ERRORS.length*100);
    const fb=document.getElementById('eh_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'🏆':'📖'} <strong>${totalOk}/${ERRORS.length}.</strong> ${pct>=80?'Excellent!':'Remember: adjectives must match the noun in gender (and number).'}`;
  }
}

/* ══ SORT ══ */
function renderSort(){
  sortPlaced={};sortChecked=false;tapSelected=null;
  const shuffled=randShuffle(SORT_ITEMS);
  const pile=shuffled.map(item=>`<div class="sort-card" id="sc_${item.id}" draggable="true"
    ondragstart="dragStart(event,'${item.id}')" ondragend="dragEnd(event)"
    onclick="tapCard('${item.id}')"><span>${item.emoji}</span><span>${item.word}</span></div>`).join('');
  const buckHTML=SORT_BUCKETS_DATA.map(b=>`<div class="sort-bucket" id="bucket-${b.id}"
    style="background:${b.bg};border:2px dashed ${b.bdr};min-height:90px"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="dropInto(event,'${b.id}')" onclick="bucketTap('${b.id}')">
    <div class="bucket-title" style="color:${b.col}">${b.icon} ${b.label}</div>
    <div class="bucket-sub">${b.sub}</div>
  </div>`).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-header"><div class="ex-title">🗂️ Drag & sort</div>
  <div class="ex-instr">Drag each adjective to its bucket: appearance or personality, positive or negative. Tap a card then a bucket on mobile.</div></div>
  <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);margin-bottom:8px">Cards — drag or tap → tap bucket</div>
  <div class="sort-pile" id="sortPile">${pile}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">${buckHTML}</div>
  <div class="fb" id="sort_fb"></div>
  <div class="actions">
    <button class="btn btn-cyan" id="sort_check" onclick="checkSort()" disabled>Check</button>
    <button class="btn btn-ghost" onclick="renderSort()">↺ Reset</button>
  </div></div>`;
}
function dragStart(e,id){dragItem=id;if(e.dataTransfer){e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}setTimeout(()=>{const c=document.getElementById('sc_'+id);if(c)c.classList.add('drag-ghost');},0);}
function dragEnd(){if(dragItem){const c=document.getElementById('sc_'+dragItem);if(c)c.classList.remove('drag-ghost');}dragItem=null;}
function dropInto(e,bucket){e.preventDefault();const id=(e.dataTransfer&&e.dataTransfer.getData('text/plain'))||dragItem;document.getElementById('bucket-'+bucket).classList.remove('drag-over');if(!id||sortPlaced[id])return;placeCard(id,bucket);}
function tapCard(id){if(sortPlaced[id])return;const card=document.getElementById('sc_'+id);if(!card)return;if(tapSelected===id){card.style.boxShadow='';tapSelected=null;return;}if(tapSelected){const p=document.getElementById('sc_'+tapSelected);if(p)p.style.boxShadow='';}tapSelected=id;card.style.boxShadow='0 0 0 3px var(--cyan)';}
function bucketTap(bucket){if(!tapSelected)return;placeCard(tapSelected,bucket);tapSelected=null;}
function placeCard(id,bucket){sortPlaced[id]=bucket;const card=document.getElementById('sc_'+id);const bEl=document.getElementById('bucket-'+bucket);if(!card||!bEl)return;card.style.boxShadow='';card.classList.remove('drag-ghost');card.draggable=false;const b=SORT_BUCKETS_DATA.find(x=>x.id===bucket);card.style.borderColor=b?b.col:'rgba(255,255,255,.3)';card.onclick=()=>returnCard(id);bEl.appendChild(card);if(Object.keys(sortPlaced).length===SORT_ITEMS.length){const btn=document.getElementById('sort_check');if(btn)btn.disabled=false;}}
function returnCard(id){if(sortChecked)return;delete sortPlaced[id];const card=document.getElementById('sc_'+id);const pile=document.getElementById('sortPile');if(!card||!pile)return;card.style.borderColor='';card.style.boxShadow='';card.draggable=true;card.onclick=()=>tapCard(id);pile.appendChild(card);const btn=document.getElementById('sort_check');if(btn)btn.disabled=true;}
function checkSort(){
  sortChecked=true;let ok=0;
  SORT_ITEMS.forEach(item=>{const card=document.getElementById('sc_'+item.id);if(!card)return;const isOk=sortPlaced[item.id]===item.correct;if(isOk)ok++;card.className='sort-card '+(isOk?'card-correct':'card-wrong');card.draggable=false;card.onclick=null;if(!isOk){const b=SORT_BUCKETS_DATA.find(x=>x.id===item.correct);card.innerHTML=`<span>${item.emoji}</span><span>${item.word}</span><span style="font-size:.7rem;opacity:.8"> → ${b?b.label:item.correct}</span>`;}card.title=item.exp;});
  const pct=Math.round(ok/SORT_ITEMS.length*100);
  const fb=document.getElementById('sort_fb');fb.className='fb show '+(pct>=80?'ok':pct>=55?'partial':'err');
  fb.innerHTML=`<strong>${ok}/${SORT_ITEMS.length} (${pct}%).</strong> Red cards show the correct bucket.`;
  document.getElementById('sort_check').disabled=true;
}

/* ══ SPEED ══ */
function renderSpeed(){
  if(speedTimer){clearInterval(speedTimer);speedTimer=null;}
  speedIdx=0;speedOk=0;speedErr=0;speedStreak=0;speedAnswered=false;
  // shuffle speed items
  for(let i=SPEED.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[SPEED[i],SPEED[j]]=[SPEED[j],SPEED[i]];}
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-header"><div class="ex-title">⚡ Speed round</div>
  <div class="ex-instr">Look at the emoji and clue, then type the Spanish adjective. The hint shows the English. Masculine form accepted unless the clue says fem. 10 seconds per question.</div></div>
  <div class="speed-wrap" id="speedWrap">
    <div class="speed-start"><div style="font-size:2.8rem">⚡</div><h2>Type the adjective</h2>
    <p>Read the emoji and clue, type the Spanish adjective. Accents optional. 30 questions — build a streak!</p>
    <button class="btn btn-cyan" onclick="startSpeed()">Let's go!</button></div>
  </div></div>`;
}
function startSpeed(){speedIdx=0;speedOk=0;speedErr=0;speedStreak=0;nextSpeedQ();}
function normS(s){return(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function nextSpeedQ(){
  if(speedIdx>=SPEED.length){endSpeed();return;}
  speedAnswered=false;const item=SPEED[speedIdx];speedTimeLeft=10;
  document.getElementById('speedWrap').innerHTML=`
    <div class="speed-stats">
      <div class="spstat"><div class="sl">Question</div><div class="sv w">${speedIdx+1}/${SPEED.length}</div></div>
      <div class="spstat"><div class="sl">Correct</div><div class="sv g">${speedOk}</div></div>
      <div class="spstat"><div class="sl">Wrong</div><div class="sv b">${speedErr}</div></div>
    </div>
    <div class="streak-badge ${speedStreak>=3?'show':''}" id="streakB">🔥 Streak: ${speedStreak}</div>
    <div class="speed-card">
      <div class="speed-emoji">${item.emoji}</div>
      <div class="speed-clue">${item.clue.replace('___','<em>___</em>')}</div>
      <div class="speed-hint">💡 ${item.hint}</div>
    </div>
    <div class="timer-row">
      <div class="timer-track"><div class="timer-fill" id="tFill" style="width:100%;transition:width 1s linear"></div></div>
      <div class="timer-num" id="tNum">10</div>
    </div>
    <div class="speed-input-row">
      <input id="sInp" class="speed-inp" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type here…" onkeydown="if(event.key==='Enter')submitSpeed()">
      <button class="btn btn-cyan" onclick="submitSpeed()" style="flex-shrink:0">→</button>
    </div>
    <div class="speed-fb" id="sFb" style="opacity:0"></div>`;
  setTimeout(()=>{const i=document.getElementById('sInp');if(i)i.focus();},50);
  if(speedTimer)clearInterval(speedTimer);
  speedTimer=setInterval(()=>{
    speedTimeLeft--;
    const f=document.getElementById('tFill'),n=document.getElementById('tNum');
    if(f)f.style.width=Math.max(0,(speedTimeLeft/10)*100)+'%';
    if(n){n.textContent=speedTimeLeft;n.style.color=speedTimeLeft<=2?'var(--bad)':speedTimeLeft<=5?'var(--warn)':'var(--muted2)';}
    if(speedTimeLeft<=0){clearInterval(speedTimer);speedTimer=null;if(!speedAnswered)submitSpeed();}
  },1000);
}
function submitSpeed(){
  const inp=document.getElementById('sInp');if(!inp||speedAnswered)return;
  speedAnswered=true;if(speedTimer){clearInterval(speedTimer);speedTimer=null;}inp.disabled=true;
  const item=SPEED[speedIdx];const nt=normS(inp.value);const na=normS(item.ans);
  const isOk=nt===na||item.also.map(normS).includes(nt);
  if(isOk){speedOk++;speedStreak++;}else{speedErr++;speedStreak=0;}
  const fb=document.getElementById('sFb');
  if(fb){fb.style.opacity='1';
    if(!inp.value.trim()){fb.className='speed-fb err';fb.innerHTML=`⏱ Time's up! → <strong>${item.ans}</strong>`;}
    else if(isOk){fb.className='speed-fb ok';fb.innerHTML=`✓ <strong>Correct!</strong>${speedStreak>=3?' 🔥 x'+speedStreak:''}`;}
    else{fb.className='speed-fb err';fb.innerHTML=`✗ <strong>${inp.value}</strong> → <strong>${item.ans}</strong>`;}}
  if(speedStreak>=3){const cf=document.getElementById('comboFlash');cf.textContent='🔥 x'+speedStreak;cf.classList.remove('anim');void cf.offsetWidth;cf.classList.add('anim');}
  speedIdx++;setTimeout(nextSpeedQ,isOk?700:1400);
}
function endSpeed(){
  const pct=Math.round(speedOk/SPEED.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  document.getElementById('speedWrap').innerHTML=`<div class="speed-start"><div style="font-size:3rem">${emo}</div><h2>${speedOk}/${SPEED.length} correct</h2>
    <p style="color:var(--muted)">${pct>=90?'Excellent! You know all 50 adjectives!':pct>=70?'Great job! Review the ones you missed.':pct>=50?'Keep going — the flashcards will help.':'Start with the flashcard exercise to build your vocabulary.'}</p>
    <button class="btn btn-cyan" onclick="startSpeed()">↺ Try again</button></div>`;
}

var personality_answers = {};
var personality_checked = false;

function getPersonalityMediaHTML(item){
  var src = PERSONALITY_IMAGE_BY_INDEX[item.imgIdx];
  if(src){
    return '<img class="photo-img loaded" src="'+src+'" alt="" loading="lazy">';
  }
  return '<div style="height:100%;display:grid;place-items:center;color:#666;font-size:.8rem">Image not available</div>';
}

function renderPersonality(reset){
  if(reset !== false){
    personality_answers={};
    personality_checked=false;
  }

  var cardsHTML=PERSONALITY_ITEMS.map(function(item,i){
    var order=seededShuffle([0,1,2,3],i*23+5);
    var optHTML=order.map(function(origIdx){
      var o=item.opts[origIdx];
      var cls='p-opt';
      if(personality_checked){
        if(origIdx===item.ans)cls+=' p-show';
        else if(personality_answers[i]===origIdx&&origIdx!==item.ans)cls+=' p-err';
      } else if(personality_answers[i]===origIdx)cls+=origIdx===item.ans?' p-ok':' p-err';
      return '<button class="'+cls+'" id="peo_'+i+'_'+origIdx+'" onclick="answerPersonality('+i+','+origIdx+')" '+(personality_checked?'disabled':'')+'>'+o+'</button>';
    }).join('');
    var explShow=personality_checked||(personality_answers[i]!==undefined);

    return '<div class="photo-card">' +
      '<div class="photo-img-wrap" id="per_wrap_'+i+'">' +
      '<span class="photo-num">'+(i+1)+'</span>' +
      getPersonalityMediaHTML(item) +
      '</div>' +
      '<div class="photo-body">' +
      '<div class="photo-q">'+item.q+'</div>' +
      '<div class="photo-opts">'+optHTML+'</div>' +
      '<div class="p-expl'+(explShow?' show':'')+'" id="perexp_'+i+'">'+item.exp+'</div>' +
      '</div></div>';
  }).join('');

  document.getElementById('exContainer').innerHTML='<div class="panel">' +
    '<div class="ex-header"><div class="ex-title">🧠 Describe the personality</div>' +
    '<div class="ex-instr">Look at the character and choose the personality adjective that best matches the expression, body language, and overall vibe. This version uses 20 different character images. Images are stored as optimized WebP files for GitHub Pages.</div></div>' +
    '<div class="score-bar">' +
    '<div class="sc"><span class="l">Total</span><span class="v">'+PERSONALITY_ITEMS.length+'</span></div>' +
    '<div class="sc"><span class="l">Correct</span><span class="v g" id="per_ok">—</span></div>' +
    '<div class="sc"><span class="l">Wrong</span><span class="v b" id="per_err">—</span></div>' +
    '<div class="prog-w"><div class="prog-l">Answered: <span id="per_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="per_prog" style="width:0%"></div></div></div>' +
    '</div>' +
    '<div class="photo-grid">'+cardsHTML+'</div>' +
    '<div class="fb" id="per_fb"></div>' +
    '<div class="actions">' +
    '<button class="btn btn-cyan" id="per_check" onclick="checkPersonality()" '+(personality_checked?'disabled':'')+'>Check all</button>' +
    '<button class="btn btn-ghost" onclick="renderPersonality(true)">↺ Reset</button>' +
    '</div></div>';

  updatePersonalityProgress(personality_checked);
}

function answerPersonality(qi,origIdx){
  if(personality_checked) return;
  personality_answers[qi]=origIdx;
  updatePersonalityProgress(false);
  renderPersonality(false);
}

function updatePersonalityProgress(finalMode){
  var answered=Object.keys(personality_answers).length;
  var ok=0;
  PERSONALITY_ITEMS.forEach(function(item,i){if(personality_answers[i]===item.ans)ok++;});
  var pct=finalMode?100:Math.round(answered/PERSONALITY_ITEMS.length*100);

  var perOk=document.getElementById('per_ok');
  var perErr=document.getElementById('per_err');
  var perPct=document.getElementById('per_pct');
  var perProg=document.getElementById('per_prog');

  if(perOk)perOk.textContent=finalMode?ok:'—';
  if(perErr)perErr.textContent=finalMode?(PERSONALITY_ITEMS.length-ok):'—';
  if(perPct)perPct.textContent=pct+'%';
  if(perProg)perProg.style.width=pct+'%';
}

function checkPersonality(){
  personality_checked=true;
  var ok=0;
  PERSONALITY_ITEMS.forEach(function(item,i){if(personality_answers[i]===item.ans)ok++;});
  var pct=Math.round(ok/PERSONALITY_ITEMS.length*100);
  renderPersonality(false);
  updatePersonalityProgress(true);

  var fb=document.getElementById('per_fb');
  if(pct===100){fb.className='fb show ok';fb.innerHTML='🏆 <strong>Perfect! '+ok+'/'+PERSONALITY_ITEMS.length+'.</strong>';}
  else if(pct>=75){fb.className='fb show ok';fb.innerHTML='👍 <strong>'+ok+'/'+PERSONALITY_ITEMS.length+'.</strong> Great job!';}
  else if(pct>=50){fb.className='fb show partial';fb.innerHTML='📖 <strong>'+ok+'/'+PERSONALITY_ITEMS.length+'.</strong> Good start. Review the adjectives and body-language clues.';}
  else{fb.className='fb show err';fb.innerHTML='💪 <strong>'+ok+'/'+PERSONALITY_ITEMS.length+'.</strong> Try again and focus on facial expressions and posture.';}
}

var photo_answers = {};

function cleanSvgLabel(svg){
  return (svg||'')
    .replace(/<text[\s\S]*?<\/text>/gi,'')
    .replace(/<rect x="10" y="226"[\s\S]*?\/>/gi,'');
}

function getPhotoMediaHTML(item,i){
  var src = PHOTO_IMAGE_BY_INDEX[i] || item.img;
  if(src){
    return '<img class="photo-img loaded" src="'+src+'" alt="" loading="lazy">';
  }
  if(item.svg){
    return cleanSvgLabel(item.svg).replace('<svg', '<svg style="width:100%;height:100%;max-height:260px;object-fit:contain"');
  }
  return '<div style="height:100%;display:grid;place-items:center;color:#666;font-size:.8rem">Image not available</div>';
}

function renderPhoto(reset){
  if(reset !== false){

    '<div class="score-bar">' +
    '<div class="sc"><span class="l">Total</span><span class="v">'+PHOTO_ITEMS.length+'</span></div>' +

    '<div class="prog-w"><div class="prog-l">Answered: <span id="ph_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="ph_prog" style="width:0%"></div></div></div>' +
    '</div>' +
    '<div class="photo-grid">'+cardsHTML+'</div>' +
    '<div class="fb" id="ph_fb"></div>' +
    '<div class="actions">' +
    '<button class="btn btn-cyan" id="ph_check" onclick="checkPhoto()" '+(photo_checked?'disabled':'')+'>Check all</button>' +
    '<button class="btn btn-ghost" onclick="renderPhoto(true)">↺ Reset</button>' +
    '</div></div>';

  updatePhotoProgress(photo_checked);
}

function updatePhotoProgress(finalMode){
  var answered=Object.keys(photo_answers).length;
  var ok=0;
  PHOTO_ITEMS.forEach(function(item,i){if(photo_answers[i]===item.ans)ok++;});
  var pct=finalMode?100:Math.round(answered/PHOTO_ITEMS.length*100);

  var phOk=document.getElementById('ph_ok');
  var phErr=document.getElementById('ph_err');
  var phPct=document.getElementById('ph_pct');
  var phProg=document.getElementById('ph_prog');

  if(phOk)phOk.textContent=finalMode?ok:'—';
  if(phErr)phErr.textContent=finalMode?(PHOTO_ITEMS.length-ok):'—';
  if(phPct)phPct.textContent=pct+'%';
  if(phProg)phProg.style.width=pct+'%';
}

function answerPhoto(qi,origIdx){
  if(photo_checked)return;
  if(photo_answers[qi]!==undefined){
    var p=document.getElementById('po_'+qi+'_'+photo_answers[qi]);
    if(p)p.classList.remove('p-ok','p-err');
  }
  photo_answers[qi]=origIdx;
  var isOk=origIdx===PHOTO_ITEMS[qi].ans;
  var btn=document.getElementById('po_'+qi+'_'+origIdx);
  if(btn)btn.classList.add(isOk?'p-ok':'p-err');
  var exp=document.getElementById('pexp_'+qi);
  if(exp)exp.classList.add('show');
  updatePhotoProgress(false);
}

function checkPhoto(){
  photo_checked=true;
  var ok=0;
  PHOTO_ITEMS.forEach(function(item,i){if(photo_answers[i]===item.ans)ok++;});
  var pct=Math.round(ok/PHOTO_ITEMS.length*100);

  renderPhoto(false);
  updatePhotoProgress(true);

  var fb=document.getElementById('ph_fb');
  if(pct===100){fb.className='fb show ok';fb.innerHTML='🏆 <strong>Perfect!</strong> You described every person correctly.';}
  else if(pct>=75){fb.className='fb show ok';fb.innerHTML='👍 <strong>'+ok+'/'+PHOTO_ITEMS.length+'.</strong> Great job!';}
  else{fb.className='fb show partial';fb.innerHTML='📖 <strong>'+ok+'/'+PHOTO_ITEMS.length+'.</strong> Remember to use the correct gender form for each person.';}
}
