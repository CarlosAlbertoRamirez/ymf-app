<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinónimos y Antónimos | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --syn:#34d399;--syn2:#6ee7b7;   /* synonyms = green */
  --ant:#f87171;--ant2:#fca5a5;   /* antonyms = red */
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 12% 8%,rgba(52,211,153,.12),transparent 30%),radial-gradient(ellipse at 88% 12%,rgba(248,113,113,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--syn),#fff 40%,var(--ant));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:5px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:8px 11px;font-weight:800;font-family:var(--font);font-size:.76rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.15rem;line-height:1}
.etab-label{font-size:.62rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:100px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--syn),var(--ant));transition:width .35s}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ── WORD CARDS (EX 0) ── */
.wc-controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.wc-filter{border:0;border-radius:9px;padding:5px 13px;font-size:.73rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);color:var(--muted);border:1.5px solid transparent}
.wc-filter.active{color:white;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.wc-mode{border:0;border-radius:9px;padding:5px 13px;font-size:.73rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:.14s}
.wc-syn.active{background:rgba(52,211,153,.18);border:1.5px solid rgba(52,211,153,.4);color:var(--syn2)}
.wc-ant.active{background:rgba(248,113,113,.18);border:1.5px solid rgba(248,113,113,.4);color:var(--ant2)}
.wc-syn{background:rgba(52,211,153,.07);border:1.5px solid rgba(52,211,153,.2);color:var(--syn)}
.wc-ant{background:rgba(248,113,113,.07);border:1.5px solid rgba(248,113,113,.2);color:var(--ant)}
.wc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.wc-prow{display:flex;align-items:center;gap:12px;width:100%;max-width:660px}
.wc-cnt{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.wc-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.wc-fil{height:100%;border-radius:999px;transition:width .4s}
.wc-card{width:100%;max-width:660px;min-height:240px;perspective:1000px;cursor:pointer}
.wc-inner{position:relative;width:100%;min-height:240px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.wc-card.flipped .wc-inner{transform:rotateY(180deg)}
.wc-front,.wc-back{position:absolute;inset:0;border-radius:18px;padding:22px 24px;backface-visibility:hidden;display:flex;flex-direction:column;gap:10px;min-height:240px}
.wc-back{transform:rotateY(180deg)}
.wc-cat-tag{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.09em;border-radius:999px;padding:3px 11px;width:fit-content}
.wc-headword{font-family:var(--display);font-size:2rem;font-weight:900;color:var(--text);line-height:1.1}
.wc-en{font-size:.83rem;color:var(--muted2);font-style:italic}
.wc-pairs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.wc-pair{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:10px}
.wc-pair-label{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;border-radius:6px;padding:2px 7px;flex-shrink:0;margin-top:2px}
.wc-pair-words{font-size:.92rem;font-weight:700;line-height:1.5}
.wc-pair-ex{font-size:.76rem;color:var(--muted);font-style:italic;line-height:1.45}
.wc-hint{font-size:.72rem;color:var(--muted2);text-align:center;font-style:italic;margin-top:auto}
.wc-nav{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:660px}

/* ── PICTURE CARDS (EX 1) ── */
.pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(276px,1fr));gap:16px}
.pic-card{position:relative;border-radius:24px;overflow:hidden;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);transition:transform .15s,box-shadow .15s}
.pic-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.pic-card.ok{border-color:var(--good);box-shadow:0 0 0 2px rgba(34,197,94,.3)}
.pic-card.err{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
.pic-q{padding:16px 14px 10px;font-size:1rem;font-weight:800;text-align:center;line-height:1.45;background:rgba(0,0,0,.22)}
.pic-task{font-size:.75rem;color:var(--muted2);display:block;margin-top:4px}
.pic-img{background:#dfe3e8;display:flex;align-items:center;justify-content:center;padding:14px;min-height:300px;position:relative;overflow:hidden}
.pic-img::before{display:none}
.pic-img svg,.pic-img img{width:100%;max-width:440px;max-height:280px;display:block;position:relative;z-index:1;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.10));border-radius:18px}
.pic-btns{display:grid;grid-template-columns:1fr 1fr}
.pic-btn{border:0;padding:11px 8px 11px 22px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.12s;color:white;text-align:left;position:relative;line-height:1.3}
.pic-btn:hover:not([disabled]){filter:brightness(1.15)}
.pic-btn[disabled]{cursor:default}
.pic-btn::before{content:attr(data-l);position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:.68rem;opacity:.65;font-weight:900}
.pic-btn.c1{background:#c0392b}.pic-btn.c2{background:#2980b9}
.pic-btn.c3{background:#d35400}.pic-btn.c4{background:#27ae60}
.pic-btn.revealed{box-shadow:inset 0 0 0 3px white}
.pic-btn.revealed::after{content:"✓";position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.pic-btn.dim{opacity:.28}
.pic-exp{font-size:.76rem;padding:8px 12px;background:rgba(0,0,0,.35);color:var(--muted);line-height:1.5;text-align:center;display:none}
.pic-exp.show{display:block}
.pic-num{position:absolute;top:14px;left:14px;z-index:3;background:#7b7b7b;color:#fff;border-radius:10px;padding:7px 12px;font-size:1.25rem;font-weight:900;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.18)}

/* ── MC ── */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.65;flex:1}
.mc-blank{display:inline-block;min-width:80px;border-bottom:2.5px solid rgba(37,217,255,.4);padding:0 4px;text-align:center;font-weight:800;color:var(--cyan)}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px}
.mc-opt{border:0;border-radius:10px;padding:7px 14px;font-weight:700;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px);background:rgba(37,217,255,.09);border-color:rgba(37,217,255,.35)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.79rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:7px 12px 7px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}
.tag-syn{background:rgba(52,211,153,.18);color:var(--syn2);font-size:.6rem;font-weight:900;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-left:5px;vertical-align:middle}
.tag-ant{background:rgba(248,113,113,.18);color:var(--ant2);font-size:.6rem;font-weight:900;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-left:5px;vertical-align:middle}

/* ── ERROR HUNT ── */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.eh-ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.eh-bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}.eh-sent{font-size:.97rem;line-height:1.6}
.eh-task{font-size:.72rem;color:var(--muted2);font-style:italic;margin-bottom:4px}
.eh-fix{font-size:.82rem;font-weight:700;color:var(--good);margin-left:6px}
.eh-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-btn{border:0;border-radius:9px;padding:7px 15px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-yes:hover:not([disabled]){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-no:hover:not([disabled]){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-btn[disabled]{cursor:default;opacity:.5}
.cho-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.cho-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* ── SPEED ── */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;text-align:center;width:100%;max-width:520px}
.sp-q{font-size:1rem;line-height:1.7;margin-bottom:4px}
.sp-badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:800;margin-bottom:6px}
.sp-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.sp-inp{flex:1;max-width:260px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--font);font-size:1rem;font-weight:700;color:var(--text);outline:none;transition:.15s}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-inp::placeholder{color:var(--muted2);font-weight:400}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:520px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:520px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--syn),var(--ant));transition:width 1s linear}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* ── REFERENCE ── */
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:14px}
.ref-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:0;overflow:hidden}
.ref-block-head{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.ref-block-body{padding:0}
.ref-table{width:100%;border-collapse:collapse;font-size:.82rem}
.ref-table th{padding:6px 12px;font-size:.58rem;font-weight:800;text-transform:uppercase;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
.ref-table td{padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5;vertical-align:top}
.ref-table tr:last-child td{border-bottom:none}
.ref-table tr:hover td{background:rgba(255,255,255,.02)}
.td-word{font-weight:800;font-size:.88rem}
.td-syn{color:var(--syn2);font-weight:600;font-size:.82rem}
.td-ant{color:var(--ant2);font-weight:600;font-size:.82rem}
.td-en{color:var(--muted2);font-style:italic;font-size:.76rem}
.ref-alert{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:12px;padding:10px 14px;font-size:.83rem;color:#fde68a;line-height:1.6;margin-bottom:12px}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.panel{padding:14px 12px}.pic-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="cf" id="cf"></div>
<header class="hero">
  <div class="hero-in">
    <div class="logo-box">YMF</div>

function getWCFiltered(){return wcFilter==='all'?WORDS:WORDS.filter(w=>w.cat===wcFilter);}

function renderWordCards(){
  wcCards=getWCFiltered();if(wcIdx>=wcCards.length)wcIdx=0;
  wcFlipped=false;renderWCCard();
}
function renderWCCard(){
  if(!wcCards.length){document.getElementById('exContainer').innerHTML=`<div class="panel"><p style="text-align:center;color:var(--muted);padding:24px">No cards.</p></div>`;return;}
  const item=wcCards[wcIdx];
  const cat=CATS_META[item.cat];
  const pct=Math.round((wcIdx+1)/wcCards.length*100);

  const fbtns=[{id:'all',lbl:'All',col:'rgba(255,255,255,.12)',bd:'rgba(255,255,255,.25)',txt:'white'},...Object.entries(CATS_META).map(([k,v])=>({id:k,lbl:v.label,col:v.bg,bd:v.bd,txt:v.col}))].map(f=>`<button class="wc-filter${wcFilter===f.id?' active':''}" style="${wcFilter===f.id?`background:${f.col};border-color:${f.bd};color:${f.txt}`:''}" onclick="setWCFilter('${f.id}')">${f.lbl}</button>`).join('');

  const synList=item.syn.slice(0,4).join(', ');
  const antList=item.ant.slice(0,4).join(', ');

  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">&#128218; Word cards — ${WORDS.length} palabras</div>
  <div class="ex-instr">Click any card to flip it and see the <em style="color:var(--syn2)">synonyms</em> and <em style="color:var(--ant2)">antonyms</em> with examples. Filter by category.</div>
  <div class="wc-controls">${fbtns}</div>
  <div class="wc-wrap">
    <div class="wc-prow">
      <span class="wc-cnt">${wcIdx+1} / ${wcCards.length}</span>
      <div class="wc-trk"><div class="wc-fil" style="width:${pct}%;background:${cat.col}"></div></div>
      <span class="wc-cnt" style="color:${cat.col}">${cat.icon} ${cat.label}</span>
    </div>
    <div class="wc-card${wcFlipped?' flipped':''}" id="wcCard" onclick="flipWC()">
      <div class="wc-inner">
        <div class="wc-front" style="background:${cat.bg};border:1.5px solid ${cat.bd}">
          <span class="wc-cat-tag" style="background:${cat.bg};border:1px solid ${cat.bd};color:${cat.col}">${cat.icon} ${cat.label}</span>
          <div class="wc-headword">${item.word}</div>
          <div class="wc-en">${item.en}</div>
          <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
            <div style="background:rgba(52,211,153,.12);border-radius:8px;padding:6px 12px;font-size:.78rem">

              <span style="color:var(--syn2)">${synList}</span>
            </div>
            <div style="background:rgba(248,113,113,.1);border-radius:8px;padding:6px 12px;font-size:.78rem">
              <span style="color:var(--ant);font-weight:800;font-size:.65rem;text-transform:uppercase;display:block;margin-bottom:2px">Antónimos</span>
              <span style="color:var(--ant2)">${antList}</span>
            </div>
          </div>
          <div class="wc-hint" style="margin-top:auto">&#128161; Click to see examples</div>
        </div>
        <div class="wc-back" style="background:${cat.bg};border:1.5px solid ${cat.bd}">
          <span class="wc-cat-tag" style="background:${cat.bg};border:1px solid ${cat.bd};color:${cat.col}">${cat.icon} ${cat.label}</span>
          <div class="wc-headword" style="font-size:1.4rem">${item.word}</div>

            <div class="wc-pair" style="background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2)">
              <span class="wc-pair-label" style="background:rgba(52,211,153,.2);color:var(--syn)">Sinónimo</span>
              <div><div class="wc-pair-words" style="color:var(--syn2)">${synList}</div><div class="wc-pair-ex">${item.ex_syn}</div></div>
            </div>
            <div class="wc-pair" style="background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.2)">
              <span class="wc-pair-label" style="background:rgba(248,113,113,.18);color:var(--ant)">Antónimo</span>
              <div><div class="wc-pair-words" style="color:var(--ant2)">${antList}</div><div class="wc-pair-ex">${item.ex_ant}</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="wc-nav">

      <button class="btn btn-cyan" onclick="nextWC()" ${wcIdx===wcCards.length-1?'disabled':''}>Next &#8594;</button>
    </div>
  </div></div>`;
}
function flipWC(){wcFlipped=!wcFlipped;const c=document.getElementById('wcCard');if(c)c.classList.toggle('flipped',wcFlipped);}
function nextWC(){wcIdx=Math.min(wcCards.length-1,wcIdx+1);wcFlipped=false;renderWCCard();}
function prevWC(){wcIdx=Math.max(0,wcIdx-1);wcFlipped=false;renderWCCard();}
function setWCFilter(f){wcFilter=f;wcIdx=0;renderWordCards();}

function renderPicCards(){
  const ok=Object.values(picAnswers).filter(v=>v).length;
  const ans=Object.keys(picAnswers).length;
  const total=PIC_ITEMS.length;
  const pct=Math.round(ans/total*100);
  const cards=PIC_ITEMS.map((item,idx)=>{
    const done=picAnswers[idx]!==undefined;
    const isOk=picAnswers[idx]===true;
    const isSyn=item.type==='syn';
    const taskColor=isSyn?'var(--syn)':'var(--ant)';
    const taskBg=isSyn?'rgba(52,211,153,.15)':'rgba(248,113,113,.15)';
    const colors=['c1','c2','c3','c4'];
    const letters=['A','B','C','D'];
    const btns=item.opts.map((o,oi)=>{
      let cls=`pic-btn ${colors[oi]}`;
      if(done)cls+=oi===item.ans?' revealed':' dim';
      return `<button class="${cls}" data-l="${letters[oi]}" onclick="answerPic(${idx},${oi})" ${done?'disabled':''}>${o}</button>`;
    }).join('');
    return `<div class="pic-card${done?(isOk?' ok':' err'):''}" id="pc${idx}">
      <span class="pic-num">${idx+1}</span>
      <div class="pic-q">
        <span style="font-size:.7rem;font-weight:900;border-radius:999px;padding:2px 9px;background:${taskBg};color:${taskColor}">${isSyn?'≈ SINÓNIMO':'↔ ANTÓNIMO'}</span><br>
        ${item.task}
        <span class="pic-task">Palabra clave: <strong style="color:${taskColor}">${item.word}</strong></span>
      </div>
      <div class="pic-img">${PIC_IMAGES[item.word]?`<img src="${PIC_IMAGES[item.word]}" alt="${item.word}">`:(CUTE_PICS[item.word]||item.svg)}</div>
      <div class="pic-btns">${btns}</div>
      <div class="pic-exp${done?' show':''}">${done?(isOk?'✓ ':'✗ ')+item.exp:''}</div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">🖼️ Picture cards</div>
  <div class="ex-instr">Look at the illustration and word, then choose the correct <em style="color:var(--syn2)">≈ sinónimo</em> or <em style="color:var(--ant2)">↔ antónimo</em> as indicated by the task tag.</div>
  <div class="score-bar">
    <div class="sc"><span class="l">Cards</span><span class="v">${total}</span></div>
    <div class="sc"><span class="l">OK</span><span class="v g" id="pOk">${ok}</span></div>
    <div class="sc"><span class="l">Miss</span><span class="v b" id="pErr">${ans-ok}</span></div>
    <div class="prog-w"><div class="prog-l">Answered: ${pct}%</div><div class="prog-t"><div class="prog-f" id="pPg" style="width:${pct}%"></div></div></div>
  </div>
  <div class="pic-grid">${cards}</div>
  <div class="actions"><button class="btn btn-ghost" onclick="picAnswers={};renderPicCards()">↺ Reset</button></div></div>`;
}
function answerPic(idx,oi){
  if(picAnswers[idx]!==undefined)return;
  const item=PIC_ITEMS[idx];const isOk=oi===item.ans;
  picAnswers[idx]=isOk;
  const card=document.getElementById('pc'+idx);
  if(card){
    card.classList.add(isOk?'ok':'err');
    card.querySelectorAll('.pic-btn').forEach((b,bi)=>{
      b.disabled=true;b.classList.remove('revealed','dim');
      b.classList.add(bi===item.ans?'revealed':'dim');
    });
    const e=card.querySelector('.pic-exp');
    if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ ':'✗ ')+item.exp;}
  }
  const ok=Object.values(picAnswers).filter(v=>v).length;
  const a=Object.keys(picAnswers).length;
  const pct=Math.round(a/PIC_ITEMS.length*100);
  const e1=document.getElementById('pOk');if(e1)e1.textContent=ok;
  const e2=document.getElementById('pErr');if(e2)e2.textContent=a-ok;
  const pg=document.getElementById('pPg');if(pg)pg.style.width=pct+'%';
}

}

function judgeEh(idx,saysErr){
  if(ehAnswered[idx]!==undefined)return;
  const [s,hasErr,fix,exp]=ERRORS[idx];
  const correct=saysErr===hasErr;
  ehAnswered[idx]=correct;
  const item=document.getElementById('ehi'+idx);
  item.classList.add('revealed',correct?'eh-ok':'eh-bad');
  item.querySelectorAll('.eh-btn').forEach(b=>b.disabled=true);
  const chosen=item.querySelector(saysErr?'.eh-no':'.eh-yes');
  if(chosen)chosen.classList.add(correct?'cho-ok':'cho-err');
  if(hasErr&&fix){const se=document.getElementById('ehs'+idx);se.innerHTML=s+` <span class="eh-fix">→ <strong>${fix}</strong></span>`;}
  document.getElementById('ehe'+idx).classList.add('show');
  const total=Object.keys(ehAnswered).length;
  const ok=Object.values(ehAnswered).filter(v=>v).length;
  document.getElementById('eh_ok').textContent=ok;document.getElementById('eh_err').textContent=total-ok;
  document.getElementById('eh_pct').textContent=Math.round(total/ERRORS.length*100)+'%';
  document.getElementById('eh_pg').style.width=Math.round(total/ERRORS.length*100)+'%';
  if(total===ERRORS.length){
    const pct=Math.round(ok/ERRORS.length*100);
    const fb=document.getElementById('eh_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'🏆':'📖'} <strong>${ok}/${ERRORS.length}.</strong> ${pct>=80?'Excellent!':'Review the word cards for the pairs you missed.'}`;
  }
}

  spAnswered=true;if(spTimer){clearInterval(spTimer);spTimer=null;}inp.disabled=true;
  const item=SPEED[spIdx];const nt=normS(inp.value);const na=normS(item.a);
  const isOk=nt===na||item.also.map(normS).includes(nt);
  if(isOk){spOk++;spStreak++;}else{spErr++;spStreak=0;}
  const fb=document.getElementById('sFb');
  if(fb){fb.style.opacity='1';
    if(!inp.value.trim()){fb.className='sp-fb err';fb.innerHTML=`⏱ Time's up! → <strong>${item.hint}</strong>`;}
    else if(isOk){fb.className='sp-fb ok';fb.innerHTML=`✓ <strong>Correct!</strong>${spStreak>=3?' 🔥 x'+spStreak:''}`;}
    else{fb.className='sp-fb err';fb.innerHTML=`✗ <strong>${inp.value}</strong> → <strong>${item.hint}</strong>`;}}
  if(spStreak>=3){const cf=document.getElementById('cf');cf.textContent='🔥 x'+spStreak;cf.classList.remove('pop');void cf.offsetWidth;cf.classList.add('pop');}
  spIdx++;setTimeout(nextQ,isOk?700:1400);
}
function endSpeed(){
  const pct=Math.round(spOk/SPEED.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  document.getElementById('spWrap').innerHTML=`<div class="sp-start"><div style="font-size:3rem">${emo}</div><h2>${spOk}/${SPEED.length}</h2><p style="color:var(--muted)">${pct>=90?'Excellent!':pct>=70?'Great job!':pct>=50?'Keep going!':'Study the word cards.'}</p><button class="btn btn-cyan" onclick="startSpeed()">↺ Try again</button></div>`;
}

/* ══════════════════════════════════
   EX 5 — REFERENCE (grouped by category)
══════════════════════════════════ */
function renderReference(){
  const rows=WORDS.map(w=>{
    const cat=CATS_META[w.cat];
    return `<tr>
      <td><span style="font-size:.65rem;font-weight:800;border-radius:5px;padding:2px 6px;background:${cat.bg};color:${cat.col}">${cat.icon}</span></td>
      <td class="td-word">${w.word}</td>
      <td class="td-en">${w.en}</td>
      <td class="td-syn">${w.syn.slice(0,3).join(', ')}</td>
      <td class="td-ant">${w.ant.slice(0,3).join(', ')}</td>
    </tr>`;
  }).join('');

  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📄 Reference — Sinónimos &amp; Antónimos</div>
  <div class="ex-instr"><em style="color:var(--syn2)">Verde = sinónimos</em> (same meaning) · <em style="color:var(--ant2)">Rojo = antónimos</em> (opposite meaning)</div>
  <div class="ref-alert" style="margin-bottom:14px">
    <strong>💡 Key concepts:</strong><br>
    • <strong>Sinónimo</strong> = same or similar meaning. "Triste" = "melancólico" = "afligido"<br>
    • <strong>Antónimo</strong> = opposite meaning. "Triste" ↔ "feliz"<br>
    • Synonyms can differ in <strong>intensity</strong> (enojado &lt; furioso &lt; iracundo) and <strong>register</strong> (hablar / platicar MX / conversar formal)<br>
    • In MX Spanish: chido ≈ padre ≈ genial · gacho = bad/unpleasant · codo = tacaño
  </div>
  <table class="ref-table">
    <tr><th></th><th>Palabra</th><th>English</th><th style="color:var(--syn2)">≈ Sinónimos</th><th style="color:var(--ant2)">↔ Antónimos</th></tr>
    ${rows}
  </table>
  </div>`;
}

goEx(0);
</script>
