<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slang Mexicano Actual | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --bas:#34d399;--bas2:#6ee7b7;
  --gen:#f472b6;--gen2:#ff91cd;
  --trab:#fbbf24;--trab2:#fde68a;
  --emo:#60a5fa;--emo2:#93c5fd;
  --fies:#a78bfa;--fies2:#c4b5fd;
  --fuel:#f87171;--fuel2:#fca5a5;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 10% 8%,rgba(52,211,153,.12),transparent 30%),radial-gradient(ellipse at 90% 10%,rgba(248,113,113,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1040px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--bas),#fff 40%,var(--fuel));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:5px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:8px 11px;font-weight:800;font-family:var(--font);font-size:.73rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.15rem;line-height:1}
.etab-label{font-size:.6rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:90px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;transition:width .35s;background:linear-gradient(90deg,var(--bas),var(--fuel))}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#00bfff);color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ── FLASHCARDS ── */
.flash-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ff-btn{border:0;border-radius:9px;padding:5px 12px;font-size:.73rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);color:var(--muted);border:1.5px solid transparent}
.ff-btn.active{color:white}
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.flash-prow{display:flex;align-items:center;gap:12px;width:100%;max-width:680px}
.flash-cnt{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.flash-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.flash-fil{height:100%;border-radius:999px;transition:width .4s}
.flash-card{width:100%;max-width:680px;min-height:260px;perspective:1000px;cursor:pointer}
.flash-inner{position:relative;width:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;inset:0;border-radius:20px;padding:24px 26px;backface-visibility:hidden;display:flex;flex-direction:column;gap:9px;min-height:260px}
.flash-back{transform:rotateY(180deg)}
.flash-word{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1.1}
.flash-lit{font-size:.8rem;color:var(--muted2);font-style:italic}
.flash-lvl{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:900;border-radius:999px;padding:3px 10px;margin-top:2px}
.flash-reg{font-size:.7rem;color:var(--muted2)}
.flash-eq{font-size:1.05rem;font-weight:700;line-height:1.4}
.flash-ex{font-size:.88rem;line-height:1.65;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:10px}
.flash-note{font-size:.76rem;color:var(--muted2);line-height:1.5;padding:7px 12px;background:rgba(255,255,255,.04);border-radius:8px}
.flash-hint{font-size:.72rem;color:var(--muted2);text-align:center;font-style:italic;margin-top:auto}
.flash-nav{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:680px}

/* ── MC ── */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.65;flex:1}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px;margin-top:10px}
.mc-opt{border:0;border-radius:10px;padding:8px 15px;font-weight:700;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px);border-color:rgba(37,217,255,.35)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.79rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:7px 12px 7px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}

/* ── VERDADERO/FALSO ── */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.eh-ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.eh-bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}.eh-sent{font-size:.97rem;line-height:1.6}
.eh-fix{font-size:.82rem;font-weight:700;color:var(--good);margin-left:6px}
.eh-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-btn{border:0;border-radius:9px;padding:7px 14px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-yes:hover:not([disabled]){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-no:hover:not([disabled]){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-btn[disabled]{cursor:default;opacity:.5}
.cho-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.cho-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* ── SORT ── */
.sort-pile{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;min-height:52px;margin-bottom:12px}
.sort-bucket{border-radius:14px;padding:12px;min-height:80px;display:flex;flex-direction:column;gap:6px;transition:.2s}
.sort-bucket.drag-over{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.bucket-title{font-family:var(--display);font-size:.76rem;font-weight:900;text-align:center}
.bucket-sub{font-size:.62rem;color:var(--muted2);text-align:center;line-height:1.35}
.sort-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:grab;user-select:none;transition:.15s}
.sort-card:hover{transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sort-card.ghost{opacity:.35}
.sort-card.c-ok{background:rgba(34,197,94,.14);border-color:var(--good);color:#86efac;cursor:default}
.sort-card.c-err{background:rgba(239,68,68,.1);border-color:var(--bad);color:#fca5a5;font-size:.78rem}

/* ── SPEED ── */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;text-align:center;width:100%;max-width:540px}
.sp-q{font-size:1rem;line-height:1.7;margin-bottom:4px}
.sp-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:540px}
.sp-inp{flex:1;max-width:280px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--font);font-size:1rem;font-weight:700;color:var(--text);outline:none;transition:.15s}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-inp::placeholder{color:var(--muted2);font-weight:400}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:540px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:540px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;transition:width 1s linear;background:linear-gradient(90deg,var(--bas),var(--fuel))}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* ── REFERENCE ── */
.ref-section{margin-bottom:18px}
.ref-h3{font-family:var(--display);font-size:.92rem;font-weight:800;padding:6px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.ref-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:10px}
.ref-table th{padding:6px 12px;font-size:.58rem;font-weight:800;text-transform:uppercase;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.ref-table td{padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5;vertical-align:top}
.ref-table tr:last-child td{border-bottom:none}
.ref-table tr:hover td{background:rgba(255,255,255,.02)}
.ref-tip{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:10px 14px;font-size:.83rem;color:#bbf7d0;line-height:1.6;margin-bottom:12px}
.ref-alert{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:12px;padding:10px 14px;font-size:.83rem;color:#fecaca;line-height:1.6;margin-bottom:12px}
.lvl-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.panel{padding:14px 12px}}

/* ── AUDIO BUTTON ── */
.btn-audio{background:rgba(37,217,255,.13);border:1.5px solid rgba(37,217,255,.3);color:var(--cyan);border-radius:8px;padding:5px 11px;font-size:.76rem;font-weight:800;cursor:pointer;transition:.13s;font-family:var(--font);display:inline-flex;align-items:center;gap:5px}
.btn-audio:hover{background:rgba(37,217,255,.24);border-color:var(--cyan)}
.btn-audio.playing{background:rgba(37,217,255,.28);border-color:var(--cyan);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.btn-audio.bad{background:rgba(239,68,68,.12);border-color:var(--bad);color:var(--bad)}

/* ── VOICE SELECTOR ── */
.voice-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(37,217,255,.06);border:1px solid rgba(37,217,255,.15);border-radius:10px;margin-bottom:14px;flex-wrap:wrap}
.voice-bar label{font-size:.74rem;font-weight:800;color:var(--muted2)}
.voice-select{background:rgba(255,255,255,.07);border:1px solid rgba(37,217,255,.25);color:var(--text);border-radius:8px;padding:5px 10px;font-size:.77rem;font-family:var(--font);cursor:pointer;max-width:260px}
.voice-status{font-size:.7rem;color:var(--muted2);font-style:italic}

/* ── CHAT CONVERSATIONS ── */
.conv-list{display:flex;flex-direction:column;gap:16px}
.conv-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden}
.conv-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.conv-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.conv-header{padding:10px 16px;background:rgba(0,0,0,.2);font-size:.76rem;color:var(--muted2);font-style:italic;display:flex;align-items:center;gap:8px}
.conv-header strong{color:var(--text);font-style:normal}
.conv-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row.right{flex-direction:row-reverse}
.chat-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;background:rgba(255,255,255,.08)}
.chat-bub{max-width:78%;padding:9px 13px;border-radius:16px;font-size:.9rem;line-height:1.55;position:relative}
.chat-row.left .chat-bub{background:rgba(255,255,255,.09);border-radius:4px 16px 16px 16px}
.chat-row.right .chat-bub{background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.22);border-radius:16px 4px 16px 16px}
.chat-who{font-size:.6rem;font-weight:900;text-transform:uppercase;color:var(--muted2);margin-bottom:3px}
.chat-audio-btn{background:none;border:0;cursor:pointer;font-size:.9rem;padding:2px 4px;border-radius:5px;opacity:.55;transition:.13s;vertical-align:middle}
.chat-audio-btn:hover{opacity:1;background:rgba(255,255,255,.1)}
.slang-tag{display:inline-block;background:rgba(37,217,255,.14);border:1px solid rgba(37,217,255,.3);color:var(--cyan);border-radius:5px;padding:1px 6px;font-size:.7rem;font-weight:800;margin:0 2px;cursor:help}
.conv-q{padding:14px 16px;background:rgba(0,0,0,.15);border-top:1px solid rgba(255,255,255,.06);font-size:.88rem;font-weight:700;color:var(--muted)}
.conv-opts{display:flex;flex-direction:column;gap:7px;padding:10px 16px 14px}
.conv-opt{border:0;border-radius:10px;padding:10px 15px;font-weight:600;font-family:var(--font);font-size:.9rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text);text-align:left}
.conv-opt:hover:not([disabled]){transform:translateX(4px);border-color:rgba(37,217,255,.35);background:rgba(37,217,255,.07)}
.conv-opt[disabled]{cursor:default;transform:none}
.conv-opt.co-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.conv-opt.co-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.conv-opt.co-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.conv-exp{display:none;font-size:.8rem;color:var(--muted);line-height:1.58;padding:8px 16px 14px;background:rgba(255,255,255,.03)}
.conv-exp.show{display:block}
.conv-exp .slang-tag{font-size:.72rem}

/* ── SEARCHABLE REFERENCE ── */
.ref-search{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.25);color:var(--text);border-radius:11px;padding:10px 16px;font-family:var(--font);font-size:.95rem;outline:none;transition:.15s;margin-bottom:14px}
.ref-search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.ref-search::placeholder{color:var(--muted2)}
.ref-count{font-size:.75rem;color:var(--muted2);font-weight:700;margin-bottom:10px}
.ref-row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;border-bottom:1px solid rgba(255,255,255,.04);transition:.13s}
.ref-row:hover{background:rgba(255,255,255,.03)}
.ref-row:last-child{border-bottom:none}
.rr-es{font-family:var(--display);font-weight:900;font-size:.98rem;min-width:140px;cursor:pointer}
.rr-es:hover{text-decoration:underline}
.rr-lit{font-size:.74rem;color:var(--muted2);font-style:italic;min-width:110px}

.rr-meta{display:flex;flex-direction:column;gap:3px;align-items:flex-end;min-width:80px}

<script>
function seededShuffle(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function normS(s){return(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}

  bas:{label:'Lo básico',      icon:'✅', col:'var(--bas)',  bg:'rgba(52,211,153,.1)', bd:'rgba(52,211,153,.28)'},
  gen:{label:'Gente',          icon:'🤙', col:'var(--gen)',  bg:'rgba(244,114,182,.1)',bd:'rgba(244,114,182,.28)'},

  fies:{label:'Diversión',     icon:'🎉', col:'var(--fies)', bg:'rgba(167,139,250,.1)',bd:'rgba(167,139,250,.28)'},

};

/* lvl colors */
const LVL_COL={1:'#22c55e',2:'#84cc16',3:'#f59e0b',4:'#ef4444',5:'#9f1239'};
const LVL_LABEL={1:'🟢 Nivel 1 – suave',2:'🟡 Nivel 2 – informal',3:'🟠 Nivel 3 – muy informal',4:'🔴 Nivel 4 – fuerte',5:'💀 Nivel 5 – vulgar'};

/* ══════════════════════════════════
   SLANG DATA — 90 entries
   Fields: cat, es, lit (literal), eq (equivalente), lvl, reg, ex, note
══════════════════════════════════ */
const SLANG=[
  /* ── LO BÁSICO (15) ── */
  {cat:'bas',es:'qué onda',lit:'"what wave?"',eq:'What\'s up? / What\'s going on?',lvl:2,reg:'Todo México',
   ex:'— ¿Qué onda? ¿Sí vas a la fiesta?\n— Sí, jalo.',note:'One of the most essential Mexican expressions. Works as a greeting AND a question meaning "what\'s happening?"'},
  {cat:'bas',es:'órale',lit:'"now-le" (origin unclear)',eq:'Okay / Wow / Come on / Hurry up',lvl:2,reg:'Todo México',
   ex:'— ¿Vamos por tacos? — ¡Órale!\n— Órale pues, nos vemos a las 8.',note:'Context-dependent: agreement ("órale" = okay), amazement ("¡Órale!" = wow!), encouragement ("órale, ya vámonos" = come on, let\'s go).'},
  {cat:'bas',es:'sale / va / va que va',lit:'"it goes out"',eq:'Okay / Sounds good / Deal',lvl:1,reg:'Todo México',
   ex:'— ¿Nos vemos a las 6? — Sale.\n— ¿Me ayudas? — Va que va.',note:'"Sale" is the most versatile. "Va" is also common. "Va que va" adds enthusiasm — it\'s a done deal.'},
  {cat:'bas',es:'neta / la neta',lit:'"the clear/true one"',eq:'The truth / Honestly / For real',lvl:2,reg:'Todo México',
   ex:'— La neta, sí estuvo difícil el examen.\n— ¿Neta que no sabías?',note:'"La neta" = the honest truth. "¿Neta?" alone = really? for real? Similar to English "for real."'},
  {cat:'bas',es:'padre',lit:'"father"',eq:'Cool / Nice / Great',lvl:1,reg:'Todo México',
   ex:'— Está padre tu idea.\n— ¡Qué padre lugar!',note:'Very safe to use — completely inoffensive. Can be combined: "muy padre" (very cool), "qué padre" (how cool). Level 1: even kids and grandparents use it.'},
  {cat:'bas',es:'chido / chida',lit:'cool/nice (no literal meaning)',eq:'Cool / Awesome / Great',lvl:2,reg:'Todo México, esp. CDMX',
   ex:'— Tu clase estuvo muy chida.\n— ¡Qué chido lugar!',note:'"Chido" (masc.), "chida" (fem.). More casual than "padre". Sounds very natural in Mexico City.'},
  {cat:'bas',es:'no manches',lit:'"don\'t stain"',eq:'No way! / Seriously? / Come on!',lvl:2,reg:'Todo México',
   ex:'— ¡No manches! ¿En serio costó 500 pesos?\n— No manches, ya se me hizo tarde.',note:'The safe, all-contexts version of "no mames." Great for expressing surprise or mild frustration. Works in any company.'},
  {cat:'bas',es:'aguas',lit:'"waters!"',eq:'Watch out! / Careful! / Heads up!',lvl:2,reg:'Todo México',
   ex:'— ¡Aguas con el escalón!\n— ¡Aguas, viene un carro!',note:'Shout this as a warning. Mexican origin — used since the colonial era when people would throw water out of windows. Ubiquitous and useful.'},
  {cat:'bas',es:'simón / nel',lit:'corruptions of "sí" and "no"',eq:'Yep / Nope',lvl:2,reg:'Todo México',
   ex:'— ¿Vas a ir? — Simón, jalo.\n— ¿Ya comiste? — Nel, todavía no.',note:'"Simón" = yes (casual). "Nel" = no (casual). "Nel pastel" is the rhyming version of "nel" = definitely not.'},
  {cat:'bas',es:'de volada',lit:'"of a flight"',eq:'Right away / Quickly / In a flash',lvl:2,reg:'Todo México',
   ex:'— ¿Puedes mandarme el archivo? — Sí, de volada.\n— Lo hice de volada.',note:'Implies speed and immediacy. "Te llamo de volada" = I\'ll call you right away.'},
  {cat:'bas',es:'al cien / al tiro',lit:'"at one hundred" / "at the shot"',eq:'All good / Perfect / Pay attention',lvl:2,reg:'Todo México',
   ex:'— ¿Todo bien? — Al cien, gracias.\n— Ponte al tiro con la tarea.',note:'"Al cien" = everything is 100% good. "Al tiro" = pay attention / be ready. Similar vibe but different use.'},
  {cat:'bas',es:'me late',lit:'"it beats to me"',eq:'I like it / Sounds good / I\'m feeling it',lvl:2,reg:'Todo México',
   ex:'— ¿Vamos al cine? — Me late.\n— No me late mucho la idea.',note:'From the heartbeat: "me late" = it resonates with me / I like it. "No me late" = I\'m not feeling it.'},
  {cat:'bas',es:'cotorrear / cotorreo',lit:'(from cotorra = parrot)',eq:'To hang out / To chat / To chill',lvl:2,reg:'Todo México',
   ex:'— ¿Qué hacen? — Nada, nomás cotorreando.\n— Fue un cotorreo muy padre.',note:'Light, fun socializing. "Cotorrear" = hanging out/chatting casually. "Cotorreo" = the chill hangout session.'},
  {cat:'bas',es:'mande',lit:'"command me"',eq:'Pardon? / Yes? / At your service',lvl:1,reg:'Todo México, esp. centro/sur',
   ex:'— Luis. — ¿Mande?\n— ¿Mande? No te escuché bien.',note:'Deeply Mexican expression. Said when you didn\'t hear something or when someone calls your name. Much more common than "¿qué?" to respond. Shows respect.'},
  {cat:'bas',es:'arre',lit:'"giddy up"',eq:'Let\'s go / Okay / Bet',lvl:2,reg:'Norte/noroeste, esp. Sinaloa',
   ex:'— ¿Vamos? — Arre.\n— ¡Arre, nos vemos!',note:'Common in the north, increasingly used by youth nationwide. Similar vibe to "órale" — agreement and enthusiasm.'},
  /* ── GENTE (15) ── */
  {cat:'gen',es:'güey / wey',lit:'"ox" (buey → güey)',eq:'Dude / Bro / Man',lvl:3,reg:'Todo México, esp. CDMX',
   ex:'— ¿Qué onda, güey? ¿Cómo estás?\n— No manches, güey, ¿en serio?',note:'Possibly the most-used Mexican slang word. Between friends = affectionate. Beware: tone matters — with strangers it can be offensive. "Wey" is common spelling in texts.'},
  {cat:'gen',es:'carnal',lit:'"flesh-related" (of the same flesh)',eq:'Bro / Close friend / Brother',lvl:3,reg:'Todo México',
   ex:'— Ese es mi carnal de toda la vida.\n— ¿Qué onda, carnal?',note:'Implies a very close, brother-like friendship. Stronger bond than "cuate" or "compa." Widely used across Mexico.'},
  {cat:'gen',es:'cuate',lit:'"twin" (from Nahuatl)',eq:'Friend / Buddy',lvl:2,reg:'Todo México',
   ex:'— Voy con unos cuates.\n— Es un cuate del trabajo.',note:'From Nahuatl "coatl" (twin). Softer than "güey." Friendly and safe to use in most casual contexts.'},
  {cat:'gen',es:'compa',lit:'"companion/compadre"',eq:'Buddy / Pal / Bro',lvl:2,reg:'Norte, occidente, todo México',
   ex:'— Gracias, compa.\n— ¿Qué onda, compa?',note:'Short for "compañero" or "compadre." More common in the north and west but widely understood everywhere.'},
  {cat:'gen',es:'banda',lit:'"band/group"',eq:'The crew / Friends / People',lvl:2,reg:'Todo México, muy usado en redes',
   ex:'— ¿Qué dice la banda?\n— La banda ya está en el antro.',note:'Collective: refers to a group of friends or people in general. "¿Qué dice la banda?" = what\'s everyone saying? Very social media-friendly.'},
  {cat:'gen',es:'morro / morra',lit:'"snout/face"',eq:'Kid / Young guy / Young girl',lvl:3,reg:'Norte/noroeste, entendido en todo México',
   ex:'— Ese morro es mi vecino.\n— ¿Quién es esa morra?',note:'"Morro" = young guy/kid. "Morra" = young girl. Common in the north. In CDMX, "chamaco/a" is more common for the same concept.'},
  {cat:'gen',es:'vato / bato',lit:'"—"',eq:'Guy / Dude',lvl:3,reg:'Norte/noroeste, frontera',
   ex:'— Ese vato trabaja conmigo.\n— ¿Quién es ese bato?',note:'"Vato" is more center/north. "Bato" skews more noroeste/frontera. Both = guy/dude. Less common in CDMX where "güey" or "tipo" are preferred.'},
  {cat:'gen',es:'morrita',lit:'"little snout"',eq:'Girl / Young woman',lvl:3,reg:'Norte/noroeste',
   ex:'— La morrita de la tienda fue muy amable.\n— Esa morrita estudia conmigo.',note:'Diminutive of "morra." Can be neutral but can also sound very informal. Context and tone matter.'},
  {cat:'gen',es:'plebe / plebes',lit:'"common people"',eq:'Kids / Young people / The crew',lvl:3,reg:'Sinaloa, Sonora, noroeste',
   ex:'— Los plebes van a jugar fútbol.\n— ¿Qué onda, plebes?',note:'Strongly associated with Sinaloa and the northwest. Widely understood across Mexico now thanks to music/culture.'},
  {cat:'gen',es:'fresa',lit:'"strawberry"',eq:'Preppy / Posh / Snobby',lvl:2,reg:'Todo México, urbano',
   ex:'— Ese lugar está muy fresa.\n— Actúa bien fresa a veces.',note:'Describes someone or something upper-class/preppy/snobby. Not necessarily an insult — context-dependent. Very common in Mexico City.'},
  {cat:'gen',es:'naco / naca',lit:'"—" (pejorative)',eq:'Tacky / Low-class / Vulgar',lvl:4,reg:'Todo México',
   ex:'— No digas eso, suena naco.\n— Ese outfit está bien naco.',note:'Can be offensive and classist. Use with caution. Describes behavior, appearance, or attitude as low-class or tacky. Often used casually but has problematic origins.'},
  {cat:'gen',es:'godín',lit:'(from surname Godínez)',eq:'Office worker / Corporate employee',lvl:2,reg:'Todo México, urbano',
   ex:'— Horario godín: de 9 a 6.\n— Ya me siento muy godín.',note:'Refers humorously to the stereotypical office drone. "Horario godín" = the classic 9-to-6 schedule. Self-deprecating humor about corporate life.'},
  {cat:'gen',es:'chilango / chilanga',lit:'"of chile-ish people?" (disputed origin)',eq:'Person from Mexico City',lvl:2,reg:'Todo México',
   ex:'— Es chilango, vive en la CDMX.\n— Los chilangos siempre llegan tarde.',note:'Refers to people from Mexico City. Can be affectionate or mildly pejorative depending on who says it. CDMXers often use it self-referentially with pride.'},
  {cat:'gen',es:'apapachar',lit:'(from Nahuatl "papachoa" = squeeze)',eq:'To cuddle / To pamper / To comfort',lvl:1,reg:'Todo México',
   ex:'— Necesito que me apapachen hoy.\n— ¡Apapacha a tu abuela!',note:'Beautiful Nahuatl-origin word meaning to embrace with love, to comfort. No direct English equivalent — "apapachar" is its own feeling.'},
  {cat:'gen',es:'la vibra',lit:'"the vibe"',eq:'The vibe / The energy',lvl:2,reg:'Urbano, jóvenes',
   ex:'— Ese lugar tiene buena vibra.\n— No me gusta la vibra de esa persona.',note:'Direct adoption of "vibe." "Buena vibra" = good vibes. "Mala vibra" = bad vibes. Very common in youth and social media contexts.'},
  /* ── TRABAJO Y LANA (12) ── */
  {cat:'trab',es:'chamba',lit:'"work/job" (various origins proposed)',eq:'Work / Job',lvl:2,reg:'Todo México',
   ex:'— Tengo mucha chamba hoy.\n— ¿Ya encontraste chamba?',note:'One of the most natural ways to say "work" or "job" in casual Mexican Spanish. Very widely used.'},
  {cat:'trab',es:'chambear',lit:'"to work"',eq:'To work',lvl:2,reg:'Todo México',
   ex:'— No puedo, tengo que chambear.\n— ¿Dónde chambeas?',note:'The verb form of "chamba." Completely normal to use in casual conversation about work.'},
  {cat:'trab',es:'lana',lit:'"wool"',eq:'Money / Cash',lvl:2,reg:'Todo México',
   ex:'— No traigo lana.\n— ¿Tienes lana para el taxi?',note:'Very common slang for money. "Sin lana" = broke. The association with wool (lana) may relate to old silver coins.'},
  {cat:'trab',es:'feria',lit:'"fair/festival"',eq:'Money / Change / Cash',lvl:2,reg:'Norte, occidente, centro',
   ex:'— ¿Traes feria para el camión?\n— Sí, pero poca feria.',note:'More common in the north and west for money, especially small amounts/change. "¿Traes feria?" = do you have (any) cash?'},
  {cat:'trab',es:'varos',lit:'"—"',eq:'Bucks / Pesos',lvl:3,reg:'Todo México, juvenil',
   ex:'— Me costó 200 varos.\n— ¿Cuántos varos tienes?',note:'Juvenile/street slang for pesos. "200 varos" = 200 pesos. More casual than "lana."'},
  {cat:'trab',es:'codo / coda',lit:'"elbow"',eq:'Stingy / Cheap / Tight with money',lvl:2,reg:'Todo México',
   ex:'— ¡No seas codo! Invita las chelas.\n— Es muy coda, nunca paga.',note:'Calling someone "codo" = they\'re tight with money, never pay for things. The image is of someone guarding their wallet with their elbow.'},
  {cat:'trab',es:'dar el rol',lit:'"give the roll"',eq:'To give someone a ride',lvl:2,reg:'Todo México',
   ex:'— ¿Me das el rol a la tienda?\n— ¿Alguien me da el rol al trabajo?',note:'Asking for a lift/ride. "¿Me das el rol?" = can you give me a ride? Common and useful in daily life.'},
  {cat:'trab',es:'echar paro / hacer el paro',lit:'"throw a stop" / "do the favor"',eq:'To help out / To do a favor',lvl:3,reg:'Todo México',
   ex:'— Échame el paro con esta tarea.\n— Hazme el paro, bróder.',note:'"Echar paro" and "hacer el paro" = help someone out. Very common request between friends. "Paro" alone = favor.'},
  {cat:'trab',es:'trucha',lit:'"trout (fish)"',eq:'Sharp / Alert / Watch out / Clever',lvl:2,reg:'Todo México',
   ex:'— Esa persona es bien trucha para los negocios.\n— ¡Ponte trucha!',note:'"Trucha" = street-smart, sharp, clever. "Ser trucha" = to be sharp. "¡Ponte trucha!" = pay attention / be careful / be sharp.'},
  {cat:'trab',es:'fifí',lit:'"—"',eq:'Fancy / Bougie / Elitist',lvl:2,reg:'Todo México, urbano',
   ex:'— Ese café está bien fifí.\n— Vive en una zona muy fifí.',note:'Describes something or someone overly fancy or elite. Popularized in political contexts but widely used in daily life too.'},
  {cat:'trab',es:'en chinga',lit:'"in the fuck"',eq:'Really fast / In a rush / Quickly',lvl:4,reg:'Todo México',
   ex:'— Necesito esto en chinga.\n— Salimos en chinga porque se hizo tarde.',note:'Vulgar but extremely common meaning to do something very fast or urgently. "En chinga" can also mean "a lot of work." Level 4 — strong language but practical.'},
  {cat:'trab',es:'jalar',lit:'"to pull"',eq:'To work (informally) / To pitch in / I\'m in',lvl:2,reg:'Todo México',
   ex:'— Yo jalo contigo en el proyecto.\n— ¿Jalamos al cine? — Jalo.',note:'"Jalar" has multiple uses: to work together, to be in (for a plan), or in the north to go somewhere. Very versatile.'},
  /* ── EMOCIONES Y ACTITUDES (15) ── */
  {cat:'emo',es:'chale',lit:'"—"',eq:'Damn / That sucks / Ugh / Really?',lvl:2,reg:'Centro/CDMX, entendido en todo México',
   ex:'— Chale, se me olvidó la tarea.\n— ¡Chale! ¿Ya no hay boletos?',note:'Expression of mild disappointment, frustration or disbelief. Typical CDMX expression. "¡Chale!" alone conveys the feeling.'},
  {cat:'emo',es:'sacar de onda',lit:'"take out of the wave"',eq:'To throw off / To weird out / To confuse',lvl:2,reg:'Todo México',
   ex:'— Me sacó de onda su mensaje.\n— ¿Te sacó de onda lo que dijo?',note:'"Sacar de onda" = to throw someone off, confuse or disturb them. "Me sacó de onda" = it threw me off / weirded me out.'},
  {cat:'emo',es:'agüitado / agüitada',lit:'"watered down"',eq:'Sad / Down / Bummed out',lvl:2,reg:'Norte/noroeste, entendido en centro',
   ex:'— Está agüitado por el examen.\n— ¿Por qué estás tan agüitada?',note:'Feeling down, sad, deflated. More common in the north but understood everywhere. Like "bummed out" in English.'},
  {cat:'emo',es:'hueva',lit:'"roe/eggs" (vulgar anatomy ref.)',eq:'Laziness / Drag / Too much effort',lvl:3,reg:'Todo México',
   ex:'— Me da hueva hacer eso.\n— ¡Qué hueva ir tan lejos!',note:'"Me da hueva" = I can\'t be bothered / I\'m too lazy. "Qué hueva" = what a drag. Anatomically vulgar origin but used casually by most people.'},
  {cat:'emo',es:'gacho / gacha',lit:'"crooked/ugly"',eq:'Mean / Ugly / Messed up / Bad',lvl:3,reg:'Todo México',
   ex:'— Se portó bien gacho contigo.\n— Qué gacha situación.',note:'Describes something bad, ugly (behavior), or mean. "Qué gacho" = that\'s messed up. "Ser gacho" = to be mean/unkind.'},
  {cat:'emo',es:'qué oso',lit:'"what a bear"',eq:'How embarrassing / So cringe / Awkward',lvl:2,reg:'Todo México, urbano',
   ex:'— Qué oso, me equivoqué de chat.\n— ¡Qué oso! Me vieron bailar solo.',note:'Expressing secondhand or firsthand embarrassment. "¡Qué oso!" alone says it all. The "bear" image = being as obvious and clumsy as a bear.'},
  {cat:'emo',es:'me dio cringe',lit:'"it gave me cringe"',eq:'It made me cringe / So embarrassing',lvl:2,reg:'Jóvenes, urbano',
   ex:'— Me dio cringe su video.\n— Eso es muy cringe.',note:'Direct English import used naturally in Mexican youth speech. Both "cringe" (noun) and "cringeoso/a" (adj.) are used: "qué cringeoso."'},
  {cat:'emo',es:'pasarse de lanza',lit:'"to go beyond the spear"',eq:'To go too far / To cross a line',lvl:3,reg:'Todo México',
   ex:'— Te pasaste de lanza con ese comentario.\n— Se pasó de lanza con el precio.',note:'"Pasarse de lanza" = overstepping. "Pasarse" alone also works. The "lanza" (spear) = the line you shouldn\'t cross.'},
  {cat:'emo',es:'equis / X',lit:'"X"',eq:'Meh / Whatever / Not special',lvl:2,reg:'Urbano, jóvenes',
   ex:'— ¿Cómo estuvo la peli? — Estuvo equis.\n— Me cae equis esa persona.',note:'"Estar equis" = to be meh/mediocre. "Me cae equis" = I neither like nor dislike someone. From the letter X as a placeholder.'},
  {cat:'emo',es:'al alba / estar al alba',lit:'"at the dawn"',eq:'To be alert / Heads up',lvl:3,reg:'Todo México',
   ex:'— Estate al alba con esa persona.\n— ¡Al alba! Viene el jefe.',note:'To be watchful or alert. "Estate al alba" = be on your guard. "Al alba" as an exclamation = heads up!'},
  {cat:'emo',es:'hacerse pato',lit:'"to make oneself duck"',eq:'To play dumb / To avoid / To ghost',lvl:3,reg:'Todo México',
   ex:'— Se hizo pato con el trabajo.\n— No te hagas pato, ya sé que sabes.',note:'To pretend you don\'t know or aren\'t involved. Like "playing possum" in English but with a duck. Common in all contexts.'},
  {cat:'emo',es:'traer el rollo',lit:'"to bring the scroll/story"',eq:'To have the moves / To be charming',lvl:2,reg:'Todo México',
   ex:'— Ese güey sí trae el rollo.\n— Trae buen rollo con todos.',note:'"Tener/traer el rollo" = to be charming, smooth, know how to talk to people. "Trae buen rollo" = great energy/vibe.'},
  {cat:'emo',es:'funar',lit:'"—"',eq:'To cancel / To call out publicly',lvl:3,reg:'Redes sociales, jóvenes',
   ex:'— Lo funaron en redes por eso.\n— Lo cancelaron después del escándalo.',note:'From social media culture. "Funar" = to expose and cancel someone publicly online. More youth/internet usage.'},
  {cat:'emo',es:'¿sí o qué?',lit:'"yes or what?"',eq:'Right? / You with me? / Am I right or what?',lvl:2,reg:'Todo México',
   ex:'— Estuvo buenísima la fiesta, ¿sí o qué?\n— ¿Vamos a la playa, sí o qué?',note:'Tag question seeking agreement or confirmation. Very common in Mexican speech as a rhetorical check-in.'},
  {cat:'emo',es:'literal',lit:'"literally"',eq:'Literally / Seriously / For real',lvl:1,reg:'Urbano, jóvenes',
   ex:'— Literal casi me caigo.\n— Literal no entendí nada.',note:'Used exactly like English "literally" — often as an intensifier even when not literal. Very common in youth speech, increasingly across all ages.'},
  /* ── DIVERSIÓN Y FIESTA (18) ── */
  {cat:'fies',es:'chela',lit:'"—"',eq:'Beer',lvl:2,reg:'Todo México',
   ex:'— Vamos por unas chelas.\n— ¿Quieres una chela?',note:'One of the most common ways to say "cerveza" casually. Completely standard in any informal setting.'},
  {cat:'fies',es:'pistear',lit:'"to drink"',eq:'To drink alcohol / To go drinking',lvl:3,reg:'Norte/noroeste, entendido en todo México',
   ex:'— El viernes vamos a pistear.\n— Pistamos toda la noche.',note:'More common in the north but understood everywhere. "Pisteamos" = we were drinking/partying.'},
  {cat:'fies',es:'crudo / cruda',lit:'"raw"',eq:'Hungover',lvl:2,reg:'Todo México',
   ex:'— Estoy muy crudo, no quiero salir.\n— Se nota que traes cruda.',note:'"Crudo/a" = hungover. The "rawness" = feeling rough the morning after. "Traer cruda" = to have a hangover.'},
  {cat:'fies',es:'peda',lit:'"fart-like party"',eq:'Drinking party / Booze night',lvl:4,reg:'Todo México',
   ex:'— Ayer hubo una peda en casa de Luis.\n— Se armó una peda.',note:'Refers to a drinking gathering/party. Level 4 because of its vulgar root, but widely used conversationally.'},
  {cat:'fies',es:'antro',lit:'"den/cave"',eq:'Nightclub / Club',lvl:2,reg:'Todo México',
   ex:'— Vamos al antro el sábado.\n— Ya no me gusta el antro.',note:'"Antro" = nightclub/bar with dancing. Not an insult — it\'s just the casual word for nightclub. "Ir al antro" = to go clubbing.'},
  {cat:'fies',es:'botanear',lit:'"to snack" (from botana)',eq:'To snack / To eat appetizers',lvl:1,reg:'Todo México',
   ex:'— ¿No quieren botanear mientras esperamos?\n— Vamos a botanear algo.',note:'"Botana" = snacks/appetizers. "Botanear" = to eat snacks, often while drinking or waiting. Very common and harmless.'},
  {cat:'fies',es:'caerle',lit:'"fall to it"',eq:'To come over / To show up / To visit',lvl:2,reg:'Todo México',
   ex:'— Cáele a mi casa más tarde.\n— ¿A qué hora caes?',note:'"Cáele" = come over / drop by. Casual invitation. "¿A qué hora caes?" = what time are you coming over?'},
  {cat:'fies',es:'rola',lit:'"roll"',eq:'Song / Track',lvl:2,reg:'Todo México',
   ex:'— Pon una rola buena.\n— ¿Cuál es esa rola?',note:'"Rola" = a song/track. "Rolar" = to share/send. "Rola el link" = send me the link.'},
  {cat:'fies',es:'ligar',lit:'"to tie"',eq:'To flirt / To pick someone up',lvl:2,reg:'Todo México',
   ex:'— Quiere ligar en la fiesta.\n— Se fueron a ligar.',note:'To actively flirt with someone with romantic intent. "Ligó a alguien" = he/she picked someone up. Common and understood everywhere.'},
  {cat:'fies',es:'tirar la onda',lit:'"throwing the wave"',eq:'To flirt / To make a move',lvl:2,reg:'Todo México',
   ex:'— Le está tirando la onda.\n— Me está tirando la onda, creo.',note:'More specific than "ligar" — it\'s the act of flirting/approaching someone. "Le tiré la onda" = I made a move on them.'},
  {cat:'fies',es:'chisme',lit:'"gossip"',eq:'Gossip / Tea',lvl:1,reg:'Todo México',
   ex:'— Cuéntame el chisme.\n— ¿Cuál es el chisme de hoy?',note:'"Chisme" = gossip. "Chismear" = to gossip. Very common and lightly used. "Chismoso/a" = gossip (person). Classic Mexican social fabric.'},
  {cat:'fies',es:'se rayó',lit:'"got scratched"',eq:'Scored big / Got lucky / Hit the jackpot',lvl:2,reg:'Todo México',
   ex:'— Se rayó con ese regalo.\n— Nos rayamos con las entradas.',note:'"Rayarse" = to be lucky or score something great unexpectedly. "¡Se rayó!" = they hit the jackpot / got super lucky.'},
  {cat:'fies',es:'top',lit:'"top"',eq:'Really good / Top-tier',lvl:2,reg:'Urbano, jóvenes',
   ex:'— Ese lugar está top.\n— La fiesta estuvo top.',note:'Direct English import. "Estar top" = to be excellent/top-tier. Very common in youth and social media Spanish.'},
  {cat:'fies',es:'perrear',lit:'"to dog"',eq:'To dance reggaeton-style / To party hard',lvl:3,reg:'Todo México, jóvenes',
   ex:'— Se pusieron a perrear.\n— ¡A perrear!',note:'Dancing in the reggaeton style. Level 3 — sexual connotations but widely used. You\'ll hear this in clubs constantly.'},
  {cat:'fies',es:'echar un clavado',lit:'"to throw a dive"',eq:'To dive in / To take a deep look / To have a quickie',lvl:2,reg:'Todo México',
   ex:'— Eché un clavado al archivo.\n— Vamos a echar un clavado al mar.',note:'Context-dependent. Literally = to dive (into water). Figuratively = to take a quick deep look at something. Sometimes has romantic connotation — read context!'},
  {cat:'fies',es:'random',lit:'"random"',eq:'Random / Weird / Out of nowhere',lvl:2,reg:'Urbano, jóvenes',
   ex:'— Fue un comentario bien random.\n— ¿Por qué aparece una persona random?',note:'Directly from English "random." Widely used to mean unexpected, weird, or out-of-nowhere. "Bien random" = super random.'},
  {cat:'fies',es:'traer el mood',lit:'"to bring the mood"',eq:'To be in the mood / To have the vibe',lvl:2,reg:'Urbano, jóvenes',
   ex:'— Hoy no traigo el mood.\n— ¿Quién trae el mood para la fiesta?',note:'Spanglish. "Traer el mood" = to be in the right headspace for something. "No traigo el mood" = I\'m not feeling it today.'},
  {cat:'fies',es:'en su rollo',lit:'"in their roll"',eq:'In their own world / Doing their thing',lvl:2,reg:'Todo México',
   ex:'— Está bien en su rollo.\n— No le molestes, está en su rollo.',note:'"En su rollo" = someone is focused on their own thing, in their own world. Can be positive (doing their thing) or a gentle way to say "leave them alone."'},
  /* ── SOLO CON CONFIANZA — Nivel 4-5 (15) ── */

   ex:'— (with strangers) ¡Oye, güey! — ¡Tú, güey!',note:'⚠️ The SAME word "güey" that means "bro" between friends becomes offensive with strangers or an aggressive tone. Tone, relationship, and context are everything.'},
  {cat:'fuel',es:'qué pedo',lit:'"what fart?"',eq:'What\'s going on? / What the hell?',lvl:4,reg:'Todo México',
   ex:'— ¿Qué pedo, ya llegaste?\n— ¿Qué pedo fue eso?',note:'Stronger version of "qué onda." Only among people you know very well. "¿Qué pedo?" as a greeting = very casual. As a challenge = confrontational.'},

   ex:'— ¡No mames! ¿En serio costó tanto?\n— No mames, ¿cómo te pasó eso?',note:'One of the most expressive Mexican exclamations. Despite being level 5 (vulgar), it\'s extremely common in casual adult speech. The safe version: "no manches."'},
  {cat:'fuel',es:'chingón / chingona',lit:'"fucking awesome"',eq:'Badass / Awesome / Excellent',lvl:4,reg:'Todo México',
   ex:'— Ese profe está chingón.\n— Esa idea está chingona.',note:'From "chingar." Despite its origin, "chingón" is often used as a genuine compliment between friends. "Es un chingón" = they\'re a total badass.'},
  {cat:'fuel',es:'cabrón / cabrona',lit:'"bastard/goat"',eq:'Bastard / Tough / Badass / Intense (context-dependent)',lvl:4,reg:'Todo México',
   ex:'— Ese vato es bien cabrón para negociar.\n— ¡No seas cabrón!',note:'Highly context-dependent. Can be an insult OR a compliment depending on tone: "es muy cabrón" can mean he\'s intense/skilled, not necessarily bad.'},

function getFiltered(){return flashFilter==='all'?SLANG:SLANG.filter(c=>c.cat===flashFilter);}

function renderFlash(){
  flashCards=getFiltered();if(flashIdx>=flashCards.length)flashIdx=0;
  flashFlipped=false;renderFlashCard();
}
function renderFlashCard(){
  if(!flashCards.length){document.getElementById('exContainer').innerHTML='<div class="panel"><p>No cards.</p></div>';return;}
  const item=flashCards[flashIdx];
  const cat=CATS[item.cat];
  const pct=Math.round((flashIdx+1)/flashCards.length*100);
  const lvlColor=LVL_COL[item.lvl]||'#888';
  const fbtns=[{id:'all',lbl:'All ('+SLANG.length+')'},...Object.entries(CATS).map(([k,v])=>({id:k,lbl:v.icon+' '+v.label}))].map(f=>`<button class="ff-btn${flashFilter===f.id?' active':''}" style="${flashFilter===f.id?`background:${CATS[f.id]?.bg||'rgba(255,255,255,.1)'};border-color:${CATS[f.id]?.bd||'rgba(255,255,255,.25)'};color:${CATS[f.id]?.col||'var(--text)'}`:''};" onclick="setFilter('${f.id}')">${f.lbl}</button>`).join('');

  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">🃏 Flashcards — ${SLANG.length} expresiones de slang</div>
  <div class="ex-instr">Front: the slang + its literal (often absurd) translation. Back: the real meaning, an example, and usage notes. Filter by category!</div>
  <div class="flash-controls">${fbtns}</div>
  <div class="flash-wrap">
    <div class="flash-prow">
      <span class="flash-cnt">${flashIdx+1}/${flashCards.length}</span>
      <div class="flash-trk"><div class="flash-fil" style="width:${pct}%;background:${cat.col}"></div></div>
      <span class="flash-cnt" style="color:${cat.col}">${cat.icon} ${cat.label}</span>
    </div>
    <div class="flash-card${flashFlipped?' flipped':''}" id="flashCard" onclick="flipCard()">
      <div class="flash-inner">
        <div class="flash-front" style="background:${cat.bg};border:1.5px solid ${cat.bd}">
          <span style="font-size:.65rem;font-weight:900;text-transform:uppercase;color:${cat.col};letter-spacing:.08em">${cat.icon} ${cat.label}</span>
          <div class="flash-word" style="color:${cat.col}">${item.es}</div>
          <div class="flash-lit">💡 Literal: ${item.lit}</div>
          <div style="margin-top:auto;display:flex;align-items:center;gap:10px">
            <span class="flash-lvl" style="background:${lvlColor}22;border:1px solid ${lvlColor}55;color:${lvlColor}">${'●'.repeat(item.lvl)+'○'.repeat(5-item.lvl)} Nivel ${item.lvl}</span>
            <span class="flash-reg">📍 ${item.reg}</span>
          </div>
          <div class="flash-hint">🔊 Click to hear / flip for meaning</div>
        </div>
        <div class="flash-back" style="background:${cat.bg};border:1.5px solid ${cat.bd}">
          <span style="font-size:.65rem;font-weight:900;text-transform:uppercase;color:${cat.col};letter-spacing:.08em">${cat.icon} ${cat.label}</span>
          <div style="display:flex;align-items:flex-start;gap:10px">
            <div>
              <div class="flash-word" style="color:${cat.col};font-size:1.5rem">${item.es}</div>
              <div class="flash-eq">= ${item.eq}</div>
            </div>
            <span class="flash-lvl" style="margin-left:auto;background:${lvlColor}22;border:1px solid ${lvlColor}55;color:${lvlColor};white-space:nowrap">Nivel ${item.lvl}</span>
          </div>
          <div class="flash-ex">${item.ex.replace(/\n/g,'<br>')}</div>
          <div class="flash-note">📌 ${item.note}</div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn btn-ghost" onclick="prevFlash()" ${flashIdx===0?'disabled':''}>← Prev</button>
      <button class="btn btn-ghost" onclick="flipCard()">↺ Flip</button>
      <button class="btn btn-cyan" onclick="nextFlash()" ${flashIdx===flashCards.length-1?'disabled':''}>Next →</button>
    </div>
  </div></div>`;
}
function flipCard(){flashFlipped=!flashFlipped;const c=document.getElementById('flashCard');if(c)c.classList.toggle('flipped',flashFlipped);}
function nextFlash(){flashIdx=Math.min(flashCards.length-1,flashIdx+1);flashFlipped=false;renderFlashCard();}
function prevFlash(){flashIdx=Math.max(0,flashIdx-1);flashFlipped=false;renderFlashCard();}
function setFilter(f){flashFilter=f;flashIdx=0;renderFlash();}

  {s:'¿Cuál es la diferencia entre "padre" y "chido"?',o:['No hay diferencia, son idénticos','Padre es nivel 1 (suave), chido es nivel 2 (un poco más informal)','Chido es insultante','Padre solo se usa en el norte'],a:1,x:'"Padre" (nivel 1) is completely safe, even with strangers. "Chido" (nivel 2) is slightly more casual, especially common in CDMX.'},
  {s:'"No manches, ¡qué caro!" ¿Cuándo usarías "no manches"?',o:['Solo cuando algo es barato','Cuando algo te sorprende negativamente o te frustra','Solo en contextos formales','Cuando alguien se va'],a:1,x:'"No manches" = No way! / Seriously? — safe version of "no mames." Use when surprised or frustrated. OK in most situations.'},
  {s:'"¡Aguas con el escalón!" ¿Qué significa "aguas"?',o:['¡Hay agua aquí!','¡Cuidado! / ¡Ojo!','Hay escalones mojados.','¡Ven acá!'],a:1,x:'"¡Aguas!" = Watch out! / Heads up! A classic Mexican warning expression.'},
  {s:'"Vamos de volada." ¿Qué significa?',o:['Vamos a volar en avión.','Vamos rápido / enseguida.','Vamos a la playa.','No vamos.'],a:1,x:'"De volada" = right away / quickly. "Vamos de volada" = let\'s go fast.'},
  {s:'"Me late esa idea." ¿Qué significa?',o:['La idea me da miedo.','Me gusta esa idea / suena bien.','No entiendo esa idea.','La idea es mía.'],a:1,x:'"Me late" = I like it / sounds good to me. From the heartbeat — it resonates with me.'},
  {s:'"¿Vienes? Simón." ¿Qué significa "simón"?',o:['Sí (casual).','No.','Tal vez.','Más tarde.'],a:0,x:'"Simón" = yes (casual). And "nel" = no (casual). Both are informal alternatives.'},
  {s:'"Ese morro es mi vecino." ¿Qué es un "morro"?',o:['Un perro.','Un niño / chico joven.','Un señor mayor.','Un profesor.'],a:1,x:'"Morro" = kid / young guy. "Morra" = young girl. More common in northern Mexico.'},
  {s:'"Ese vato trabaja conmigo." ¿Qué es un "vato"?',o:['Una mujer.','Un tipo / dude.','Un jefe.','Un familiar.'],a:1,x:'"Vato" = guy / dude. Common in the north and northwest. In CDMX, "güey" or "tipo" are more common.'},
  {s:'"Esa banda ya está en el antro." ¿Qué significa "banda"?',o:['Música en vivo.','El grupo de amigos / la gente.','Una fiesta privada.','El trabajo.'],a:1,x:'"La banda" = the crew / friends / people. "¿Qué dice la banda?" = what\'s everyone saying?'},
  {s:'"Es muy codo para pagar." ¿Qué significa "codo"?',o:['Es generoso.','Es tacaño / no le gusta gastar dinero.','Trabaja mucho.','Es inteligente.'],a:1,x:'"Codo" = stingy / tight with money. The image is of someone guarding their wallet with their elbow.'},
  {s:'"Échame el paro con la tarea." ¿Qué significa?',o:['Dame el paro (lugar).','Ayúdame con la tarea.','Para la tarea que estoy haciendo.','¿Qué tarea tienes?'],a:1,x:'"Echar el paro" = to help out / do a favor. "Échame el paro" = help me out.'},
  {s:'"¿Traes lana para el taxi?" ¿Qué es "lana"?',o:['Material de tejido.','Dinero / efectivo.','Un boleto.','Tiempo.'],a:1,x:'"Lana" = money / cash. Very common slang. "Sin lana" = broke.'},
  {s:'"Tengo mucha chamba hoy." ¿Qué significa "chamba"?',o:['Tarea de la escuela.','Trabajo / job.','Una reunión importante.','Un problema.'],a:1,x:'"Chamba" = work / job. One of the most natural words for work in casual Mexican Spanish.'},
  {s:'"¡Ponte trucha!" ¿Qué significa?',o:['Come pescado.','¡Presta atención! / ¡Sé listo!','Muévete rápido.','Cómete la trucha.'],a:1,x:'"¡Ponte trucha!" = pay attention / be sharp / be careful. "Trucha" = clever/alert.'},
  {s:'"Me da hueva salir hoy." ¿Qué significa "me da hueva"?',o:['Me da asco.','Me da flojera / no tengo ganas.','Me da miedo.','Me da gusto.'],a:1,x:'"Me da hueva" = I can\'t be bothered / I\'m too lazy. "Hueva" = laziness/drag.'},
  {s:'"Chale, se me olvidó la tarea." ¿Qué expresa "chale"?',o:['Alegría.','Sorpresa positiva.','Decepción / frustración leve.','Enojo fuerte.'],a:2,x:'"Chale" = ugh / damn / that sucks. Expresses mild disappointment or frustration. Common in CDMX.'},
  {s:'"Me sacó de onda su reacción." ¿Qué significa?',o:['Me hizo bailar.','Me confundió / me desconcertó.','Me gustó mucho.','Me enojó.'],a:1,x:'"Sacar de onda" = to throw someone off / confuse or unsettle them. "Me sacó de onda" = it threw me off.'},
  {s:'"¡Qué oso! Me equivoqué de nombre." ¿Qué expresa "qué oso"?',o:['¡Qué animal!','¡Qué vergüenza! / ¡Qué penoso!','¡Qué gracioso!','¡Qué suerte!'],a:1,x:'"Qué oso" = how embarrassing / so awkward. The "bear" image = being as clumsy as a bear.'},
  {s:'"Está agüitado por el examen." ¿Qué significa?',o:['Está enojado.','Está emocionado.','Está triste / decaído.','Está ocupado.'],a:2,x:'"Agüitado" = bummed out / feeling down. More common in the north but understood everywhere.'},
  {s:'"Se pasó de lanza con ese comentario." ¿Qué significa?',o:['Fue muy bueno.','Se pasó de la raya / cruzó un límite.','Habló muy bien.','Llegó tarde.'],a:1,x:'"Pasarse de lanza" = to go too far / to cross a line. The "lanza" (spear) = the limit you shouldn\'t cross.'},
  {s:'"La película estuvo equis." ¿Qué significa "equis"?',o:['Fue increíble.','Fue equivocada.','Fue mediocre / más o menos.','Fue muy larga.'],a:2,x:'"Equis" = meh / so-so. "Estar equis" = to be mediocre or average. From the letter X as a placeholder.'},
  {s:'"¡Qué chido cotorreo!" ¿Qué es un "cotorreo"?',o:['Un concierto.','Un rato agradable / un hangout divertido.','Una discusión.','Un trabajo.'],a:1,x:'"Cotorreo" = a chill/fun hangout. "Cotorrear" = to hang out/chat casually.'},
  {s:'"Vamos por unas chelas." ¿Qué son "chelas"?',o:['Unas aguas.','Unas cervezas.','Unas botanas.','Unas sodas.'],a:1,x:'"Chelas" = beers. One of the most common casual words for "cervezas."'},
  {s:'"Estoy crudo hoy." ¿Qué significa estar "crudo"?',o:['Tener hambre.','Tener resaca / cruda (hangover).','Estar enfermo de gripa.','Estar cansado de trabajar.'],a:1,x:'"Crudo" = hungover. "Tener cruda" = to have a hangover. "Traer cruda" = same thing.'},
  {s:'"Se fue al antro con sus amigos." ¿Qué es un "antro"?',o:['Una cueva literal.','Un bar / antro = nightclub.','Una tienda de ropa.','Un parque.'],a:1,x:'"Antro" = nightclub / bar with dancing. "Ir al antro" = to go clubbing. Nothing negative about the word.'},
  {s:'"Cáele a mi casa más tarde." ¿Qué significa "cáele"?',o:['Cae desde arriba.','Ven / visítame.','Llámame.','Recógeme.'],a:1,x:'"Cáele" = come over / drop by. "¿A qué hora caes?" = what time are you coming?'},
  {s:'"Le está tirando la onda." ¿Qué significa?',o:['Le está lanzando una pelota.','Le está coqueteando / haciendo un movimiento.','Le está hablando de trabajo.','Le está ayudando.'],a:1,x:'"Tirar la onda" = to flirt with someone / to make a move on them.'},
  {s:'"Pon una rola buena." ¿Qué es una "rola"?',o:['Un juego.','Una canción.','Una película.','Una broma.'],a:1,x:'"Rola" = a song / track. "Rolar el link" = to share/send the link.'},
  {s:'"Se rayó con ese regalo." ¿Qué significa "se rayó"?',o:['Se lastimó.','Tuvo mucha suerte / sacó algo increíble.','Se enojó mucho.','Se fue rápido.'],a:1,x:'"Rayarse" = to score big / to get lucky with something great. "¡Se rayó!" = they hit the jackpot!'},
  {s:'"Cuéntame el chisme." ¿Qué significa?',o:['Cuéntame el cuento.','Cuéntame el chismoso.','Cuéntame el chisme / el gossip.','Cuéntame lo que pasó.'],a:2,x:'"Chisme" = gossip / tea. "Chismear" = to gossip. "¿Cuál es el chisme?" = what\'s the tea?'},
  {s:'"Ese lugar está top." ¿Qué significa "top"?',o:['Está en lo alto de un edificio.','Está al principio de la lista.','Está increíble / de primer nivel.','Es caro.'],a:2,x:'"Top" (from English) = really good / top-tier. Very common in youth Mexican Spanish.'},
  {s:'"¿Qué pedo con ese güey?" — ¿cuándo usarías "qué pedo"?',o:['Siempre, es muy educado.','Solo entre amigos de confianza — es nivel 4.','En contextos formales.','Con personas mayores.'],a:1,x:'"Qué pedo" is a Level 4 expression — only use with close friends you know very well.'},
  {s:'"¡No mames!" — ¿cuál es la versión más suave?',o:['¡No güey!','¡No manches!','¡No pedo!','¡No chale!'],a:1,x:'"No manches" is the safe, all-contexts version of "no mames." Same meaning, much less offensive.'},
  {s:'"Ese profe está chingón." ¿Es un insulto?',o:['Sí, siempre es ofensivo.','No, en este contexto es un cumplido entre amigos.','Depende del país.','Solo mujeres pueden decirlo.'],a:1,x:'"Chingón" can be a genuine compliment: "está chingón" = they\'re awesome / excellent. Context and relationship matter a lot.'},
  {s:'"Ni pedo, ya se fue el camión." ¿Qué significa?',o:['No importa, no es problema.','Ni modo, ya qué / no hay nada que hacer.','El camión se fue.','No hay autobús.'],a:1,x:'"Ni pedo" = oh well / it is what it is / nothing can be done. Expression of resigned acceptance.'},
  {s:'"No hay pedo" — ¿qué significa?',o:['No hay problema / estamos bien.','Hay un problema serio.','No hay gas.','Está bien enojado.'],a:0,x:'"No hay pedo" = no problem / all good / we\'re fine. Opposite emotional valence from "qué pedo."'},
  {s:'"¡A huevo que sí!" — ¿qué expresa?',o:['Desacuerdo total.','Duda.','Confirmación entusiasta / absolutamente sí.','Sorpresa negativa.'],a:2,x:'"A huevo" = hell yeah! / absolutely! Very enthusiastic affirmation. Level 4 but widely used.'},
  {s:'"Está bien en su rollo." ¿Qué significa?',o:['Está en un buen lugar.','Está ocupado/a haciendo lo suyo / en su mundo.','Está enferma.','Trabaja mucho.'],a:1,x:'"En su rollo" = in their own world / doing their thing. Can mean focused, or leave them alone.'},
  {s:'"Cuéntame, ¿mande?" — ¿cuándo dices "mande"?',o:['Cuando ordenas algo.','Cuando no escuchaste bien algo o alguien te llama.','Cuando llegas a algún lugar.','Cuando te vas.'],a:1,x:'"Mande" = Pardon? / Yes? — said when you didn\'t hear or someone called your name. Very Mexican.'},
  {s:'"Ese lugar está bien fresa." ¿Qué significa?',o:['Venden fresas.','Es muy elegante / exclusivo / snob.','Es barato.','Es divertido.'],a:1,x:'"Fresa" = posh / preppy / snobby. Describes a place, person or event as upper-class or exclusive.'},
  {s:'"Me dio cringe su presentación." ¿Qué significa?',o:['Me pareció muy buena.','Me hizo sentir vergüenza ajena.','Me aburrió.','Me confundió.'],a:1,x:'"Me dio cringe" = it made me cringe / feel secondhand embarrassment. Direct English import used naturally.'},
  {s:'"Vamos a caer a la fiesta más tarde." ¿Qué significa "caer"?',o:['Tropezar.','Llegar / aparecer.','Irnos.','Dormirnos.'],a:1,x:'"Caer" used informally = to show up / arrive somewhere. "Caemos más tarde" = we\'ll show up later.'},

  {s:'"¿Quieres jalar con nosotros?" ¿Qué significa "jalar"?',o:['¿Quieres halar algo pesado?','¿Quieres venir / unirte a nosotros?','¿Quieres trabajar?','¿Quieres ir a otro lado?'],a:1,x:'"Jalar" = to be in / to join / to come along. "¡Jalo!" = I\'m in! Very versatile verb.'},

function renderErrorHunt(){
  ehAnswered={};
  let html=`<div class="panel"><div class="ex-title">❓ ¿Se usa así? — Verdadero o falso</div>

  <div class="eh-list">`;
  ERRORS.forEach(([s,hasErr,,exp],i)=>{
    html+=`<div class="eh-item" id="ehi${i}"><div class="eh-n">${i+1}</div>

}
function judgeEh(idx,saysErr){
  if(ehAnswered[idx]!==undefined)return;
  const [s,hasErr,fix,exp]=ERRORS[idx];
  const correct=saysErr===hasErr;
  ehAnswered[idx]=correct;
  const item=document.getElementById('ehi'+idx);
  item.classList.add('revealed',correct?'eh-ok':'eh-bad');
  item.querySelectorAll('.eh-btn').forEach(b=>b.disabled=true);
  const chosen=item.querySelector(saysErr?'.eh-no':'.eh-yes');
  if(chosen)chosen.classList.add(correct?'cho-ok':'cho-err');
  if(hasErr&&fix){const se=document.getElementById('ehs'+idx);se.innerHTML=`"${s}" <span class="eh-fix">→ ${fix}</span>`;}
  document.getElementById('ehe'+idx).classList.add('show');
  const total=Object.keys(ehAnswered).length;
  const ok=Object.values(ehAnswered).filter(v=>v).length;
  document.getElementById('eh_ok').textContent=ok;
  document.getElementById('eh_err').textContent=total-ok;
  document.getElementById('eh_pct').textContent=Math.round(total/ERRORS.length*100)+'%';
  document.getElementById('eh_pg').style.width=Math.round(total/ERRORS.length*100)+'%';
  if(total===ERRORS.length){
    const pct=Math.round(ok/ERRORS.length*100);
    const fb=document.getElementById('eh_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'🏆':'📖'} <strong>${ok}/${ERRORS.length}.</strong> ${pct>=80?'¡Chido! You understand slang in context!':'Remember: level matters just as much as meaning.'}`;
  }
}

/* ══════════════════════════════════
   SMART AUDIO SYSTEM
   Picks the best available es-MX voice,
   falls back gracefully on any device
══════════════════════════════════ */
let _bestVoice = null;
let _voiceReady = false;
let _voiceError = false;

function initVoices() {
  if (!window.speechSynthesis) { _voiceError = true; return; }
  const pick = () => {
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;

    // Priority list — best quality first
    const priority = [
      v => v.name === 'Paulina',                          // iOS/macOS neural MX voice
      v => v.name.includes('Paulina'),
      v => v.lang === 'es-MX' && v.localService,         // any local es-MX
      v => v.lang === 'es-MX',                            // remote es-MX
      v => v.name.includes('Google') && v.lang.startsWith('es'), // Google es
      v => v.lang === 'es-419',                           // Latin American Spanish
      v => v.lang.startsWith('es') && v.localService,    // any local Spanish
      v => v.lang.startsWith('es'),                       // any Spanish
    ];

    for (const test of priority) {
      const found = voices.find(test);
      if (found) { _bestVoice = found; break; }
    }
    _voiceReady = true;
  };

  pick();
  if (!_voiceReady) {
    window.speechSynthesis.onvoiceschanged = pick;
    // Fallback: try again after 800ms (Chrome async loading)
    setTimeout(pick, 800);
  }
}

// Call immediately and on load
initVoices();
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initVoices);
}

let _currentUtt = null;

function speak(text, btn) {
  if (!window.speechSynthesis) {
    if (btn) { btn.textContent = '🔇 No audio'; btn.classList.add('bad'); }
    return;
  }

  // Stop anything playing
  window.speechSynthesis.cancel();
  _currentUtt = null;

  // Reset all audio buttons
  document.querySelectorAll('.btn-audio, .chat-audio-btn').forEach(b => {
    b.classList.remove('playing');
    if (b.dataset.orig) b.innerHTML = b.dataset.orig;
  });

  const utt = new SpeechSynthesisUtterance(text);

  // Apply best available voice
  if (_bestVoice) utt.voice = _bestVoice;
  utt.lang   = _bestVoice ? _bestVoice.lang : 'es-MX';
  utt.rate   = 0.82;   // slightly slower than natural — good for learners
  utt.pitch  = 1.0;
  utt.volume = 1.0;

  if (btn) {
    if (!btn.dataset.orig) btn.dataset.orig = btn.innerHTML;
    btn.classList.add('playing');
    btn.innerHTML = '🔊 ▶';
  }

  utt.onend = () => {
    _currentUtt = null;
    if (btn) {
      btn.classList.remove('playing');
      if (btn.dataset.orig) btn.innerHTML = btn.dataset.orig;
    }
  };
  utt.onerror = () => {
    _currentUtt = null;
    if (btn) {
      btn.classList.remove('playing');
      if (btn.dataset.orig) btn.innerHTML = btn.dataset.orig;
    }
  };

  _currentUtt = utt;
  window.speechSynthesis.speak(utt);
}

// Render a small voice-info bar showing which voice is in use
function voiceBar() {
  if (!window.speechSynthesis) return '<div class="voice-bar"><span class="voice-status">⚠️ Audio not supported on this browser/device.</span></div>';
  const name  = _bestVoice ? _bestVoice.name  : 'system default';
  const lang  = _bestVoice ? _bestVoice.lang  : 'es';
  const local = _bestVoice && _bestVoice.localService ? '✅ local (best)' : '🌐 remote';
  return `<div class="voice-bar">
    <span class="voice-status">🔊 Voice: <strong>${name}</strong> · ${lang} · ${local}</span>
    <span class="voice-status" style="margin-left:auto;opacity:.7">Tip: on iOS, "Paulina" sounds the most natural.</span>
  </div>`;
}

      {side:'right',av:'🙋', who:'Tú', text:'Jajaja ya ves. Cuídate.', audio:'Jajaja ya ves. Cuídate.'},
    ],
    q: '"Cayó el veinte" is a classic Mexican expression. What does it mean?',
    opts: ['she dropped 20 pesos', 'she finally realized / it clicked', 'she missed the bus on purpose', 'she paid 20 pesos for the bus'],
    a: 1,
    exp: '"Caer el veinte" = to finally realize something (it clicked / the penny dropped). From old public phone tokens worth 20 centavos — when you dropped the coin, the call connected. "Ni pedo" = oh well, "me dio hueva" = I was too lazy.',
  },
];

function renderChats() {
  chatAnswers = {};
  const tot = CHATS.length;

  const html = CHATS.map((conv, i) => {
    const bubbles = conv.msgs.map(m => `
      <div class="chat-row ${m.side}">
        <div class="chat-av">${m.av}</div>
        <div>
          <div class="chat-who">${m.who}</div>
          <div class="chat-bub">
            ${m.text}
            ${m.audio ? `<button class="chat-audio-btn" onclick="speak('${m.audio.replace(/'/g,"\\'")}',this)" title="🔊 Listen">🔊</button>` : ''}
          </div>
        </div>
      </div>`).join('');

    const opts = conv.opts.map((o, oi) =>
      `<button class="conv-opt" id="co${i}_${oi}" onclick="answerChat(${i},${oi})">${o}</button>`
    ).join('');

    return `<div class="conv-card" id="cc${i}">
      <div class="conv-header">📍 <strong>${conv.ctx}</strong></div>
      <div class="conv-body">${bubbles}</div>
      <div class="conv-q">👉 ${conv.q}</div>
      <div class="conv-opts">${opts}</div>
      <div class="conv-exp" id="cexp${i}"></div>
    </div>`;
  }).join('');

  document.getElementById('exContainer').innerHTML = `<div class="panel">
  <div class="ex-title">📱 Chats reales — Slang en contexto</div>
  ${voiceBar()}
  <div class="ex-instr">Read the whole WhatsApp conversation, then answer the question. Click 🔊 on any bubble to hear it. Real slang makes sense in <em>context</em> — not in isolation!</div>
  <div class="score-bar">
    <div class="sc"><span class="l">Total</span><span class="v">${tot}</span></div>
    <div class="sc"><span class="l">OK</span><span class="v g" id="ch_ok">0</span></div>
    <div class="sc"><span class="l">Miss</span><span class="v b" id="ch_err">0</span></div>
    <div class="prog-w"><div class="prog-l">Answered: <span id="ch_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="ch_pg" style="width:0%"></div></div></div>
  </div>
  <div class="conv-list">${html}</div>
  <div class="fb" id="ch_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="chatAnswers={};renderChats()">↺ Reset</button></div></div>`;
}

function answerChat(qi, oi) {
  if (chatAnswers[qi] !== undefined) return;
  const conv = CHATS[qi];
  const isOk = oi === conv.a;
  chatAnswers[qi] = isOk;

  const card = document.getElementById('cc' + qi);
  if (card) card.classList.add(isOk ? 'ok' : 'err');

  conv.opts.forEach((_, x) => {
    const b = document.getElementById(`co${qi}_${x}`);
    if (!b) return;
    b.disabled = true;
    if (x === conv.a) b.classList.add('co-show');
    else if (x === oi && !isOk) b.classList.add('co-err');
  });

  const e = document.getElementById('cexp' + qi);
  if (e) { e.classList.add('show'); e.innerHTML = (isOk ? '✓ ' : '✗ ') + conv.exp; }

  const tot = Object.keys(chatAnswers).length;
  const ok  = Object.values(chatAnswers).filter(v => v).length;
  document.getElementById('ch_ok').textContent  = ok;
  document.getElementById('ch_err').textContent = tot - ok;
  document.getElementById('ch_pct').textContent = Math.round(tot / CHATS.length * 100) + '%';
  document.getElementById('ch_pg').style.width  = Math.round(tot / CHATS.length * 100) + '%';

  if (tot === CHATS.length) {
    const pct = Math.round(ok / tot * 100);
    const fb  = document.getElementById('ch_fb');
    fb.className = 'fb show ' + (pct >= 85 ? 'ok' : 'partial');
    fb.innerHTML = `${pct>=85?'🏆':'📖'} <strong>${ok}/${tot}.</strong> ${pct>=85?'¡Chingón! You read Mexican conversations like a native!':'Study the flashcards and try again — context is everything.'}`;
  }
}

function renderReference() {
  const LVL_COL_REF = {1:'#22c55e',2:'#84cc16',3:'#f59e0b',4:'#ef4444',5:'#9f1239'};
  const LVL_EMOJI   = {1:'🟢',2:'🟡',3:'🟠',4:'🔴',5:'💀'};

  function buildRows(query) {
    const q = normS(query || '');
    const filtered = q.length < 2
      ? SLANG
      : SLANG.filter(s =>
          normS(s.es).includes(q) ||
          normS(s.eq).includes(q) ||
          normS(s.lit).includes(q) ||
          normS(CATS[s.cat]?.label||'').includes(q)
        );

    const hl = (str) => q.length >= 2
      ? str.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'),
          '<span class="rr-highlight">$1</span>')
      : str;

    return { count: filtered.length, html: filtered.map(item => {
      const cat = CATS[item.cat];
      const lc  = LVL_COL_REF[item.lvl];
      return `<div class="ref-row">
        <div class="rr-es" style="color:${cat.col}" onclick="speak('${item.es.replace(/'/g,"\\'")}',null)">${hl(item.es)}</div>
        <div class="rr-lit">${hl(item.lit)}</div>
        <div class="rr-eq">${hl(item.eq)}</div>
        <div class="rr-meta">
          <span class="rr-lvl" style="color:${lc}">${LVL_EMOJI[item.lvl]} Nivel ${item.lvl}</span>
          <span class="rr-reg">${item.reg.replace('Todo México','🌎 Todo MX').replace('Norte/noroeste','🔼 Norte').replace('Urbano, jóvenes','📱 Jóvenes').replace('CDMX','🏙️ CDMX').replace('Redes sociales','📲 Redes')}</span>
        </div>
      </div>`;
    }).join('') };
  }

  const { count, html } = buildRows('');

  document.getElementById('exContainer').innerHTML = `<div class="panel">
  <div class="ex-title">📄 Referencia — ${SLANG.length} expresiones</div>
  <div class="ex-instr">Search any slang, meaning, or category. Click any expression to <em>hear it</em>. Nivel: 🟢1 suave → 💀5 vulgar.</div>
  ${voiceBar()}
  <input class="ref-search" id="refSearch" placeholder="Search slang, meaning, or category… (e.g. 'money', 'chida', 'fiesta')" oninput="updateRefSearch(this.value)" autocomplete="off">
  <div class="ref-count" id="refCount">Showing all ${count} expressions</div>
  <div id="refRows">${html}</div>
  <div class="ref-tip" style="margin-top:16px">💡 <strong>Start with Nivel 1-2</strong> — qué onda, órale, sale, neta, padre, chido, no manches, aguas, me late, de volada, chamba, lana, chela, banda, rola, chisme, cotorrear, mande.</div>
  <div class="ref-alert" style="margin-top:8px">🔴 <strong>Nivel 4-5 — only with close friends:</strong> güey, qué pedo, no mames, ni pedo, a huevo, cabrón, chingón, me vale madre, en chinga.</div>
  </div>`;
}

function updateRefSearch(q) {
  const { count, html } = buildRefRows(q);
  const el = document.getElementById('refRows');
  const ct = document.getElementById('refCount');
  if (el) el.innerHTML = html;
  if (ct) ct.textContent = count < SLANG.length
    ? `Showing ${count} of ${SLANG.length} expressions`
    : `Showing all ${count} expressions`;
}
