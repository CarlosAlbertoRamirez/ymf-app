<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulario de la Casa A2–B1 | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --t1:#f97316;--t2:#34d399;--t3:#a78bfa;--t4:#25d9ff;--t5:#f472b6;
  --t6:#fbbf24;--t7:#e879f9;--t8:#60a5fa;--t9:#2dd4bf;--t10:#a3e635;
  --t11:#fb7185;--t12:#c084fc;--t13:#4ade80;--t14:#38bdf8;--t15:#facc15;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(37,217,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 20% 10%,rgba(167,139,250,.12),transparent 35%),radial-gradient(ellipse at 80% 15%,rgba(34,211,153,.07),transparent 35%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(940px,96%);margin:14px auto 60px;display:flex;flex-direction:column;gap:14px}
/* HERO */
.hero{border-radius:22px;padding:26px 30px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.hero-in{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.logo-box{width:56px;height:56px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--magenta)}
.hero h1{font-family:var(--display);font-size:clamp(1.2rem,3vw,1.9rem);font-weight:900;background:linear-gradient(90deg,var(--t1),#fff 40%,var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--muted);font-size:.86rem;margin-top:3px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 11px;font-size:.7rem;font-weight:700;color:var(--muted)}
/* TABS */
.tabs-wrap{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.tabs-bar{display:flex;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.07);scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;border:0;background:transparent;color:var(--muted2);font-family:var(--font);font-size:.78rem;font-weight:700;padding:12px 14px;cursor:pointer;transition:.2s;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab-panel{display:none;padding:26px 28px}.tab-panel.visible{display:block}
/* VOCAB TABLE */
.vocab-section{margin-bottom:24px}
.vocab-title{font-family:var(--display);font-size:1rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.vocab-table{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:8px}
.vocab-table th{text-align:left;padding:7px 12px;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08)}
.vocab-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5}
.vocab-table td:first-child{font-weight:700;color:var(--text)}
.vocab-table td:nth-child(2){color:var(--muted)}
.vocab-table td:last-child{font-size:.82rem;color:var(--muted2);font-style:italic}
.vocab-table tr:last-child td{border-bottom:0}
.vocab-table tr:hover td{background:rgba(255,255,255,.02)}
/* PATTERNS BOX */
.patterns-box{background:rgba(37,217,255,.05);border:1px solid rgba(37,217,255,.18);border-radius:12px;padding:13px 16px;margin-bottom:20px}
.patterns-title{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--cyan);margin-bottom:8px}
.pattern-row{font-size:.85rem;line-height:1.8;color:var(--muted)}
.pattern-row strong{color:var(--text)}
/* EXERCISE CARDS */
.ex-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.ex-title{font-family:var(--display);font-size:.82rem;font-weight:900;color:var(--cyan);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.score-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.score-pill{background:rgba(167,139,250,.15);color:#c4b5fd;border-radius:999px;padding:3px 12px;font-size:.72rem;font-weight:800;border:1px solid rgba(167,139,250,.3)}
.btn-restart{border:1px solid rgba(249,115,22,.4);border-radius:999px;padding:4px 12px;font-weight:800;font-family:var(--font);font-size:.72rem;cursor:pointer;background:rgba(249,115,22,.1);color:var(--t1);transition:.15s}
.btn-restart:hover{background:rgba(249,115,22,.2)}
/* Q ITEMS */
.q-list{display:flex;flex-direction:column;gap:12px}
.q-item{font-size:.92rem;line-height:1.7}
.q-num{font-size:.68rem;font-weight:900;color:var(--muted2);margin-right:4px}
.q-stem{font-weight:600;margin-bottom:6px}
.q-sub{font-size:.8rem;color:var(--muted2);font-style:italic;margin-bottom:6px}
/* CHIPS */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:0;border-radius:9px;padding:7px 14px;font-weight:800;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);color:var(--text)}
.chip:hover:not([disabled]):not(.used){transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.chip.used{opacity:.2;cursor:not-allowed}
.chip.chip-ok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.chip.chip-err{border-color:var(--bad);background:rgba(239,68,68,.14);color:#fca5a5}
/* TEXT INPUT */
.q-input{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 12px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;transition:.2s;width:100%;margin-bottom:4px}
.q-input:focus{border-color:rgba(37,217,255,.4);background:rgba(37,217,255,.04)}
.q-input[disabled]{opacity:.65;cursor:default}
.q-input.inp-ok{border-color:var(--good);background:rgba(34,197,94,.06);color:#86efac}
.q-input.inp-err{border-color:var(--bad);background:rgba(239,68,68,.05)}
.q-textarea{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:9px;padding:10px 13px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;resize:vertical;min-height:80px;transition:.2s;line-height:1.6}
.q-textarea:focus{border-color:rgba(37,217,255,.35)}
.q-textarea[disabled]{opacity:.65}
/* BLANK */
.blank{display:inline-block;border-bottom:2px solid var(--cyan);min-width:120px;text-align:center;padding:0 4px;color:var(--cyan);font-weight:800}
/* BUTTONS */
.btn-check{border:0;border-radius:8px;padding:7px 16px;font-weight:800;font-family:var(--font);font-size:.8rem;cursor:pointer;transition:.13s;background:rgba(37,217,255,.12);border:1.5px solid rgba(37,217,255,.3);color:var(--cyan);margin-top:6px}
.btn-check:hover{background:rgba(37,217,255,.2)}
.btn-open{border:0;border-radius:8px;padding:7px 16px;font-weight:800;font-family:var(--font);font-size:.8rem;cursor:pointer;transition:.13s;background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:#fff;margin-top:6px}
/* FEEDBACK */
.q-fb{display:none;font-size:.8rem;color:var(--muted);margin-top:6px;padding:7px 11px;border-radius:8px;background:rgba(255,255,255,.04);line-height:1.6}
.q-fb.show{display:block}
.q-ref{display:none;font-size:.8rem;color:var(--muted);margin-top:6px;padding:7px 11px;border-radius:8px;background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.2);line-height:1.6}
.q-ref.show{display:block}
/* SECTION RESULT */
.sec-result{display:none;margin-top:16px;padding:14px 18px;border-radius:12px;text-align:center}
.sec-result.show{display:block}
/* WORD BANK DISPLAY */
.wordbank{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.83rem;color:var(--muted2)}
.wordbank strong{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:4px}
.creator span{color:var(--magenta2)}
@media(max-width:560px){.tab-panel{padding:18px 14px}.vocab-table td:last-child{display:none}}

/* YMF brand v2 */
.logo-box,.hero .logo,.logoBox{padding:0!important;overflow:hidden!important;background:#0c0030!important;border:2px solid rgba(37,217,255,.28)!important;box-shadow:0 0 18px rgba(255,43,191,.18)!important}
img.ymf-logo{width:72px!important;height:72px!important;max-width:72px!important;object-fit:cover!important;border-radius:18px!important;padding:0!important;display:block}
.logo-box>img.ymf-logo,.hero .logo>img.ymf-logo,.logoBox>img.ymf-logo{width:100%!important;height:100%!important;max-width:none!important;border-radius:inherit!important}
.logo-box .logoText,.logoBox .logoText{display:none!important}
.hero-text h1,.hero h1,.app>header h1,header .brand~h1{background:linear-gradient(90deg,#ff4fd8,#ffffff 48%,#25d9ff)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;font-family:'Syne','DM Sans',system-ui,sans-serif!important}
.app>header:not(.hero){background:radial-gradient(circle at top right,rgba(37,217,255,.16),transparent 38%),linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e)!important;border-bottom:1px solid rgba(37,217,255,.13)}
.etab.active,.tab.active,.tab-btn.active{background:linear-gradient(135deg,#ff2bbf,#ff4fd8)!important;color:#fff!important}
.prog-f,.progress-fill,.progress-bar-fill,.bar-fill,.pfill{background:linear-gradient(90deg,#ff2bbf,#25d9ff)!important}
.btn-primary{background:linear-gradient(135deg,#ff2bbf,#ff4fd8)!important;color:#fff!important;border:0!important}
.ymf-brandbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-radius:16px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(37,217,255,.15)}
.ymf-brandbar img{width:44px;height:44px;border-radius:12px;border:2px solid rgba(37,217,255,.28);object-fit:cover}
.ymf-brandbar b{display:block;font-family:'Syne','DM Sans',sans-serif;font-size:1rem;background:linear-gradient(90deg,#ff4fd8,#fff 48%,#25d9ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ymf-brandbar span{display:block;font-size:.72rem;color:#a8abce;font-weight:700;margin-top:2px}
</style>
</head>

        <h1>Vocabulario de la Casa</h1>

   ]},

</script>
<script>
const renderedTabs=new Set();
const answers={};

function normalize(s){
  return s.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[¿?¡!.,;:]/g,'').replace(/\s+/g,' ');
}
function checkAns(user,correct){
  const u=normalize(user);
  return correct.split('/').map(a=>normalize(a)).some(a=>u.includes(a)||a.includes(u));
}

function switchTab(i){
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',i===j));
  if(!renderedTabs.has(i)){renderTab(i);renderedTabs.add(i);}
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('visible'));
  const panel=document.getElementById('panel'+i);
  if(panel)panel.classList.add('visible');
}

function buildTabsBar(){
  const bar=document.getElementById('tabsBar');
  TABS.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===0?' active':'');
    btn.textContent=t.icon+' '+t.title;
    btn.onclick=()=>switchTab(i);
    bar.appendChild(btn);
  });
}

function renderTab(i){
  const t=TABS[i];
  const container=document.getElementById('tabContents');
  const panel=document.createElement('div');
  panel.className='tab-panel'+(i===0?' visible':'');
  panel.id='panel'+i;
  let html='';

  // Vocab table
  if(t.vocab&&t.vocab.length>0){
    const hasSamples=t.vocab.some(v=>v.ex);
    html+=`<div class="vocab-section">
    <div class="vocab-title" style="color:${t.color}">${t.icon} Vocabulario clave</div>
    <table class="vocab-table">
      <thead><tr><th>Español</th><th>English</th>${hasSamples?'<th>Ejemplo</th>':''}</tr></thead>
      <tbody>`;
    t.vocab.forEach(v=>{
      html+=`<tr><td>${v.es}</td><td>${v.en}</td>${hasSamples?`<td>${v.ex||''}</td>`:''}</tr>`;
    });
    html+=`</tbody></table></div>`;
  }

  // Patterns
  if(t.patterns&&t.patterns.length>0){
    html+=`<div class="patterns-box">
    <div class="patterns-title">💬 Expresiones útiles</div>`;
    t.patterns.forEach(p=>{
      html+=`<div class="pattern-row"><strong>${p.es}</strong> — ${p.en}</div>`;
    });
    html+=`</div>`;
  }

  // Exercises
  t.exercises.forEach((ex,ei)=>{
    html+=`<div class="ex-card">
    <div class="ex-title">${ex.title}</div>
    <div class="score-row">
      <span class="score-pill" id="score${i}_${ei}">0 / ${ex.qs.length} respondidas</span>
      <button class="btn-restart" onclick="restartEx(${i},${ei})">🔄 Reiniciar</button>
    </div>`;

    if(ex.type==='fill'){
      // Word bank
      const wb=ex.wb||[];
      if(wb.length){
        html+=`<div class="wordbank"><strong>Banco de palabras</strong>${wb.join(' · ')}</div>`;
      }
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const key=`${i}_${ei}_${qi}`;
        html+=`<div class="q-item" id="qitem${key}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${q.stem}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <div class="chip-row" id="chips${key}">
            ${wb.map(w=>`<button class="chip" onclick="answerChip('${key}','${w.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}',${i},${ei})">${w}</button>`).join('')}
          </div>
          <div class="q-fb" id="fb${key}"></div>
        </div>`;
      });
      html+=`</div>`;

    } else if(ex.type==='translate'){
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const key=`${i}_${ei}_${qi}`;
        html+=`<div class="q-item" id="qitem${key}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${q.stem}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <input type="text" class="q-input" id="inp${key}" placeholder="Escribe tu traducción..."
            onkeydown="if(event.key==='Enter')checkTranslate('${key}','${q.a.replace(/'/g,"\\'")}',${i},${ei})">
          <button class="btn-check" onclick="checkTranslate('${key}','${q.a.replace(/'/g,"\\'")}',${i},${ei})">Verificar ✓</button>
          <div class="q-fb" id="fb${key}"></div>
        </div>`;
      });
      html+=`</div>`;

    } else if(ex.type==='open'){
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const key=`${i}_${ei}_${qi}`;
        html+=`<div class="q-item" id="qitem${key}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${q.stem}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <textarea class="q-textarea" id="inp${key}" placeholder="Escribe tu respuesta..." rows="3"></textarea>
          <button class="btn-open" onclick="submitOpen('${key}','${(q.ref||'').replace(/'/g,"\\'")}',${i},${ei})">Enviar →</button>
          <div class="q-ref" id="ref${key}"></div>
        </div>`;
      });
      html+=`</div>`;
    }

    html+=`</div>`; // ex-card
  });

  panel.innerHTML=html;
  container.appendChild(panel);
}

function answerChip(key,chosen,correct,ti,ei){
  if(answers[key]!==undefined)return;
  const ok=normalize(chosen)===normalize(correct);
  answers[key]=ok;
  const chips=document.querySelectorAll(`#chips${key} .chip`);
  chips.forEach(btn=>{
    btn.disabled=true;
    if(normalize(btn.textContent)===normalize(chosen))btn.classList.add(ok?'chip-ok':'chip-err');
    else btn.classList.add('used');
  });
  const fb=document.getElementById('fb'+key);
  if(fb){fb.innerHTML=(ok?'✅ ¡Correcto!':'❌ La respuesta correcta es: <strong>'+correct+'</strong>');fb.classList.add('show');}
  updateScore(ti,ei);
}

function checkTranslate(key,correct,ti,ei){
  if(answers[key]!==undefined)return;
  const inp=document.getElementById('inp'+key);
  if(!inp||!inp.value.trim()){alert('Escribe una respuesta primero.');return;}
  const ok=checkAns(inp.value,correct);
  answers[key]=ok;
  inp.disabled=true;
  inp.classList.add(ok?'inp-ok':'inp-err');
  const fb=document.getElementById('fb'+key);
  if(fb){
    fb.innerHTML=ok?'✅ ¡Muy bien!':'❌ Respuesta de referencia: <strong>'+correct+'</strong>';
    fb.classList.add('show');
  }
  const btn=inp.nextElementSibling;if(btn&&btn.classList.contains('btn-check'))btn.disabled=true;
  updateScore(ti,ei);
}

function submitOpen(key,ref,ti,ei){
  if(answers[key]!==undefined)return;
  const inp=document.getElementById('inp'+key);
  if(!inp||!inp.value.trim()){alert('Escribe tu respuesta primero.');return;}
  answers[key]=true;
  inp.disabled=true;
  const refEl=document.getElementById('ref'+key);
  if(refEl&&ref){refEl.innerHTML='📋 <strong>Respuesta de referencia:</strong> '+ref;refEl.classList.add('show');}
  const btn=inp.nextElementSibling;if(btn&&btn.classList.contains('btn-open'))btn.disabled=true;
  updateScore(ti,ei);
}

function updateScore(ti,ei){
  const ex=TABS[ti].exercises[ei];
  const done=ex.qs.filter((_,qi)=>answers[`${ti}_${ei}_${qi}`]!==undefined).length;
  const sc=document.getElementById(`score${ti}_${ei}`);
  if(sc)sc.textContent=done+' / '+ex.qs.length+' respondidas';
}

function restartEx(ti,ei){
  const ex=TABS[ti].exercises[ei];
  ex.qs.forEach((_,qi)=>{
    const key=`${ti}_${ei}_${qi}`;
    delete answers[key];
    // Reset chips
    document.querySelectorAll(`#chips${key} .chip`).forEach(b=>{b.disabled=false;b.className='chip';});
    // Reset input
    const inp=document.getElementById('inp'+key);
    if(inp){inp.disabled=false;inp.value='';inp.className=inp.tagName==='TEXTAREA'?'q-textarea':'q-input';}
    // Reset feedback
    const fb=document.getElementById('fb'+key);if(fb){fb.innerHTML='';fb.className='q-fb';}
    const ref=document.getElementById('ref'+key);if(ref){ref.innerHTML='';ref.className='q-ref';}
    // Re-enable buttons
    const item=document.getElementById('qitem'+key);
    if(item){
      const btn=item.querySelector('.btn-check,.btn-open');
      if(btn)btn.disabled=false;
    }
  });
  updateScore(ti,ei);
}

buildTabsBar();
renderTab(0);
renderedTabs.add(0);
</script>
