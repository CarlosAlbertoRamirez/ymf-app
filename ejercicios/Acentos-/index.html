<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Acentos en Español | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --ag:#f97316;--agb:rgba(249,115,22,.12);--agd:rgba(249,115,22,.32);
  --gr:#60a5fa;--grb:rgba(96,165,250,.12);--grd:rgba(96,165,250,.32);
  --es:#a78bfa;--esb:rgba(167,139,250,.12);--esd:rgba(167,139,250,.32);
  --so:#34d399;--sob:rgba(52,211,153,.12);--sod:rgba(52,211,153,.32);
  --di:#f472b6;--dib:rgba(244,114,182,.12);--did:rgba(244,114,182,.32);
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(37,217,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 15% 8%,rgba(167,139,250,.14),transparent 30%),radial-gradient(ellipse at 85% 10%,rgba(249,115,22,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1040px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--ag),#fff 40%,var(--es));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:4px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:7px 10px;font-weight:800;font-family:var(--font);font-size:.72rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.1rem;line-height:1}.etab-label{font-size:.58rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:90px}.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;transition:width .35s;background:linear-gradient(90deg,var(--ag),var(--es))}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:0 11px 11px 0;font-size:.88rem;line-height:1.6;border-left:4px solid}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-color:var(--good);color:#bbf7d0}
.fb.partial{background:rgba(245,158,11,.1);border-color:var(--warn);color:#fde68a}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#00bfff);color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.btn-audio{background:rgba(37,217,255,.12);border:1.5px solid rgba(37,217,255,.28);color:var(--cyan);border-radius:8px;padding:4px 10px;font-size:.74rem;font-weight:800;cursor:pointer;transition:.13s;font-family:var(--font);display:inline-flex;align-items:center;gap:4px}
.btn-audio:hover{background:rgba(37,217,255,.22)}
/* TYPE PILLS */
.pill-ag{display:inline-block;background:var(--agb);border:1px solid var(--agd);color:#fb923c;border-radius:6px;padding:1px 8px;font-weight:900;font-size:.82rem}
.pill-gr{display:inline-block;background:var(--grb);border:1px solid var(--grd);color:#93c5fd;border-radius:6px;padding:1px 8px;font-weight:900;font-size:.82rem}
.pill-es{display:inline-block;background:var(--esb);border:1px solid var(--esd);color:#c4b5fd;border-radius:6px;padding:1px 8px;font-weight:900;font-size:.82rem}
.pill-so{display:inline-block;background:var(--sob);border:1px solid var(--sod);color:#6ee7b7;border-radius:6px;padding:1px 8px;font-weight:900;font-size:.82rem}
.pill-di{display:inline-block;background:var(--dib);border:1px solid var(--did);color:#f9a8d4;border-radius:6px;padding:1px 8px;font-weight:900;font-size:.82rem}
.tilde{color:var(--ag);font-weight:900}
/* WORD DISPLAY */
.word-big{font-family:var(--display);font-size:2.4rem;font-weight:900;letter-spacing:.04em;line-height:1.2}
.syl-box{display:inline-flex;align-items:flex-end;gap:2px}
.syl{display:inline-block;padding:2px 1px;font-size:inherit;font-weight:inherit}
.syl.tonic{color:var(--ag);border-bottom:3px solid var(--ag);padding-bottom:0}
/* EXPL */
.expl-section{margin-bottom:22px}
.expl-h{font-family:var(--display);font-size:1rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.type-card{border-radius:16px;padding:16px 18px;margin-bottom:12px;border:1.5px solid}
.rule-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.rule-box{border-radius:12px;padding:12px 14px;font-size:.87rem;line-height:1.7}
.word-ex{font-family:var(--display);font-size:1rem;font-weight:800}
.diac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.diac-card{border-radius:13px;padding:13px 16px;background:rgba(244,114,182,.07);border:1.5px solid rgba(244,114,182,.25)}
.diac-pair{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.diac-w{font-family:var(--display);font-size:1.1rem;font-weight:900}
.diac-def{font-size:.78rem;color:var(--muted);line-height:1.5}
/* FC */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-prow{display:flex;align-items:center;gap:12px;width:100%;max-width:680px}
.fc-cnt{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.fc-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.fc-fil{height:100%;border-radius:999px;transition:width .4s;background:linear-gradient(90deg,var(--ag),var(--es))}
.fc-card{width:100%;max-width:680px;min-height:240px;perspective:1000px;cursor:pointer}
.fc-inner{position:relative;width:100%;min-height:240px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:20px;padding:22px 26px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:240px;background:rgba(249,115,22,.07);border:1.5px solid rgba(249,115,22,.3)}
.fc-back{transform:rotateY(180deg);background:rgba(167,139,250,.07);border-color:rgba(167,139,250,.3)}
.fc-nav{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:680px}
/* MC */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.mc-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.mc-q{font-size:1rem;line-height:1.7;margin-bottom:8px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px}
.mc-opt{border:0;border-radius:10px;padding:8px 16px;font-weight:800;font-family:var(--display);font-size:.9rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.merr{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mshow{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-exp{display:none;font-size:.8rem;color:var(--muted);line-height:1.6;margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-exp.show{display:block}
/* TILDE OR NOT (binary) */
.tn-list{display:flex;flex-direction:column;gap:10px}
.tn-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:15px 18px}
.tn-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.tn-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.tn-word{font-family:var(--display);font-size:1.8rem;font-weight:900;margin-bottom:4px}
.tn-hint{font-size:.78rem;color:var(--muted2);margin-bottom:10px}
.tn-choice{display:flex;gap:10px}
.tn-btn{border:0;border-radius:11px;padding:9px 22px;font-weight:900;font-family:var(--display);font-size:1rem;cursor:pointer;transition:.14s;border:2px solid}
.tn-btn.y{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:#86efac}
.tn-btn.n{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25);color:#fca5a5}
.tn-btn:hover:not([disabled]){transform:translateY(-2px);filter:brightness(1.2)}
.tn-btn[disabled]{cursor:default;transform:none}
.tn-btn.vok{border-color:var(--good);background:rgba(34,197,94,.2);color:#86efac}
.tn-btn.verr{border-color:var(--bad);background:rgba(239,68,68,.16);color:#fca5a5}
.tn-exp{display:none;font-size:.8rem;color:var(--muted);margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.6}
.tn-exp.show{display:block}
/* FILL */
.fill-list{display:flex;flex-direction:column;gap:12px}
.fill-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;padding:15px 17px}
.fill-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.fill-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.fill-q{font-size:1rem;line-height:1.9;font-weight:600;margin-bottom:6px}
.fill-hint{font-size:.76rem;color:var(--muted2);font-style:italic;margin-bottom:10px}
.fill-blank{display:inline-block;border-bottom:2.5px solid var(--ag);min-width:80px;text-align:center;padding:0 4px;color:#fb923c;font-weight:800;font-family:var(--display);font-size:1rem}
.fill-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.fill-chip{border:0;border-radius:9px;padding:7px 14px;font-weight:800;font-family:var(--display);font-size:.95rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);color:var(--text)}
.fill-chip:hover:not([disabled]):not(.used){transform:translateY(-2px)}
.fill-chip.used{opacity:.22;cursor:not-allowed}
.fill-chip.chip-ok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.fill-chip.chip-err{border-color:var(--bad);background:rgba(239,68,68,.15);color:#fca5a5}
.fill-exp{display:none;font-size:.8rem;color:var(--muted);margin-top:6px;padding:7px 10px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.6}
.fill-exp.show{display:block}
/* DIAC exercise */
.diac-ex-list{display:flex;flex-direction:column;gap:12px}
.diac-ex-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;padding:15px 17px}
.diac-ex-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.diac-ex-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.diac-q{font-size:.97rem;line-height:1.85;font-weight:600;margin-bottom:10px}
.diac-blank{display:inline-block;min-width:55px;text-align:center;border-bottom:2.5px solid var(--di);color:#f9a8d4;font-weight:900;font-family:var(--display)}
.diac-choice{display:flex;gap:8px;flex-wrap:wrap}
.diac-btn{border:0;border-radius:10px;padding:9px 20px;font-weight:900;font-family:var(--display);font-size:1.05rem;cursor:pointer;transition:.14s;background:var(--dib);border:2px solid var(--did);color:#f9a8d4}
.diac-btn:hover:not([disabled]){transform:translateY(-2px);filter:brightness(1.15)}
.diac-btn[disabled]{cursor:default;transform:none}
.diac-btn.dok{border-color:var(--good);background:rgba(34,197,94,.2);color:#86efac}
.diac-btn.derr{border-color:var(--bad);background:rgba(239,68,68,.15);color:#fca5a5}
.diac-btn.dshow{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.diac-exp{display:none;font-size:.8rem;color:var(--muted);margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.6}
.diac-exp.show{display:block}
/* SPEED */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(249,115,22,.25);border-radius:18px;padding:22px;text-align:center;width:100%;max-width:560px}
.sp-q{font-family:var(--display);font-size:1.6rem;font-weight:900;margin-bottom:8px;letter-spacing:.03em}
.sp-hint{font-size:.83rem;color:var(--muted2);font-style:italic;margin-top:4px}
.sp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:560px}
.sp-opt{border:0;border-radius:12px;padding:10px 14px;font-weight:900;font-family:var(--display);font-size:1rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:var(--text)}
.sp-opt:hover:not([disabled]){transform:translateY(-2px);border-color:rgba(249,115,22,.5)}
.sp-opt[disabled]{cursor:default;transform:none}
.sp-opt.spok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.sp-opt.sperr{border-color:var(--bad);background:rgba(239,68,68,.14);color:#fca5a5}
.sp-opt.spshow{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:560px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}
/* REF table */
.ref-table{width:100%;border-collapse:collapse;font-size:.87rem;margin-bottom:14px}
.ref-table th{padding:9px 12px;text-align:left;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08)}
.ref-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.ref-table tr:hover td{background:rgba(255,255,255,.03)}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.panel{padding:14px 12px}.rule-row{grid-template-columns:1fr}.sp-opts{grid-template-columns:1fr}.diac-grid{grid-template-columns:1fr}}

/* YMF brand v2 */
.logo-box,.hero .logo,.logoBox{padding:0!important;overflow:hidden!important;background:#0c0030!important;border:2px solid rgba(37,217,255,.28)!important;box-shadow:0 0 18px rgba(255,43,191,.18)!important}
img.ymf-logo{width:72px!important;height:72px!important;max-width:72px!important;object-fit:cover!important;border-radius:18px!important;padding:0!important;display:block}
.logo-box>img.ymf-logo,.hero .logo>img.ymf-logo,.logoBox>img.ymf-logo{width:100%!important;height:100%!important;max-width:none!important;border-radius:inherit!important}
.logo-box .logoText,.logoBox .logoText{display:none!important}
.hero-text h1,.hero h1,.app>header h1,header .brand~h1{background:linear-gradient(90deg,#ff4fd8,#ffffff 48%,#25d9ff)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;font-family:'Syne','DM Sans',system-ui,sans-serif!important}
.app>header:not(.hero){background:radial-gradient(circle at top right,rgba(37,217,255,.16),transparent 38%),linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e)!important;border-bottom:1px solid rgba(37,217,255,.13)}

<script>
let _voice=null;
function initVoice(){if(!window.speechSynthesis)return;const pick=()=>{const vs=window.speechSynthesis.getVoices();if(!vs.length)return;const tests=[v=>v.name==='Paulina',v=>v.name.includes('Paulina'),v=>v.lang==='es-MX'&&v.localService,v=>v.lang==='es-MX',v=>v.name.includes('Google')&&v.lang.startsWith('es'),v=>v.lang.startsWith('es')&&v.localService,v=>v.lang.startsWith('es')];for(const t of tests){const f=vs.find(t);if(f){_voice=f;break;}}};pick();if(window.speechSynthesis.onvoiceschanged!==undefined)window.speechSynthesis.onvoiceschanged=pick;setTimeout(pick,800);}
initVoice();
function speak(txt,btn){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);if(_voice)u.voice=_voice;u.lang='es-MX';u.rate=0.82;u.pitch=1;if(btn){btn.classList.add('playing');const o=btn.textContent;btn.textContent='🔊▶';u.onend=u.onerror=()=>{btn.classList.remove('playing');btn.textContent=o;};}window.speechSynthesis.speak(u);}
function seededShuffle(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderExpl(){
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📖 Spanish Accents — Complete Guide</div>

  <!-- INTRO -->
  <div class="expl-section">
    <div class="expl-h" style="color:var(--cyan)">🧠 What is the accent?</div>
    <div style="background:rgba(37,217,255,.07);border:1.5px solid rgba(37,217,255,.2);border-radius:14px;padding:15px 18px;margin-bottom:12px;font-size:.91rem;line-height:1.75">
      <p>The <strong>accent</strong> (acento) is the extra force or stress we place on one syllable when pronouncing a word — that syllable is called the <strong>stressed syllable</strong> (sílaba tónica).</p>
      <p style="margin-top:8px;color:var(--muted)">There are three types: <strong style="color:#fb923c">prosódico</strong> (only pronounced, never written), <strong style="color:#c4b5fd">ortográfico</strong> (written as an accent mark ´, called tilde), and <strong style="color:#f9a8d4">diacrítico</strong> (distinguishes identical words with different meanings).</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:4px">
      <div style="background:rgba(249,115,22,.08);border:1.5px solid rgba(249,115,22,.25);border-radius:12px;padding:12px 14px;font-size:.85rem">
        <div style="font-weight:900;color:#fb923c;margin-bottom:4px">🔉 Prosódico</div>
        <div style="color:var(--muted)">Only pronounced — not represented with a written accent mark. Most independent words have a stressed syllable, but not every stressed syllable is marked with a tilde.</div>
        <div style="margin-top:6px;font-family:var(--display)">ca-<span style="color:#fb923c;font-weight:900">SA</span> · li-<span style="color:#fb923c;font-weight:900">BRO</span> · a-<span style="color:#fb923c;font-weight:900">MOR</span></div>
      </div>
      <div style="background:rgba(167,139,250,.08);border:1.5px solid rgba(167,139,250,.25);border-radius:12px;padding:12px 14px;font-size:.85rem">
        <div style="font-weight:900;color:#c4b5fd;margin-bottom:4px">´ Ortográfico (tilde)</div>
        <div style="color:var(--muted)">Written according to the rules. Only used when the word type and ending match the conditions below.</div>
        <div style="margin-top:6px;font-family:var(--display)"><span style="color:#c4b5fd">caf<span style="color:#fb923c">é</span></span> · <span style="color:#c4b5fd"><span style="color:#fb923c">á</span>rbol</span> · <span style="color:#c4b5fd">m<span style="color:#fb923c">ú</span>sica</span></div>
      </div>
      <div style="background:rgba(244,114,182,.08);border:1.5px solid rgba(244,114,182,.25);border-radius:12px;padding:12px 14px;font-size:.85rem">
        <div style="font-weight:900;color:#f9a8d4;margin-bottom:4px">🔀 Diacrítico</div>
        <div style="color:var(--muted)">Distinguishes identical words with different meanings or grammatical roles. Very common with one-syllable words.</div>
        <div style="margin-top:6px;font-family:var(--display)"><span style="color:#f9a8d4">él</span> ≠ el · <span style="color:#f9a8d4">tú</span> ≠ tu · <span style="color:#f9a8d4">sí</span> ≠ si</div>
      </div>
    </div>
  </div>

  <!-- 4 WORD CATEGORIES -->
  <div class="expl-section">
    <div class="expl-h" style="color:#fb923c">🔤 The 4 word categories based on stress</div>

    <div class="type-card" style="background:var(--agb);border-color:var(--agd);margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span class="pill-ag">AGUDA</span>
        <span style="font-size:.85rem;color:var(--muted)">Stress on the <strong style="color:#fb923c">last syllable</strong></span>
      </div>
      <div class="rule-row">
        <div class="rule-box" style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2)">
          <div style="font-size:.65rem;font-weight:900;color:var(--good);text-transform:uppercase;margin-bottom:6px">✅ Gets a tilde if it ends in…</div>
          <div style="font-family:var(--display);font-size:1.1rem;font-weight:900;color:var(--good);margin-bottom:8px">vowel · N · S</div>
          <div style="font-size:.84rem;line-height:1.8">
            caf<span class="tilde">é</span> · can-ci<span class="tilde">ó</span>n · pa-<span class="tilde">í</span>s<br>
            tam-bi<span class="tilde">é</span>n · beb<span class="tilde">é</span>s · ven-dr<span class="tilde">á</span>
          </div>
        </div>
        <div class="rule-box" style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.18)">
          <div style="font-size:.65rem;font-weight:900;color:var(--bad);text-transform:uppercase;margin-bottom:6px">❌ No tilde if it ends in…</div>
          <div style="font-family:var(--display);font-size:1.1rem;font-weight:900;color:var(--bad);margin-bottom:8px">any other consonant</div>
          <div style="font-size:.84rem;line-height:1.8">
            a-mor · pa-pel · re-loj<br>
            ciu-dad · ve-loz · co-mer
          </div>
        </div>
      </div>
      <div style="font-size:.76rem;color:var(--muted2);margin-top:6px">* These are the general rules. A few special cases, such as some words ending in consonant groups, follow additional conventions.</div>
    </div>

    <div class="type-card" style="background:var(--grb);border-color:var(--grd);margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span class="pill-gr">GRAVE / LLANA</span>
        <span style="font-size:.85rem;color:var(--muted)">Stress on the <strong style="color:#93c5fd">second-to-last syllable</strong></span>
      </div>
      <div class="rule-row">
        <div class="rule-box" style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2)">
          <div style="font-size:.65rem;font-weight:900;color:var(--good);text-transform:uppercase;margin-bottom:6px">✅ Gets a tilde if it ends in…</div>
          <div style="font-family:var(--display);font-size:1.1rem;font-weight:900;color:var(--good);margin-bottom:8px">consonant ≠ N or S</div>
          <div style="font-size:.84rem;line-height:1.8">
            <span class="tilde">á</span>r-bol · l<span class="tilde">á</span>-piz · <span class="tilde">á</span>n-gel<br>
            f<span class="tilde">á</span>-cil · a-z<span class="tilde">ú</span>-car · c<span class="tilde">á</span>r-cel
          </div>
        </div>
        <div class="rule-box" style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.18)">
          <div style="font-size:.65rem;font-weight:900;color:var(--bad);text-transform:uppercase;margin-bottom:6px">❌ No tilde if it ends in…</div>
          <div style="font-family:var(--display);font-size:1.1rem;font-weight:900;color:var(--bad);margin-bottom:8px">vowel · N · S</div>
          <div style="font-size:.84rem;line-height:1.8">
            ca-sa · li-bro · co-men<br>
            ha-blas · ma-dre · e-xa-men

      </div>
      <div style="font-size:.76rem;color:var(--muted2);margin-top:6px">* Most Spanish words are <em>grave</em> — they are the most common type.</div>

    <div class="type-card" style="background:var(--esb);border-color:var(--esd);margin-bottom:10px">

      <div class="diac-card"><div class="diac-pair"><div><div class="diac-w">aun <span style="color:var(--muted2)">vs</span> <span style="color:#f9a8d4">aún</span></div><div class="diac-def"><strong>aun</strong> = even / including (aun así = even so)<br><strong style="color:#f9a8d4">aún</strong> = still / yet (aún no llega = he still has not arrived)</div></div></div></div>

      <div class="diac-card"><div class="diac-pair"><div><div class="diac-w">como <span style="color:var(--muted2)">vs</span> <span style="color:#f9a8d4">cómo</span></div><div class="diac-def"><strong>como</strong> = like / as / I eat (como tú · como tacos)<br><strong style="color:#f9a8d4">cómo</strong> = how (question word) (¿cómo te llamas? = what is your name?)</div></div></div></div>

function renderClasifica(){
  classAns={};
  const opts=['aguda','grave','esdrújula','sobresdrújula'];
  const html=CLASS.map((item,i)=>{
    const done=classAns[i]!==undefined;
    const btns=opts.map(o=>{
      let cls='mc-opt';
      if(done){if(o===item.ans)cls+=' mshow';else if(classAns[i]===o&&o!==item.ans)cls+=' merr';}
      return `<button class="${cls}" onclick="answerClass(${i},'${o}')" ${done?'disabled':''}>${o}</button>`;

function renderDiac(){
  diacAns={};
  const html=DIAC.map((item,i)=>{
    const done=diacAns[i]!==undefined;const isOk=done&&diacAns[i]===item.correct;
    const btns=item.blankopts.map(o=>{
      let cls='diac-btn';
      if(done){if(o===item.correct)cls+=' dshow';else if(diacAns[i]===o&&o!==item.correct)cls+=' derr';}
      return `<button class="${cls}" onclick="answerDiac(${i},'${o.replace(/'/g,"\\'")}',this)" ${done?'disabled':''}>${o}</button>`;
    }).join('');
    return `<div class="diac-ex-card${done?(isOk?' ok':' err'):''}" id="diac${i}">
      <div class="diac-q">${item.q.replace('___','<span class="diac-blank" id="dbl${i}">___</span>')}</div>
      <div class="diac-choice">${btns}</div>
      <div class="diac-exp${done?' show':''}" id="dexp${i}">${done?(isOk?'✓ ':'✗ ')+item.x:''}</div>
    </div>`;
  }).join('');
  const done=Object.keys(diacAns).length;const ok=DIAC.filter((_,i)=>diacAns[i]===DIAC[i].correct).length;const tot=DIAC.length;
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">🔀 Diacritics — ${tot} sentences</div>
  <div class="ex-instr">Choose the correct form based on context. Diacritical pairs are spelled the same except for the accent mark, but have different grammatical roles. <span class="pill-di">Read the context carefully</span> — it is the only clue.</div>
  <div class="score-bar"><div class="sc"><span class="l">Total</span><span class="v">${tot}</span></div><div class="sc"><span class="l">OK</span><span class="v g" id="di_ok">${ok}</span></div><div class="sc"><span class="l">Miss</span><span class="v b" id="di_err">${done-ok}</span></div><div class="prog-w"><div class="prog-l"><span id="di_pct">${Math.round(done/tot*100)}%</span></div><div class="prog-t"><div class="prog-f" id="di_pg" style="width:${Math.round(done/tot*100)}%"></div></div></div></div>
  <div class="diac-ex-list">${html}</div>
  <div class="fb" id="di_fb"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="diacAns={};renderDiac()">↺ Reset</button></div></div>`;
}
function answerDiac(qi,chosen,btn){
  if(diacAns[qi]!==undefined)return;
  const item=DIAC[qi];const isOk=chosen===item.correct;diacAns[qi]=chosen;
  document.getElementById('diac'+qi).classList.add(isOk?'ok':'err');
  const bl=document.getElementById('dbl'+qi);if(bl)bl.textContent=chosen;
  btn.parentElement.querySelectorAll('.diac-btn').forEach(b=>{b.disabled=true;if(b.textContent===item.correct)b.classList.add('dshow');else if(b===btn&&!isOk)b.classList.add('derr');});
  const e=document.getElementById('dexp'+qi);if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ ':'✗ ')+item.x;}
  const done=Object.keys(diacAns).length;const ok=DIAC.filter((_,i)=>diacAns[i]===DIAC[i].correct).length;
  document.getElementById('di_ok').textContent=ok;document.getElementById('di_err').textContent=done-ok;
  document.getElementById('di_pct').textContent=Math.round(done/DIAC.length*100)+'%';
  document.getElementById('di_pg').style.width=Math.round(done/DIAC.length*100)+'%';
  if(done===DIAC.length){const pct=Math.round(ok/done*100);const fb=document.getElementById('di_fb');fb.className='fb show '+(pct>=80?'ok':'partial');fb.innerHTML=`${pct>=80?'🏆':'📖'} <strong>${ok}/${done}.</strong> ${pct>=80?'You have mastered the diacritical accents!':'Remember: context is everything — is it an article or pronoun? A question word or a relative?'}`;}
}

    <div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:12px 15px;font-size:.84rem;line-height:1.75">
      <div style="font-weight:900;color:var(--warn);margin-bottom:6px">📝 Adverbs ending in -mente</div>
      They keep the tilde of the base adjective:<br>
      <span style="font-family:var(--display)">rápido → rápidamente · fácil → fácilmente · difícil → difícilmente</span>
    </div>
  </div>
  </div>`;
}
