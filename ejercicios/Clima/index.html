<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Clima y la Ropa | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --clima:#60a5fa;--clima2:#93c5fd;--climabg:rgba(96,165,250,.1);--climabd:rgba(96,165,250,.3);
  --ropa:#f472b6;--ropa2:#ff91cd;--ropabg:rgba(244,114,182,.1);--ropabd:rgba(244,114,182,.3);
  --mex:#34d399;--mex2:#6ee7b7;--mexbg:rgba(52,211,153,.1);--mexbd:rgba(52,211,153,.3);
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 12% 8%,rgba(96,165,250,.13),transparent 32%),radial-gradient(ellipse at 88% 10%,rgba(52,211,153,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--clima),#fff 45%,var(--mex));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:4px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:7px 10px;font-weight:800;font-family:var(--font);font-size:.72rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.1rem;line-height:1}
.etab-label{font-size:.58rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:90px}.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;transition:width .35s;background:linear-gradient(90deg,var(--clima),var(--mex))}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#00bfff);color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}
.btn-audio{background:rgba(37,217,255,.12);border:1.5px solid rgba(37,217,255,.28);color:var(--cyan);border-radius:8px;padding:4px 10px;font-size:.74rem;font-weight:800;cursor:pointer;transition:.13s;font-family:var(--font);display:inline-flex;align-items:center;gap:4px}
.btn-audio:hover{background:rgba(37,217,255,.22)}.btn-audio.playing{animation:ablink .8s infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.5}}
/* FLASHCARDS */
.fc-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fc-fbtn{border:0;border-radius:9px;padding:5px 13px;font-size:.73rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);color:var(--muted);border:1.5px solid transparent}
.fc-fbtn.active{color:white}
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-prow{display:flex;align-items:center;gap:12px;width:100%;max-width:660px}
.fc-cnt{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.fc-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.fc-fil{height:100%;border-radius:999px;transition:width .4s}
.fc-card{width:100%;max-width:660px;min-height:260px;perspective:1000px;cursor:pointer}
.fc-inner{position:relative;width:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:20px;padding:24px 26px;backface-visibility:hidden;display:flex;flex-direction:column;gap:9px;min-height:260px}
.fc-back{transform:rotateY(180deg)}
.fc-emoji{font-size:3rem;line-height:1}
.fc-es{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1.1}
.fc-en{font-size:.95rem;font-weight:600;color:var(--muted)}
.fc-pron{font-size:.8rem;color:var(--muted2);font-style:italic}
.fc-ex{font-size:.88rem;line-height:1.65;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:10px}
.fc-note{font-size:.77rem;color:var(--muted2);line-height:1.5;padding:7px 12px;background:rgba(255,255,255,.04);border-radius:8px}
.fc-hint{font-size:.72rem;color:var(--muted2);text-align:center;font-style:italic;margin-top:auto}
.fc-nav{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:660px}
/* MC */
.mc-grid{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.mc-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.07);border-radius:6px;padding:3px 8px;flex-shrink:0;margin-top:2px}
.mc-q{font-size:.98rem;line-height:1.65;flex:1}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px}
.mc-opt{border:0;border-radius:10px;padding:8px 15px;font-weight:700;font-family:var(--font);font-size:.9rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px);border-color:rgba(37,217,255,.35)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.merr{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mshow{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-exp{display:none;font-size:.79rem;color:var(--muted);line-height:1.6;margin-top:7px;padding:7px 12px 7px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-exp.show{display:block}
/* ROPA VISUAL CARDS */
.ropa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ropa-card{border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:.14s}
.ropa-card:hover{transform:translateY(-2px)}
.ropa-card.ok{border-color:var(--good)}
.ropa-card.err{border-color:var(--bad)}
.ropa-emoji-box{font-size:3rem;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#180a30,#240f44);min-height:100px;position:relative}
.ropa-weather{position:absolute;top:8px;right:8px;font-size:1.4rem}
.ropa-q{padding:10px 14px 6px;font-size:.9rem;font-weight:700;line-height:1.4}
.ropa-qen{font-size:.74rem;color:var(--muted2);font-style:italic;display:block;margin-top:2px;padding:0 14px 8px}
.ropa-opts{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ropa-opt{border:0;padding:10px 8px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;color:white;transition:.12s;line-height:1.3;text-align:center}
.ropa-opt:nth-child(1){background:#7c3aed}.ropa-opt:nth-child(2){background:#1d4ed8}
.ropa-opt:nth-child(3){background:#b45309}.ropa-opt:nth-child(4){background:#065f46}
.ropa-opt:hover:not([disabled]){filter:brightness(1.2)}
.ropa-opt[disabled]{cursor:default}
.ropa-opt.r-ok{box-shadow:inset 0 0 0 3px #86efac}
.ropa-opt.r-err{opacity:.35}
.ropa-exp{display:none;font-size:.76rem;padding:8px 12px;background:rgba(0,0,0,.3);color:var(--muted);line-height:1.5;text-align:center}
.ropa-exp.show{display:block}
/* DIAL */
.dial-wrap{display:flex;flex-direction:column;gap:16px}
.chat-scene{font-size:.75rem;color:var(--muted2);font-style:italic;padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.03);border-left:3px solid rgba(255,255,255,.08);margin-bottom:4px}
.chat-body{display:flex;flex-direction:column;gap:8px;padding:0 0 10px}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row.right{flex-direction:row-reverse}
.chat-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;background:rgba(255,255,255,.08)}
.chat-bub{max-width:80%;padding:9px 13px;border-radius:16px;font-size:.9rem;line-height:1.55}
.chat-row.left .chat-bub{background:rgba(255,255,255,.09);border-radius:4px 16px 16px 16px}
.chat-row.right .chat-bub{background:rgba(96,165,250,.16);border:1px solid rgba(96,165,250,.22);border-radius:16px 4px 16px 16px}
.chat-who{font-size:.6rem;font-weight:900;text-transform:uppercase;color:var(--muted2);margin-bottom:3px}
.chat-en{font-size:.73rem;color:var(--muted2);font-style:italic;margin-top:3px}
.chat-audio{background:none;border:0;cursor:pointer;font-size:.9rem;padding:2px 4px;border-radius:5px;opacity:.55;transition:.13s}
.chat-audio:hover{opacity:1;background:rgba(255,255,255,.1)}
.dial-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
.dial-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.dial-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.dial-q{font-size:.87rem;font-weight:700;color:var(--muted);margin:10px 0 8px}
.dial-opts{display:flex;flex-direction:column;gap:7px}
.dial-opt{border:0;border-radius:10px;padding:10px 15px;font-weight:600;font-family:var(--font);font-size:.9rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:var(--text);text-align:left}
.dial-opt:hover:not([disabled]){transform:translateX(4px);border-color:rgba(37,217,255,.35)}
.dial-opt[disabled]{cursor:default;transform:none}
.dial-opt.dok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.dial-opt.derr{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.dial-opt.dshow{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.dial-exp{display:none;font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:8px}
.dial-exp.show{display:block}
/* FILL */
.fill-list{display:flex;flex-direction:column;gap:12px}
.fill-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;padding:15px 17px}
.fill-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.fill-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.fill-ctx{font-size:.72rem;color:var(--muted2);font-style:italic;margin-bottom:6px}
.fill-q{font-size:1rem;line-height:1.85;font-weight:600;margin-bottom:4px}
.fill-en{font-size:.76rem;color:var(--muted2);font-style:italic;margin-bottom:10px}
.fill-blank{display:inline-block;border-bottom:2.5px solid var(--cyan);min-width:90px;text-align:center;padding:0 4px;color:var(--cyan);font-weight:800;font-family:var(--display);font-size:1rem}
.fill-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.fill-chip{border:0;border-radius:9px;padding:7px 14px;font-weight:700;font-family:var(--display);font-size:.9rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);color:var(--text)}
.fill-chip:hover:not([disabled]):not(.used){transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.fill-chip.used{opacity:.22;cursor:not-allowed}
.fill-chip.chip-ok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.fill-chip.chip-err{border-color:var(--bad);background:rgba(239,68,68,.15);color:#fca5a5}
.fill-exp{display:none;font-size:.8rem;color:var(--muted);margin-top:6px;padding:7px 10px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.55}
.fill-exp.show{display:block}
/* SPEED */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:22px;text-align:center;width:100%;max-width:540px}
.sp-emoji{font-size:3rem;margin-bottom:6px}
.sp-q{font-size:1rem;line-height:1.6}
.sp-en{font-size:.82rem;color:var(--muted2);font-style:italic;margin-top:3px}
.sp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:540px}
.sp-opt{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:var(--text);text-align:left}
.sp-opt:hover:not([disabled]){transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sp-opt[disabled]{cursor:default;transform:none}
.sp-opt.spok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.sp-opt.sperr{border-color:var(--bad);background:rgba(239,68,68,.14);color:#fca5a5}
.sp-opt.spshow{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:540px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}
/* REF */
.ref-search{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.25);color:var(--text);border-radius:11px;padding:10px 16px;font-family:var(--font);font-size:.95rem;outline:none;transition:.15s;margin-bottom:12px}
.ref-search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.ref-search::placeholder{color:var(--muted2)}
.ref-row{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);flex-wrap:wrap;transition:.12s;cursor:pointer}
.ref-row:hover{background:rgba(255,255,255,.03)}
.rr-em{font-size:1.4rem;width:30px;text-align:center;flex-shrink:0}
.rr-es{font-family:var(--display);font-weight:900;font-size:.95rem;min-width:170px}
.rr-en{color:var(--muted2);font-style:italic;font-size:.82rem;flex:1}
.rr-note{font-size:.7rem;color:var(--muted2);width:100%;padding-top:3px;border-top:1px solid rgba(255,255,255,.04)}
.hl{background:rgba(37,217,255,.2);border-radius:3px;padding:0 2px}
/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cal-month{border-radius:12px;padding:10px 12px;text-align:center;border:1.5px solid rgba(255,255,255,.08)}

function speak(text,btn){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();document.querySelectorAll('.btn-audio,.chat-audio').forEach(b=>{b.classList.remove('playing');if(b.textContent.includes('▶'))b.textContent='🔊';});const u=new SpeechSynthesisUtterance(text);if(_voice)u.voice=_voice;u.lang=_voice?_voice.lang:'es-MX';u.rate=0.82;u.pitch=1;if(btn){btn.classList.add('playing');const orig=btn.textContent;btn.textContent='🔊▶';u.onend=u.onerror=()=>{btn.classList.remove('playing');btn.textContent=orig;};}window.speechSynthesis.speak(u);}

function renderDial(){
  dialAns={};

    const msgs=d.chat.map(m=>`<div class="chat-row ${m.side}">

      </div>

    const opts=d.opts.map((o,oi)=>`<button class="dial-opt" id="do${i}_${oi}" onclick="answerDial(${i},${oi})">${o}</button>`).join('');

function answerDial(qi,oi){
  if(dialAns[qi]!==undefined)return;
  const d=DIALS[qi];const isOk=oi===d.a;
  dialAns[qi]=isOk;
  const card=document.getElementById('dc'+qi);if(card)card.classList.add(isOk?'ok':'err');
  d.opts.forEach((_,x)=>{const b=document.getElementById(`do${qi}_${x}`);if(!b)return;b.disabled=true;if(x===d.a)b.classList.add('dshow');else if(x===oi&&!isOk)b.classList.add('derr');});
  const e=document.getElementById('de'+qi);if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ ':'✗ ')+d.exp;}
  const tot=Object.keys(dialAns).length;const ok=Object.values(dialAns).filter(v=>v).length;
  document.getElementById('da_ok').textContent=ok;document.getElementById('da_err').textContent=tot-ok;
  document.getElementById('da_pct').textContent=Math.round(tot/DIALS.length*100)+'%';
  document.getElementById('da_pg').style.width=Math.round(tot/DIALS.length*100)+'%';
  if(tot===DIALS.length){const pct=Math.round(ok/tot*100);const fb=document.getElementById('da_fb');fb.className='fb show '+(pct>=85?'ok':'partial');fb.innerHTML=`${pct>=85?'🏆':'📖'} <strong>${ok}/${tot}.</strong> ${pct>=85?'¡Excelente! You understand Mexican weather talk!':'Review the flashcards and try again.'}`;}
}

   correct:'¿Va a llover la próxima semana?',
   wrong:['¿Llovía la próxima semana?','¿Lloverá mañana?','¿Hay lluvia próxima?'],
   exp:'"¿Va a llover?" is a natural question about future weather.'},
  {orig:'Hoy hace un calorón. (coloquial)',ctx:'How would you have described LAST SUMMER heat?',
   tense:'past',
   correct:'El verano pasado hacía un calorón todos los días.',
   wrong:['El verano pasado hizo un calorón todos los días.','El verano pasado hace un calorón.','El verano pasado había calorón.'],
   exp:'"Hacía un calorón" is a casual emphatic way to describe recurring intense heat in the past.'},
  {orig:'Ya paró de llover.',ctx:'How would you say the rain will probably stop soon?',
   tense:'future',
   correct:'Espera, ya va a dejar de llover.',
   wrong:['Espera, ya dejó de llover.','Espera, ya va a llover.','Espera, ya paraba de llover.'],
   exp:'"Va a dejar de llover" means it is going to stop raining. It is a natural everyday Mexican expression.'},
  {orig:'Hace viento hoy.',ctx:'What will the weather be NEXT WEDNESDAY according to the forecast?',
   tense:'future',
   correct:'El miércoles va a hacer viento.',
   wrong:['El miércoles hacía viento.','El miércoles hace viento.','El miércoles va viento.'],
   exp:'"Va a hacer viento" uses ir a + infinitive to talk about future weather.'},
  {orig:'Hay niebla en la carretera.',ctx:'Describe the fog that was there WHEN YOU DROVE (ongoing background).',
   tense:'past',
   correct:'Había mucha niebla cuando manejé.',
   wrong:['Hubo mucha niebla cuando manejé.','Estaba niebla cuando manejé.','Había niebla cuando manejo.'],
   exp:'"Había niebla" sets the scene; "manejé" is the specific completed action.'},
  {orig:'¡Qué frío!',ctx:'Your friend says it was like this EVERY MORNING last winter.',
   tense:'past',
   correct:'Todas las mañanas hacía mucho frío.',
   wrong:['Todas las mañanas hizo mucho frío.','Todas las mañanas hace frío.','Todas las mañanas había frío.'],
   exp:'"Hacía mucho frío" is used for repeated or ongoing cold weather in the past.'},
  {orig:'Está cayendo un aguacero.',ctx:'Warn your friend this will happen THIS AFTERNOON.',
   tense:'future',
   correct:'Esta tarde va a caer un aguacero.',
   wrong:['Esta tarde cayó un aguacero.','Esta tarde caía un aguacero.','Esta tarde hay cayó un aguacero.'],
   exp:'"Va a caer un aguacero" is a natural way to warn about a heavy downpour later today.'},
  {orig:'Está granizando afuera.',ctx:'How do you tell what happened LAST TUESDAY in CDMX?',
   tense:'past',
   correct:'El martes pasado hubo granizo en la CDMX.',
   wrong:['El martes pasado había granizo.','El martes pasado estaba granizo.','El martes pasado granizaba siempre.'],
   exp:'"Hubo granizo" describes a completed hail event on a specific day.'},
  {orig:'¡Aguas, ya va a tronar!',ctx:'How would you say the storm ALREADY PASSED?',
   tense:'past',
   correct:'Ya tronó. Ya pasó la tormenta.',
   wrong:['Ya tronaba.','Va a tronar mañana.','Ya trona.'],
   exp:'"Ya tronó" means it already thundered. "Ya pasó la tormenta" makes clear that the storm is over.'},
];

let trAns={};
function renderTransform(){
  trAns={};
  const tot=TRANSFORM.length;
  const html=TRANSFORM.map((item,i)=>{
    const opts=seededShuffle([item.correct,...item.wrong],i*11+7);
    const chips=opts.map((o,oi)=>`<button class="fill-chip" id="tc${i}_${oi}" onclick="answerTr(${i},${JSON.stringify(o).replace(/'/g,"\'")})">${o}</button>`).join('');
    const tensePill=item.tense==='past'?
      '<span style="background:rgba(96,165,250,.15);border:1px solid rgba(96,165,250,.3);color:var(--clima2);border-radius:999px;padding:2px 10px;font-size:.68rem;font-weight:900">↩️ Past</span>':
      '<span style="background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);color:var(--mex2);border-radius:999px;padding:2px 10px;font-size:.68rem;font-weight:900">→ Future</span>';
    return `<div class="fill-card" id="tcard${i}">
      <div class="fill-ctx">📌 ${tensePill} ${item.ctx}</div>
      <div style="font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:6px;color:var(--muted)">Original: <em style="color:var(--text)">${item.orig}</em></div>
      <div class="fill-chips" id="tch${i}">${chips}</div>
      <div class="fill-exp" id="texp${i}"></div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">🔀 Transforma — Presente → Pasado & Futuro</div>
  <div class="ex-instr">You see a weather sentence in the present. Transform it to the <em>past or future</em> as indicated. This is where grammar really matters — <em>hacía vs hizo, había vs hubo</em>.</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <div style="background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);border-radius:12px;padding:12px;font-size:.8rem;line-height:1.7">
      <div style="font-weight:900;color:var(--clima2);margin-bottom:4px">↩️ PAST — key forms</div>
      hace calor → <strong style="color:var(--clima2)">hacía</strong> calor (habit/description)<br>
      hace calor → <strong style="color:var(--clima2)">hizo</strong> calor (specific event)<br>
      hay tormenta → <strong style="color:var(--clima2)">había</strong> (background) / <strong style="color:var(--clima2)">hubo</strong> (event)<br>
      está lloviendo → <strong style="color:var(--clima2)">estaba</strong> lloviendo
    </div>
    <div style="background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);border-radius:12px;padding:12px;font-size:.8rem;line-height:1.7">
      <div style="font-weight:900;color:var(--mex2);margin-bottom:4px">→ FUTURE — natural Mexican Spanish</div>
      hace calor → <strong style="color:var(--mex2)">va a hacer</strong> calor<br>
      llueve → <strong style="color:var(--mex2)">va a llover</strong><br>
      hay tormenta → <strong style="color:var(--mex2)">va a haber</strong> tormenta<br>
      está nevando → <strong style="color:var(--mex2)">va a estar</strong> nevando
    </div>
  </div>
  <div class="score-bar"><div class="sc"><span class="l">Total</span><span class="v">${tot}</span></div><div class="sc"><span class="l">OK</span><span class="v g" id="tr_ok">0</span></div><div class="sc"><span class="l">Miss</span><span class="v b" id="tr_err">0</span></div><div class="prog-w"><div class="prog-l">Answered: <span id="tr_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="tr_pg" style="width:0%"></div></div></div></div>
  <div class="fill-list">${html}</div>
  <div class="fb" id="tr_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="trAns={};renderTransform()">↺ Reset</button></div></div>`;
}
function answerTr(qi,chosen){
  if(trAns[qi]!==undefined)return;
  const item=TRANSFORM[qi];const isOk=chosen===item.correct;
  trAns[qi]=isOk;
  document.getElementById('tcard'+qi).classList.add(isOk?'ok':'err');
  document.querySelectorAll(`[id^="tc${qi}_"]`).forEach(b=>{
    b.disabled=true;b.classList.add('used');
    if(b.textContent===item.correct)b.classList.add('chip-ok');
    else if(b.textContent===chosen&&!isOk)b.classList.add('chip-err');
  });
  const e=document.getElementById('texp'+qi);if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ ':'✗ ')+item.exp;}
  const tot=Object.keys(trAns).length;const ok=Object.values(trAns).filter(v=>v).length;
  document.getElementById('tr_ok').textContent=ok;document.getElementById('tr_err').textContent=tot-ok;
  document.getElementById('tr_pct').textContent=Math.round(tot/TRANSFORM.length*100)+'%';
  document.getElementById('tr_pg').style.width=Math.round(tot/TRANSFORM.length*100)+'%';
  if(tot===TRANSFORM.length){
    const pct=Math.round(ok/tot*100);const fb=document.getElementById('tr_fb');
    fb.className='fb show '+(pct>=75?'ok':'partial');
    fb.innerHTML=`${pct>=75?'🏆':'📖'} <strong>${ok}/${tot}.</strong> ${pct>=75?'¡Excelente! You can use weather in past AND future!':'Focus on había vs hubo and "va a hacer" for future.'}`;
  }
}


function renderSpeed(){
  const arr=seededShuffle([...SP],42);window.__sp=arr;
  spIdx=0;spOk=0;spErr=0;spStreak=0;spAns2={};
  document.getElementById('exContainer').innerHTML=`<div class="panel"><div class="ex-title">⚡ Speed round</div>
  <div class="ex-instr">See the emoji + English. Choose the correct Spanish. Watch the <em>verb</em> choices — grammar matters!</div>
  <div class="sp-wrap" id="spWrap"><div class="sp-start"><div style="font-size:2.8rem">⚡🌤️</div><h2>Clima + Ropa</h2><p style="color:var(--muted);max-width:400px">25 items — weather expressions, clothing vocabulary and Mexico climate facts.</p><button class="btn btn-cyan" onclick="startSp()">¡Empezamos!</button></div></div></div>`;
}
function startSp(){spIdx=0;spOk=0;spErr=0;spStreak=0;nextSp();}
function nextSp(){
  const arr=window.__sp;if(spIdx>=arr.length){endSp();return;}
  const item=arr[spIdx];
  const shuffled=seededShuffle([...item.opts],spIdx*13+5);
  const opts=shuffled.map(o=>`<button class="sp-opt" onclick="answerSp('${o.replace(/'/g,"\\'")}','${item.a.replace(/'/g,"\\'")}',this)">${o}</button>`).join('');
  document.getElementById('spWrap').innerHTML=`
    <div class="sp-stats"><div class="spst"><div class="sl">Q</div><div class="sv w">${spIdx+1}/${arr.length}</div></div><div class="spst"><div class="sl">OK</div><div class="sv g">${spOk}</div></div><div class="spst"><div class="sl">Miss</div><div class="sv b">${spErr}</div></div></div>
    <div class="streak${spStreak>=3?' on':''}" id="stk">🔥 x${spStreak}</div>
    <div class="sp-card"><div class="sp-emoji">${item.emoji}</div><div class="sp-q">${item.q}</div></div>
    <div class="sp-opts">${opts}</div>
    <div class="sp-fb" id="sFb" style="opacity:0"></div>`;
}
function answerSp(chosen,correct,btn){
  if(spAns2[spIdx])return;spAns2[spIdx]=true;
  const isOk=chosen===correct;
  if(isOk){spOk++;spStreak++;}else{spErr++;spStreak=0;}
  document.querySelectorAll('.sp-opt').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('spshow');else if(b===btn&&!isOk)b.classList.add('sperr');});
  const fb=document.getElementById('sFb');if(fb){fb.style.opacity='1';fb.className=`sp-fb ${isOk?'ok':'err'}`;fb.innerHTML=isOk?`✓ Correct!${spStreak>=3?' 🔥 x'+spStreak:''}`:`✗ "${correct}"`;}
  if(spStreak>=3){const cf=document.getElementById('cf');cf.textContent='🔥 x'+spStreak;cf.classList.remove('pop');void cf.offsetWidth;cf.classList.add('pop');}
  const stk=document.getElementById('stk');if(stk){stk.className='streak'+(spStreak>=3?' on':'');stk.textContent='🔥 x'+spStreak;}
  spIdx++;setTimeout(nextSp,isOk?800:1600);
}
function endSp(){
  const pct=Math.round(spOk/SP.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  document.getElementById('spWrap').innerHTML=`<div class="sp-start"><div style="font-size:3rem">${emo}</div><h2>${spOk}/${SP.length}</h2><p style="color:var(--muted)">${pct>=90?'¡Excelente! You know the weather and clothing!':pct>=70?'¡Muy bien! Getting there.':pct>=50?'Good start — keep practicing!':'Study the flashcards first.'}</p><button class="btn btn-cyan" onclick="startSp()">↺ Try again</button></div>`;
}

/* ══════════════════════════════════
   EX 6 — REFERENCE (searchable + Mexico climate calendar)
══════════════════════════════════ */
function buildRefRows(q){
  const sq=normS(q||'');
  const base=refFilter==='all'?VOC:VOC.filter(v=>v.cat===refFilter);
  const filtered=sq.length<2?base:base.filter(v=>normS(v.es).includes(sq)||normS(v.en).includes(sq)||normS(CATS[v.cat]?.label||'').includes(sq)||normS(v.note||'').includes(sq));
  const hl=str=>sq.length>=2?str.replace(new RegExp('('+sq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="hl">$1</span>'):str;
  let prev='';let html='';
  filtered.forEach(item=>{
    const cat=CATS[item.cat];
    if(item.cat!==prev){prev=item.cat;html+=`<div style="font-family:var(--display);font-size:.88rem;font-weight:900;padding:7px 12px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;margin:14px 0 8px;background:${cat.bg};color:${cat.col2}">${cat.label}</div>`;}
    html+=`<div class="ref-row" onclick="speak('${item.es.replace(/'/g,"\\'").replace(/\./g,'')}',null)">
      <div class="rr-em">${item.emoji}</div>
      <div class="rr-es" style="color:${cat.col2}">${hl(item.es)}</div>
      <div class="rr-en">${hl(item.en)}</div>
      ${item.note?`<div class="rr-note">💡 ${item.note.slice(0,80)}${item.note.length>80?'…':''}</div>`:''}
    </div>`;
  });
  return {count:filtered.length,html};
}

function updateRef(q){
  const {count,html}=buildRefRows(q);
  const el=document.getElementById('refRows');if(el)el.innerHTML=html;

}
