<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulario Mexicano | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --comida:#f97316;--comida2:#fdba74;
  --lugar:#34d399;--lugar2:#6ee7b7;
  --casa:#a78bfa;--casa2:#c4b5fd;
  --calle:#60a5fa;--calle2:#93c5fd;
  --fiestas:#f472b6;--fiestas2:#ff91cd;
  --extra:#fbbf24;--extra2:#fde68a;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 12% 8%,rgba(249,115,22,.13),transparent 30%),radial-gradient(ellipse at 88% 12%,rgba(52,211,153,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--comida),#fff 40%,var(--lugar));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:4px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:7px 10px;font-weight:800;font-family:var(--font);font-size:.72rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.1rem;line-height:1}
.etab-label{font-size:.58rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:90px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;transition:width .35s;background:linear-gradient(90deg,var(--comida),var(--lugar))}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}
/* ── AUDIO ── */
.btn-audio{background:rgba(37,217,255,.12);border:1.5px solid rgba(37,217,255,.28);color:var(--cyan);border-radius:8px;padding:4px 10px;font-size:.74rem;font-weight:800;cursor:pointer;transition:.13s;font-family:var(--font);display:inline-flex;align-items:center;gap:4px}
.btn-audio:hover{background:rgba(37,217,255,.22)}.btn-audio.playing{animation:ablink .8s infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.5}}
/* ── FLASHCARDS ── */
.fc-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fc-fbtn{border:0;border-radius:9px;padding:5px 13px;font-size:.73rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);color:var(--muted);border:1.5px solid transparent}
.fc-fbtn.active{color:white}
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-prow{display:flex;align-items:center;gap:12px;width:100%;max-width:660px}
.fc-cnt{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.fc-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.fc-fil{height:100%;border-radius:999px;transition:width .4s}
.fc-card{width:100%;max-width:660px;min-height:260px;perspective:1000px;cursor:pointer}
.fc-inner{position:relative;width:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:20px;padding:24px 26px;backface-visibility:hidden;display:flex;flex-direction:column;gap:8px;min-height:260px}
.fc-back{transform:rotateY(180deg)}
.fc-emoji{font-size:3rem;line-height:1}
.fc-es{font-family:var(--display);font-size:2.2rem;font-weight:900;line-height:1.1}
.fc-en{font-size:1rem;font-weight:600;color:var(--muted)}
.fc-pron{font-size:.8rem;color:var(--muted2);font-style:italic}
.fc-ex{font-size:.88rem;line-height:1.65;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:10px}
.fc-note{font-size:.78rem;color:var(--muted2);line-height:1.5;padding:7px 12px;background:rgba(255,255,255,.04);border-radius:8px}
.fc-hint{font-size:.72rem;color:var(--muted2);text-align:center;font-style:italic;margin-top:auto}
.fc-nav{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:660px}
/* ── PICTURE MATCH ── */
.pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pm-card{border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:transform .15s}
.pm-card:hover{transform:translateY(-2px)}
.pm-card.ok{border-color:var(--good);box-shadow:0 0 0 2px rgba(34,197,94,.3)}
.pm-card.err{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
.pm-emoji{font-size:3.5rem;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(160deg,#1c0d30,#2a1245);min-height:110px}
.pm-q{padding:11px 14px 8px;font-size:.92rem;font-weight:700;text-align:center;background:rgba(0,0,0,.2);line-height:1.45}
.pm-q-en{font-size:.72rem;color:var(--muted2);font-style:italic;display:block;margin-top:2px}
.pm-btns{display:grid;grid-template-columns:1fr 1fr}
.pm-btn{border:0;padding:10px 8px 10px 20px;font-weight:800;font-family:var(--font);font-size:.85rem;cursor:pointer;color:white;text-align:left;position:relative;transition:.12s;line-height:1.3}
.pm-btn:hover:not([disabled]){filter:brightness(1.15)}
.pm-btn[disabled]{cursor:default}
.pm-btn::before{content:attr(data-l);position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:.65rem;opacity:.6;font-weight:900}
.pm-btn.c1{background:#c0392b}.pm-btn.c2{background:#2980b9}.pm-btn.c3{background:#d35400}.pm-btn.c4{background:#27ae60}
.pm-btn.revealed{box-shadow:inset 0 0 0 3px white}
.pm-btn.revealed::after{content:"✓";position:absolute;right:7px;top:50%;transform:translateY(-50%)}
.pm-btn.dim{opacity:.25}
.pm-exp{display:none;font-size:.76rem;padding:8px 12px;background:rgba(0,0,0,.3);color:var(--muted);line-height:1.5;text-align:center}
.pm-exp.show{display:block}
/* ── CHAT DIALOGUES ── */
.dial-wrap{display:flex;flex-direction:column;gap:16px}
.dial-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden}
.dial-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.dial-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.dial-scene{padding:9px 16px;background:rgba(0,0,0,.2);font-size:.75rem;color:var(--muted2);font-style:italic}
.chat-body{padding:13px 16px;display:flex;flex-direction:column;gap:8px}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row.right{flex-direction:row-reverse}
.chat-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;background:rgba(255,255,255,.08)}
.chat-bub{max-width:80%;padding:9px 13px;border-radius:16px;font-size:.9rem;line-height:1.55}
.chat-row.left .chat-bub{background:rgba(255,255,255,.09);border-radius:4px 16px 16px 16px}
.chat-row.right .chat-bub{background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.22);border-radius:16px 4px 16px 16px}
.chat-who{font-size:.6rem;font-weight:900;text-transform:uppercase;color:var(--muted2);margin-bottom:3px}
.voc-tag{display:inline-block;background:rgba(37,217,255,.14);border:1px solid rgba(37,217,255,.3);color:var(--cyan);border-radius:5px;padding:1px 6px;font-size:.7rem;font-weight:800;margin:0 2px}
.dial-q-area{padding:12px 16px;background:rgba(0,0,0,.12);border-top:1px solid rgba(255,255,255,.06)}
.dial-q-txt{font-size:.87rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.dial-opts{display:flex;flex-direction:column;gap:7px}
.dial-opt{border:0;border-radius:10px;padding:10px 15px;font-weight:600;font-family:var(--font);font-size:.9rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:var(--text);text-align:left}
.dial-opt:hover:not([disabled]){transform:translateX(4px);border-color:rgba(37,217,255,.35)}
.dial-opt[disabled]{cursor:default;transform:none}
.dial-opt.d-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.dial-opt.d-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.dial-opt.d-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.dial-exp{display:none;font-size:.8rem;color:var(--muted);line-height:1.55;padding:8px 16px 12px;background:rgba(255,255,255,.03)}
.dial-exp.show{display:block}
/* ── FILL-IN ── */
.fill-list{display:flex;flex-direction:column;gap:14px}
.fill-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:17px}
.fill-card.ok{border-color:var(--good);background:rgba(34,197,94,.04)}
.fill-card.err{border-color:var(--bad);background:rgba(239,68,68,.04)}
.fill-ctx{font-size:.75rem;color:var(--muted2);font-style:italic;margin-bottom:7px}
.fill-q{font-size:1rem;line-height:1.85;font-weight:600;margin-bottom:8px}
.fill-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px}
.fill-blank{display:inline-block;border-bottom:2.5px solid var(--cyan);min-width:90px;text-align:center;padding:0 4px;color:var(--cyan);font-weight:800;font-family:var(--display);font-size:1rem}
.fill-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.fill-chip{border:0;border-radius:9px;padding:7px 14px;font-weight:700;font-family:var(--display);font-size:.9rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);color:var(--text)}
.fill-chip:hover:not([disabled]):not(.used){transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.fill-chip.used{opacity:.22;cursor:not-allowed}
.fill-chip.chip-ok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.fill-chip.chip-err{border-color:var(--bad);background:rgba(239,68,68,.15);color:#fca5a5}
.fill-exp{display:none;font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:6px;padding:7px 11px;background:rgba(255,255,255,.04);border-radius:8px}
.fill-exp.show{display:block}
/* ── SORT ── */
.sort-pile{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;min-height:52px;margin-bottom:12px}
.sort-bucket{border-radius:14px;padding:12px;min-height:76px;display:flex;flex-direction:column;gap:6px;transition:.2s}
.sort-bucket.drag-over{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.bucket-title{font-family:var(--display);font-size:.76rem;font-weight:900;text-align:center}
.sort-chip{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:grab;user-select:none;transition:.15s}
.sort-chip:hover{transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sort-chip.ghost{opacity:.35}
.sort-chip.c-ok{cursor:default}
.sort-chip.c-err{font-size:.78rem}
/* ── SPEED ── */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;text-align:center;width:100%;max-width:520px}
.sp-emoji{font-size:2.5rem;margin-bottom:6px}
.sp-q{font-size:1rem;line-height:1.6;margin-bottom:4px}
.sp-en{font-size:.82rem;color:var(--muted2);font-style:italic;margin-bottom:4px}
.sp-hint{font-size:.76rem;color:var(--muted2)}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.sp-inp{flex:1;max-width:260px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--display);font-size:1rem;font-weight:800;color:var(--text);outline:none;transition:.15s}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-inp::placeholder{color:var(--muted2);font-weight:400}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:520px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:520px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;transition:width 1s linear;background:linear-gradient(90deg,var(--comida),var(--lugar))}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}
/* ── REFERENCE ── */
.ref-search{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.25);color:var(--text);border-radius:11px;padding:10px 16px;font-family:var(--font);font-size:.95rem;outline:none;transition:.15s;margin-bottom:12px}
.ref-search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.ref-search::placeholder{color:var(--muted2)}
.ref-row{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);transition:.13s;flex-wrap:wrap}
.ref-row:hover{background:rgba(255,255,255,.03)}
.ref-row:last-child{border-bottom:none}
.rr-emoji{font-size:1.4rem;width:30px;text-align:center;flex-shrink:0}
.rr-es{font-family:var(--display);font-weight:900;font-size:.95rem;min-width:140px;cursor:pointer}
.rr-es:hover{text-decoration:underline}
.rr-en{color:var(--muted2);font-style:italic;font-size:.82rem;flex:1}
.rr-note{font-size:.72rem;color:var(--muted2);min-width:120px;text-align:right}
.ref-section-h{font-family:var(--display);font-size:.88rem;font-weight:900;padding:7px 12px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;margin:14px 0 8px}
.ref-count{font-size:.73rem;color:var(--muted2);font-weight:700;margin-bottom:10px}
.hl{background:rgba(37,217,255,.2);border-radius:3px;padding:0 2px}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}

/* ── Smart audio ── */
let _voice=null;
function initVoice(){
  if(!window.speechSynthesis)return;
  const pick=()=>{
    const vs=window.speechSynthesis.getVoices();if(!vs.length)return;
    const tests=[v=>v.name==='Paulina',v=>v.name.includes('Paulina'),
      v=>v.lang==='es-MX'&&v.localService,v=>v.lang==='es-MX',
      v=>v.name.includes('Google')&&v.lang.startsWith('es'),
      v=>v.lang.startsWith('es')&&v.localService,v=>v.lang.startsWith('es')];
    for(const t of tests){const f=vs.find(t);if(f){_voice=f;break;}}
  };
  pick();
  if(window.speechSynthesis.onvoiceschanged!==undefined)
    window.speechSynthesis.onvoiceschanged=pick;
  setTimeout(pick,800);
}
initVoice();
function speak(text,btn){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.btn-audio').forEach(b=>{b.classList.remove('playing');b.textContent='🔊';});
  const u=new SpeechSynthesisUtterance(text);
  if(_voice)u.voice=_voice;
  u.lang=_voice?_voice.lang:'es-MX';u.rate=0.82;u.pitch=1.0;
  if(btn){btn.classList.add('playing');btn.textContent='🔊▶';}
  u.onend=u.onerror=()=>{if(btn){btn.classList.remove('playing');btn.textContent='🔊';}};
  window.speechSynthesis.speak(u);
}

function normS(s){return(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function seededShuffle(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function getFC(){return fcFilter==='all'?VOC:VOC.filter(v=>v.cat===fcFilter);}

function renderFlash(){
  fcCards=getFC();if(fcIdx>=fcCards.length)fcIdx=0;
  fcFlipped=false;renderFCCard();
}
function renderFCCard(){
  if(!fcCards.length){document.getElementById('exContainer').innerHTML='<div class="panel"><p>No cards.</p></div>';return;}
  const item=fcCards[fcIdx];const cat=CATS[item.cat];
  const pct=Math.round((fcIdx+1)/fcCards.length*100);
  const hasAudio=!!window.speechSynthesis;
  const fbtns=[{id:'all',lbl:'All ('+VOC.length+')'},...Object.entries(CATS).map(([k,v])=>({id:k,lbl:v.icon+' '+v.label}))].map(f=>`<button class="fc-fbtn${fcFilter===f.id?' active':''}" style="${fcFilter===f.id?`background:${CATS[f.id]?.bg||'rgba(255,255,255,.1)'};border-color:${CATS[f.id]?.bd||'rgba(255,255,255,.25)'};color:${CATS[f.id]?.col||'var(--text)'}`:''};" onclick="setFC('${f.id}')">${f.lbl}</button>`).join('');

  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📖 Flashcards — ${VOC.length} palabras mexicanas + 🔊 audio</div>
  <div class="ex-instr">Front: the Spanish word + pronunciation. Back: English meaning, real example in both languages, and cultural note. <em>Click any card to flip!</em></div>
  <div class="fc-filter">${fbtns}</div>
  <div class="fc-wrap">
    <div class="fc-prow">
      <span class="fc-cnt">${fcIdx+1}/${fcCards.length}</span>
      <div class="fc-trk"><div class="fc-fil" style="width:${pct}%;background:${cat.col}"></div></div>
      <span class="fc-cnt" style="color:${cat.col}">${cat.icon} ${cat.label}</span>
    </div>
    <div class="fc-card${fcFlipped?' flipped':''}" id="fcCard" onclick="flipFC()">
      <div class="fc-inner">
        <div class="fc-front" style="background:${cat.bg};border:1.5px solid ${cat.bd}">
          <span style="font-size:.65rem;font-weight:900;text-transform:uppercase;color:${cat.col};letter-spacing:.08em">${cat.icon} ${cat.label}</span>
          <div class="fc-emoji">${item.emoji}</div>
          <div class="fc-es" style="color:${cat.col}">${item.es}</div>
          <div class="fc-pron">🔊 /${item.pron}/</div>
          ${hasAudio?`<button class="btn-audio" onclick="event.stopPropagation();speak('${item.es}',this)">🔊 Listen</button>`:''}
          <div class="fc-hint">👆 Click to flip</div>
        </div>
        <div class="fc-back" style="background:${cat.bg};border:1.5px solid ${cat.bd}">
          <span style="font-size:.65rem;font-weight:900;text-transform:uppercase;color:${cat.col};letter-spacing:.08em">${cat.icon} ${cat.label}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:1.8rem">${item.emoji}</span>
            <div>
              <div class="fc-es" style="color:${cat.col};font-size:1.5rem">${item.es}</div>
              <div class="fc-en">${item.en}</div>
            </div>
            ${hasAudio?`<button class="btn-audio" onclick="event.stopPropagation();speak('${item.es}',this)" style="margin-left:auto">🔊</button>`:''}
          </div>
          <div class="fc-ex">🇲🇽 <em>${item.ex_es}</em><br>🇬🇧 <span style="color:var(--muted2)">${item.ex_en}</span></div>
          <div class="fc-note">📌 ${item.note}</div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="btn btn-ghost" onclick="prevFC()" ${fcIdx===0?'disabled':''}>← Prev</button>
      <button class="btn btn-ghost" onclick="flipFC()">↺ Flip</button>
      <button class="btn btn-cyan" onclick="nextFC()" ${fcIdx===fcCards.length-1?'disabled':''}>Next →</button>
    </div>
  </div></div>`;
}
function flipFC(){fcFlipped=!fcFlipped;const c=document.getElementById('fcCard');if(c)c.classList.toggle('flipped',fcFlipped);}
function nextFC(){fcIdx=Math.min(fcCards.length-1,fcIdx+1);fcFlipped=false;renderFCCard();}
function prevFC(){fcIdx=Math.max(0,fcIdx-1);fcFlipped=false;renderFCCard();}
function setFC(f){fcFilter=f;fcIdx=0;renderFlash();}

function renderPM(){
  pmAns={};
  const tot=PM.length;
  const letters=['A','B','C','D'];const colors=['pm-btn c1','pm-btn c2','pm-btn c3','pm-btn c4'];
  const cards=PM.map((item,idx)=>{
    const btns=item.opts.map((o,oi)=>{
      let cls=colors[oi];
      if(pmAns[idx]!==undefined)cls+=oi===item.a?' revealed':' dim';
      return `<button class="${cls}" data-l="${letters[oi]}" onclick="answerPM(${idx},${oi})" ${pmAns[idx]!==undefined?'disabled':''}>${o}</button>`;
    }).join('');
    const done=pmAns[idx]!==undefined;
    return `<div class="pm-card${done?(pmAns[idx]?' ok':' err'):''}" id="pmc${idx}">
      <div class="pm-emoji">${item.emoji}</div>
      <div class="pm-q">${item.q}</div>
      <div class="pm-btns">${btns}</div>
      <div class="pm-exp${done?' show':''}" id="pme${idx}">${done?item.exp:''}</div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">🖼️ ¿Cómo se dice? — Vocabulary match</div>
  <div class="ex-instr">Look at the emoji and English description. Choose the correct Spanish word. Some are <em>uniquely Mexican</em> — they differ from other Spanish-speaking countries!</div>
  <div class="score-bar">
    <div class="sc"><span class="l">Cards</span><span class="v">${tot}</span></div>
    <div class="sc"><span class="l">OK</span><span class="v g" id="pm_ok">0</span></div>
    <div class="sc"><span class="l">Miss</span><span class="v b" id="pm_err">0</span></div>
    <div class="prog-w"><div class="prog-l">Answered: <span id="pm_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="pm_pg" style="width:0%"></div></div></div>
  </div>
  <div class="pm-grid">${cards}</div>
  <div class="fb" id="pm_fb" style="margin-top:10px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="pmAns={};renderPM()">↺ Reset</button></div></div>`;
}
function answerPM(idx,oi){
  if(pmAns[idx]!==undefined)return;
  const item=PM[idx];const isOk=oi===item.a;
  pmAns[idx]=isOk;
  const card=document.getElementById('pmc'+idx);
  if(card){
    card.classList.add(isOk?'ok':'err');
    card.querySelectorAll('.pm-btn').forEach((b,bi)=>{b.disabled=true;b.classList.remove('revealed','dim');b.classList.add(bi===item.a?'revealed':'dim');});
    const e=card.querySelector('.pm-exp');if(e){e.classList.add('show');e.innerHTML=item.exp;}
  }
  const tot=Object.keys(pmAns).length;
  const ok=Object.values(pmAns).filter(v=>v).length;
  document.getElementById('pm_ok').textContent=ok;
  document.getElementById('pm_err').textContent=tot-ok;
  document.getElementById('pm_pct').textContent=Math.round(tot/PM.length*100)+'%';
  document.getElementById('pm_pg').style.width=Math.round(tot/PM.length*100)+'%';
  if(tot===PM.length){
    const pct=Math.round(ok/tot*100);
    const fb=document.getElementById('pm_fb');
    fb.className='fb show '+(pct>=85?'ok':'partial');
    fb.innerHTML=`${pct>=85?'🏆':'📖'} <strong>${ok}/${tot}.</strong> ${pct>=85?'¡Excelente! You know your Mexican vocabulary!':'Study the flashcards and try again.'}`;
  }
}

function answerDial(qi,oi){
  if(dialAnswers[qi]!==undefined)return;

  d.opts.forEach((_,x)=>{const b=document.getElementById(`do${qi}_${x}`);if(!b)return;b.disabled=true;if(x===d.a)b.classList.add('d-show');else if(x===oi&&!isOk)b.classList.add('d-err');});

function answerFill(qi,oi){
  if(fillAnswers[qi]!==undefined)return;
  const f=FILLS[qi];const isOk=oi===f.a;
  fillAnswers[qi]=isOk;
  const card=document.getElementById('fcard'+qi);if(card)card.classList.add(isOk?'ok':'err');
  const blank=document.getElementById('fb'+qi);
  if(blank)blank.innerHTML=`<span class="fill-chip ${isOk?'chip-ok':'chip-err'}" style="cursor:default">${f.opts[oi]}</span>${!isOk?` <span class="fill-chip chip-ok" style="cursor:default">${f.opts[f.a]}</span>`:''}`;
  document.querySelectorAll(`[id^="fchip${qi}_"]`).forEach(c=>{c.disabled=true;c.classList.add('used');});
  const e=document.getElementById('fexp'+qi);if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ ':'✗ ')+f.exp;}
  const tot=Object.keys(fillAnswers).length;
  const ok=FILLS.filter((_,i2)=>fillAnswers[i2]===FILLS[i2]?.a).length;
  document.getElementById('fi_ok').textContent=ok;document.getElementById('fi_err').textContent=tot-ok;
  document.getElementById('fi_pct').textContent=Math.round(tot/FILLS.length*100)+'%';
  document.getElementById('fi_pg').style.width=Math.round(tot/FILLS.length*100)+'%';
  if(tot===FILLS.length){
    const pct=Math.round(ok/tot*100);
    const fb=document.getElementById('fi_fb');
    fb.className='fb show '+(pct>=85?'ok':'partial');
    fb.innerHTML=`${pct>=85?'🏆':'📖'} <strong>${ok}/${tot}.</strong> ${pct>=85?'¡Muy bien!':'Review and try again.'}`;
  }
}

function buildRows(q){
  const sq=normS(q||'');
  const filtered=sq.length<2?VOC:VOC.filter(v=>
    normS(v.es).includes(sq)||normS(v.en).includes(sq)||
    normS(CATS[v.cat]?.label||'').includes(sq)||normS(v.note).includes(sq)
  );
  const hl=str=>sq.length>=2?str.replace(new RegExp('('+sq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="hl">$1</span>'):str;
  let prev='';
  let html='';
  filtered.forEach(item=>{
    const cat=CATS[item.cat];
    if(item.cat!==prev){
      prev=item.cat;
      html+=`<div class="ref-section-h" style="color:${cat.col};background:${cat.bg}">${cat.icon} ${cat.label}</div>`;
    }
    html+=`<div class="ref-row">
      <div class="rr-emoji">${item.emoji}</div>
      <div class="rr-es" style="color:${cat.col}" onclick="speak('${item.es}',null)">${hl(item.es)}</div>
      <div class="rr-en">${hl(item.en)}</div>
      <div class="rr-note">${item.note.slice(0,50)}${item.note.length>50?'…':''}</div>
    </div>`;
  });
  return {count:filtered.length,html};
}

function renderRef(){
  const {count,html}=buildRows('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📄 Referencia — ${VOC.length} Mexican vocabulary words</div>
  <div class="ex-instr">Search in English or Spanish. Click any word to <em>hear it</em>. Hover the note for the full cultural explanation.</div>
  <input class="ref-search" id="refQ" placeholder="Search… e.g. 'bus', 'taco', 'fiestas', 'colonia'" oninput="updateRef(this.value)" autocomplete="off">
  <div class="ref-count" id="refCnt">Showing all ${count} words</div>
  <div id="refRows">${html}</div>
  </div>`;
}
function updateRef(q){
  const {count,html}=buildRows(q);
  const el=document.getElementById('refRows');if(el)el.innerHTML=html;
  const ct=document.getElementById('refCnt');if(ct)ct.textContent=count<VOC.length?`Showing ${count} of ${VOC.length} words`:`Showing all ${count} words`;
}

goEx(0);
</script>
</body>
</html>
