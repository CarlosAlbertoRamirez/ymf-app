<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Cuerpo Humano | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --a1:#34d399;--a2:#f97316;--mix:#a78bfa;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(37,217,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 20% 10%,rgba(167,139,250,.12),transparent 35%),radial-gradient(ellipse at 80% 15%,rgba(34,211,153,.07),transparent 35%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(960px,96%);margin:14px auto 60px;display:flex;flex-direction:column;gap:14px}
.hero{border-radius:22px;padding:26px 30px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.hero-in{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.logo-box{width:56px;height:56px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--magenta)}
.hero h1{font-family:var(--display);font-size:clamp(1.2rem,3vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--a1),#fff 40%,var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--muted);font-size:.86rem;margin-top:3px;line-height:1.55}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 11px;font-size:.7rem;font-weight:700;color:var(--muted)}
/* TABS */
.tabs-wrap{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.tabs-bar{display:flex;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.07);scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;border:0;background:transparent;color:var(--muted2);font-family:var(--font);font-size:.8rem;font-weight:700;padding:13px 22px;cursor:pointer;transition:.2s;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab-panel{display:none;padding:28px 30px}.tab-panel.visible{display:block}
/* BODY DIAGRAM */
.diagram-section{display:grid;grid-template-columns:1fr 1.6fr;gap:24px;margin-bottom:28px;align-items:start}
.learn-img-wrap{display:flex;justify-content:center;margin:0 0 18px}.learn-img{width:min(100%,420px);height:auto;border-radius:18px;border:1.5px solid rgba(255,255,255,.1);box-shadow:var(--shadow);background:rgba(255,255,255,.02)}
/* VOCAB GRID */
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vocab-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;transition:.2s;cursor:default}
.vocab-card:hover{background:rgba(255,255,255,.07);border-color:rgba(37,217,255,.2)}
.vocab-card.highlighted{border-color:var(--cyan);background:rgba(37,217,255,.07)}
.vocab-emoji{font-size:1.6rem;flex-shrink:0}
.vocab-es{font-family:var(--display);font-weight:900;font-size:.95rem;color:var(--text)}
.vocab-en{font-size:.78rem;color:var(--muted2);margin-top:2px}
.vocab-ex{font-size:.75rem;color:var(--muted2);font-style:italic;margin-top:3px;line-height:1.4}
/* EXERCISES */
.ex-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.ex-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ex-title{font-family:var(--display);font-size:.8rem;font-weight:900;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em}
.score-row{display:flex;align-items:center;gap:8px}
.score-pill{background:rgba(167,139,250,.15);color:#c4b5fd;border-radius:999px;padding:3px 12px;font-size:.7rem;font-weight:800;border:1px solid rgba(167,139,250,.3)}
.btn-restart{border:1px solid rgba(249,115,22,.35);border-radius:999px;padding:3px 10px;font-weight:800;font-family:var(--font);font-size:.68rem;cursor:pointer;background:rgba(249,115,22,.08);color:var(--a2);transition:.13s}
.btn-restart:hover{background:rgba(249,115,22,.18)}
.wb-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 14px;margin-bottom:14px;font-size:.82rem;color:var(--muted2)}
.wb-box strong{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.q-list{display:flex;flex-direction:column;gap:12px}
.q-item{font-size:.92rem}
.q-num{font-size:.68rem;font-weight:900;color:var(--muted2);margin-right:4px}
.q-stem{font-weight:600;margin-bottom:5px;line-height:1.7}
.q-sub{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:6px;padding-left:8px;border-left:2px solid rgba(255,255,255,.1)}
.blank{display:inline-block;border-bottom:2.5px solid var(--cyan);min-width:100px;text-align:center;padding:0 4px;color:var(--cyan);font-weight:900;font-family:var(--display);font-size:.95rem}
/* CHIPS */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:0;border-radius:9px;padding:7px 14px;font-weight:800;font-family:var(--display);font-size:.88rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.11);color:var(--text)}
.chip:hover:not([disabled]):not(.used){transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.chip.used{opacity:.18;cursor:not-allowed}
.chip.chip-ok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.chip.chip-err{border-color:var(--bad);background:rgba(239,68,68,.14);color:#fca5a5}
/* MC */
.mc-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mc-opt{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:var(--text);text-align:left}
.mc-opt:hover:not([disabled]){transform:translateY(-1px);border-color:rgba(37,217,255,.4)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.sel-correct{border-color:var(--good);background:rgba(34,197,94,.15);color:#86efac}
.mc-opt.sel-wrong{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.show-correct{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
/* INPUT */
.q-input{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:9px;padding:9px 13px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;transition:.2s;width:100%;margin-bottom:4px}
.q-input:focus{border-color:rgba(37,217,255,.4)}.q-input[disabled]{opacity:.65}
.q-input.inp-ok{border-color:var(--good);background:rgba(34,197,94,.06)}
.q-input.inp-err{border-color:var(--bad);background:rgba(239,68,68,.05)}
.btn-check{border:0;border-radius:8px;padding:7px 16px;font-weight:800;font-family:var(--font);font-size:.8rem;cursor:pointer;transition:.13s;background:rgba(37,217,255,.12);border:1.5px solid rgba(37,217,255,.28);color:var(--cyan);margin-top:6px}
.btn-check:hover{background:rgba(37,217,255,.2)}.btn-check[disabled]{opacity:.4}
.q-fb{display:none;font-size:.8rem;color:var(--muted);margin-top:6px;padding:7px 11px;border-radius:8px;background:rgba(255,255,255,.04);line-height:1.6}
.q-fb.show{display:block}
/* FLASHCARDS */
.fc-scene{perspective:900px;width:100%;max-width:400px;margin:0 auto 14px;height:180px;cursor:pointer}
.fc-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;text-align:center;border:1.5px solid}
.fc-front{background:rgba(255,255,255,.04);border-color:rgba(52,211,153,.3)}
.fc-back{transform:rotateY(180deg);background:rgba(37,217,255,.06);border-color:rgba(37,217,255,.3)}
.fc-emoji{font-size:2.6rem;margin-bottom:6px}
.fc-word{font-family:var(--display);font-size:1.5rem;font-weight:900}
.fc-en{font-size:.9rem;color:var(--muted);margin-top:4px}
.fc-ex{font-size:.78rem;color:var(--muted2);margin-top:6px;font-style:italic;line-height:1.5}
.fc-nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.fc-counter{font-size:.76rem;font-weight:800;color:var(--muted2)}
.btn-fc{border:0;border-radius:9px;padding:6px 16px;font-weight:800;font-family:var(--font);font-size:.8rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.11)}
.btn-fc:hover{background:rgba(255,255,255,.14)}
/* LABELING EXERCISE */
.label-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-bottom:14px}
.label-svg-wrap{position:relative;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;padding:14px}
.label-answers{display:flex;flex-direction:column;gap:8px}
.label-item{display:flex;align-items:center;gap:8px;font-size:.88rem}
.label-num{font-family:var(--display);font-weight:900;font-size:.9rem;color:var(--cyan);width:20px;flex-shrink:0}
.label-blank{flex:1;border:0;border-bottom:2px solid rgba(37,217,255,.3);background:transparent;color:var(--text);font-family:var(--font);font-size:.88rem;padding:4px 6px;outline:none;transition:.2s}
.label-blank:focus{border-bottom-color:var(--cyan)}
.label-blank.inp-ok{border-bottom-color:var(--good);color:#86efac}
.label-blank.inp-err{border-bottom-color:var(--bad)}
.label-fb{font-size:.72rem;color:var(--muted2);margin-left:4px;display:none}
.label-fb.show{display:inline}
.btn-check-all{border:0;border-radius:9px;padding:9px 22px;font-weight:800;font-family:var(--font);font-size:.85rem;cursor:pointer;transition:.13s;background:linear-gradient(135deg,var(--cyan),#00bfff);color:#07111f;margin-top:10px}
.btn-check-all:hover{transform:translateY(-1px)}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:4px}
.creator span{color:var(--magenta2)}
@media(max-width:640px){.diagram-section{grid-template-columns:1fr}.vocab-grid{grid-template-columns:1fr}.mc-opts{grid-template-columns:1fr}.label-wrap{grid-template-columns:1fr}.tab-panel{padding:18px 14px}}

/* YMF brand v2 */
.logo-box,.hero .logo,.logoBox{padding:0!important;overflow:hidden!important;background:#0c0030!important;border:2px solid rgba(37,217,255,.28)!important;box-shadow:0 0 18px rgba(255,43,191,.18)!important}
img.ymf-logo{width:72px!important;height:72px!important;max-width:72px!important;object-fit:cover!important;border-radius:18px!important;padding:0!important;display:block}
.logo-box>img.ymf-logo,.hero .logo>img.ymf-logo,.logoBox>img.ymf-logo{width:100%!important;height:100%!important;max-width:none!important;border-radius:inherit!important}
.logo-box .logoText,.logoBox .logoText{display:none!important}
.hero-text h1,.hero h1,.app>header h1,header .brand~h1{background:linear-gradient(90deg,#ff4fd8,#ffffff 48%,#25d9ff)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;font-family:'Syne','DM Sans',system-ui,sans-serif!important}
.app>header:not(.hero){background:radial-gradient(circle at top right,rgba(37,217,255,.16),transparent 38%),linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e)!important;border-bottom:1px solid rgba(37,217,255,.13)}
.etab.active,.tab.active,.tab-btn.active{background:linear-gradient(135deg,#ff2bbf,#ff4fd8)!important;color:#fff!important}
.prog-f,.progress-fill,.progress-bar-fill,.bar-fill,.pfill{background:linear-gradient(90deg,#ff2bbf,#25d9ff)!important}
.btn-primary{background:linear-gradient(135deg,#ff2bbf,#ff4fd8)!important;color:#fff!important;border:0!important}
.ymf-brandbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-radius:16px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(37,217,255,.15)}
.ymf-brandbar img{width:44px;height:44px;border-radius:12px;border:2px solid rgba(37,217,255,.28);object-fit:cover}
.ymf-brandbar b{display:block;font-family:'Syne','DM Sans',sans-serif;font-size:1rem;background:linear-gradient(90deg,#ff4fd8,#fff 48%,#25d9ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ymf-brandbar span{display:block;font-size:.72rem;color:#a8abce;font-weight:700;margin-top:2px}
</style>
</head>

function normalize(s){
  return (s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[¿?¡!.,;:'"()]/g,'').replace(/\s+/g,' ');
}
function buildAlternatives(correct){
  if(Array.isArray(correct)) return correct;
  return String(correct).split('/').map(s=>s.trim()).filter(Boolean);
}
function checkAns(user,correct){
  const u=normalize(user);
  if(!u) return false;
  const alts=buildAlternatives(correct).map(a=>normalize(a));
  return alts.includes(u);
}

function switchTab(i){
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',i===j));

  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('visible'));

}

          <div class="fc-emoji" id="fcemojib_${fcKey}">${t.flashcards[0].emoji}</div>
          <div class="fc-word" id="fcen_${fcKey}">${t.flashcards[0].en}</div>
          <div class="fc-ex" id="fcex_${fcKey}">${t.flashcards[0].ex||''}</div>
        </div>
      </div>
    </div></div>`;
  }

  // EXERCISES
  t.exercises.forEach((ex,ei)=>{
    const key=`${i}_${ei}`;
    html+=`<div class="ex-card">
    <div class="ex-header">
      <div class="ex-title" style="color:${t.color}">${ex.title}</div>
      <div class="score-row">
        <span class="score-pill" id="score_${key}">0 / ${ex.qs.length} respondidas · 0 correctas</span>
        <button class="btn-restart" onclick="restartEx('${key}',${i},${ei})">🔄 Reiniciar</button>
      </div>
    </div>`;

    if(ex.type==='mc'){
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const qkey=`${key}_${qi}`;
        html+=`<div class="q-item" id="qitem_${qkey}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${q.stem}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <div class="mc-opts">
            ${q.opts.map((o,oi)=>`<button class="mc-opt" onclick="answerMC('${qkey}',${oi},${q.a})">${o}</button>`).join('')}
          </div>
          <div class="q-fb" id="fb_${qkey}"></div>
        </div>`;
      });
      html+=`</div>`;

    } else if(ex.type==='fill'){
      html+=`<div class="wb-box"><strong>Banco de palabras</strong>${ex.wb.join(' &nbsp;·&nbsp; ')}</div>`;
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const qkey=`${key}_${qi}`;
        const parts=q.stem.split('___');
        const stemHTML=parts.length>=2?parts[0]+`<span class="blank" id="blank_${qkey}"></span>`+parts[1]:q.stem;
        html+=`<div class="q-item" id="qitem_${qkey}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${stemHTML}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <div class="chip-row" id="chips_${qkey}">
            ${ex.wb.map(w=>`<button class="chip" onclick="answerChip('${qkey}','${w.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}','${key}')">${w}</button>`).join('')}
          </div>
          <div class="q-fb" id="fb_${qkey}"></div>
        </div>`;
      });
      html+=`</div>`;

    } else if(ex.type==='translate'){
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const qkey=`${key}_${qi}`;
        html+=`<div class="q-item" id="qitem_${qkey}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${q.stem}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <input type="text" class="q-input" id="inp_${qkey}" placeholder="Escribe tu traducción..."
            onkeydown="if(event.key==='Enter')checkTranslate('${qkey}','${q.a.replace(/'/g,"\\'")}','${key}')">
          <button class="btn-check" onclick="checkTranslate('${qkey}','${q.a.replace(/'/g,"\\'")}','${key}')">Verificar ✓</button>
          <div class="q-fb" id="fb_${qkey}"></div>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });

  panel.innerHTML=html;
  container.appendChild(panel);
}

// ── FLASHCARDS ────────────────────────────────────────────────────────────────
function fcFlip(k){
  const c=document.getElementById('fccard_'+k);
  const s=fcState[k];if(!s)return;
  s.flipped=!s.flipped;c.classList.toggle('flipped',s.flipped);
}
function fcNext(k){const s=fcState[k];if(!s)return;s.idx=(s.idx+1)%s.cards.length;s.flipped=false;fcUpdate(k);}
function fcPrev(k){const s=fcState[k];if(!s)return;s.idx=(s.idx-1+s.cards.length)%s.cards.length;s.flipped=false;fcUpdate(k);}
function fcUpdate(k){
  const s=fcState[k];const c=s.cards[s.idx];
  const card=document.getElementById('fccard_'+k);if(card)card.classList.remove('flipped');
  const set=(id,val)=>{const el=document.getElementById(id+'_'+k);if(el)el.textContent=val;};
  set('fcemoji',c.emoji);set('fcword',c.es);set('fcemojib',c.emoji);set('fcen',c.en);set('fcex',c.ex||'');
  const ctr=document.getElementById('fcctr_'+k);if(ctr)ctr.textContent=(s.idx+1)+' / '+s.cards.length;
}

// ── ANSWER FUNCTIONS ──────────────────────────────────────────────────────────
function answerMC(qkey,chosen,correct){
  if(answers[qkey]!==undefined)return;
  const ok=chosen===correct;answers[qkey]=ok;
  const item=document.getElementById('qitem_'+qkey);
  item.querySelectorAll('.mc-opt').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===correct)btn.classList.add('show-correct');
    else if(i===chosen)btn.classList.add('sel-wrong');
  });
  const key=qkey.split('_').slice(0,2).join('_');
  const fb=document.getElementById('fb_'+qkey);
  if(fb){fb.innerHTML=ok?'✅ ¡Correcto!':'❌ La respuesta correcta es la opción marcada en verde.';fb.classList.add('show');}
  updateScore(key);
}

function answerChip(qkey,chosen,correct,key){
  if(answers[qkey]!==undefined)return;
  const ok=normalize(chosen)===normalize(correct);
  answers[qkey]=ok;
  const blank=document.getElementById('blank_'+qkey);
  if(blank){blank.textContent=chosen;blank.style.color=ok?'var(--good)':'var(--bad)';}
  document.querySelectorAll(`#chips_${qkey} .chip`).forEach(btn=>{
    btn.disabled=true;
    if(normalize(btn.textContent)===normalize(chosen))btn.classList.add(ok?'chip-ok':'chip-err');
    else btn.classList.add('used');
  });
  const fb=document.getElementById('fb_'+qkey);
  if(fb){fb.innerHTML=ok?'✅ ¡Correcto!':'❌ Respuesta correcta: <strong>'+correct+'</strong>';fb.classList.add('show');}
  updateScore(key);
}

function checkTranslate(qkey,correct,key){
  if(answers[qkey]!==undefined)return;
  const inp=document.getElementById('inp_'+qkey);
  if(!inp||!inp.value.trim()){alert('Escribe tu respuesta primero.');return;}
  const ok=checkAns(inp.value,correct);
  answers[qkey]=ok;
  inp.disabled=true;inp.classList.add(ok?'inp-ok':'inp-err');
  const fb=document.getElementById('fb_'+qkey);
  if(fb){fb.innerHTML=ok?'✅ ¡Muy bien!':'❌ Referencia: <strong>'+correct+'</strong>';fb.classList.add('show');}
  const btn=inp.nextElementSibling;if(btn)btn.disabled=true;
  updateScore(key);
}

function updateScore(key){
  const [ti,ei]=key.split('_').map(Number);
  const ex=TABS[ti].exercises[ei];
  const done=ex.qs.filter((_,qi)=>answers[`${key}_${qi}`]!==undefined).length;
  const correct=ex.qs.filter((_,qi)=>answers[`${key}_${qi}`]===true).length;
  const sc=document.getElementById('score_'+key);
  if(sc)sc.textContent=done+' / '+ex.qs.length+' respondidas · '+correct+' correctas';
}

function restartEx(key,ti,ei){
  const ex=TABS[ti].exercises[ei];
  ex.qs.forEach((_,qi)=>{
    const qkey=`${key}_${qi}`;
    delete answers[qkey];
    const blank=document.getElementById('blank_'+qkey);if(blank){blank.textContent='';blank.style.color='var(--cyan)';}
    document.querySelectorAll(`#chips_${qkey} .chip`).forEach(b=>{b.disabled=false;b.className='chip';});
    const item=document.getElementById('qitem_'+qkey);
    if(item){
      item.querySelectorAll('.mc-opt').forEach(b=>{b.disabled=false;b.className='mc-opt';});
      const inp=item.querySelector('.q-input');if(inp){inp.disabled=false;inp.value='';inp.className='q-input';}
      const btn=item.querySelector('.btn-check');if(btn)btn.disabled=false;
    }
    const fb=document.getElementById('fb_'+qkey);if(fb){fb.innerHTML='';fb.className='q-fb';}
  });
  updateScore(key);
}

buildTabsBar();
renderTab(0);
renderedTabs.add(0);
</script>
