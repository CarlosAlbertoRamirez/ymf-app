<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronombres OD & OI | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --od:#f472b6;--od2:#ff91cd;   /* OD = pink */
  --oi:#25d9ff;--oi2:#7ee8ff;   /* OI = cyan */
  --comb:#a78bfa;--comb2:#c4b5fd; /* combined = purple */
  --se:#34d399;--se2:#6ee7b7;   /* se rule = green */
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 12% 8%,rgba(255,43,191,.15),transparent 30%),radial-gradient(ellipse at 88% 12%,rgba(37,217,255,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.1rem,2.2vw,1.9rem);font-weight:900;background:linear-gradient(90deg,var(--od),#fff 40%,var(--oi));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;margin-top:4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
.ex-tabs{display:flex;gap:4px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:7px 10px;font-weight:800;font-family:var(--font);font-size:.72rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;transform:translateY(-1px)}
.etab-icon{font-size:1.1rem;line-height:1}
.etab-label{font-size:.58rem;text-align:center;line-height:1.2;opacity:.9}
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:80px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;transition:width .35s}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ── TYPE TAGS ── */
.tag{font-size:.6rem;font-weight:900;text-transform:uppercase;border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:4px}
.tag-od{background:rgba(244,114,182,.2);color:var(--od2)}
.tag-oi{background:rgba(37,217,255,.15);color:var(--oi2)}
.tag-comb{background:rgba(167,139,250,.15);color:var(--comb2)}
.tag-se{background:rgba(52,211,153,.15);color:var(--se2)}
.tag-pos{background:rgba(251,191,36,.15);color:#fde68a}
.tag-spec{background:rgba(248,113,113,.15);color:#fca5a5}

/* ── EXPLANATION CARDS (EX 0) ── */
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.exp-card{border-radius:16px;padding:18px;border:1.5px solid}
.exp-card-title{font-family:var(--display);font-size:.95rem;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pron-table{width:100%;border-collapse:collapse;font-size:.85rem;margin:8px 0}
.pron-table th{padding:5px 10px;font-size:.6rem;font-weight:800;text-transform:uppercase;color:var(--muted2);text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.pron-table td{padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5}
.pron-table tr:last-child td{border-bottom:none}
.pron{font-family:var(--display);font-weight:900;font-size:1rem}
.pron-en{color:var(--muted2);font-size:.78rem;font-style:italic}
.formula-box{background:rgba(0,0,0,.25);border-radius:10px;padding:10px 14px;font-size:.85rem;line-height:1.9;margin-top:8px}
.f-pron{font-weight:900;font-size:1rem}
.f-gray{color:var(--muted2)}
.example-line{font-size:.83rem;color:var(--muted);font-style:italic;padding:4px 0;line-height:1.55}
.example-line strong{color:var(--text);font-style:normal}
.tip-box{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:9px;padding:9px 12px;font-size:.79rem;color:#fde68a;line-height:1.55;margin-top:8px}

/* ── PICTURE CARDS (EX 1, 2) ── */
.pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.pic-card{border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:transform .15s}
.pic-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.pic-card.ok{border-color:var(--good);box-shadow:0 0 0 2px rgba(34,197,94,.3)}
.pic-card.err{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
.pic-q{padding:14px 16px;font-size:.95rem;font-weight:700;background:rgba(0,0,0,.18);line-height:1.55}
.pic-sub{font-size:.7rem;color:var(--muted2);display:block;margin-top:3px}
.pic-en{font-size:.76rem;color:var(--muted);display:block;margin-top:6px;font-style:italic;line-height:1.45}
.pic-blank{display:inline-block;min-width:48px;border-bottom:2.5px solid var(--cyan);color:var(--cyan);font-weight:900;padding:0 3px;text-align:center}
.pic-btns{display:grid;grid-template-columns:1fr 1fr}
.pic-btn{border:1px solid rgba(255,255,255,.12);padding:11px 10px;font-weight:800;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.12s;color:var(--text);text-align:center;position:relative;background:rgba(255,255,255,.06)}
.pic-btn:hover:not([disabled]){background:rgba(255,255,255,.11);border-color:rgba(37,217,255,.28)}
.pic-btn[disabled]{cursor:default}
.pic-btn::before{display:none}
.pic-btn.c1,.pic-btn.c2,.pic-btn.c3,.pic-btn.c4{background:rgba(255,255,255,.06)}
.pic-btn.revealed{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.6);box-shadow:inset 0 0 0 1px rgba(34,197,94,.35)}
.pic-btn.dim{opacity:.55}
.pic-btn.revealed::after{content:"✓";position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:.72rem;font-weight:900;color:#86efac}
.pic-exp{font-size:.74rem;padding:7px 11px;background:rgba(0,0,0,.35);color:var(--muted);line-height:1.5;display:none}
.pic-exp.show{display:block}

/* ── MC ── */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:13px 15px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:3px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:.97rem;line-height:1.65;flex:1}
.mc-blank{display:inline-block;min-width:64px;border-bottom:2.5px solid rgba(37,217,255,.4);padding:0 4px;text-align:center;font-weight:800;color:var(--cyan)}
.mc-en{font-size:.77rem;color:var(--muted2);font-style:italic;margin-bottom:9px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:6px;padding-left:28px}
.mc-opt{border:0;border-radius:9px;padding:6px 14px;font-weight:700;font-family:var(--display);font-size:.9rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not([disabled]){transform:translateY(-1px);border-color:rgba(37,217,255,.35)}
.mc-opt[disabled]{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.78rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:6px 12px 6px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}

/* ── ERROR HUNT ── */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.eh-ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.eh-bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}.eh-sent{font-size:.97rem;line-height:1.6}
.eh-fix{font-size:.82rem;font-weight:700;color:var(--good);margin-left:6px}
.eh-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-btn{border:0;border-radius:9px;padding:7px 14px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-yes:hover:not([disabled]){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-no:hover:not([disabled]){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-btn[disabled]{cursor:default;opacity:.5}
.cho-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.cho-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* ── SPEED ── */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;text-align:center;width:100%;max-width:540px}
.sp-q{font-size:.95rem;line-height:1.7;margin-bottom:4px}
.sp-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:540px}
.sp-inp{flex:1;max-width:260px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--display);font-size:1.1rem;font-weight:900;color:var(--text);outline:none;transition:.15s;letter-spacing:.03em}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-inp::placeholder{color:var(--muted2);font-weight:400;font-family:var(--font);font-size:.9rem;letter-spacing:0}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:540px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:540px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;transition:width 1s linear}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* ── REFERENCE ── */
.ref-section{margin-bottom:18px}
.ref-h3{font-family:var(--display);font-size:.92rem;font-weight:800;padding:6px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.ref-table{width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:10px}
.ref-table th{padding:6px 12px;font-size:.6rem;font-weight:800;text-transform:uppercase;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.ref-table td{padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5}
.ref-table tr:last-child td{border-bottom:none}
.ref-table tr:hover td{background:rgba(255,255,255,.02)}
.ref-tip{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:10px 14px;font-size:.83rem;color:#bbf7d0;line-height:1.6;margin-bottom:12px}
.ref-alert{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:12px;padding:10px 14px;font-size:.83rem;color:#fecaca;line-height:1.6;margin-bottom:12px}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:2px}
.creator span{color:var(--magenta2)}
@media(max-width:600px){.panel{padding:14px 12px}.pic-grid{grid-template-columns:1fr}.exp-grid{grid-template-columns:1fr}}

/* YMF brand v2 */
.logo-box,.hero .logo,.logoBox{padding:0!important;overflow:hidden!important;background:#0c0030!important;border:2px solid rgba(37,217,255,.28)!important;box-shadow:0 0 18px rgba(255,43,191,.18)!important}
img.ymf-logo{width:72px!important;height:72px!important;max-width:72px!important;object-fit:cover!important;border-radius:18px!important;padding:0!important;display:block}
.logo-box>img.ymf-logo,.hero .logo>img.ymf-logo,.logoBox>img.ymf-logo{width:100%!important;height:100%!important;max-width:none!important;border-radius:inherit!important}
.logo-box .logoText,.logoBox .logoText{display:none!important}
.hero-text h1,.hero h1,.app>header h1,header .brand~h1{background:linear-gradient(90deg,#ff4fd8,#ffffff 48%,#25d9ff)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;font-family:'Syne','DM Sans',system-ui,sans-serif!important}
.app>header:not(.hero){background:radial-gradient(circle at top right,rgba(37,217,255,.16),transparent 38%),linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e)!important;border-bottom:1px solid rgba(37,217,255,.13)}
.etab.active,.tab.active,.tab-btn.active{background:linear-gradient(135deg,#ff2bbf,#ff4fd8)!important;color:#fff!important}
.prog-f,.progress-fill,.progress-bar-fill,.bar-fill,.pfill{background:linear-gradient(90deg,#ff2bbf,#25d9ff)!important}
.btn-primary{background:linear-gradient(135deg,#ff2bbf,#ff4fd8)!important;color:#fff!important;border:0!important}
.ymf-brandbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-radius:16px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(37,217,255,.15)}
.ymf-brandbar img{width:44px;height:44px;border-radius:12px;border:2px solid rgba(37,217,255,.28);object-fit:cover}
.ymf-brandbar b{display:block;font-family:'Syne','DM Sans',sans-serif;font-size:1rem;background:linear-gradient(90deg,#ff4fd8,#fff 48%,#25d9ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ymf-brandbar span{display:block;font-size:.72rem;color:#a8abce;font-weight:700;margin-top:2px}
</style>
</head>
<body>
<div class="app">
<div class="cf" id="cf"></div>

function renderExplanation(){
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📚 Explicación — OD, OI, Combinados y Casos Especiales</div>
  <div class="ex-instr">Read each card carefully before doing the exercises. The <em>order</em> and <em>position</em> of pronouns are key. Start with the exercises after reading!</div>
  <div class="exp-grid">

    <!-- OD CARD -->
    <div class="exp-card" style="background:rgba(244,114,182,.08);border-color:rgba(244,114,182,.28)">
      <div class="exp-card-title" style="color:var(--od2)">📌 Pronombres OD — Objeto Directo</div>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">The OD answers <strong>"¿Qué?"</strong> or <strong>"¿A quién?"</strong> — what or who receives the action directly.</p>
      <table class="pron-table">
        <tr><th>Persona</th><th>Pronombre</th><th>English</th></tr>
        <tr><td class="pron-en">yo</td><td><span class="pron" style="color:var(--od2)">me</span></td><td class="pron-en">me</td></tr>
        <tr><td class="pron-en">tú</td><td><span class="pron" style="color:var(--od2)">te</span></td><td class="pron-en">you</td></tr>
        <tr><td class="pron-en">él/ella/usted</td><td><span class="pron" style="color:var(--od2)">lo / la</span></td><td class="pron-en">him / her / it / you(f)</td></tr>
        <tr><td class="pron-en">nosotros</td><td><span class="pron" style="color:var(--od2)">nos</span></td><td class="pron-en">us</td></tr>
        <tr><td class="pron-en">ellos/ellas/uds.</td><td><span class="pron" style="color:var(--od2)">los / las</span></td><td class="pron-en">them / you all</td></tr>
      </table>
      <div class="example-line">¿Viste la película? — Sí, <strong>la</strong> vi ayer. <span class="pron-en">(la = la película)</span></div>
      <div class="example-line">¿Conoces a Carlos? — No, no <strong>lo</strong> conozco. <span class="pron-en">(lo = Carlos)</span></div>
      <div class="example-line">¿Me llamas más tarde? — Sí, <strong>te</strong> llamo. <span class="pron-en">(te = tú)</span></div>
    </div>

    <!-- OI CARD -->
    <div class="exp-card" style="background:rgba(37,217,255,.07);border-color:rgba(37,217,255,.25)">
      <div class="exp-card-title" style="color:var(--oi2)">🔵 Pronombres OI — Objeto Indirecto</div>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">The OI answers <strong>"¿A quién?"</strong> or <strong>"¿Para quién?"</strong> — to/for whom the action is done.</p>
      <table class="pron-table">
        <tr><th>Persona</th><th>Pronombre</th><th>English</th></tr>
        <tr><td class="pron-en">yo</td><td><span class="pron" style="color:var(--oi2)">me</span></td><td class="pron-en">to/for me</td></tr>
        <tr><td class="pron-en">tú</td><td><span class="pron" style="color:var(--oi2)">te</span></td><td class="pron-en">to/for you</td></tr>
        <tr><td class="pron-en">él/ella/usted</td><td><span class="pron" style="color:var(--oi2)">le</span></td><td class="pron-en">to/for him/her/you</td></tr>
        <tr><td class="pron-en">nosotros</td><td><span class="pron" style="color:var(--oi2)">nos</span></td><td class="pron-en">to/for us</td></tr>
        <tr><td class="pron-en">ellos/uds.</td><td><span class="pron" style="color:var(--oi2)">les</span></td><td class="pron-en">to/for them/you all</td></tr>
      </table>
      <div class="example-line">Carlos <strong>le</strong> escribió un mensaje a ella. <span class="pron-en">(le = to her)</span></div>
      <div class="example-line"><strong>Te</strong> mando el archivo. <span class="pron-en">(te = to you)</span></div>
      <div class="example-line"><strong>Les</strong> explicó el tema a los alumnos. <span class="pron-en">(les = to them)</span></div>
    </div>

    <!-- COMBINED ORDER CARD -->
    <div class="exp-card" style="background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.28)">
      <div class="exp-card-title" style="color:var(--comb2)">🔗 Combinados — OI siempre va ANTES del OD</div>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">When two pronouns appear together, OI always comes first.</p>
      <div class="formula-box">
        <div><span class="f-pron" style="color:var(--oi2)">OI</span> <span class="f-gray">+</span> <span class="f-pron" style="color:var(--od2)">OD</span> <span class="f-gray">+ verbo</span></div>
        <div style="font-size:.78rem;color:var(--muted2);margin-top:4px">me/te/le/nos/les + lo/la/los/las</div>
      </div>
      <div class="example-line"><strong>Me lo</strong> mandas mañana. <span class="pron-en">You send it to me tomorrow. (me=OI, lo=OD)</span></div>
      <div class="example-line"><strong>Te la</strong> explico ahora. <span class="pron-en">I explain it to you now. (te=OI, la=OD)</span></div>
      <div class="example-line"><strong>Nos los</strong> enviaron por correo. <span class="pron-en">They sent them to us. (nos=OI, los=OD)</span></div>
      <div class="tip-box">💡 <strong>Memory trick:</strong> "I ODIO que OI goes first" — OI before OD, always!</div>
    </div>

    <!-- SE RULE CARD -->
    <div class="exp-card" style="background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.25)">
      <div class="exp-card-title" style="color:var(--se2)">⚡ La regla del SE — le/les → se antes de lo/la/los/las</div>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">When OI <strong>le</strong> or <strong>les</strong> meets OD <strong>lo/la/los/las</strong>, the OI changes to <strong>se</strong> to avoid awkward sound.</p>
      <div class="formula-box">
        <div><span class="f-pron" style="color:var(--bad)">le/les</span> <span class="f-gray">+ lo/la/los/las → </span><span class="f-pron" style="color:var(--se2)">se</span> <span class="f-gray">+ lo/la/los/las</span></div>
      </div>
      <div class="example-line">Voy a darle el libro a Juan. → Voy a dár<strong>se</strong><span style="color:var(--od2)"><strong>lo</strong></span>. <span class="pron-en">(NOT le lo)</span></div>
      <div class="example-line">¿<strong>Le</strong> mandaste la carta a ella? → ¿<strong>Se</strong><span style="color:var(--od2)"><strong>la</strong></span> mandaste? <span class="pron-en">(NOT le la)</span></div>
      <div class="example-line"><strong>Les</strong> explicaré las reglas. → <strong>Se</strong><span style="color:var(--od2)"><strong>las</strong></span> explicaré. <span class="pron-en">(NOT les las)</span></div>
      <div class="tip-box">⚠️ This "se" is NOT reflexive — it only replaces le/les before lo/la. Add "a él/ella/ellos/usted" to clarify who.</div>
    </div>

    <!-- POSITION CARD -->
    <div class="exp-card" style="background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.25)">
      <div class="exp-card-title" style="color:#fde68a">📍 Posición — ¿Antes o después del verbo?</div>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">Pronouns can go BEFORE conjugated verbs OR ATTACHED to infinitives, gerunds, and imperatives.</p>
      <div class="formula-box">
        <div style="margin-bottom:6px"><span style="color:#fde68a;font-weight:800">ANTES</span> <span class="f-gray">del verbo conjugado:</span></div>
        <div class="example-line" style="margin:0"><strong>Lo</strong> compré ayer. / <strong>Me lo</strong> explicó.</div>
        <div style="margin:8px 0 6px"><span style="color:#fde68a;font-weight:800">DESPUÉS</span> <span class="f-gray">— unido al infinitivo:</span></div>
        <div class="example-line" style="margin:0">Voy a comprar<strong>lo</strong>. / Quiero dár<strong>se</strong><span style="color:var(--od2)">lo</span>.</div>
        <div style="margin:8px 0 6px"><span style="color:#fde68a;font-weight:800">DESPUÉS</span> <span class="f-gray">— unido al gerundio:</span></div>
        <div class="example-line" style="margin:0">Estoy leyéndo<strong>lo</strong>. / Lo estoy leyendo. (both OK)</div>
        <div style="margin:8px 0 6px"><span style="color:#fde68a;font-weight:800">UNIDO</span> <span class="f-gray">al imperativo afirmativo:</span></div>
        <div class="example-line" style="margin:0">¡Dí<strong>me</strong><span style="color:var(--od2)">lo</span>! / ¡Llá<strong>ma</strong><span style="color:var(--od2)">me</span>!</div>
        <div style="margin:8px 0 6px"><span style="color:#fde68a;font-weight:800">ANTES</span> <span class="f-gray">del imperativo negativo:</span></div>
        <div class="example-line" style="margin:0">¡No <strong>lo</strong> hagas! / ¡No <strong>me lo</strong> digas!</div>
      </div>
    </div>

    <!-- SPECIAL CASES CARD -->
    <div class="exp-card" style="background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.25)">
      <div class="exp-card-title" style="color:#fca5a5">🔴 Casos especiales</div>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">These patterns are unique to Spanish and confuse many learners.</p>
      <div class="formula-box" style="font-size:.82rem">
        <div style="margin-bottom:8px"><span style="color:#fca5a5;font-weight:800">1. Pronombre redundante</span> — with "a + noun", the OI pronoun is often DOUBLED:</div>
        <div class="example-line" style="margin:0 0 8px"><strong>Le</strong> dije a María que viniera. <span class="pron-en">(le + a María = double)</span></div>
        <div style="margin-bottom:6px"><span style="color:#fca5a5;font-weight:800">2. Verbos de tipo gustar</span> — the IO pronoun IS the subject position:</div>
        <div class="example-line" style="margin:0 0 8px"><strong>Me</strong> duele la cabeza. / <strong>Les</strong> encanta el café.</div>
        <div style="margin-bottom:6px"><span style="color:#fca5a5;font-weight:800">3. Imperativo negativo vs positivo:</span></div>

function renderPicSet(items,answers,exNum,title,instr,progId){
  const ok=Object.values(answers).filter(v=>v).length;
  const ans=Object.keys(answers).length;
  const total=items.length;
  const pct=Math.round(ans/total*100);
  const resetCall = exNum===1?'picODAnswers={};renderOD()':exNum===2?'picOIAnswers={};renderOI()':'picCombAnswers={};renderMC()';
  const cards=items.map((item,idx)=>{
    const done=answers[idx]!==undefined;
    const isOk=answers[idx]===true;
    const colors=['c1','c2','c3','c4'];
    const letters=['A','B','C','D'];
    const btns=item.opts.map((o,oi)=>{
      let cls=`pic-btn ${colors[oi]}`;
      if(done)cls+=oi===item.ans?' revealed':' dim';
      return `<button class="${cls}" data-l="${letters[oi]}" onclick="answerPic(${exNum},${idx},${oi})" ${done?'disabled':''}>${o}</button>`;
    }).join('');
    return `<div class="pic-card${done?(isOk?' ok':' err'):''}" id="pc${exNum}_${idx}">
      <div class="pic-q">${item.q}<span class="pic-en">${item.en||''}</span><span class="pic-sub">${item.sub}</span></div>
      <div class="pic-btns">${btns}</div>
      <div class="pic-exp${done?' show':''}">${done?(isOk?'✓ ':'✗ ')+item.exp:''}</div>
    </div>`;
  }).join('');
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">${title}</div>
  <div class="ex-instr">${instr}</div>
  <div class="score-bar">
    <div class="sc"><span class="l">Cards</span><span class="v">${total}</span></div>
    <div class="sc"><span class="l">OK</span><span class="v g" id="${progId}_ok">${ok}</span></div>
    <div class="sc"><span class="l">Miss</span><span class="v b" id="${progId}_err">${ans-ok}</span></div>
    <div class="prog-w"><div class="prog-l">Answered: ${pct}%</div><div class="prog-t"><div class="prog-f" id="${progId}_pg" style="width:${pct}%;background:linear-gradient(90deg,var(--od),var(--oi))"></div></div></div>
  </div>
  <div class="pic-grid">${cards}</div>
  <div class="actions"><button class="btn btn-ghost" onclick="${resetCall}">↺ Reset</button></div></div>`;
}

function answerPic(exNum,idx,oi){
  const items=exNum===1?OD_CARDS:exNum===2?OI_CARDS:COMB_CARDS;
  const answers=exNum===1?picODAnswers:exNum===2?picOIAnswers:picCombAnswers;
  if(answers[idx]!==undefined)return;
  const item=items[idx];const isOk=oi===item.ans;
  answers[idx]=isOk;
  const card=document.getElementById(`pc${exNum}_${idx}`);
  if(card){
    card.classList.add(isOk?'ok':'err');
    card.querySelectorAll('.pic-btn').forEach((b,bi)=>{
      b.disabled=true;b.classList.remove('revealed','dim');
      b.classList.add(bi===item.ans?'revealed':'dim');
    });
    const e=card.querySelector('.pic-exp');
    if(e){e.classList.add('show');e.innerHTML=(isOk?'✓ ':'✗ ')+item.exp;}
  }
  const ok=Object.values(answers).filter(v=>v).length;
  const a=Object.keys(answers).length;
  const pct=Math.round(a/items.length*100);
  const pid=exNum===1?'od':exNum===2?'oi':'comb';
  const e1=document.getElementById(`${pid}_ok`);if(e1)e1.textContent=ok;
  const e2=document.getElementById(`${pid}_err`);if(e2)e2.textContent=a-ok;
  const pg=document.getElementById(`${pid}_pg`);if(pg)pg.style.width=pct+'%';
}

  renderPicSet(OD_CARDS,picODAnswers,1,

  ['¡No me lo digas ahora!',false,null,'CORRECT ✓ — In negative commands, the pronouns go before the verb.'],
  ['No dímelo ahora.',true,'No me lo digas ahora.','ERROR — Negative imperatives take pronouns before the verb, not attached.'],

  ['A Juan le gusta el café.',false,null,'CORRECT ✓ — With gustar, the person is the indirect object: le gusta.'],

  ['Se las expliqué a mis alumnos.',false,null,'CORRECT ✓ — les + las becomes se las. Perfect use of the se rule.'],
  ['Estoy lo leyendo.',true,'Lo estoy leyendo. / Estoy leyéndolo.','ERROR — You cannot place the pronoun between estar and the gerund.'],

  ['¿Puedes me prestar el libro?',true,'¿Me puedes prestar el libro? / ¿Puedes prestarme el libro?','ERROR — Pronouns do not go between the modal and the infinitive.'],
  ['Nos la enviaron por correo.',false,null,'CORRECT ✓ — nos = indirect object, la = direct object. Good order: OI before OD.'],
  ['Te se olvidó llamar.',true,'Se te olvidó llamar.','ERROR — In this structure the fixed order is <strong>se te</strong>, not te se.'],
  ['Les lo conté a mis amigos.',true,'Se lo conté a mis amigos.','ERROR — les + lo becomes <strong>se lo</strong>.'],

function renderErrorHunt(){
  ehAnswered={};
  let html=`<div class="panel"><div class="ex-title">🔍 Error hunter</div>
  <div class="ex-instr">Is the pronoun use correct? Focus on <em>the se rule</em>, <em>position</em>, <em>OI vs OD</em>, and subtle structures like <em>gustar</em>, doubled pronouns, and tricky command forms. Some are correct — don\'t over-correct!</div>
  <div class="score-bar"><div class="sc"><span class="l">Total</span><span class="v">${ERRORS.length}</span></div><div class="sc"><span class="l">OK</span><span class="v g" id="eh_ok">0</span></div><div class="sc"><span class="l">Miss</span><span class="v b" id="eh_err">0</span></div><div class="prog-w"><div class="prog-l">Progress: <span id="eh_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="eh_pg" style="width:0%;background:linear-gradient(90deg,var(--od),var(--oi))"></div></div></div></div>
  <div class="eh-list">`;
  ERRORS.forEach(([s,hasErr,,exp],i)=>{
    html+=`<div class="eh-item" id="ehi${i}"><div class="eh-n">${i+1}</div>
    <div class="eh-body"><div class="eh-sent" id="ehs${i}">${s}</div>
    <div class="eh-btns"><button class="eh-btn eh-yes" onclick="judgeEh(${i},false)">✅ Correct</button><button class="eh-btn eh-no" onclick="judgeEh(${i},true)">❌ Has an error</button></div>
    <div class="eh-exp" id="ehe${i}">${exp}</div></div></div>`;
  });
  html+=`</div><div class="fb" id="eh_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="ehAnswered={};renderErrorHunt()">↺ Reset</button></div></div>`;
  document.getElementById('exContainer').innerHTML=html;
}
function judgeEh(idx,saysErr){
  if(ehAnswered[idx]!==undefined)return;
  const [s,hasErr,fix,exp]=ERRORS[idx];
  const correct=saysErr===hasErr;
  ehAnswered[idx]=correct;
  const item=document.getElementById('ehi'+idx);
  item.classList.add('revealed',correct?'eh-ok':'eh-bad');
  item.querySelectorAll('.eh-btn').forEach(b=>b.disabled=true);
  const chosen=item.querySelector(saysErr?'.eh-no':'.eh-yes');
  if(chosen)chosen.classList.add(correct?'cho-ok':'cho-err');
  if(hasErr&&fix){const se=document.getElementById('ehs'+idx);se.innerHTML=s+` <span class="eh-fix">→ <strong>${fix}</strong></span>`;}
  document.getElementById('ehe'+idx).classList.add('show');
  const total=Object.keys(ehAnswered).length;
  const ok=Object.values(ehAnswered).filter(v=>v).length;
  document.getElementById('eh_ok').textContent=ok;document.getElementById('eh_err').textContent=total-ok;
  document.getElementById('eh_pct').textContent=Math.round(total/ERRORS.length*100)+'%';
  document.getElementById('eh_pg').style.width=Math.round(total/ERRORS.length*100)+'%';
  if(total===ERRORS.length){
    const pct=Math.round(ok/ERRORS.length*100);
    const fb=document.getElementById('eh_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'🏆':'📖'} <strong>${ok}/${ERRORS.length}.</strong> ${pct>=80?'Excellent!':'Focus on the SE rule and pronoun position.'}`;
  }
}

  <div class="sp-wrap" id="spWrap"><div class="sp-start"><div style="font-size:2.8rem">⚡</div><h2>OD, OI &amp; combinados</h2><p style="color:var(--muted);max-width:420px">30 items covering all the rules — OD, OI, the se rule, and position.</p><button class="btn btn-cyan" onclick="startSpeed()">Let's go!</button></div></div></div>`;
}
function startSpeed(){spIdx=0;spOk=0;spErr=0;spStreak=0;nextQ();}
function nextQ(){
  if(spIdx>=SPEED.length){endSpeed();return;}
  spAnswered=false;const item=SPEED[spIdx];spTimeLeft=12;
  document.getElementById('spWrap').innerHTML=`
    <div class="sp-stats"><div class="spst"><div class="sl">Q</div><div class="sv w">${spIdx+1}/${SPEED.length}</div></div><div class="spst"><div class="sl">OK</div><div class="sv g">${spOk}</div></div><div class="spst"><div class="sl">Miss</div><div class="sv b">${spErr}</div></div></div>
    <div class="streak${spStreak>=3?' on':''}" id="stk">🔥 x${spStreak}</div>
    <div class="sp-card"><div class="sp-q">${item.q}</div><div class="sp-hint">💡 ${item.hint}</div></div>
    <div class="tmr-row"><div class="tmr-trk"><div class="tmr-fil" id="tF" style="width:100%;transition:width 1s linear;background:linear-gradient(90deg,var(--od),var(--oi))"></div></div><div class="tmr-n" id="tN">12</div></div>
    <div class="sp-row"><input id="sInp" class="sp-inp" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type answer…" onkeydown="if(event.key==='Enter')submitQ()"><button class="btn btn-cyan" onclick="submitQ()" style="flex-shrink:0">→</button></div>
    <div class="sp-fb" id="sFb" style="opacity:0"></div>`;
  setTimeout(()=>{const i=document.getElementById('sInp');if(i)i.focus();},50);
  if(spTimer)clearInterval(spTimer);
  spTimer=setInterval(()=>{
    spTimeLeft--;
    const f=document.getElementById('tF'),n=document.getElementById('tN');
    if(f)f.style.width=Math.max(0,(spTimeLeft/12)*100)+'%';
    if(n){n.textContent=spTimeLeft;n.style.color=spTimeLeft<=3?'var(--bad)':spTimeLeft<=6?'var(--warn)':'var(--muted2)';}
    if(spTimeLeft<=0){clearInterval(spTimer);spTimer=null;if(!spAnswered)submitQ();}
  },1000);
}
function submitQ(){
  const inp=document.getElementById('sInp');if(!inp||spAnswered)return;
  spAnswered=true;if(spTimer){clearInterval(spTimer);spTimer=null;}inp.disabled=true;
  const item=SPEED[spIdx];const nt=normS(inp.value);const na=normS(item.a);
  const isOk=nt===na||item.also.map(normS).includes(nt)||(nt.length>1&&na.includes(nt));
  if(isOk){spOk++;spStreak++;}else{spErr++;spStreak=0;}
  const fb=document.getElementById('sFb');
  if(fb){fb.style.opacity='1';
    if(!inp.value.trim()){fb.className='sp-fb err';fb.innerHTML=`⏱ Time's up! → <strong>${item.hint}</strong>`;}
    else if(isOk){fb.className='sp-fb ok';fb.innerHTML=`✓ <strong>Correct!</strong>${spStreak>=3?' 🔥 x'+spStreak:''}`;}
    else{fb.className='sp-fb err';fb.innerHTML=`✗ <strong>${inp.value}</strong> → <strong>${item.hint}</strong>`;}}
  if(spStreak>=3){const cf=document.getElementById('cf');cf.textContent='🔥 x'+spStreak;cf.classList.remove('pop');void cf.offsetWidth;cf.classList.add('pop');}
  spIdx++;setTimeout(nextQ,isOk?700:1500);
}
function endSpeed(){
  const pct=Math.round(spOk/SPEED.length*100);
  const emo=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  document.getElementById('spWrap').innerHTML=`<div class="sp-start"><div style="font-size:3rem">${emo}</div><h2>${spOk}/${SPEED.length}</h2><p style="color:var(--muted)">${pct>=90?'Excellent! You have mastered OD/OI!':pct>=70?'Great job!':pct>=50?'Keep practicing!':'Review the explanation cards.'}</p><button class="btn btn-cyan" onclick="startSpeed()">↺ Try again</button></div>`;
}

/* ══════════════════════════════════
   EX 6 — REFERENCE CARD
══════════════════════════════════ */
function renderReference(){
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">📄 Reference card — OD, OI, Combinados &amp; Casos Especiales</div>
  <div class="ex-instr">Complete guide to direct and indirect object pronouns. Bookmark this for quick review.</div>

  <div class="ref-section">

    <tr><td>tú</td><td style="font-weight:800;color:var(--od2)">te</td><td style="color:var(--muted)">¿A quién/qué...? = te</td></tr>
    <tr><td>él/ella/usted</td><td style="font-weight:800;color:var(--od2)">lo / la</td><td style="color:var(--muted)">lo=masc., la=fem.</td></tr>
    <tr><td>nosotros</td><td style="font-weight:800;color:var(--od2)">nos</td><td style="color:var(--muted)">¿A quién/qué...? = nos</td></tr>
    <tr><td>ellos/ellas/ustedes</td><td style="font-weight:800;color:var(--od2)">los / las</td><td style="color:var(--muted)">los=masc., las=fem.</td></tr>
    </table>
    <div class="ref-tip">💡 <strong>Test:</strong> "¿Compraste el carro?" — el carro answers "¿qué?" → OD → "Sí, lo compré."</div>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:var(--oi2);background:rgba(37,217,255,.08)">🔵 Pronombres OI (Objeto Indirecto)</div>
    <table class="ref-table"><tr><th>Persona</th><th>Pronombre</th><th>Pregunta clave</th></tr>
    <tr><td>yo</td><td style="font-weight:800;color:var(--oi2)">me</td><td style="color:var(--muted)">¿A/para quién...? = me</td></tr>
    <tr><td>tú</td><td style="font-weight:800;color:var(--oi2)">te</td><td style="color:var(--muted)">¿A/para quién...? = te</td></tr>
    <tr><td>él/ella/usted</td><td style="font-weight:800;color:var(--oi2)">le</td><td style="color:var(--muted)">same for both genders!</td></tr>
    <tr><td>nosotros</td><td style="font-weight:800;color:var(--oi2)">nos</td><td style="color:var(--muted)">¿A/para quién...? = nos</td></tr>
    <tr><td>ellos/ellas/ustedes</td><td style="font-weight:800;color:var(--oi2)">les</td><td style="color:var(--muted)">same for all genders!</td></tr>
    </table>
    <div class="ref-tip">💡 <strong>Test:</strong> "Le mandé un mensaje a Ana." — a Ana answers "¿a quién?" → OI → le.</div>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:var(--comb2);background:rgba(167,139,250,.1)">🔗 Combinados — Orden: OI antes de OD</div>
    <div class="formula-box" style="background:rgba(255,255,255,.03);border:1px solid rgba(167,139,250,.2)">
      <span class="f-pron" style="color:var(--oi2)">OI</span> <span class="f-gray">+</span> <span class="f-pron" style="color:var(--od2)">OD</span> <span class="f-gray">+ verbo conjugado</span><br>
      <span style="font-size:.78rem;color:var(--muted2)">me/te/le/nos/les + lo/la/los/las</span>
    </div>
    <table class="ref-table" style="margin-top:10px"><tr><th>Ejemplo</th><th>OI</th><th>OD</th><th>English</th></tr>
    <tr><td><strong>Me lo</strong> dieron.</td><td style="color:var(--oi2)">me</td><td style="color:var(--od2)">lo</td><td style="color:var(--muted)">They gave it to me.</td></tr>
    <tr><td><strong>Te la</strong> explico.</td><td style="color:var(--oi2)">te</td><td style="color:var(--od2)">la</td><td style="color:var(--muted)">I explain it to you.</td></tr>
    <tr><td><strong>Nos los</strong> mandaron.</td><td style="color:var(--oi2)">nos</td><td style="color:var(--od2)">los</td><td style="color:var(--muted)">They sent them to us.</td></tr>
    </table>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:var(--se2);background:rgba(52,211,153,.08)">⚡ La regla del SE</div>
    <div class="ref-alert">⚠️ <strong>le/les + lo/la/los/las → se + lo/la/los/las</strong> — Never say "le lo", "le la", "les los", "les las"!</div>
    <table class="ref-table"><tr><th>Incorrecto</th><th>Correcto</th><th>Ejemplo</th></tr>
    <tr><td style="color:var(--bad);text-decoration:line-through">le lo</td><td style="color:var(--good);font-weight:800">se lo</td><td style="color:var(--muted)">Se lo di (a él).</td></tr>
    <tr><td style="color:var(--bad);text-decoration:line-through">le la</td><td style="color:var(--good);font-weight:800">se la</td><td style="color:var(--muted)">Se la mandé (a ella).</td></tr>
    <tr><td style="color:var(--bad);text-decoration:line-through">les los</td><td style="color:var(--good);font-weight:800">se los</td><td style="color:var(--muted)">Se los expliqué (a ellos).</td></tr>

    </table>
    <div class="ref-tip">💡 This "se" is NOT reflexive. It's purely a sound-avoidance rule. To clarify who, add "a él/ella/ellos/ellas/usted/ustedes".</div>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:#fde68a;background:rgba(251,191,36,.08)">📍 Posición de los pronombres</div>
    <table class="ref-table"><tr><th>Caso</th><th>Posición</th><th>Ejemplo</th></tr>

    <tr><td>Infinitivo</td><td style="color:#fde68a;font-weight:700">antes O unido</td><td style="color:var(--muted)">Lo voy a comprar. = Voy a comprarlo.</td></tr>
    <tr><td>Gerundio</td><td style="color:#fde68a;font-weight:700">antes O unido</td><td style="color:var(--muted)">Lo estoy leyendo. = Estoy leyéndolo.</td></tr>
    <tr><td>Imperativo afirmativo</td><td style="color:#fde68a;font-weight:700">UNIDO (después)</td><td style="color:var(--muted)">¡Dímelo! / ¡Cómpralo!</td></tr>
    <tr><td>Imperativo negativo</td><td style="color:#fde68a;font-weight:700">ANTES</td><td style="color:var(--muted)">¡No me lo digas! / ¡No lo compres!</td></tr>
    </table>
    <div class="ref-tip">💡 When pronouns attach to gerunds or imperatives, watch the accent: leyendo→leyéndolo, compra→cómpralo, di→dímelo.</div>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:#fca5a5;background:rgba(248,113,113,.08)">🔴 Casos especiales</div>
    <table class="ref-table"><tr><th>Caso</th><th>Explicación</th><th>Ejemplo</th></tr>
    <tr><td style="font-weight:700">Pronombre redundante</td><td style="color:var(--muted)">OI pronoun appears even with "a + noun"</td><td style="color:var(--muted)">Le dije a María.</td></tr>
    <tr><td style="font-weight:700">Verbos tipo gustar</td><td style="color:var(--muted)">OI = person who feels; subject is the thing</td><td style="color:var(--muted)">Me duele la cabeza.</td></tr>
    <tr><td style="font-weight:700">Comprarse / hacerse</td><td style="color:var(--muted)">OI for oneself (not strictly reflexive)</td><td style="color:var(--muted)">Me compré un café.</td></tr>
    <tr><td style="font-weight:700">Clarificar "se"</td><td style="color:var(--muted)">Add "a + pronoun" when ambiguous</td><td style="color:var(--muted)">Se lo di a ella (not a él).</td></tr>
    </table>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:var(--cyan);background:rgba(37,217,255,.06)">📋 Tabla resumen completa</div>
    <table class="ref-table"><tr><th>Sujeto</th><th>OD</th><th>OI</th><th>Combinado (OI+OD)</th></tr>
    <tr><td>yo</td><td style="color:var(--od2);font-weight:700">me</td><td style="color:var(--oi2);font-weight:700">me</td><td style="color:var(--comb2)">me lo/la/los/las</td></tr>
    <tr><td>tú</td><td style="color:var(--od2);font-weight:700">te</td><td style="color:var(--oi2);font-weight:700">te</td><td style="color:var(--comb2)">te lo/la/los/las</td></tr>
    <tr><td>él/ella/usted</td><td style="color:var(--od2);font-weight:700">lo / la</td><td style="color:var(--oi2);font-weight:700">le → <span style="color:var(--se2)">se</span></td><td style="color:var(--comb2)"><span style="color:var(--se2)">se</span> lo/la/los/las</td></tr>
    <tr><td>nosotros</td><td style="color:var(--od2);font-weight:700">nos</td><td style="color:var(--oi2);font-weight:700">nos</td><td style="color:var(--comb2)">nos lo/la/los/las</td></tr>
    <tr><td>ellos/ellas/ustedes</td><td style="color:var(--od2);font-weight:700">los / las</td><td style="color:var(--oi2);font-weight:700">les → <span style="color:var(--se2)">se</span></td><td style="color:var(--comb2)"><span style="color:var(--se2)">se</span> lo/la/los/las</td></tr>
    </table>
  </div>
  </div>`;
}
